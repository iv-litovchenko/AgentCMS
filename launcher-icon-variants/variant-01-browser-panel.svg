<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" role="img" aria-label="Browser + side panel + extension">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e3a8a"/>
    </linearGradient>
    <linearGradient id="panel" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#8b5cf6"/>
      <stop offset="100%" stop-color="#db2777"/>
    </linearGradient>
    <linearGradient id="winShine" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.35"/>
      <stop offset="45%" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <filter id="winShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="3" stdDeviation="3" flood-color="#020617" flood-opacity="0.45"/>
    </filter>
  </defs>
  <rect width="128" height="128" rx="28" fill="url(#bg)"/>

  <!-- Browser window -->
  <g filter="url(#winShadow)">
    <rect x="16" y="22" width="96" height="82" rx="12" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1.5"/>
    <path fill="#e2e8f0" d="M16 22h96a12 12 0 0 1 12 12v10H16V34a12 12 0 0 1 12-12z"/>
    <rect x="16" y="22" width="96" height="82" rx="12" fill="url(#winShine)"/>
    <!-- traffic lights -->
    <circle cx="30" cy="33" r="3.5" fill="#ef4444"/>
    <circle cx="42" cy="33" r="3.5" fill="#facc15"/>
    <circle cx="54" cy="33" r="3.5" fill="#22c55e"/>
    <!-- address bar -->
    <rect x="64" y="28" width="40" height="10" rx="5" fill="#fff" stroke="#cbd5e1" stroke-width="1"/>
    <!-- page (left) -->
    <rect x="24" y="48" width="46" height="5" rx="2.5" fill="#cbd5e1"/>
    <rect x="24" y="57" width="38" height="3.5" rx="1.75" fill="#e2e8f0"/>
    <rect x="24" y="64" width="42" height="3.5" rx="1.75" fill="#e2e8f0"/>
    <rect x="24" y="71" width="34" height="3.5" rx="1.75" fill="#e2e8f0"/>
    <rect x="24" y="82" width="44" height="14" rx="5" fill="#e2e8f0"/>
    <!-- divider -->
    <rect x="72" y="44" width="1.5" height="52" rx="0.75" fill="#cbd5e1"/>
    <!-- side panel -->
    <rect x="76" y="44" width="28" height="52" rx="7" fill="url(#panel)"/>
    <rect x="80" y="50" width="20" height="3.5" rx="1.75" fill="rgba(255,255,255,0.9)"/>
    <rect x="80" y="57" width="15" height="3" rx="1.5" fill="rgba(255,255,255,0.5)"/>
    <rect x="80" y="63" width="17" height="3" rx="1.5" fill="rgba(255,255,255,0.5)"/>
    <path d="M82 82 L88.5 88 L95 80" fill="none" stroke="#fff" stroke-width="2.75" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <!-- Extension badge: yellow puzzle (Chrome-style) -->
  <circle cx="36" cy="98" r="21" fill="#ea580c" stroke="#fff" stroke-width="3"/>
  <path
    fill="#facc15"
    stroke="#fef9c3"
    stroke-width="1.25"
    stroke-linejoin="round"
    d="M36 84.5
       h9.5 v3.2 c0 2.4 1.9 4.3 4.3 4.3 h3.2 v9.5
       h-3.2 c-2.4 0-4.3 1.9-4.3 4.3 v3.2 H36
       v-3.2 c0-2.4-1.9-4.3-4.3-4.3 h-3.2 v-9.5 h3.2
       c2.4 0 4.3-1.9 4.3-4.3 v-3.2z"
  />
</svg>
