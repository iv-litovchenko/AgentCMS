<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" role="img" aria-label="Browser + side panel + extension">
  <defs>
    <linearGradient id="bg" x1="18%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e3a8a"/>
      <stop offset="55%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#020617"/>
    </linearGradient>
    <radialGradient id="glow" cx="30%" cy="18%" r="70%">
      <stop offset="0%" stop-color="#60a5fa" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#60a5fa" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="panel" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#a78bfa"/>
      <stop offset="55%" stop-color="#7c3aed"/>
      <stop offset="100%" stop-color="#db2777"/>
    </linearGradient>
    <linearGradient id="badge" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#fb923c"/>
      <stop offset="100%" stop-color="#ea580c"/>
    </linearGradient>
    <linearGradient id="puzzle" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#fef08a"/>
      <stop offset="100%" stop-color="#facc15"/>
    </linearGradient>
    <clipPath id="win">
      <rect x="18" y="16" width="94" height="84" rx="14"/>
    </clipPath>
  </defs>

  <rect width="128" height="128" rx="28" fill="url(#bg)"/>
  <rect width="128" height="128" rx="28" fill="url(#glow)"/>

  <!-- soft ground shadow -->
  <ellipse cx="66" cy="108" rx="36" ry="6" fill="#020617" opacity="0.35"/>

  <g clip-path="url(#win)">
    <rect x="18" y="16" width="94" height="84" fill="#f8fafc"/>
    <!-- chrome -->
    <rect x="18" y="16" width="94" height="22" fill="#e8eef6"/>
    <rect x="18" y="37" width="94" height="1" fill="#d5dee9"/>
    <!-- traffic lights -->
    <circle cx="32" cy="27" r="3.4" fill="#ff5f57"/>
    <circle cx="43" cy="27" r="3.4" fill="#febc2e"/>
    <circle cx="54" cy="27" r="3.4" fill="#28c840"/>
    <!-- address pill -->
    <rect x="64" y="21.5" width="40" height="11" rx="5.5" fill="#ffffff"/>
    <circle cx="71" cy="27" r="2" fill="#94a3b8"/>
    <rect x="76" y="25.5" width="18" height="3" rx="1.5" fill="#cbd5e1"/>
    <!-- page -->
    <rect x="28" y="46" width="40" height="5" rx="2.5" fill="#cbd5e1"/>
    <rect x="28" y="55" width="34" height="3.2" rx="1.6" fill="#e2e8f0"/>
    <rect x="28" y="62" width="38" height="3.2" rx="1.6" fill="#e2e8f0"/>
    <rect x="28" y="69" width="28" height="3.2" rx="1.6" fill="#e2e8f0"/>
    <rect x="28" y="80" width="36" height="12" rx="4" fill="#e7edf4"/>
    <!-- companion panel -->
    <rect x="74" y="44" width="30" height="48" rx="8" fill="url(#panel)"/>
    <rect x="79" y="50" width="20" height="3.2" rx="1.6" fill="#ffffff" opacity="0.95"/>
    <rect x="79" y="57" width="14" height="2.6" rx="1.3" fill="#ffffff" opacity="0.55"/>
    <rect x="79" y="63" width="17" height="2.6" rx="1.3" fill="#ffffff" opacity="0.55"/>
    <path d="M82 78.5 L87.2 83.5 L95 74.5" fill="none" stroke="#ffffff" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
  <rect x="18.75" y="16.75" width="92.5" height="82.5" rx="13.25" fill="none" stroke="#ffffff" stroke-opacity="0.55" stroke-width="1.5"/>

  <!-- extension badge -->
  <circle cx="34" cy="100" r="22" fill="#ffffff"/>
  <circle cx="34" cy="100" r="19" fill="url(#badge)"/>
  <!-- puzzle: body + top & right knobs, bottom socket -->
  <path fill="url(#puzzle)" d="
    M27 91
    h5.2
    a4.2 4.2 0 1 1 8.4 0
    H46
    v5.2
    a4.2 4.2 0 1 1 0 8.4
    V110
    h-7.2
    a4.2 4.2 0 1 0-8.4 0
    H27
    V91
    z"/>
</svg>
