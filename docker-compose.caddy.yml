# HTTPS reverse proxy (Let's Encrypt) — поверх docker-compose.yml
#   docker compose -f docker-compose.yml -f docker-compose.caddy.yml up -d
# Env: MAPTEX_DOMAIN=maptex.ru

services:
  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    environment:
      MAPTEX_DOMAIN: "${MAPTEX_DOMAIN:-localhost}"
    volumes:
      - ./docs/deploy/docker-Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      cms:
        condition: service_healthy
      mcp:
        condition: service_started

volumes:
  caddy-data:
  caddy-config:
