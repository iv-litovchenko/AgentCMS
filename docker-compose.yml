# Agent CMS — полный стек: CMS + MCP + Control (Launcher)
#   docker compose up -d --build
#   Editor:  http://localhost:3000
#   Control: http://localhost:3288
#   MCP:     http://localhost:3490/mcp
#
# HTTPS через Caddy: docker compose -f docker-compose.yml -f docker-compose.caddy.yml up -d

name: agent-cms

services:
  cms:
    build: .
    command: ["cms"]
    env_file:
      - .env
    ports:
      - "${AGENT_CMS_EDITOR_HTTP_PORT:-3000}:3000"
      - "${AGENT_CMS_VOICE_HTTP_PORT:-3088}:3088"
    environment:
      HOST: "0.0.0.0"
      VOICE_HOST: "0.0.0.0"
      PORT: "3000"
      VOICE_PORT: "3088"
      AGENT_CMS_HTTP_TO_HTTPS: "0"
      CONTROL_AUTOSTART: "0"
      VOICE_AUTOSTART: "${VOICE_AUTOSTART:-1}"
      APP_LOCK_LOGIN: "${APP_LOCK_LOGIN:-admin}"
      APP_LOCK_PASSWORD: "${APP_LOCK_PASSWORD:-changeme}"
    volumes:
      - cms-workspaces:/app/workspaces
      - cms-global:/app/.agent-cms-global
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3000/api/agent/mcp-ping').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"
        ]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 60s
    restart: unless-stopped

  mcp:
    build: .
    command: ["mcp"]
    env_file:
      - .env
    depends_on:
      cms:
        condition: service_healthy
    ports:
      - "${AGENT_CMS_MCP_HTTP_PORT:-3490}:3490"
    environment:
      AGENT_CMS_MCP_HTTP_HOST: "0.0.0.0"
      AGENT_CMS_MCP_HTTP_PORT: "3490"
      AGENT_CMS_BASE_URL: "http://cms:3000"
      AGENT_CMS_MCP_TOKEN: "${AGENT_CMS_MCP_TOKEN:-}"
    restart: unless-stopped

  control:
    build: .
    command: ["control"]
    env_file:
      - .env
    depends_on:
      cms:
        condition: service_started
    ports:
      - "${AGENT_CMS_CONTROL_HTTP_PORT:-3288}:3288"
    environment:
      CONTROL_HOST: "0.0.0.0"
      CONTROL_AUTOSTART: "0"
      CMS_API_URL: "http://cms:3000"
      AGENT_CMS_BASE_URL: "http://cms:3000"
      AGENT_CMS_DOCKER_OPS: "1"
      AGENT_CMS_COMPOSE_FILE: "/app/docker-compose.yml"
      AGENT_CMS_COMPOSE_SERVICE: "cms"
      COMPOSE_PROJECT_NAME: "agent-cms"
      APP_LOCK_LOGIN: "${APP_LOCK_LOGIN:-admin}"
      APP_LOCK_PASSWORD: "${APP_LOCK_PASSWORD:-changeme}"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - ./docker-compose.yml:/app/docker-compose.yml:ro
    restart: unless-stopped

volumes:
  cms-workspaces:
  cms-global:
