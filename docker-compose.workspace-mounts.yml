# docker-compose.workspace-mounts.yml — доп. bind-mount корней workspace (Mac / Linux / VPS)
#
# Дефолт: ./workspaces → /app/workspaces (или AGENT_CMS_WORKSPACES_DIR) — в docker-compose.mac.yml | docker-compose.linux.yml
#
# Этот файл — второй слой compose (как override). Подключается всегда:
#   docker compose -f docker-compose.mac.yml -f docker-compose.workspace-mounts.yml up -d
#
# Дополнительные каталоги с хранилищами:
#   • Control → «Папки хранилищ (Docker)»
#   • MCP → platform_workspace_mounts_list / platform_workspace_mounts_write (write — app-lock)
# CMS пишет .agent-cms-global/workspace-mounts.json и перезаписывает секции cms/mcp ниже.
# После изменений — рестарт stack (compose up -d).
#
# Пример доп. mount (1:1 путь на Mac; на VPS — свой абсолютный путь):
#
# services:
#   cms:
#     volumes:
#       - /Users/you/Agent-workspaces:/Users/you/Agent-workspaces
#   mcp:
#     volumes:
#       - /Users/you/Agent-workspaces:/Users/you/Agent-workspaces:ro

services: {}
