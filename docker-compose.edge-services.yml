# Edge-сервисы на поддоменах (Q10). Не трогает /app-* на apex.
#   AGENT_CMS_EDGE_SERVICES_ENABLED=1 в .env
#   Данные: workspaces/${AGENT_CMS_SERVICES_DATA_DIR}/{serviceId}/ (default 0-services-data/qwenpaw)
#   docker compose -f docker-compose.linux.yml -f docker-compose.workspace-mounts.yml -f docker-compose.edge-services.yml up -d

name: agent-cms

services:
  qwenpaw:
    image: agentscope/qwenpaw:${QWENPAW_IMAGE_TAG:-latest}
    restart: unless-stopped
    networks:
      - agent-cms
    expose:
      - "8088"
    environment:
      QWENPAW_PORT: "8088"
    volumes:
      - ${AGENT_CMS_WORKSPACES_DIR:-./workspaces}/${AGENT_CMS_SERVICES_DATA_DIR:-0-services-data}/qwenpaw:/app/working
      - ${AGENT_CMS_WORKSPACES_DIR:-./workspaces}/${AGENT_CMS_SERVICES_DATA_DIR:-0-services-data}/qwenpaw/_secret:/app/working.secret
      - ${AGENT_CMS_WORKSPACES_DIR:-./workspaces}/${AGENT_CMS_SERVICES_DATA_DIR:-0-services-data}/qwenpaw/_backups:/app/working.backups

  caddy:
    environment:
      AGENT_CMS_PUBLIC_DOMAIN: "${AGENT_CMS_PUBLIC_DOMAIN:-localhost}"
      AGENT_CMS_CADDY_EMAIL: "${AGENT_CMS_CADDY_EMAIL:-admin@example.com}"
    volumes:
      - ./docs/deploy/docker-Caddyfile.edge:/etc/caddy/Caddyfile:ro
      - ./docs/deploy/caddy-errors:/srv/caddy-errors:ro
      - ./docs/deploy/edge-static:/srv/edge-static:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      cms:
        condition: service_healthy
      mcp:
        condition: service_healthy
      qwenpaw:
        condition: service_started

volumes:
  caddy-data:
  caddy-config:
