<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>05 — Иконки секций</title>
    <link rel="stylesheet" href="../shared.css" />
    <style>
      .v05-wrap { padding: 8px 10px 0; }
      .v05-toggle {
        display: grid;
        grid-template-columns: 1fr auto;
        gap: 8px;
        align-items: center;
        width: 100%;
        padding: 8px 10px;
        border: 1px solid #e2e8f0;
        border-radius: 10px;
        background: #fff;
        cursor: pointer;
        font: inherit;
      }
      .v05-icons { display: flex; gap: 6px; }
      .v05-icon {
        width: 28px;
        height: 28px;
        display: flex;
        align-items: center;
        justify-content: center;
        border-radius: 8px;
        font-size: 14px;
        background: #f1f5f9;
        border: 1px solid #e2e8f0;
      }
      .v05-icon--p { background: #f5f3ff; border-color: #ddd6fe; }
      .v05-icon--b { background: #eef2ff; border-color: #c7d2fe; }
      .v05-more { font-size: 10px; font-weight: 700; color: #4f46e5; white-space: nowrap; }
    </style>
  </head>
  <body>
    <header class="demo-top">
      <div><h1>05 · Иконки секций</h1><p>Превью блоков вместо длинного заголовка</p></div>
      <a href="../index.html">← Все варианты</a>
    </header>
    <div class="demo-stage">
      <aside class="sidebar-mock">
        <div class="sidebar-mock-head"><strong>Agent workspace</strong></div>
        <div class="sidebar-mock-tree"><div class="tree-item">📁 Темы</div></div>
        <div class="sidebar-mock-bottom">
          <section class="footer-panel v05-wrap">
            <button type="button" class="v05-toggle" data-footer-toggle aria-expanded="true">
              <span class="v05-icons" aria-hidden="true">
                <span class="v05-icon v05-icon--p">🟢</span>
                <span class="v05-icon v05-icon--b">💬</span>
                <span class="v05-icon">🛠</span>
              </span>
              <span class="v05-more" data-footer-action>Свернуть ▴</span>
            </button>
            <div class="footer-body" style="padding-top:8px">
              <details class="mock-section mock-section--purple" open><summary>🟢 Накопители</summary><div class="mock-section-body">Domains</div></details>
              <details class="mock-section mock-section--blue"><summary>💬 Диалоги</summary><div class="mock-section-body">Runtime</div></details>
              <details class="mock-section mock-section--slate"><summary>🛠 Среда</summary><div class="mock-section-body">Зависимости</div></details>
            </div>
          </section>
        </div>
      </aside>
    </div>
    <script src="../shared.js"></script>
    <script>
      document.querySelector("[data-footer-toggle]")?.addEventListener("click", function () {
        const open = this.getAttribute("aria-expanded") === "true";
        this.querySelector("[data-footer-action]").textContent = open ? "Свернуть ▴" : "Развернуть ▾";
      });
    </script>
  </body>
</html>
