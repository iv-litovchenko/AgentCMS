<!doctype html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>02 — Galaxy + brain</title>
  <link rel="stylesheet" href="../shared-base.css" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <header class="mock-toolbar"><a class="mock-back" href="../index.html">← Каталог</a><div><h1>Agent CMS Core</h1><p>База знаний</p></div><button class="mock-open" type="button">Workspace</button></header>
  <main class="stage">
    <div class="galaxy" aria-hidden="true"></div>
    <div class="brain node"><div class="brain-inner">🧠</div><p>Agent CMS Core</p></div>
    <div class="tier">
      <div class="bubble big">📚<span>Docs</span></div>
      <div class="bubble big">🗂️<span>Tasks</span></div>
      <div class="bubble big">☁️<span>Storage</span></div>
    </div>
    <div class="tier narrow">
      <div class="bubble">📄</div><div class="bubble">📄</div><div class="bubble">📝</div><div class="bubble">💡</div>
    </div>
    <div class="tier narrow">
      <div class="bubble">⚙️</div><div class="bubble">🎨</div><div class="bubble">🔌</div><div class="bubble">📊</div>
    </div>
    <div class="cards">
      <div class="card-win"><code>awn-main: true</code></div>
      <div class="card-win"><code>*.md topics</code></div>
      <div class="card-win"><code>workspace/</code></div>
    </div>
  </main>
  <span class="variant-tag">02 · galaxy brain</span>
</body>
