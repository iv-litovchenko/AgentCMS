version: 1
description: >
  Центральная MCP policy платформы Agent CMS.
  Значения лимитов per-workspace — в config.yml → awn_settings (batch-read-limit, batch-write-limit).
  Этот файл — denylist, категории tools, паттерны. Меняется редко, одно на платформу.

mcp:
  # single-call write tools (blocked in mcp-mode=readonly)
  write_tool_pattern: "^(write_|create_|register_|delete_|move_|rename_|append_|upload_|import_|triage_|retain_|write_database_|register_database|create_database|delete_database|rename_database|database_register|database_update|database_delete|database_rename|database_schema_write|database_properties_write|database_property_write|delete_channel|rename_channel|channel_register|channel_update|channel_delete|channel_rename|delete_media_library|rename_media_library|media_library_register|media_library_update|media_library_delete|media_library_rename|delete_repository|rename_repository|repository_register|repository_update|repository_delete|repository_rename|refresh_databases_index_toc|database_frame_write_|database_frame_create_|database_frame_refresh_|refresh_database_frame_index_toc|database_frame_delete_|database_frame_rename_|workspace_fact_create|workspace_fact_update|glossary_term_create|glossary_term_update|reference_entry_create|reference_entry_update|topic_create|topic_update|topic_delete|topic_rename|topic_move|topic_body_write|topic_properties_write|topic_property_write|topic_schema_write|topic_config_write|topic_env_write|topic_slots_template_set|content_create|content_write|content_delete|content_rename|content_move|content_split|content_merge|content_binary_write|content_binary_write_from_url|content_property_write|workspace_note_write|workspace_todo_write|sidecar_create|sidecar_write|sidecar_delete|context_buffer_append|context_buffer_item_remove|context_buffer_clear|setting_write|workspace_dependencies_write|workspace_create|workspace_register|workspace_update|workspace_default_set|workspace_orchestrator_set|workspace_group_create|workspace_group_update|workspace_group_delete|workspace_group_assign|workspace_group_unassign|workspace_groups_reorder|notify_user|run_script|exec_|module_git_commit|module_git_init|module_git_push|module_git_pull|module_git_remote)"
  exec_tools:
    - exec_command
    - exec_shell
    - run_script
  # exec разрешён только при mcp-mode=full
  exec_allowed_modes:
    - full

batch_invoke:
  absolute_max_items: 50
  default_parallel:
    read: true
    write: false

  denied_tools:
    - batch_invoke
    - search_workspace_batch
    - session_context_get
    - get_session_context
    - get_ui_focus
    - get_user_active_context_now
    - workspaces_list
    - list_workspaces
    - list_vaults
    - ask_workspace
    - search_and_get_context
    - notify_user
    - mcp_connection_test
    - test_mcp_connection
    - toggle_comment_reaction
    - triage_inbox_item
    - rebuild_workspace_indexes
    - rebuild_workspace_semantic_index
    - rebuild_workspace_storage_index
    - rebuild_workspace_fulltext_index
    - rebuild_workspace_link_index
    - run_workspace_ocr_index
    - sync_workspace_index_file

  exec_tools:
    - exec_command
    - exec_shell
    - run_script

  read_name_patterns:
    - "^read_"
    - "^list_"
    - "^get_"
    - "_list$"
    - "_get$"
    - "^search_"
    - "^recall_"
    - "^resolve_"
    - "^refresh_"

  read_tools:
    - repositories_list
    - repository_get
    - media_libraries_list
    - media_library_get
    - channels_list
    - channel_get
    - topics_list
    - topic_get
    - topic_meta_get
    - topic_slots_template_get
    - topic_body_read
    - topic_properties_read
    - topic_property_read
    - topic_schema_read
    - topic_config_read
    - topic_env_read
    - topic_exists
    - content_exists
    - contents_list
    - content_read
    - content_meta_get
    - content_binary_read
    - content_binary_url_get
    - content_property_read
    - workspace_note_read
    - workspace_todo_read
    - sidecar_path_resolve
    - sidecar_read
    - context_buffer_read
    - settings_list
    - setting_read
    - list_settings
    - read_setting
    - databases_list
    - database_get
    - read_databases_index_toc
    - database_schema_read
    - database_properties_read
    - database_property_read
    - workspace_facts_list
    - workspace_facts_search
    - glossary_terms_list
    - glossary_terms_search
    - reference_entries_list
    - reference_entries_search
    - module_git_status
    - module_git_diff
