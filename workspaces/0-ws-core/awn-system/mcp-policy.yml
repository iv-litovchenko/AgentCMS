version: 1
description: >
  Центральная MCP policy платформы Agent CMS.
  Значения лимитов per-workspace — в config.yml → awn_settings (batch-read-limit, batch-write-limit).
  Этот файл — denylist, категории tools, паттерны. Меняется редко, одно на платформу.

mcp:
  # single-call write tools (blocked in mcp-mode=readonly)
  write_tool_pattern: "^(write_|create_|register_|delete_|move_|rename_|append_|upload_|import_|triage_|inbox_item_triage|retain_|write_database_|register_database|create_database|delete_database|rename_database|database_register|database_update|database_delete|database_rename|database_schema_write|database_properties_write|database_property_write|delete_channel|rename_channel|channel_register|channel_update|channel_delete|channel_rename|delete_media_library|rename_media_library|media_library_register|media_library_update|media_library_delete|media_library_rename|delete_repository|rename_repository|repository_register|repository_update|repository_delete|repository_rename|nav_map_workspace_refresh|nav_index_toc_topics_refresh|nav_index_toc_contents_refresh|nav_index_toc_databases_refresh|nav_index_toc_channels_refresh|nav_index_toc_repositories_refresh|nav_index_toc_media_libraries_refresh|databases_index_toc_refresh|channels_index_toc_refresh|repositories_index_toc_refresh|media_libraries_index_toc_refresh|topics_index_toc_refresh|contents_index_toc_refresh|workspace_map_refresh|refresh_databases_index_toc|database_frame_write_|database_frame_create_|database_frame_refresh_|refresh_database_frame_index_toc|database_frame_delete_|database_frame_rename_|fact_create|fact_update|workspace_fact_create|workspace_fact_update|glossary_term_create|glossary_term_update|reference_entry_create|reference_entry_update|topic_create|topic_update|topic_delete|topic_rename|topic_move|topic_body_write|topic_properties_write|topic_property_write|topic_schema_write|topic_config_write|topic_env_write|topic_slots_template_set|content_create|content_write|content_delete|content_rename|content_move|content_split|content_merge|content_binary_write|content_binary_write_from_url|content_property_write|session_note_write|session_todo_write|workspace_note_write|workspace_todo_write|annotation_sidecar_create|annotation_sidecar_update|annotation_sidecar_write|annotation_sidecar_delete|sidecar_create|sidecar_write|sidecar_delete|annotation_comment_append|annotation_comment_update|annotation_comment_delete|session_context_buffer_append|session_buffer_append|session_context_buffer_remove|session_buffer_item_remove|session_context_buffer_clear|session_buffer_clear|context_buffer_append|context_buffer_item_remove|context_buffer_clear|comment_append|comment_update|comment_delete|journal_entry_append|setting_write|workspace_dependencies_write|workspace_create|workspace_register|workspace_update|workspace_default_set|workspace_orchestrator_set|workspace_group_create|workspace_group_update|workspace_group_delete|workspace_group_assign|workspace_group_unassign|workspace_groups_reorder|user_notification_send|notify_user|utility_script_run|utility_command_exec|utility_shell_exec|tool_script_run|tool_command_exec|tool_shell_exec|run_script|exec_|module_git_commit|module_git_init|module_git_push|module_git_pull|module_git_remote)"
  exec_tools:
    - utility_script_run
    - utility_command_exec
    - utility_shell_exec
    - tool_script_run
    - tool_command_exec
    - tool_shell_exec
    - run_script
    - exec_command
    - exec_shell
  # exec разрешён только при mcp-mode=full
  exec_allowed_modes:
    - full

batch_invoke:
  absolute_max_items: 50
  default_parallel:
    read: true
    write: false

  denied_tools:
