<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="n-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090d1a" />
      <stop offset="60%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e1b4b" />
    </linearGradient>
    <linearGradient id="n-line-left" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#6366f1" />
    </linearGradient>
    <linearGradient id="n-line-right" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#c084fc" />
      <stop offset="100%" stop-color="#a855f7" />
    </linearGradient>
    <linearGradient id="n-cross" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#fde047" />
      <stop offset="100%" stop-color="#c084fc" />
    </linearGradient>
    <linearGradient id="n-core" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="40%" stop-color="#93c5fd" />
      <stop offset="100%" stop-color="#3b82f6" />
    </linearGradient>
    <filter id="n-glow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <rect width="64" height="64" rx="16" fill="url(#n-bg)" />
  <rect x="0.75" y="0.75" width="62.5" height="62.5" rx="15.25" fill="none" stroke="rgba(255,255,255,0.14)" stroke-width="1.5" />

  <!-- Center subtle nebula glow -->
  <circle cx="32" cy="24" r="18" fill="#6366f1" opacity="0.2" filter="url(#n-glow)" />

  <!-- Legs -->
  <line x1="32" y1="16" x2="16" y2="48" stroke="url(#n-line-left)" stroke-width="4" stroke-linecap="round" />
  <line x1="32" y1="16" x2="48" y2="48" stroke="url(#n-line-right)" stroke-width="4" stroke-linecap="round" />

  <!-- Cross bridge -->
  <line x1="22.5" y1="35" x2="41.5" y2="35" stroke="url(#n-cross)" stroke-width="3.5" stroke-linecap="round" />
  <circle cx="32" cy="35" r="3" fill="#fef08a" />
  <circle cx="32" cy="35" r="1.2" fill="#ffffff" />

  <!-- Left node (User) -->
  <circle cx="16" cy="48" r="6" fill="#0f172a" stroke="#38bdf8" stroke-width="3.5" />
  <circle cx="16" cy="48" r="2.5" fill="#38bdf8" />

  <!-- Right node (AI Agent) -->
  <circle cx="48" cy="48" r="6" fill="#0f172a" stroke="#c084fc" stroke-width="3.5" />
  <circle cx="48" cy="48" r="2.5" fill="#c084fc" />

  <!-- Apex Core (Memory / Workspace) -->
  <circle cx="32" cy="16" r="7" fill="url(#n-core)" />
  <circle cx="32" cy="16" r="3.5" fill="#ffffff" />
</svg>