<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="m-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#080d1a" />
      <stop offset="60%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e1b4b" />
    </linearGradient>
    <linearGradient id="screen-face" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#e2f0fd" />
      <stop offset="50%" stop-color="#cbe5fd" />
      <stop offset="100%" stop-color="#93c5fd" />
    </linearGradient>
    <linearGradient id="ant-orb" x1="10%" y1="10%" x2="90%" y2="90%">
      <stop offset="0%" stop-color="#fffbeb" />
      <stop offset="40%" stop-color="#fde047" />
      <stop offset="100%" stop-color="#f59e0b" />
    </linearGradient>
    <filter id="ant-glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="2" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background squircle -->
  <rect width="64" height="64" rx="16" fill="url(#m-bg)" />
  <rect x="0.75" y="0.75" width="62.5" height="62.5" rx="15.25" fill="none" stroke="rgba(255,255,255,0.14)" stroke-width="1.5" />

  <!-- Antenna stem & glowing orb -->
  <line x1="32" y1="13" x2="32" y2="20" stroke="#64748b" stroke-width="3" stroke-linecap="round" />
  <circle cx="32" cy="11" r="6" fill="#f59e0b" opacity="0.3" filter="url(#ant-glow)" />
  <circle cx="32" cy="11" r="4.5" fill="url(#ant-orb)" />
  <circle cx="30.5" cy="9.5" r="1.5" fill="#ffffff" opacity="0.9" />

  <!-- Screen Outer Bezel -->
  <rect x="11" y="19" width="42" height="34" rx="12" fill="#1e293b" stroke="rgba(148,163,184,0.35)" stroke-width="1.5" />
  <!-- Screen Inner Display -->
  <rect x="13.5" y="21.5" width="37" height="29" rx="9.5" fill="url(#screen-face)" />

  <!-- Eyes with specular reflection -->
  <rect x="21" y="28" width="5" height="7" rx="2.2" fill="#0f172a" />
  <circle cx="23" cy="29.5" r="1.2" fill="#38bdf8" />
  <circle cx="22.2" cy="28.8" r="0.6" fill="#ffffff" />

  <rect x="38" y="28" width="5" height="7" rx="2.2" fill="#0f172a" />
  <circle cx="40" cy="29.5" r="1.2" fill="#38bdf8" />
  <circle cx="39.2" cy="28.8" r="0.6" fill="#ffffff" />

  <!-- Smile -->
  <path d="M26.5 38.5 Q32 43.5 37.5 38.5" fill="none" stroke="#0f172a" stroke-width="2.5" stroke-linecap="round" />

  <!-- Cheeks blush -->
  <circle cx="18" cy="37" r="2.2" fill="#fb7185" opacity="0.45" />
  <circle cx="46" cy="37" r="2.2" fill="#fb7185" opacity="0.45" />
</svg>