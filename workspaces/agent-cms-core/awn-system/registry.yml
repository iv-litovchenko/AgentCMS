version: 1
mode: agent-owned
agent: agent-cms-test
description: CMS-модель агента — типы, слоты, поля. Runtime читает awn-system/types/

# domains — источник правды по доменам («какие бывают компоненты»).
domains:
  - base
  - content
  - fields
  - pages
  - slots
  - mixins
  - data
  - md-blocks
  - id: settings
    label: Настройки
    kind: type
    icon: "⚙"

# Три независимые области настроек (не merge):
#   platform — settings.global.yml (agent-cms-core)
#   workspace — settings.yml (хранилище)
#   user — .agent-cms/user-settings.yml (UI пользователя)
settings:
  description: >
    Platform — политика CMS (MCP, лимиты, индексы). Workspace — параметры хранилища.
    User — UI/дерево для пользователя. Области не сливаются. MCP policy — settings.global.yml → awn_policy.
  schema:
    platform:
      type: awn.settings.platform
      path: awn-system/types/settings/platform.yml
    workspace:
      type: awn.settings.workspace
      path: awn-system/types/settings/workspace.yml
    user:
      type: awn.settings.user
      path: awn-system/types/settings/user.yml
  values:
    platform: settings.global.yml
    workspace: settings.yml
    user: .agent-cms/user-settings.yml

docs:
  map: GLOBAL_MCP_DOC.md
  response-style: AGENT_RESPONSE_STYLE.md
  agents: AGENTS.md

canonical-types: migrated
migration-date: "2026-07-05"
