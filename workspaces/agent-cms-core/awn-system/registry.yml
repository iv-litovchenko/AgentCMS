version: 1
mode: agent-owned
agent: agent-cms-test
description: CMS-модель агента — типы, слоты, поля. Runtime читает awn-system/types/

# domains — источник правды по доменам («какие бывают компоненты»).
# Встроенные домены известны рантайму по умолчанию. Здесь можно:
#   • переопределить их label/kind;
#   • ДОБАВИТЬ новый домен-«пакет» — заведи папку awn-system/types/<id>/ и запись ниже,
#     и новый домен появится в дереве (с ярлыком и кнопкой «+») и в каталоге типов.
# Формат записи: строка "id" ИЛИ объект:
#   - id: settings          # = имя папки awn-system/types/settings/
#     label: Настройки       # подпись в дереве
#     kind: type             # kind для новых типов этого домена (type|slot|field|block|view|taxonomy|mixin)
#     icon: "⚙"             # необязательно
domains:
  - base
  - content
  - fields
  - pages
  - slots
  - mixins
  - data
  - md-blocks
  # Домен схем awn.settings.{platform,workspace} — awn-system/types/settings/
  - id: settings
    label: Настройки
    kind: type
    icon: "⚙"

# Две модели: platform (settings.global.yml) + workspace (settings.yml).
# Схемы полей — types/settings/awn.settings.{platform,workspace}.yml
settings:
  description: >
    Платформа (agent-cms-core) задаёт defaults и поведение всей системы.
    Workspace переопределяет точечно только для текущего хранилища.
    Эффективные настройки = platform + workspace. MCP policy — settings.global.yml → awn_policy.
  schema:
    platform:
      type: awn.settings.platform
      path: awn-system/types/settings/awn.settings.platform.yml
    workspace:
      type: awn.settings.workspace
      path: awn-system/types/settings/awn.settings.workspace.yml
  values:
    platform: settings.global.yml
    workspace: settings.yml

docs:
  map: GLOBAL_MCP_DOC.md
  response-style: AGENT_RESPONSE_STYLE.md
  agents: AGENTS.md

canonical-types: migrated
migration-date: "2026-07-05"
