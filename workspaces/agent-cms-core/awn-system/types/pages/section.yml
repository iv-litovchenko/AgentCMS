id: awn.page.section
name: Секция
kind: type
domain: pages
status: draft
extends: awn.page.base
description: >
  Служебная секция workspace — только в корне агента (awn-agent-kit, awn-shared,
  awn-container). Черновик: UI секций — в следующих итерациях.
manifest-pattern: "{slug}/manifest.md"
storage-slots: []

fields:
  awn-section-bg:
    type: awn.field.string.catalog-colors
    title: Цвет фона
    description: Фон секции в меню workspace
    placement: aside-body
    group: nav
    sort: 10

  awn-section-border:
    type: awn.field.string.catalog-colors
    title: Цвет бордюра
    description: Обводка секции в меню workspace
    placement: aside-body
    group: nav
    sort: 11
