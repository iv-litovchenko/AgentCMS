id: awn.page.base
name: База страницы
kind: base
domain: pages
status: active
extends: awn.base
description: Узел дерева (ws / section / area / topic) — навигация и runtime

field-groups:
  - id: content
    name: ААА Основное
    description: Что заполняет человек или агент
    collapsed: false
  - id: nav
    name: ААА Дерево и вид
    description: Поведение в меню и на главной
    collapsed: true
  - id: runtime
    name: ААА Runtime агента
    description: Загрузка в контекст, cron, heartbeat
    collapsed: true
  - id: taxonomy
    name: Таксономия
    description: Категории, теги, приоритет, цвет, владелец
    collapsed: true
  - id: system
    name: АААСистемные
    description: Заполняется автоматически, только чтение
    collapsed: true

fields:
  awn-tags:
    group: taxonomy
    sort: 5

  awn-main:
    type: awn.field.boolean
    title: АААНа главной
    default: false
    placement: aside-body
    group: nav
    sort: 2

  awn-category:
    type: awn.field.lookup.one
    source: categories
    title: АААКатегория
    placement: aside-body
    group: taxonomy
    sort: 1

  awn-owner:
    type: awn.field.lookup.one
    source: users
    title: АААВладелец
    placement: aside-body
    group: taxonomy
    sort: 2

  awn-priority:
    type: awn.field.lookup.one
    source: priorities
    title: АААПриоритет
    placement: aside-body
    group: taxonomy
    sort: 3

  awn-color:
    type: awn.field.lookup.one
    source: colors
    value-kind: color
    title: АААЦвет
    placement: aside-body
    group: taxonomy
    sort: 4

  awn-sort:
    type: awn.field.number.integer
    title: АААСортировка
    placement: aside-body
    group: nav
    sort: 3

  awn-runtime-load-always:
    type: awn.field.boolean
    title: АААВсегда в контексте
    description: Тема всегда в контексте агента; иначе — только по запросу (по умолчанию)
    default: false
    placement: aside-body
    group: runtime
    sort: 1

  awn-runtime-cron:
    type: awn.field.boolean
    title: АААВыполнение по расписанию
    placement: aside-body
    group: runtime
    sort: 2

  awn-runtime-cron-schedule:
    type: awn.field.string.cron-schedule
    title: АААРасписание
    description: День и время, шаблон или своё cron-выражение
    placement: aside-body
    group: runtime
    sort: 3
    show-when:
      field: awn-runtime-cron
      equals: true

  awn-runtime-heartbeat:
    type: awn.field.boolean
    title: АААHeartbeat
    placement: aside-body
    group: runtime
    sort: 4

  awn-runtime-commands:
    type: awn.field.boolean
    title: АААВыполнение команд
    description: В инструкции темы есть команды для выполнения (визуальный маркер)
    default: false
    placement: aside-body
    group: runtime
    sort: 5
