id: awn.page.base
name: База страницы
kind: base
domain: pages
status: active
extends: awn.base
description: Узел дерева (ws / section / area / topic) — навигация и runtime

form:
  panel-title: "{A2!} Свойства страницы"

fields:
  awn-focus:
    type: awn.field.boolean
    title: "{A2!} В фокусе"
    description: Показывать в быстром навигаторе workspace
    default: false
    placement: aside-body
    group: nav
    sort: 1

  awn-main:
    type: awn.field.boolean
    title: "{A2!} На главной"
    description: Показывать в карусели на главной странице
    default: false
    placement: aside-body
    group: nav
    sort: 2

  awn-slots-disabled:
    type: awn.field.boolean
    title: "{A2!} Общий слот (lite)"
    description: >
      Скрыть слоты данных; многофайловая память читается из папки темы
      (рядом с manifest.md), без awn-storage/
    default: false
    placement: aside-body
    group: nav
    sort: 1
