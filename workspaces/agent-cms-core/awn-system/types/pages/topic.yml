id: awn.page.topic
name: Тема
kind: type
domain: pages
status: active
extends: awn.page.base
description: Тема — manifest.md + слоты памяти
manifest-pattern: "{slug}/manifest.md"

storage-slots:
  - main
  - main-single
  - main-single-csv
  - inbox
  - notes
  - references
  - artefacts
  - assets
  - media
  - repository
  - scripts
  - todo-single
  - log-single

fields:
  awn-slots-disabled:
    type: awn.field.boolean
    title: ААА Общий слот (lite)
    description: >
      Скрыть слоты данных; многофайловая память читается из папки темы
      (рядом с manifest.md), без awn-storage/
    default: false
    placement: aside-body
    group: nav
    sort: 7
