id: awn.annotation.base
name: База аннотаций
kind: base
domain: annotations
status: active
extends: awn.base
description: >
  Привязки к объектам хранилища (sidecar 1:1 к файлу, comment N:1 к target).
  Не авторский контент слота — overlay поверх страниц, записей и бинарников.
  Черновик резолва пути — блок idea (не поля формы, runtime не читает).

kind-ui:
  for: type
  label: Аннотация
  badge: { background: "#fef3c7", border: "#fcd34d", text: "#92400e" }

form:
  panel-title: "{A2!} Свойства привязки"

field-groups:
  - id: content
    name: "{A2!} Основное"
    description: Описание и связь с объектом
    collapsed: false
  - id: work-note
    name: "{A2!} Служебная заметка"
    description: На чём остановились — для вас и агента
    collapsed: false
  - id: system
    name: "{A2!} Системные"
    description: Заполняется автоматически, только чтение
    collapsed: true

fields:
  awn-sort:
    hidden: true

# ИДЕЯ — не входит в fields / topic-schema / форму записи (только документация типа).
idea:
  version: 1
  status: draft
  title: Куда сохранять файл аннотации
  bind:
    description: Якорь — manifest.md, запись в слоте или workspace-путь к файлу
    comment: path + mode + file в API Discuss
    sidecar: sourcePath или path + slot + file
  storage:
    modes:
      co-located:
        description: Рядом с файлом-якорем (*.sidecar.md)
        example: sidecar
      storage-folder:
        description: awn-storage/<folder>/… от узла якоря; нет папки — подъём к родительскому manifest
        folder: имя слоя (comments, …)
        example: comment → comments/{target}/
  runtime-today:
    comment: comments/ + list_comments / append_comment
    sidecar: co-located sidecar.md + create_sidecar
