id: awn.module.registry
name: Каталог модулей workspace
kind: type
domain: modules
status: active
extends: awn.module.base
description: >
  Реестр встроенных модулей Agent CMS. Соответствует кнопкам в picker
  агента и CHPU ~module-*. Пока справочник — не меняет runtime workspace.

entries:
  - module-id: module-git
    label: Git-репозиторий
    view: git
    implementation: active
    ui-surfaces: [picker]
    mcp: [module_git_status, module_git_diff, module_git_commit]
  - module-id: module-journal
    label: Журнал
    view: journal
    implementation: active
    ui-surfaces: [picker, footer, menu-stats]
  - module-id: module-settings
    label: Настройки проекта
    view: project-settings
    implementation: active
    ui-surfaces: [picker]
  - module-id: module-awn-types
    label: Реестр типов, модулей, компонентов и расширений
    view: awn-types
    implementation: active
    ui-surfaces: [picker]
  - module-id: module-registry
    label: Реестр контекста
    view: runtime-registry
    implementation: active
    ui-surfaces: [picker]
  - module-id: module-large-files
    label: Крупные файлы
    view: large-files
    implementation: active
    ui-surfaces: [picker]
  - module-id: module-broken-links
    label: Битые ссылки
    view: broken-links
    implementation: active
    ui-surfaces: [picker]
  - module-id: module-run-scripts
    label: Запуск скриптов
    view: run-scripts
    implementation: stub
    ui-surfaces: [picker]
    mcp: [run_script]
  - module-id: module-todo-list
    label: Список задач
    view: todo-list
    implementation: stub
    ui-surfaces: [picker]
    mcp: [read_workspace_todo, write_workspace_todo]
  - module-id: module-catalog
    label: Каталог модулей и инструментов
    view: module-catalog
    implementation: stub
    ui-surfaces: [picker]
    mcp: [list_tools]
