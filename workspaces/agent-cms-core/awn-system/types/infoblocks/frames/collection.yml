id: awn.infoblock.frame.collection
name: Коллекция
kind: frame
domain: infoblock
status: active
extends: awn.infoblock.frame.base
description: manifest + schema в корне; записи в awn-storage/data/, вложения в awn-storage/assets/
manifest-pattern: manifest.md

kind-ui:
  for: collection
  label: Коллекция
  badge: { background: "#f5f3ff", border: "#ddd6fe", text: "#5b21b6" }

fields:
  awn-collection-type:
    type: awn.field.choice.one
    title: Тип коллекции
    enum: [md, csv, files]
    default: md
    description: md — записи на базе md-файлов; csv — одна таблица main.csv; files — загрузка файлов
  awn-record-hierarchy:
    type: awn.boolean
    title: Поддержка разделов
    default: false
    description: Для md и files; не для csv-таблицы
  awn-record-file-types:
    type: awn.string
    title: Типы файлов
    default: ""
    description: "Только для files: image/*,.pdf,.md"
