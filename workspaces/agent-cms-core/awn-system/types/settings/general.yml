id: agent.settings.general
name: Общие
kind: type
domain: settings
status: active
extends: awn.settings.base
description: Общие настройки workspace — язык, стиль ответов
scope: agent
enabled: true

fields:

  agent-language:
    type: awn.field.choice.one
    title: Язык агента
    description: Предпочтительный язык ответов
    default: ru
    enum: [ru, en, auto]
    group: agent
    sort: 1

  response-style:
    type: awn.field.choice.one
    title: Стиль ответов
    description: Кратко / подробно / как в AGENTS.md
    default: agents-md
    enum: [brief, detailed, agents-md]
    group: agent
    sort: 2

  notify-on-complete:
    type: awn.field.boolean
    title: Уведомление по завершении
    description: notify_user после длинных задач
    default: false
    group: notify
    sort: 10
