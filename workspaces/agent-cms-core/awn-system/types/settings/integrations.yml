id: awn.settings.integrations
name: Интеграции и плагины
kind: type
domain: settings
status: active
extends: awn.settings.base
description: >
  Контейнеры настроек внешних сервисов для workspace: Cursor skills, MCP tools,
  hooks и другие плагины. Значения — .agent-cms/settings/integrations.yml. Область не
  сливается с platform/workspace/user. Пока схема статическая; позже контейнеры
  можно создавать из реестра без правки ядра CMS.
scope: integrations
enabled: true
consumer: [ui, mcp-server]
valuesFile: .agent-cms/settings/integrations.yml

fieldGroups:
  - id: concept
    name: Концепция
    description: >
      Как устроены контейнеры интеграций — один плагин = группа полей с общим
      префиксом id (.agent-cms/settings/integrations.yml).
  - id: module-git
    name: Модуль git
    description: >
      Параметры встроенного модуля module-git (панель Git workspace, MCP
      module_git_*). Только для справки — значения задаются платформой.
  - id: example-cursor-skill
    name: Пример · Cursor Skill
    description: >
      Заглушка контейнера skill — локальные skills, automations, agent hooks.
  - id: example-mcp-bridge
    name: Пример · MCP bridge
    description: >
      Заглушка контейнера MCP tool / server, подключаемого к workspace.

fields:

  integrations-model-version:
    type: awn.field.string
    title: Версия модели контейнеров
    description: >
      Маркер схемы stub-v1. В будущем — migrations при смене формата контейнеров.
    default: stub-v1
    group: concept
    locked: true
    sort: 1

  integrations-containers-note:
    type: awn.field.string
    title: Как это будет работать
    description: >
      План: реестр типов контейнеров (skill / mcp-tool / plugin / hook), UI для
      добавления экземпляров, опционально отдельный YAML на контейнер в
      .agent-cms/settings/integrations/.
    default: static-groups-stub
    group: concept
    locked: true
    sort: 2

  module-git-default-branch:
    type: awn.field.string
    title: Ветка по умолчанию
    description: >
      Начальная ветка при git init в корне workspace (module_git_init, кнопка
      «Инициализировать git»).
    default: main
    group: module-git
    locked: true
    readonly: true
    sort: 3

  module-git-commit-batches:
    type: awn.field.repeater
    title: Партии коммита при сохранении
    description: >
      До двенадцати коммитов подряд (пустые пропускаются): записи → история записей (mdback) →
      изображения → исходник → документы → медиа → 2D дизайн → 3D моделирование →
      архитектура/BIM → архивы → прочее → конфиги.
      Плейсхолдеры — {branch}, {date}, {time}.
      Дополнительно в конфигах по имени: .gitignore, .env / .env.*, *.lock.
    group: module-git
    locked: true
    readonly: true
    sort: 4
    default:
      - id: records
        label: Записи (контент)
        emoji: "📝"
        extensions: |
          md
          mdx
          csv
          txt
        messageTemplate: "[{branch}] Сохранение workspace ({date} {time}) - Records"
        maxFileSizeMb: 1
      - id: records-history
        label: Записи (контент) — история
        emoji: "🕓"
        extensions: |
          mdback
        messageTemplate: "[{branch}] Сохранение workspace ({date} {time}) - Records history"
        maxFileSizeMb: 1
      - id: images
        label: Изображения (контент)
        emoji: "🖼️"
        extensions: |
          png
          jpg
          jpeg
          gif
          webp
          svg
          avif
          heic
          heif
          jfif
          apng
          ico
          bmp
          tif
          tiff
        messageTemplate: "[{branch}] Сохранение workspace ({date} {time}) - Images"
        maxFileSizeMb: 5
      - id: sources
        label: Исходник (код)
        emoji: "💻"
        extensions: |
          html
          htm
          css
          scss
          js
          mjs
          ts
          sh
          xml
          py
          pyi
          rb
          go
          rs
          sql
        messageTemplate: "[{branch}] Сохранение workspace ({date} {time}) - Sources"
        maxFileSizeMb: 5
      - id: documents
        label: Документы
        emoji: "📄"
        extensions: |
          pdf
          doc
          docx
          xls
          xlsx
          ppt
          pptx
        messageTemplate: "[{branch}] Сохранение workspace ({date} {time}) - Documents"
        maxFileSizeMb: 5
      - id: media
        label: Медиа
        emoji: "🎬"
        extensions: |
          mp4
          mp3
          webm
          wav
          ogg
          m4a
          aac
          flac
          mov
          mkv
          avi
        messageTemplate: "[{branch}] Сохранение workspace ({date} {time}) - Media"
        maxFileSizeMb: 5
      - id: design-2d
        label: 2D — дизайн
        emoji: "🎨"
        extensions: |
          psd
          psb
          ai
          eps
          sketch
          xd
          indd
          afdesign
        messageTemplate: "[{branch}] Сохранение workspace ({date} {time}) - Design 2D"
        maxFileSizeMb: 5
      - id: design-3d
        label: 3D — моделирование
        emoji: "📐"
        extensions: |
          blend
          fbx
          obj
          glb
          gltf
          stl
          usdz
          c4d
          max
          ma
          mb
          ztl
        messageTemplate: "[{branch}] Сохранение workspace ({date} {time}) - Design 3D"
        maxFileSizeMb: 5
      - id: design-bim
        label: Архитектура / BIM
        emoji: "🏗️"
        extensions: |
          dwg
          dxf
          rvt
          ifc
          skp
          3dm
          pln
          nwd
          nwc
        messageTemplate: "[{branch}] Сохранение workspace ({date} {time}) - Architecture BIM"
        maxFileSizeMb: 5
      - id: archives
        label: Архивы
        emoji: "📦"
        extensions: |
          zip
          tar
          gz
          tgz
          bz2
          xz
          7z
        messageTemplate: "[{branch}] Сохранение workspace ({date} {time}) - Archives"
        maxFileSizeMb: 5
      - id: other
        label: Прочее
        emoji: "📎"
        extensions: |
          wasm
          woff
          woff2
        messageTemplate: "[{branch}] Сохранение workspace ({date} {time}) - Other"
        maxFileSizeMb: 5
      - id: configs
        label: Конфиги, настройки (служебное)
        emoji: "⚙️"
        extensions: |
          yml
          yaml
          json
          jsonl
          ndjson
          toml
          ini
          cfg
          properties
          lock
        messageTemplate: "[{branch}] Сохранение workspace ({date} {time}) - Configs"
        maxFileSizeMb: 1
    properties:
      id:
        type: awn.field.string.slug
        title: ID партии
        description: records, images, sources, documents, media, archives, other, configs
      label:
        type: awn.field.string
        title: Название
      emoji:
        type: awn.field.string
        title: Эмодзи в UI
        description: Одна иконка для таблицы партий и модалки коммита (например 📝)
      extensions:
        type: awn.field.text
        title: Расширения
        description: Одно расширение на строку, без точки
      messageTemplate:
        type: awn.field.string
        title: Шаблон сообщения коммита
      maxFileSizeMb:
        type: awn.field.number
        title: Макс. размер файла (МБ)
        description: >
          Файлы больше лимита не попадают в коммит этой партии. Записи и конфиги — 1 МБ,
          изображения и прочие файлы — 5 МБ по умолчанию.

  module-git-commit-max-batch-mb:
    type: awn.field.number
    title: Макс. размер одного коммита (МБ)
    description: >
      Сумма размеров файлов в одной партии при batched commit (UI и module_git_commit).
      Превышение блокирует коммит этой партии. 0 — отключить проверку.
    default: 250
    group: module-git
    locked: true
    readonly: true
    sort: 5

  module-git-user-name:
    type: awn.field.string
    title: Имя автора коммита
    description: >
      Git user.name для коммитов из UI и module_git_commit (локально для команды, без проверки личности).
    default: ""
    group: module-git
    sort: 6

  module-git-user-email:
    type: awn.field.string
    title: Email автора коммита
    description: Git user.email для коммитов из workspace.
    default: ""
    group: module-git
    sort: 7

  module-git-sign-commits:
    type: awn.field.boolean
    title: Подпись коммитов (GPG/SSH)
    description: Зарезервировано — подпись коммитов пока не поддерживается.
    default: false
    group: module-git
    locked: true
    readonly: true
    sort: 8

  module-git-pull-strategy:
    type: awn.field.choice.one
    title: Стратегия pull
    description: Зарезервировано — merge или rebase при будущем Pull.
    default: merge
    enum: [merge, rebase]
    group: module-git
    locked: true
    readonly: true
    sort: 9

  container-cursor-skill-enabled:
    type: awn.field.boolean
    title: "{NOT WORK} Включено"
    description: Подключать skill при старте агента в этом workspace
    default: false
    group: example-cursor-skill
    sort: 10

  container-cursor-skill-kind:
    type: awn.field.choice.one
    title: "{NOT WORK} Тип контейнера"
    description: Класс интеграции — skill, MCP tool, plugin или hook
    default: skill
    enum: [skill, mcp-tool, plugin, hook]
    group: example-cursor-skill
    sort: 11

  container-cursor-skill-source:
    type: awn.field.string
    title: "{NOT WORK} Путь или пакет"
    description: >
      Например ~/.cursor/skills/automate или npm-пакет с skill-манифестом
    default: ~/.cursor/skills/automate
    group: example-cursor-skill
    sort: 12

  container-cursor-skill-namespace:
    type: awn.field.string
    title: "{NOT WORK} Namespace MCP"
    description: Имя namespace для динамических tools из skill (если применимо)
    default: cursor-skill
    group: example-cursor-skill
    sort: 13

  container-mcp-bridge-enabled:
    type: awn.field.boolean
    title: "{NOT WORK} Включено"
    description: Поднимать локальный MCP bridge для этого хранилища
    default: false
    group: example-mcp-bridge
    sort: 20

  container-mcp-bridge-endpoint:
    type: awn.field.string
    title: "{NOT WORK} Endpoint"
    description: URL или stdio-команда для MCP server (заглушка)
    default: http://127.0.0.1:7337/mcp
    group: example-mcp-bridge
    sort: 21

  container-mcp-bridge-tools:
    type: awn.field.string
    title: "{NOT WORK} Разрешённые tools"
    description: Список через запятую; пусто = все tools сервера
    default: list_workspaces, read_page_body, search_workspace_content
    group: example-mcp-bridge
    sort: 22

  container-mcp-bridge-auth-token:
    type: awn.field.string
    title: "{NOT WORK} Auth token"
    description: Секрет для bridge; в runtime — из .env рядом с integrations.yml
    default: ""
    group: example-mcp-bridge
    sort: 23
