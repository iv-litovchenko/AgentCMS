id: awn.settings.platform
name: Настройки платформы
kind: type
domain: settings
status: active
extends: awn.settings.base
description: >
  Политика всей платформы Agent CMS (agent-cms-core): MCP, лимиты, системная память.
  Значения — settings.global.yml. Не перекрываются настройками workspace.
scope: platform
enabled: true
consumer: [mcp-server, server, ui, context]
valuesFile: settings.global.yml

fieldGroups:
  - id: mcp
    name: MCP
  - id: memory
    name: Память

fields:

  mcp-mode:
    type: awn.field.choice.one
    title: Режим MCP
    description: readonly — только read/list/search; standard — + write/create; full — exec
    default: standard
    enum: [readonly, standard, full]
    group: mcp
    sort: 10

  batch-enabled:
    type: awn.field.boolean
    title: batch_invoke
    description: Разрешить пакетные вызовы одного MCP-tool
    default: true
    group: mcp
    sort: 11

  batch-read-limit:
    type: awn.field.number.integer
    title: Лимит read/list/search
    default: 20
    group: mcp
    sort: 12

  batch-write-limit:
    type: awn.field.number.integer
    title: Лимит write/create/delete
    default: 10
    group: mcp
    sort: 13

  batch-deny-exec:
    type: awn.field.boolean
    title: "{NOT WORK} Запретить exec в batch"
    default: true
    group: mcp
    sort: 14

  confirm-delete:
    type: awn.field.boolean
    title: "{NOT WORK} Подтверждение delete"
    default: true
    group: mcp
    sort: 15

  confirm-exec:
    type: awn.field.boolean
    title: "{NOT WORK} Подтверждение exec"
    default: true
    group: mcp
    sort: 16

  auto-retain-facts:
    type: awn.field.boolean
    title: "{NOT WORK} Авто-факты"
    default: false
    group: memory
    sort: 21

  always-context-max-files:
    type: awn.field.number.integer
    title: "{NOT WORK} Лимит always-context"
    default: 0
    group: memory
    sort: 23
