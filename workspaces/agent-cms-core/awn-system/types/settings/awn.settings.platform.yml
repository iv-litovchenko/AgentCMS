id: awn.settings.platform
name: Настройки платформы
kind: type
domain: settings
status: active
extends: awn.settings.base
description: >
  Параметры и поведение всей платформы Agent CMS (agent-cms-core).
  Значения — settings.global.yml. Workspace переопределяет точечно через awn.settings.workspace.
scope: platform
enabled: true
consumer: [mcp-server, server, ui, context]
valuesFile: settings.global.yml

fieldGroups:
  - id: general
    name: Общие
  - id: mcp
    name: MCP
  - id: memory
    name: Память

fields:

  agent-language:
    type: awn.field.choice.one
    title: Язык агента
    description: Предпочтительный язык ответов по умолчанию
    default: ru
    enum: [ru, en, auto]
    group: general
    sort: 1

  response-style:
    type: awn.field.choice.one
    title: Стиль ответов
    description: Кратко / подробно / как в AGENTS.md
    default: agents-md
    enum: [brief, detailed, agents-md]
    group: general
    sort: 2

  notify-on-complete:
    type: awn.field.boolean
    title: Уведомление по завершении
    description: notify_user после длинных задач
    default: false
    group: general
    sort: 3

  mcp-mode:
    type: awn.field.choice.one
    title: Режим MCP
    description: readonly — только read/list/search; standard — + write/create; full — exec
    default: standard
    enum: [readonly, standard, full]
    group: mcp
    sort: 10

  batch-enabled:
    type: awn.field.boolean
    title: batch_invoke
    description: Разрешить пакетные вызовы одного MCP-tool
    default: true
    group: mcp
    sort: 11

  batch-read-limit:
    type: awn.field.number.integer
    title: Лимит read/list/search
    default: 20
    group: mcp
    sort: 12

  batch-write-limit:
    type: awn.field.number.integer
    title: Лимит write/create/delete
    default: 10
    group: mcp
    sort: 13

  batch-deny-exec:
    type: awn.field.boolean
    title: Запретить exec в batch
    default: true
    group: mcp
    sort: 14

  confirm-delete:
    type: awn.field.boolean
    title: Подтверждение delete
    default: true
    group: mcp
    sort: 15

  confirm-exec:
    type: awn.field.boolean
    title: Подтверждение exec
    default: true
    group: mcp
    sort: 16

  default-slot:
    type: awn.field.string
    title: Слот по умолчанию
    default: main
    group: memory
    sort: 20

  auto-retain-facts:
    type: awn.field.boolean
    title: Авто-факты
    default: false
    group: memory
    sort: 21

  awn-temp-ttl-days:
    type: awn.field.number.integer
    title: TTL awn-temp (дни)
    default: 0
    group: memory
    sort: 22

  always-context-max-files:
    type: awn.field.number.integer
    title: Лимит always-context
    default: 0
    group: memory
    sort: 23
