id: awn.settings.platform
name: Настройки платформы
kind: type
domain: settings
status: active
extends: awn.settings.base
description: >
  Политика всей платформы Agent CMS (agent-cms-core): MCP, лимиты, индексы, память.
  Значения — settings.global.yml. Не перекрываются workspace/user.
scope: platform
enabled: true
consumer: [mcp-server, server, ui, context]
valuesFile: settings.global.yml

fieldGroups:
  - id: main
    name: Основные
    description: Режим обслуживания и язык UI по умолчанию для всей платформы (settings.global.yml).
  - id: ui
    name: Интерфейс
    description: Глобальные настройки интерфейса — заглушка. Персональные параметры (дерево, сайдбар) — в «Пользовательские настройки».
  - id: auto-context
    name: Автоконтекст
    description: >
      Что всегда попадает в контекст агента (always-context): документы платформы, AGENTS.md workspace
      и текстовые файлы из каталога ws/ (settings.global.yml).
  - id: mcp
    name: MCP
    description: Политика MCP-tools — режим доступа, batch_invoke и лимиты чтения/записи файлов.
  - id: indexing
    name: Индексирование
    description: Включение и отключение слоёв индексов workspace (semantic, fulltext, storage, links).
  - id: memory
    name: Память
    description: Параметры долговременной памяти агента (пока не подключены в runtime).

fields:

  sys-cms-version:
    type: awn.field.string
    title: Версия CMS
    description: Версия пакета agent-cms (package.json)
    readonly: true
    group: main
    sort: 1

  sys-registry-version:
    type: awn.field.string
    title: Версия registry.yml
    readonly: true
    group: main
    sort: 2

  sys-registry-mode:
    type: awn.field.string
    title: Режим registry
    readonly: true
    group: main
    sort: 3

  sys-registry-migration-date:
    type: awn.field.string
    title: Дата миграции типов
    readonly: true
    group: main
    sort: 4

  sys-node-version:
    type: awn.field.string
    title: Node.js
    readonly: true
    group: main
    sort: 5

  sys-platform-os:
    type: awn.field.string
    title: ОС сервера
    readonly: true
    group: main
    sort: 6

  sys-core-path:
    type: awn.field.string
    title: Каталог ядра
    readonly: true
    group: main
    sort: 7

  sys-type-catalog-count:
    type: awn.field.string
    title: Типов в каталоге
    readonly: true
    group: main
    sort: 8

  maintenance-mode:
    type: awn.field.boolean
    title: Режим обслуживания
    description: Закрывает API (кроме settings.global.yml). В UI — оверлей.
    default: false
    group: main
    sort: 20

  default-locale:
    type: awn.field.choice.one
    title: Язык UI по умолчанию
    description: Атрибут lang у document (ru/en)
    default: ru
    enum: [ru, en]
    group: main
    sort: 21

  ui-theme:
    type: awn.field.choice.one
    title: "{NOT WORK} Тема оформления"
    description: Глобальная тема UI для всех workspace (пока заглушка)
    default: system
    enum: [system, light, dark]
    group: ui
    sort: 1

  ui-density:
    type: awn.field.choice.one
    title: "{NOT WORK} Плотность интерфейса"
    description: Отступы и высота строк в UI
    default: comfortable
    enum: [compact, comfortable]
    group: ui
    sort: 2

  ui-show-breadcrumbs:
    type: awn.field.boolean
    title: "{NOT WORK} Хлебные крошки"
    description: Показывать breadcrumbs по умолчанию
    default: true
    group: ui
    sort: 3

  ui-default-sidebar-width:
    type: awn.field.number.integer
    title: "{NOT WORK} Ширина сайдбара по умолчанию"
    description: Глобальный default (px). Персонально — user settings.
    default: 280
    group: ui
    sort: 4

  always-context-global-mcp-doc:
    type: awn.field.boolean
    title: GLOBAL_MCP_DOC.md
    description: Глобальная карта MCP (agent-cms-core) — полный текст в always-context всех агентов
    default: true
    group: auto-context
    sort: 24

  always-context-global-response-style:
    type: awn.field.boolean
    title: GLOBAL_RESPONSE_STYLE.md
    description: Глобальный стиль ответов (префиксы 🗄️ / 🌐 / 💭) — always-context
    default: true
    group: auto-context
    sort: 25

  always-context-agents-md:
    type: awn.field.boolean
    title: AGENTS.md
    description: Инструкции агента из корня workspace — always-context
    default: true
    group: auto-context
    sort: 26

  always-context-ws-folder:
    type: awn.field.string
    title: Папка автоконтекста (shared)
    description: >
      Относительный путь от корня workspace — каталог с файлами для always-context
      (по умолчанию awn-shared/context/awn-storage/). Рекурсивно .md/.yml/.txt. Пусто — отключить.
    default: awn-shared/context/awn-storage/
    group: auto-context
    sort: 27

  always-context-max-files:
    type: awn.field.number.integer
    title: "{NOT WORK} Лимит файлов автоконтекста"
    description: Максимум файлов из папки автоконтекста (0 — без лимита)
    default: 0
    group: auto-context
    sort: 28

  mcp-mode:
    type: awn.field.choice.one
    title: Режим MCP
    description: readonly — только read/list/search; standard — + write/create; full — exec
    default: standard
    enum: [readonly, standard, full]
    group: mcp
    sort: 10

  batch-enabled:
    type: awn.field.boolean
    title: batch_invoke
    description: Разрешить пакетные вызовы одного MCP-tool
    default: true
    group: mcp
    sort: 11

  batch-read-limit:
    type: awn.field.number.integer
    title: Лимит read/list/search
    default: 20
    group: mcp
    sort: 12

  batch-write-limit:
    type: awn.field.number.integer
    title: Лимит write/create/delete
    default: 10
    group: mcp
    sort: 13

  batch-deny-exec:
    type: awn.field.boolean
    title: "{NOT WORK} Запретить exec в batch"
    default: true
    group: mcp
    sort: 14

  confirm-delete:
    type: awn.field.boolean
    title: "{NOT WORK} Подтверждение delete"
    default: true
    group: mcp
    sort: 15

  confirm-exec:
    type: awn.field.boolean
    title: "{NOT WORK} Подтверждение exec"
    default: true
    group: mcp
    sort: 16

  read-text-max-bytes:
    type: awn.field.choice.one
    title: Лимит read_file (текст)
    description: read_workspace / scan folder / partial text read
    default: "120000"
    enum:
      - key: "65536"
        name: 64 KB
      - key: "120000"
        name: 120 KB
      - key: "262144"
        name: 256 KB
      - key: "524288"
        name: 512 KB
      - key: "1048576"
        name: 1 MB
      - key: "2097152"
        name: 2 MB
    group: mcp
    sort: 17

  read-binary-max-bytes:
    type: awn.field.choice.one
    title: Лимит read_file (base64)
    description: Бинарные файлы через read_file format=base64
    default: "1500000"
    enum:
      - key: "524288"
        name: 512 KB
      - key: "1048576"
        name: 1 MB
      - key: "1500000"
        name: 1.5 MB
      - key: "3145728"
        name: 3 MB
      - key: "5242880"
        name: 5 MB
      - key: "10485760"
        name: 10 MB
    group: mcp
    sort: 18

  index-semantic-enabled:
    type: awn.field.boolean
    title: Семантический индекс
    default: true
    group: indexing
    sort: 20

  index-fulltext-enabled:
    type: awn.field.boolean
    title: Полнотекстовый индекс
    default: true
    group: indexing
    sort: 21

  index-storage-enabled:
    type: awn.field.boolean
    title: Storage-индекс
    default: true
    group: indexing
    sort: 22

  index-links-enabled:
    type: awn.field.boolean
    title: Индекс связей
    default: true
    group: indexing
    sort: 23

  index-ocr-enabled:
    type: awn.field.boolean
    title: OCR в pipeline
    description: Включать OCR (вложения) в полную цепочку индексирования
    default: false
    group: indexing
    sort: 24

  index-workspace-id-enabled:
    type: awn.field.boolean
    title: Sync awn-id в pipeline
    description: Синхронизировать счётчик awn-id в конце цепочки
    default: true
    group: indexing
    sort: 25

  index-storage-mode:
    type: awn.field.choice.one
    title: Режим индекса полей
    description: Быстрый — только frontmatter; полный — schema + типы полей
    default: quick
    enum:
      - key: quick
        name: Быстрый — только frontmatter
      - key: full
        name: Полный — schema + типы
    group: indexing
    sort: 26

  index-file-extensions:
    type: awn.field.choice.many
    title: Типы файлов для индекса
    description: Какие расширения попадают в pipeline и поиск
    default: [".md", ".sidecar.md"]
    enum:
      - key: ".md"
        name: Markdown (.md)
      - key: ".sidecar.md"
        name: Sidecar (.sidecar.md)
      - key: ".yml"
        name: YAML (.yml)
      - key: ".yaml"
        name: YAML (.yaml)
      - key: ".txt"
        name: Text (.txt)
      - key: ".json"
        name: JSON (.json)
    group: indexing
    sort: 27

  index-path-prefixes:
    type: awn.field.choice.many
    title: Разделы workspace для индекса
    description: Пустой список = весь workspace
    default: []
    enum:
      - key: awn-storage/
        name: awn-storage/
      - key: awn-container/
        name: awn-container/
      - key: awn-shared/
        name: awn-shared/
      - key: codex-test/
        name: codex-test/
    group: indexing
    sort: 28

  index-exclude-patterns:
    type: awn.field.choice.many
    title: Исключения из индекса
    description: Каталоги и префиксы, которые не индексируются
    default:
      - .agent-cms/semantic-index/
      - .agent-cms/fulltext-index/
      - .agent-cms/storage-index/
      - .agent-cms/link-index/
      - node_modules/
      - .git/
    enum:
      - key: .agent-cms/semantic-index/
        name: Кэш semantic-index
      - key: .agent-cms/fulltext-index/
        name: Кэш fulltext-index
      - key: .agent-cms/storage-index/
        name: Кэш storage-index
      - key: .agent-cms/link-index/
        name: Кэш link-index
      - key: node_modules/
        name: node_modules/
      - key: .git/
        name: .git/
    group: indexing
    sort: 29

  search-default-scopes:
    type: awn.field.choice.many
    title: Слои hybrid-поиска
    description: Слои по умолчанию для hybrid/batch (только включённые в политике)
    default: [semantic, fulltext]
    enum:
      - key: semantic
        name: Смысл (semantic)
      - key: fulltext
        name: Слова (fulltext)
    group: indexing
    sort: 30

  search-semantic-chunk-size:
    type: awn.field.number.integer
    title: Размер чанка RAG
    description: Максимальная длина фрагмента при семантической индексации (символы)
    default: 900
    group: indexing
    sort: 31

  search-semantic-chunk-overlap:
    type: awn.field.number.integer
    title: Перекрытие чанков RAG
    description: Overlap между соседними фрагментами (символы)
    default: 100
    group: indexing
    sort: 32

  search-hybrid-semantic-weight:
    type: awn.field.number.integer
    title: Вес semantic в hybrid
    description: Доля семантического скора при объединении результатов (0–100)
    default: 60
    group: indexing
    sort: 33

  search-hybrid-fulltext-weight:
    type: awn.field.number.integer
    title: Вес fulltext в hybrid
    description: Доля полнотекстового скора при объединении результатов (0–100)
    default: 40
    group: indexing
    sort: 34

  auto-retain-facts:
    type: awn.field.boolean
    title: "{NOT WORK} Авто-факты"
    default: false
    group: memory
    sort: 30
