id: awn.settings.workspace
name: Настройки workspace
kind: type
domain: settings
status: active
extends: awn.settings.base
description: >
  Параметры конкретного хранилища (workspace): агент, слоты, TTL, счётчик awn-id.
  Значения — .agent-cms/settings/workspace.yml. Отдельная область, не сливается с platform/user.
scope: workspace
enabled: true
consumer: [mcp-server, server, ui, context]
valuesFile: .agent-cms/settings/workspace.yml

fieldGroups:
  - id: general
    name: Общие
    description: >
      Язык агента и уведомления для этого хранилища (.agent-cms/settings/workspace.yml).
  - id: agent
    name: Агент
    description: Параметры агента для этого хранилища (settings.yml).
  - id: autoincrement
    name: Автоинкремент
    description: >
      Глобальный счётчик awn-id для записей workspace (только просмотр в UI).
      Значения в settings.yml; обновляются при присвоении id и sync-counter.
  - id: memory
    name: Память
    description: Слоты и TTL временных данных workspace (пока не подключены в runtime).
  - id: hooks
    name: Крючки и триггеры
    description: >
      Правила «когда в хранилище происходит событие — выполнить действие»: webhook,
      уведомление, скрипт или вызов MCP. Список правил будет здесь; исполнитель в runtime — позже.
      Сейчас раздел-заглушка.
  - id: voice-client
    name: Голосовой клиент
    description: >
      Настройки Agent CMS Voice для этого workspace.
      Секреты API — в .env; живая сессия Shell — в .agent-cms/state/shell.json.
    subgroups:
      - id: voice-cms
        name: CMS и канал
        description: Привязка Voice к теме workspace
        sort: 1
        defaultOpen: true
      - id: voice-input
        name: Ввод (микрофон)
        description: Режим 🎤 у поля ввода и доп. опции
        sort: 2
      - id: voice-route
        name: Маршрут и агент
        description: Runtime по умолчанию и system prompt
        sort: 3
        defaultOpen: true
      - id: voice-route-claude
        name: Маршрут · Claude CLI
        description: |
          Локальный CLI Claude. Shell запускает claude в workspaces/cli-sandbox/claude/<agent-id>/ — не в корне workspace. К CMS — через MCP.
          Установка npm i -g @anthropic-ai/claude-code · claude login · claude auth status.
        sort: 4
      - id: voice-route-codex
        name: Маршрут · Codex CLI
        description: |
          Локальный CLI Codex. Shell запускает codex exec в workspaces/cli-sandbox/codex/<agent-id>/ — хранилище CMS не монтируется.
          Установка npm i -g @openai/codex · codex login · codex --version.
        sort: 5
      - id: voice-route-cursor
        name: Маршрут · Cursor
        description: Cursor Agent — OpenAI-compatible endpoint (скоро)
        disabled: true
        sort: 6
      - id: voice-route-openclaw
        name: Маршрут · OpenClaw
        description: OpenClaw Gateway — локальный агент :18789 (скоро)
        disabled: true
        sort: 7
      - id: voice-route-hermes
        name: Маршрут · Hermes Agent
        description: Hermes Agent (Nous Research) — API :8642/v1 (скоро)
        disabled: true
        sort: 8
      - id: voice-route-agent-zero
        name: Маршрут · Agent Zero
        description: Agent Zero gateway — :42617 (скоро)
        disabled: true
        sort: 9
      - id: voice-route-qwenpaw
        name: Маршрут · QwenPaw
        description: |
          HTTP-агент QwenPaw. Shell отправляет сообщения на сервер и стримит ответ через SSE.
          URL, agentId и session — в полях ниже.
        sort: 10
      - id: voice-stt
        name: Распознавание (STT)
        description: Включение, захват, промпт и движок
        sort: 11
        defaultOpen: true
      - id: voice-stt-browser
        name: Распознавание (STT) · Web Speech
        sort: 12
      - id: voice-stt-whisper
        name: Распознавание (STT) · Whisper
        description: Локальный Whisper на сервере (скоро в Voice Shell)
        disabled: true
        sort: 13
      - id: voice-stt-elevenlabs
        name: Распознавание (STT) · ElevenLabs Scribe
        description: Облачный Scribe (скоро в Voice Shell)
        disabled: true
        sort: 14
      - id: voice-tts
        name: Озвучка (TTS)
        description: Включение, способ озвучки, промпт и активный движок
        sort: 15
        defaultOpen: true
      - id: voice-tts-browser
        name: Озвучка (TTS) · Web Speech
        sort: 16
      - id: voice-tts-edge
        name: Озвучка (TTS) · Edge TTS
        sort: 17
      - id: voice-tts-piper
        name: Озвучка (TTS) · Piper
        description: Локальный Piper на сервере (скоро в Voice Shell)
        disabled: true
        sort: 18
      - id: voice-tts-elevenlabs
        name: Озвучка (TTS) · ElevenLabs
        sort: 19
      - id: voice-proactive
        name: Проактивные пинги
        sort: 20
      - id: voice-media
        name: Камера и экран
        sort: 21
      - id: voice-window
        name: Окно Voice
        description: Оформление окна Voice Shell — персонаж, компактный режим, фон, звук.
        sort: 22
        defaultOpen: true
      - id: voice-ui
        name: Интерфейс диалога
        sort: 23
      - id: voice-compose
        name: Шаблоны compose
        description: Быстрые команды для поля сообщения в Voice Shell
        sort: 24
  - id: static
    name: Статичные параметры
    description: >
      Заглушка для интеграций — внешние плагины, Cursor skills и сторонние сервисы (settings.yml).
    subgroups:
      - id: demo-plugin
        name: demo-plugin
        description: Заглушка внешнего плагина
        sort: 1
        defaultOpen: true
      - id: examples
        name: Примеры
        description: Тестовые ключи для схемы
        sort: 2

fields:

  agent-language:
    type: awn.field.choice.one
    title: "{NOT WORK} Язык агента"
    description: Предпочтительный язык ответов для этого хранилища
    default: ru
    enum: [ru, en, auto]
    group: general
    sort: 10

  response-style:
    type: awn.field.choice.one
    title: "{NOT WORK} Стиль ответов"
    description: Кратко / подробно / как в AGENTS.md
    default: agents-md
    enum: [brief, detailed, agents-md]
    group: general
    sort: 11

  notify-on-complete:
    type: awn.field.boolean
    title: "{NOT WORK} Уведомление по завершении"
    description: notify_user после длинных задач в этом workspace
    default: false
    group: general
    sort: 12

  awn-id-next:
    type: awn.field.number.integer
    title: Следующий id
    description: Следующий номер для присвоения awn-id новым записям
    locked: true
    default: 1
    group: autoincrement
    sort: 20

  awn-id-issued:
    type: awn.field.number.integer
    title: Выдано id
    description: Сколько awn-id уже выдано счётчиком
    locked: true
    default: 0
    group: autoincrement
    sort: 21

  awn-id-updated-at:
    type: awn.field.string
    title: Обновлено
    description: Время последнего изменения счётчика (ISO 8601)
    locked: true
    group: autoincrement
    sort: 22

  awn-id-model:
    type: awn.field.string
    title: Модель счётчика
    description: Версия схемы счётчика awn-id
    locked: true
    default: workspace-id-autoincrement-v1
    group: autoincrement
    sort: 23

  default-slot:
    type: awn.field.string
    title: "{NOT WORK} Слот по умолчанию"
    default: main
    group: memory
    sort: 30

  awn-temp-ttl-days:
    type: awn.field.number.integer
    title: "{NOT WORK} TTL awn-temp (дни)"
    default: 0
    group: memory
    sort: 31

  hooks-stub-plan:
    type: awn.field.text
    title: Как это будет работать
    description: Концепция раздела (только просмотр, пока не исполняется)
    readonly: true
    group: hooks
    sort: 40
    default: |
      1. Событие — file.saved, index.pipeline.done, cron, конец сессии агента…
      2. Условие — путь, тип записи, тег (опционально).
      3. Действие — POST на URL, notify_user, run_script, mcp.tool.

      Правила хранятся в settings.yml (или отдельном awn-data). Подписка — в server/MCP.

  hooks-rules:
    type: awn.field.repeater
    title: "{NOT WORK} Правила"
    description: Список крючков workspace — редактор и runtime позже
    locked: true
    group: hooks
    sort: 41
    items: awn.field.trigger.rule

  voice-route-runtime:
    type: awn.field.choice.one
    title: Runtime по умолчанию
    description: Дефолтный runtime при открытии Shell. В шапке можно выбрать другой на время сессии.
    default: codex
    enum:
      - key: claude
        name: Claude CLI (Anthropic)
      - key: codex
        name: Codex CLI (OpenAI)
      - key: cursor
        name: Cursor (Anysphere) — скоро
      - key: openclaw
        name: OpenClaw — скоро
      - key: hermes
        name: Hermes Agent — скоро
      - key: agent-zero
        name: Agent Zero — скоро
      - key: qwenpaw
        name: QwenPaw (AgentScope)
    group: voice-client
    subgroup: voice-cms
    sort: 49

  voice-cms-topic-path:
    type: awn.field.string
    title: Тема агента (manifest)
    description: Путь к manifest темы для Voice Shell (cms.topicPath)
    default: awn-agent-kit/agent/manifest.md
    group: voice-client
    subgroup: voice-cms
    sort: 50

  voice-cms-channel:
    type: awn.field.choice.one
    title: Канал диалога
    description: Канал сообщений Voice Shell (thread или session)
    default: thread
    enum:
      - key: thread
        name: thread
      - key: session
        name: session
    group: voice-client
    subgroup: voice-cms
    sort: 51

  voice-route-system-prompt:
    type: awn.field.text
    title: System prompt Voice
    description: Доп. system prompt для Voice Shell
    group: voice-client
    subgroup: voice-route
    sort: 53

  voice-route-claude-cli-path:
    type: awn.field.string
    title: Путь к Claude CLI
    description: Команда или путь к исполняемому файлу Claude CLI.
    default: claude
    group: voice-client
    subgroup: voice-route-claude
    sort: 60

  voice-route-claude-model:
    type: awn.field.string
    title: Модель Claude
    description: Модель Claude. Пусто — значение по умолчанию из CLI.
    group: voice-client
    subgroup: voice-route-claude
    sort: 61

  voice-route-claude-session-id:
    type: awn.field.string
    title: Session ID
    description: Привязка к сессии Claude CLI (--resume). Пусто — новая сессия.
    group: voice-client
    subgroup: voice-route-claude
    sort: 62

  voice-route-claude-permission-mode:
    type: awn.field.choice.one
    title: Подтверждение инструментов
    description: Как Claude CLI запрашивает подтверждение вызова инструментов.
    default: ""
    enum:
      - key: ""
        name: Спрашивать (модалка)
      - key: manual
        name: Manual
      - key: plan
        name: Plan
      - key: auto
        name: Auto
      - key: dontAsk
        name: Don't ask
      - key: bypassPermissions
        name: Bypass
    group: voice-client
    subgroup: voice-route-claude
    sort: 63

  voice-route-codex-cli-path:
    type: awn.field.string
    title: Путь к Codex CLI
    description: Команда или путь к исполняемому файлу Codex CLI.
    default: codex
    group: voice-client
    subgroup: voice-route-codex
    sort: 70

  voice-route-codex-model:
    type: awn.field.string
    title: Модель Codex
    description: Модель Codex. Пусто — значение по умолчанию из CLI.
    group: voice-client
    subgroup: voice-route-codex
    sort: 71

  voice-route-codex-session-id:
    type: awn.field.string
    title: Session ID
    description: Привязка к сессии Codex CLI. Пусто — новая сессия.
    group: voice-client
    subgroup: voice-route-codex
    sort: 72

  voice-route-codex-permission-mode:
    type: awn.field.choice.one
    title: Подтверждение команд
    description: Как Codex CLI запрашивает подтверждение выполнения команд.
    default: ""
    enum:
      - key: ""
        name: Спрашивать (on-request)
      - key: untrusted
        name: Untrusted
      - key: bypassPermissions
        name: Never
    group: voice-client
    subgroup: voice-route-codex
    sort: 73

  voice-route-qwenpaw-url:
    type: awn.field.string
    title: URL QwenPaw
    description: Базовый URL API QwenPaw для Voice Shell.
    default: http://127.0.0.1:8088
    group: voice-client
    subgroup: voice-route-qwenpaw
    sort: 80

  voice-route-qwenpaw-user-id:
    type: awn.field.string
    title: User ID
    description: Идентификатор пользователя в QwenPaw API.
    default: default
    group: voice-client
    subgroup: voice-route-qwenpaw
    sort: 81

  voice-route-qwenpaw-agent-id:
    type: awn.field.string
    title: Agent ID
    description: Идентификатор агента в QwenPaw.
    default: default
    group: voice-client
    subgroup: voice-route-qwenpaw
    sort: 82

  voice-route-qwenpaw-approval-level:
    type: awn.field.choice.one
    title: Подтверждение инструментов
    description: OFF — инструменты без окна «Разрешить?»; AUTO — с подтверждением.
    default: AUTO
    enum:
      - key: AUTO
        name: Спрашивать (AUTO)
      - key: OFF
        name: Без подтверждения (OFF)
    group: voice-client
    subgroup: voice-route-qwenpaw
    sort: 83

  voice-route-qwenpaw-session-id:
    type: awn.field.string
    title: Session ID
    description: ID чата QwenPaw для Voice Shell.
    group: voice-client
    subgroup: voice-route-qwenpaw
    sort: 84

  voice-route-cursor-stub:
    type: awn.field.text
    title: Статус
    description: Подключение в Voice Shell — скоро
    readonly: true
    default: Cursor Agent — OpenAI-compatible endpoint. Настройки Base URL, model и session появятся после подключения runtime.
    group: voice-client
    subgroup: voice-route-cursor
    sort: 90

  voice-route-openclaw-stub:
    type: awn.field.text
    title: Статус
    description: Подключение в Voice Shell — скоро
    readonly: true
    default: OpenClaw Gateway — :18789, token и agent id. Настройки появятся после подключения runtime.
    group: voice-client
    subgroup: voice-route-openclaw
    sort: 91

  voice-route-hermes-stub:
    type: awn.field.text
    title: Статус
    description: Подключение в Voice Shell — скоро
    readonly: true
    default: Hermes Agent — API :8642/v1, Bearer API_SERVER_KEY, профиль и session.
    group: voice-client
    subgroup: voice-route-hermes
    sort: 92

  voice-route-agent-zero-stub:
    type: awn.field.text
    title: Статус
    description: Подключение в Voice Shell — скоро
    readonly: true
    default: Agent Zero — gateway :42617, bearer после /pair.
    group: voice-client
    subgroup: voice-route-agent-zero
    sort: 93

  voice-input-enabled:
    type: awn.field.boolean
    title: Включить голосовой ввод
    description: Микрофон и режим 🎤 у поля ввода
    default: false
    group: voice-client
    subgroup: voice-stt
    sort: 50

  voice-input-mode:
    type: awn.field.choice.one
    title: Режим 🎤
    description: Как вводить голос у поля ввода
    default: fn_button
    enum:
      - key: live
        name: Живой диалог
      - key: meeting
        name: Встреча (запись)
      - key: hold
        name: Голосовое
      - key: fn_button
        name: По кнопке Shift
    group: voice-client
    subgroup: voice-stt
    sort: 51

  voice-input-response-enabled:
    type: awn.field.boolean
    title: Автоотправка
    description: Сразу после 🎤 — агенту; выключите, чтобы править текст в диалоге
    default: false
    group: voice-client
    subgroup: voice-stt
    sort: 52

  voice-input-capture:
    type: awn.field.choice.one
    title: Что слушать
    default: microphone
    enum:
      - key: microphone
        name: Микрофон
      - key: system
        name: Системный звук
      - key: mix
        name: Смешать потоки
    group: voice-client
    subgroup: voice-stt
    sort: 53

  voice-stt-prompt:
    type: awn.field.text
    title: Промпт для обработки речи
    group: voice-client
    subgroup: voice-stt
    sort: 54

  voice-stt-engine:
    type: awn.field.choice.one
    title: Движок STT
    default: browser
    enum:
      - key: browser
        name: Web Speech — в браузере (устройство)
      - key: google
        name: Google STT — облако (Google)
      - key: whisper
        name: Whisper — локально (сервер)
      - key: elevenlabs
        name: ElevenLabs Scribe — облако (ElevenLabs)
    group: voice-client
    subgroup: voice-stt
    sort: 55

  voice-input-global-listen:
    type: awn.field.boolean
    title: Глобальное прослушивание
    description: Устарело — для voice sidecar; в браузерном Shell не используется
    readonly: true
    default: false
    group: voice-client
    subgroup: voice-input
    sort: 56

  voice-input-to-compose:
    type: awn.field.boolean
    title: Вставлять в compose
    description: Устарело — заменено на «Автоотправка» (voice-input-response-enabled)
    readonly: true
    default: false
    group: voice-client
    subgroup: voice-input
    sort: 57

  voice-stt-lang:
    type: awn.field.string
    title: Язык STT
    default: ru-RU
    group: voice-client
    subgroup: voice-stt-browser
    sort: 70

  voice-stt-whisper-model:
    type: awn.field.choice.one
    title: Модель Whisper
    default: base
    enum:
      - key: tiny
        name: tiny — быстро, хуже качество
      - key: base
        name: base — баланс
      - key: small
        name: small
      - key: medium
        name: medium — медленнее, лучше
    group: voice-client
    subgroup: voice-stt-whisper
    sort: 80

  voice-stt-elevenlabs-api-key:
    type: awn.field.string.secret
    title: API key · Scribe
    description: Если пусто — из TTS ElevenLabs; маскируется в форме
    group: voice-client
    subgroup: voice-stt-elevenlabs
    sort: 90

  voice-stt-elevenlabs-model:
    type: awn.field.string
    title: Модель Scribe
    default: scribe_v2
    group: voice-client
    subgroup: voice-stt-elevenlabs
    sort: 91

  voice-tts-enabled:
    type: awn.field.boolean
    title: Включить озвучку ответа
    default: true
    group: voice-client
    subgroup: voice-tts
    sort: 66

  voice-tts-playback-mode:
    type: awn.field.choice.one
    title: Способ озвучки
    default: dialog
    enum:
      - key: dialog
        name: Диалог (озвучка по мере печати ответа)
      - key: reading
        name: Чтение (после полного ответа и маркера [tts-break])
    group: voice-client
    subgroup: voice-tts
    sort: 67

  voice-wake-name:
    type: awn.field.string
    title: Имя для пробуждения (wake word)
    description: Только voice sidecar; в браузерном Shell пока не используется. Пусто — без wake word.
    readonly: true
    default: ""
    group: voice-client
    subgroup: voice-tts
    sort: 68

  voice-tts-prompt:
    type: awn.field.text
    title: Промпт на ответ с озвучкой
    description: Формат с маркером [tts-break]
    group: voice-client
    subgroup: voice-tts
    sort: 69

  voice-tts-include-captions:
    type: awn.field.boolean
    title: Субтитры при озвучке
    default: true
    group: voice-client
    subgroup: voice-tts
    sort: 71

  voice-tts-engine:
    type: awn.field.choice.one
    title: Провайдер (движок)
    default: browser
    enum:
      - key: browser
        name: Web Speech — в браузере (устройство)
      - key: edge
        name: Edge TTS — облако (Microsoft)
      - key: piper
        name: Piper — локально (сервер)
      - key: elevenlabs
        name: ElevenLabs — облако (ElevenLabs)
    group: voice-client
    subgroup: voice-tts
    sort: 72

  voice-tts-browser-lang:
    type: awn.field.string
    title: Язык
    default: ru-RU
    group: voice-client
    subgroup: voice-tts-browser
    sort: 80

  voice-tts-browser-voice:
    type: awn.field.string
    title: Голос
    default: ""
    group: voice-client
    subgroup: voice-tts-browser
    sort: 81

  voice-tts-rate:
    type: awn.field.string
    title: Скорость
    description: Web Speech
    default: "1"
    group: voice-client
    subgroup: voice-tts-browser
    sort: 82

  voice-tts-pitch:
    type: awn.field.string
    title: Высота голоса
    description: Только Web Speech
    default: "1"
    group: voice-client
    subgroup: voice-tts-browser
    sort: 83

  voice-tts-edge-voice:
    type: awn.field.string
    title: Голос Edge
    default: ru-RU-SvetlanaNeural
    group: voice-client
    subgroup: voice-tts-edge
    sort: 90

  voice-tts-edge-rate:
    type: awn.field.string
    title: Скорость
    description: Edge TTS
    default: "1"
    group: voice-client
