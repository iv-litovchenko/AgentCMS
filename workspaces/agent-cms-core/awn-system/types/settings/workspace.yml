id: awn.settings.workspace
name: Настройки workspace
kind: type
domain: settings
status: active
extends: awn.settings.base
description: >
  Параметры конкретного хранилища (workspace): агент, слоты, TTL, счётчик awn-id.
  Значения — settings.yml. Отдельная область, не сливается с platform/user.
scope: workspace
enabled: true
consumer: [mcp-server, server, ui, context]
valuesFile: settings.yml

fieldGroups:
  - id: general
    name: Общие
    description: Язык агента, стиль ответов и уведомления для этого хранилища (settings.yml).
  - id: autoincrement
    name: Автоинкремент
    description: >
      Глобальный счётчик awn-id для записей workspace (только просмотр в UI).
      Значения в settings.yml; обновляются при присвоении id и sync-counter.
  - id: memory
    name: Память
    description: Слоты и TTL временных данных workspace (пока не подключены в runtime).
  - id: static
    name: Статичные параметры
    description: >
      Заглушка для интеграций — внешние плагины, Cursor skills и сторонние сервисы (settings.yml).

fields:

  agent-language:
    type: awn.field.choice.one
    title: "{NOT WORK} Язык агента"
    description: Предпочтительный язык ответов для этого хранилища
    default: ru
    enum: [ru, en, auto]
    group: general
    sort: 10

  response-style:
    type: awn.field.choice.one
    title: "{NOT WORK} Стиль ответов"
    description: Кратко / подробно / как в AGENTS.md
    default: agents-md
    enum: [brief, detailed, agents-md]
    group: general
    sort: 11

  notify-on-complete:
    type: awn.field.boolean
    title: "{NOT WORK} Уведомление по завершении"
    description: notify_user после длинных задач в этом workspace
    default: false
    group: general
    sort: 12

  awn-id-next:
    type: awn.field.number.integer
    title: Следующий id
    description: Следующий номер для присвоения awn-id новым записям
    locked: true
    default: 1
    group: autoincrement
    sort: 20

  awn-id-issued:
    type: awn.field.number.integer
    title: Выдано id
    description: Сколько awn-id уже выдано счётчиком
    locked: true
    default: 0
    group: autoincrement
    sort: 21

  awn-id-updated-at:
    type: awn.field.string
    title: Обновлено
    description: Время последнего изменения счётчика (ISO 8601)
    locked: true
    group: autoincrement
    sort: 22

  awn-id-model:
    type: awn.field.string
    title: Модель счётчика
    description: Версия схемы счётчика awn-id
    locked: true
    default: workspace-id-autoincrement-v1
    group: autoincrement
    sort: 23

  default-slot:
    type: awn.field.string
    title: "{NOT WORK} Слот по умолчанию"
    default: main
    group: memory
    sort: 30

  awn-temp-ttl-days:
    type: awn.field.number.integer
    title: "{NOT WORK} TTL awn-temp (дни)"
    default: 0
    group: memory
    sort: 31

  ws-static-plugin-example:
    type: awn.field.string
    title: "{NOT WORK} Пример ключа плагина"
    description: >
      Заглушка статического параметра workspace для внешних плагинов, skills и сервисов.
    default: ""
    group: static
    sort: 90

  ws-static-example-1:
    type: awn.field.string
    title: "{NOT WORK} Ключ 1"
    default: значение 1
    group: static
    sort: 91

  ws-static-example-2:
    type: awn.field.string
    title: "{NOT WORK} Ключ 2"
    default: значение 2
    group: static
    sort: 92

  ws-static-example-3:
    type: awn.field.string
    title: "{NOT WORK} Ключ 3"
    default: значение 3
    group: static
    sort: 93
