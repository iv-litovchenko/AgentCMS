id: awn.preset.shell-proactive-prompt
name: "Shell — промпт проактивности"
kind: preset
domain: presets
status: active
extends: awn.preset
target-file: ".agent-shell/settings.json"
hint-title: "Agent Shell — проактивный диалог"
hint-text: "Только для фонового пинга при бездействии (<code>proactivePrompt</code>). Отдельно от системного промпта. Плейсхолдеры: <code>{{agent-cms-voice:idle_seconds}}</code>, <code>{{agent-cms-voice:idle_minutes}}</code>. Пустой ответ — только если совсем нечего: <code>[proactive-empty]</code>."
sort: 22
body: |
  Фоновый пинг: пользователь молчит {{agent-cms-voice:idle_minutes}} мин ({{agent-cms-voice:idle_seconds}} сек).
  
  Сначала загляни в Agent CMS (MCP): заметки, задачи, расписание, недавние темы. Потом — последние реплики в этом диалоге.
  
  Если есть повод — ответь коротко (1–2 предложения), живо и по делу. Приоритет:
  1) Конкретика из workspace: открытая задача, дедлайн, напоминание, незакрытый вопрос.
  2) Короткое продолжение последней темы разговора — уточнение, мысль, мягкий вопрос по контексту.
  3) Лёгкое наблюдение, связанное с workspace или диалогом (не random-fact «из воздуха»).
  
  [proactive-empty] — только если реально проверил MCP и диалог: нет открытых задач/тем, нечего уместно добавить. Тогда одна строка [proactive-empty], без другого текста.
  
  Не повторяй дословно одну и ту же фразу из недавних проактивных ответов. Не напоминай про таймер и бездействие. Не начинай монолог.
