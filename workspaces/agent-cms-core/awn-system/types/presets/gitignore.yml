id: awn.preset.gitignore
name: "Git — .gitignore"
kind: preset
domain: presets
status: active
extends: awn.preset
target-file: ".gitignore"
hint-title: "Git — что не попадает в репозиторий"
hint-text: "Корневой <code>.gitignore</code> workspace: секреты, runtime <code>.agent-cms/</code>, временные <code>awn-temp/</code>, OS-мусор, слоты <code>media</code>. В <code>awn-repositories/</code> коммитим только <code>manifest.md</code> и <code>README.md</code>."
sort: 1
body: |
  # Секреты — не коммитить
  .env
  .env.*
  !.env.example

  # macOS / Windows
  .DS_Store
  Thumbs.db
  Desktop.ini

  # IDE
  .idea/
  .vscode/

  # Runtime CMS / Shell
  .agent-cms/

  # Временные файлы workspace
  awn-temp/

  # Прочий кэш и временные файлы
  .cache/
  tmp/
  temp/
  *.tmp
  *.log

  # Зависимости (если есть npm-скрипты)
  node_modules/

  # Слоты awn-storage — media (крупные файлы)
  **/awn-storage/**/media/

  # Каталог исходников — в git только manifest + README карточки
  awn-repositories/**/*
  !awn-repositories/**/manifest.md
  !awn-repositories/**/README.md
