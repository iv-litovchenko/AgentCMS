id: awn.preset.gitignore
name: "Git — .gitignore"
kind: preset
domain: presets
status: active
extends: awn.preset
target-file: ".gitignore"
hint-title: "Git — что не попадает в репозиторий"
hint-text: "Корневой <code>.gitignore</code> workspace: секреты, кэш <code>.agent-cms/cache/</code>, временные <code>awn-temp/</code>, OS-мусор, бинарники в <code>awn-storage/…/media/</code> (файлы <code>.md</code> там — в git). В <code>awn-repositories/</code> — <code>index.md</code>, <code>manifest.md</code> и <code>README.md</code> карточек; остальное клона — нет."
sort: 1
body: |
  # Секреты — не коммитить
  .env
  .env.*
  !.env.example

  # macOS / Windows
  .DS_Store
  Thumbs.db
  Desktop.ini

  # IDE
  .idea/
  .vscode/

  # Кэш индексов / поиска (настройки в .agent-cms/settings/ — в git)
  .agent-cms/cache/

  # Временные файлы workspace
  awn-temp/

  # Прочий кэш и временные файлы
  .cache/
  tmp/
  temp/
  *.tmp
  *.log

  # Зависимости (если есть npm-скрипты)
  node_modules/

  # Слоты awn-storage — media (крупные файлы; .md — sidecar и подписи — в git)
  **/awn-storage/**/media/**
  !**/awn-storage/**/media/**/
  !**/awn-storage/**/media/**/*.md

  # Каталог клонов — в git каталог index.md и карточки manifest + README
  awn-repositories/**
  !awn-repositories/**/
  !awn-repositories/index.md
  !awn-repositories/**/manifest.md
  !awn-repositories/**/README.md
