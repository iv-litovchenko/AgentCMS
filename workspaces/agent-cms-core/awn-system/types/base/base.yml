id: awn.base
name: База сущности
kind: base
domain: base
status: active
extends: awn.entity
description: >
  Общие поля любой сущности CMS. UI формы свойств строится только из этой схемы
  (form / field-groups / fields.placement / type).

form:
  panel-title: {A!}  Метаданные
  zones:
    - id: title-bar
      role: primary-title
    - id: editor-body
      role: inline-fields
    - id: aside-hero
      role: media-links
    - id: aside-body
      role: field-groups
    - id: hidden
      role: system-storage

field-groups:
  - id: content
    name: Основное
    description: Что заполняет человек или агент
    collapsed: false
  - id: runtime
    name: {A!}   Runtime агента
    description: Загрузка в контекст, cron, heartbeat
    collapsed: true
  - id: taxonomy
    name: Таксономия
    description: Категории, теги, приоритет, цвет, владелец
    collapsed: true
  - id: system
    name: {A!}  Системные
    description: Заполняется автоматически, только чтение
    collapsed: true

fields:

// Основные поля

  awn-name:
    type: awn.field.string
    title: {A!}  Имя
    description: Отображаемое имя в меню; пустое → slug
    placement: title-bar
    group: content
    sort: 1

  awn-description:
    type: awn.field.text
    title: {A!}  Описание
    placement: hidden
    group: content
    sort: 4

// Превью и источник

  awn-preview:
    type: awn.field.file.image.one.with-preview
    title: {A!}  Превью
    description: awn-storage/assets/preview/
    placement: aside-hero
    group: content
    sort: 1

  awn-web-url:
    type: awn.field.string.url
    title: {A!}  Веб-источник
    description: URL оригинала в интернете (https://…)
    placement: aside-hero
    widget: url
    group: content
    sort: 2

// Эмодзи и статус

  awn-emoji:
    type: awn.field.string
    title: {A!}  Эмодзи
    description: Показывается вместо иконки, если превью не задано
    placement: aside-body
    group: content
    sort: 3

  awn-status:
    type: awn.field.choice.one
    title: {A!}  Статус
    placement: aside-body
    group: content
    sort: 2
    enum:
      - key: open
        name: 🟢 Открыта
      - key: draft
        name: 🟡 Черновик
      - key: closed
        name: 🔴 Закрыта
      - key: none
        name: ⚪ Без статуса
    default: open

  awn-sort:
    type: awn.field.number.integer
    title: {A!}  Сортировка
    placement: aside-body
    group: nav
    sort: 3


// Runtime агента

  awn-runtime-load-always:
    type: awn.field.boolean
    title: {A!}  Всегда в контексте
    description: Тема всегда в контексте агента; иначе — только по запросу (по умолчанию)
    default: false
    placement: aside-body
    group: runtime
    sort: 1

  awn-runtime-cron:
    type: awn.field.boolean
    title: {A!}  Выполнение по расписанию
    placement: aside-body
    group: runtime
    sort: 2

  awn-runtime-cron-schedule:
    type: awn.field.string.cron-schedule
    title: {A!}  Расписание
    description: День и время, шаблон или своё cron-выражение
    placement: aside-body
    group: runtime
    sort: 3
    show-when:
      field: awn-runtime-cron
      equals: true

  awn-runtime-heartbeat:
    type: awn.field.boolean
    title: {A!}  Heartbeat
    placement: aside-body
    group: runtime
    sort: 4

  awn-runtime-commands:
    type: awn.field.boolean
    title: {A!}  Выполнение команд
    description: В инструкции темы есть команды для выполнения (визуальный маркер)
    default: false
    placement: aside-body
    group: runtime
    sort: 5

// Таксономия

  awn-category:
    type: awn.field.lookup.one
    source: categories
    title: {A!}  Категория
    placement: aside-body
    group: taxonomy
    sort: 1

  awn-owner:
    type: awn.field.lookup.one
    source: users
    title: {A!}  Владелец
    placement: aside-body
    group: taxonomy
    sort: 2

  awn-priority:
    type: awn.field.lookup.one
    source: priorities
    title: {A!}  Приоритет
    placement: aside-body
    group: taxonomy
    sort: 3

  awn-color:
    type: awn.field.lookup.one
    source: colors
    value-kind: color
    title: {A!}  Цвет
    placement: aside-body
    group: taxonomy
    sort: 4

// Системные поля

  awn-type:
    type: awn.field.string
    title: {A!}  Тип
    required: true
    locked: true
    placement: aside-body
    group: system
    sort: 1

  awn-create:
    type: awn.field.date.datetime
    title: {A!}  Создан
    locked: true
    placement: aside-body
    group: system
    sort: 2

  awn-update:
    type: awn.field.date.datetime
    title: {A!}  Изменён
    locked: true
    placement: aside-body
    group: system
    sort: 3

  awn-version:
    type: awn.field.number.integer
    title: {A!}  Версия
    default: 1
    locked: true
    placement: aside-body
    group: system
    sort: 4

// Теги ???

  awn-tags:
    type: awn.field.lookup.many
    source: tags
    title: {A!}  Теги
    placement: aside-body
    group: content
    sort: 5