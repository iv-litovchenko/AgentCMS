id: awn.base
name: База сущности
kind: base
domain: base
status: active
extends: awn.entity
description: >
  Общие поля любой сущности CMS. UI формы свойств строится только из этой схемы
  (form / field-groups / fields.placement / type).
kind-ui:
  label: База
  badge: { background: "#eef2ff", border: "#a5b4fc", text: "#3730a3" }

form:
  panel-title: "{A2!} Метаданные"
  zones:
    - id: title-bar
      role: primary-title
    - id: editor-body
      role: inline-fields
    - id: aside-hero
      role: media-links
    - id: aside-body
      role: field-groups
    - id: hidden
      role: system-storage

field-groups:
  - id: content
    name: "{A2!} Основное"
    description: Что заполняет человек или агент
    collapsed: false
  - id: work-note
    name: "{A2!} Служебная заметка"
    description: На чём остановились — для вас и агента
    collapsed: false
  - id: nav
    name: "{A2!} Дерево и вид"
    description: Поведение в меню и на главной
    collapsed: true
  - id: runtime
    name: "{A2!} Runtime агента"
    description: Загрузка в контекст, cron, heartbeat
    collapsed: true
  - id: indexing
    name: "{A2!} Индексирование"
    description: Поиск и индексы workspace
    collapsed: true
  - id: taxonomy
    name: "{A2!} Таксономия"
    description: Категории, теги, приоритет, цвет, владелец
    collapsed: true
  - id: system
    name: "{A2!} Системные"
    description: Заполняется автоматически, только чтение
    collapsed: true

fields:
  # --- Основное (title-bar / hidden) ---
  awn-name:
    type: awn.field.string
    title: "{A2!} Имя"
    description: Отображаемое имя в меню; пустое → slug
    placement: title-bar
    group: content
    sort: 1

  awn-description:
    type: awn.field.text
    title: "{A2!} Описание"
    placement: hidden
    group: content
    sort: 4

  # --- aside-hero ---
  awn-preview:
    type: awn.field.file.image.for-preview
    title: "{A2!} Превью"
    description: awn-storage/assets/preview/
    placement: aside-hero
    group: content
    sort: 1

  awn-web-url:
    type: awn.field.string.url
    title: "{A2!} Веб-источник"
    description: URL оригинала в интернете (https://…)
    placement: aside-hero
    widget: url
    group: content
    sort: 2

  # --- content (aside-body) ---
  awn-status:
    type: awn.field.choice.one
    title: "{A2!} Статус"
    placement: aside-body
    group: content
    sort: 2
    enum:
      - key: new
        name: 🔵 Новая
      - key: planned
        name: 🟣 Запланирована
      - key: draft
        name: 🟡 Черновик
      - key: open
        name: 🟢 Открыта
      - key: in-progress
        name: 🟠 В работе
      - key: done
        name: ✅ Готова
      - key: closed
        name: 🔴 Закрыта
      - key: archived
        name: ⚫ Архив
      - key: none
        name: ⚪ Без статуса
    default: open

  awn-quality:
    type: awn.field.number.stars
    title: "{A2!} Качество проверки"
    description: >
      Насколько запись готова после совместной проверки с агентом.
      Ниже 4 — требует доработки; 4 — норма; 10 — отлично.
    hint: "0 — очень низко · 4 — норма · 10 — высоко · ниже 4 нужна обработка"
    placement: aside-body
    group: content
    sort: 3
    default: 4

  awn-importance:
    type: awn.field.number.importance
    title: "{A2!} Важность для меня"
    description: >
      Насколько тема или запись важны лично для вас. Влияет на приоритет
      в поиске агента: важные темы поднимаются выше при абстрактных вопросах.
      Наследуется от темы к записям внутри.
    hint: "0 — не отмечено · 5 — заметно · 10 — критично важно"
    placement: aside-body
    group: content
    sort: 3.5
    default: 0

  awn-note-todo-sticker:
    type: awn.field.text
    title: "{A2!} Заметка остановки"
    description: >
      Техническая заметка для вас и агента: на чём остановились,
      что сделать дальше, блокеры.
    hint: "Кратко: статус, следующий шаг, блокер"
    placement: aside-body
    group: work-note
    sort: 1

  awn-emoji:
    type: awn.field.string
    title: "{A2!} Эмодзи"
    description: Показывается вместо иконки, если превью не задано
    placement: aside-body
    group: content
    sort: 4

  awn-sort:
    type: awn.field.number.integer
    title: "{A2!} Сортировка"
    placement: aside-body
    group: content
    sort: 5

  # --- runtime ---
  awn-runtime-load-always:
    type: awn.field.boolean
    title: "{A2!} Всегда в контексте"
    description: Тема всегда в контексте агента; иначе — только по запросу (по умолчанию)
    default: false
    placement: aside-body
    group: runtime
    sort: 1

  awn-runtime-heartbeat:
    type: awn.field.boolean
    title: "{A2!} Heartbeat"
    placement: aside-body
    group: runtime
    sort: 2

  awn-runtime-cron:
    type: awn.field.boolean
    title: "Тип расписания (выполнение по расписанию)"
    placement: aside-body
    group: runtime
    sort: 3

  awn-runtime-cron-schedule:
    type: awn.field.string.cron-schedule
    title: "{A2!} Расписание"
    description: День и время, шаблон или своё cron-выражение
    placement: aside-body
    group: runtime
    sort: 4
    show-when:
      field: awn-runtime-cron
      equals: true

  awn-runtime-commands:
    type: awn.field.boolean
    title: "{A2!} Выполнение команд"
    description: В инструкции темы есть команды для выполнения (визуальный маркер)
    default: false
    placement: aside-body
    group: runtime
    sort: 5

  # --- taxonomy ---
  awn-category:
    type: awn.field.lookup.one
    source: categories
    title: "{A2!} Категория"
    placement: aside-body
    group: taxonomy
    sort: 1

  awn-owner:
    type: awn.field.lookup.one
    source: users
    title: "{A2!} Владелец"
    placement: hidden
    hidden: true
    group: taxonomy
    sort: 2

  awn-priority:
    type: awn.field.lookup.one
    source: priorities
    title: "{A2!} Приоритет"
    placement: aside-body
    group: taxonomy
    sort: 3

  awn-color:
    type: awn.field.lookup.one
    source: colors
    value-kind: color
    title: "{A2!} Цвет"
    placement: aside-body
    group: taxonomy
    sort: 4

  awn-tags:
    type: awn.field.lookup.many
    source: tags
    title: "{A2!} Теги"
    placement: aside-body
    group: taxonomy
    sort: 5

  # --- system ---
  awn-id:
    type: awn.field.number.integer
    title: "{A2!} ID"
    description: Глобальный номер workspace (счётчик в settings.yml → Автоинкремент). Дубликаты допустимы — можно изменить вручную.
    placement: aside-body
    group: system
    sort: 0

  awn-type:
    type: awn.field.string
    title: "{A2!} Тип"
    required: true
    locked: true
    placement: aside-body
    group: system
    sort: 1

  awn-create:
    type: awn.field.date.datetime
    title: "{A2!} Создан"
    locked: true
    placement: aside-body
    group: system
    sort: 2

  awn-update:
    type: awn.field.date.datetime
    title: "{A2!} Изменён"
    locked: true
    placement: aside-body
    group: system
    sort: 3

  awn-version:
    type: awn.field.number.integer
    title: "{A2!} Версия"
    default: 1
    locked: true
    placement: aside-body
    group: system
    sort: 4
