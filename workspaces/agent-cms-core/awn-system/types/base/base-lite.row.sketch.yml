id: awn.base.lite.row.sketch
name: Запись lite (набросок)
kind: element
domain: base
status: draft
extends: awn.base.lite
description: |
  Пример наследника: только база lite + одно поле контента.
  Не регистрировать в проде — имя *.sketch.yml намеренно «вне игры», если loader игнорирует draft/sketch.

  Дерево:
    awn.base.lite
    └── awn.base.lite.row.sketch
        └── fields: awn-name (+ body в .md по типу записи)
kind-ui:
  label: Запись lite (sketch)
  badge: { background: "#f1f5f9", border: "#94a3b8", text: "#334155" }

form:
  panel-title: "{A2!} Lite-запись"

field-groups:
  - id: main
    name: "{A2!} Основное"
    collapsed: false
  - id: system
    name: "{A2!} Системные"
    collapsed: true

fields:
  awn-name:
    type: awn.field.string
    title: "{A2!} Имя"
    description: Единственное «контентное» поле в наброске; остальное — id/status/type из base-lite
    placement: aside-body
    group: main
    sort: 0
