id: awn.content.record-csv
name: Запись CSV
kind: type
domain: content
status: active
extends: awn.entity
description: >
  Базовые колонки строки CSV (main.csv, csv-накопитель).
  Системные awn-*; пользовательские поля в schema.yml — без префикса awn-.

kind-ui:
  label: Запись CSV
  badge: { background: "#f0f9ff", border: "#bae6fd", text: "#0369a1" }

fields:
  awn-id:
    type: awn.field.number.integer
    title: ID
    description: Глобальный номер workspace (счётчик в settings.yml)
    sort: 0

  awn-parent:
    type: awn.field.string
    title: Родитель
    description: awn-id родительской строки; пусто — корень
    sort: 1

  awn-type:
    type: awn.field.string
    title: Тип
    description: >
      Тип узла в иерархии (например awn.infoblock.element.record-csv,
      awn.infoblock.element.category). Для агента и контекста CSV.
    sort: 2

  awn-name:
    type: awn.field.string
    title: Имя
    description: Отображаемое имя строки
    sort: 3

  awn-description:
    type: awn.field.text
    title: Описание
    sort: 4

  awn-code:
    type: awn.field.string
    title: Код
    description: Ключ строки (slug/id в таблице)
    sort: 5

  awn-sort:
    type: awn.field.number.integer
    title: Сортировка
    default: 0
    sort: 6
