id: awn.content.base
name: База контента
kind: base
domain: content
status: active
extends: awn.base
description: Запись, категория, sidecar — без nav/runtime страниц

form:
  panel-title: Свойства записи
  zones:
    - id: title-bar
      role: primary-title
    - id: aside-hero
      role: media-links
    - id: aside-body
      role: field-groups
    - id: hidden
      role: system-storage

field-groups:
  - id: content
    name: Основное
    collapsed: false
  - id: materials
    name: Материалы
    collapsed: false
  - id: system
    name: Системные
    collapsed: true

fields:
  awn-attachments:
    type: awn.field.file.many
    title: Вложения
    description: awn-storage/assets/attachments/
    scope: attachments
    placement: aside-hero
    group: materials
    sort: 1
