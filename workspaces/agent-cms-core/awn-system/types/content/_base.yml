id: awn.content.base
name: База контента
kind: base
domain: content
status: active
extends: awn.base
description: >
  Запись, категория, sidecar, dialog, comment. Nav контента — awn-focus и awn-main
  (awn-slots-disabled только у manifest темы, не у content). Runtime — через mixin.

# Свои field-groups (см. resolveTypeFieldGroups).

form:
  panel-title: "{A2!} Свойства записи"

field-groups:
  - id: content
    name: "{A2!} Основное"
    description: Что заполняет человек или агент
    collapsed: false
  - id: work-note
    name: "{A2!} Служебная заметка"
    description: На чём остановились — для вас и агента
    collapsed: false
  - id: nav
    name: "{A2!} Дерево и вид"
    description: Поведение в меню и на главной
    collapsed: true
  - id: runtime
    name: "{A2!} Runtime агента"
    description: Загрузка в контекст, cron, heartbeat
    collapsed: true
  - id: taxonomy
    name: "{A2!} Таксономия"
    description: Категории, теги, приоритет, цвет, владелец
    collapsed: true
  - id: physical-location
    name: "{A2!} Физическая локация"
    description: Где находится объект — место, координаты, признак реальной вещи
    collapsed: true
  - id: system
    name: "{A2!} Системные"
    description: Заполняется автоматически, только чтение
    collapsed: true
  - id: knowledge-map
    name: "{A2!} Параметры карты знаний"
    description: Отображение узла на карте знаний (v2)
    collapsed: true

fields:

  # --- nav: awn-focus / awn-main (awn-slots-disabled — не часть content, только manifest темы) ---
  awn-focus:
    type: awn.field.boolean
    title: "{A2!} В фокусе"
    description: Показывать в быстром навигаторе (сайдбар, шапка)
    default: false
    placement: aside-body
    group: nav
    sort: 1

  awn-main:
    type: awn.field.boolean
    title: "{A2!} На главной"
    description: Показывать в карусели на главной странице
    default: false
    placement: aside-body
    group: nav
    sort: 2

  awn-sort:
    hidden: true

  awn-runtime-load-always:
    hidden: true

  awn-runtime-cron:
    hidden: true

  awn-runtime-cron-schedule:
    hidden: true

  awn-runtime-heartbeat:
    hidden: true

  awn-runtime-commands:
    hidden: true

  # --- physical-location ---
  awn-location-label:
    type: awn.field.string
    title: Локация
    description: Локация, место, комната, полка, зона — человекочитаемо
    placeholder: "Гараж / полка 2"
    placement: aside-body
    group: physical-location
    sort: 1

  awn-location-coordinates:
    type: awn.field.coordinates
    title: Координаты
    description: Опционально — GPS или точка на карте
    placement: aside-body
    group: physical-location
    sort: 2

  awn-is-real-world-object:
    type: awn.field.boolean
    title: Реальный объект в мире
    description: Запись описывает физическую вещь в реальном мире, а не абстракцию или идею
    placement: aside-body
    group: physical-location
    sort: 3
    default: false

  awn-is-real-world-event:
    type: awn.field.boolean
    title: Реальное событие в мире
    description: Запись описывает событие, которое произошло или происходит в реальном мире, а не вымышленное или планируемое
    placement: aside-body
    group: physical-location
    sort: 4
    default: false

  # --- knowledge-map ---
  awn-mindmap-enabled:
    type: awn.field.boolean
    title: На карте знаний
    description: Показывать узел на карте знаний темы
    placement: aside-body
    group: knowledge-map
    sort: 1
    default: true

  awn-mindmap-type:
    type: awn.field.choice.one
    title: Тип узла
    placement: aside-body
    group: knowledge-map
    sort: 2
    widget: radio
    enum:
      - key: required
        name: "! Required"
      - key: recommended
        name: "★ Recommended"
      - key: optional
        name: "○ Optional"
      - key: advanced
        name: "⚡ Advanced"
      - key: milestone
        name: "◆ Milestone"
    default: optional

  awn-mindmap-color:
    type: awn.field.choice.one
    title: Цвет
    placement: aside-body
    group: knowledge-map
    sort: 3
    widget: radio
    enum:
      - key: blue
        name: Blue
      - key: teal
        name: Teal
      - key: slate
        name: Slate
      - key: amber
        name: Amber
      - key: red
        name: Red
      - key: purple
        name: Purple
      - key: green
        name: Green
      - key: pink
        name: Pink
    default: slate

  awn-mindmap-size:
    type: awn.field.choice.one
    title: Размер
    placement: aside-body
    group: knowledge-map
    sort: 4
    widget: radio
    enum:
      - key: auto
        name: Auto
      - key: small
        name: Small
      - key: medium
        name: Medium
      - key: large
        name: Large
      - key: junction
        name: Junction
    default: auto

  awn-mindmap-layout-independent:
    type: awn.field.boolean
    title: Свой layout-бокс
    description: Независимая раскладка ветки (Independent Layout Box)
    placement: aside-body
    group: knowledge-map
    sort: 5
    default: false

  awn-mindmap-direction:
    type: awn.field.choice.one
    title: Направление ветки
    placement: aside-body
    group: knowledge-map
    sort: 6
    widget: radio
    enum:
      - key: auto
        name: Auto
      - key: left
        name: "← Left"
      - key: right
        name: "→ Right"
      - key: up
        name: "↑ Up"
      - key: down
        name: "↓ Down"
    default: auto
