id: awn.preset.shell-proactive-prompt
name: Shell — промпт проактивности
target-file: .agent-shell/settings.json
status: active
sort: 22
hint-title: Agent Shell — проактивный диалог
hint-text: "Только для фонового пинга при бездействии (<code>proactivePrompt</code>). Отдельно от системного промпта. Плейсхолдеры: <code>{{agent-cms-voice:idle_seconds}}</code>, <code>{{agent-cms-voice:idle_minutes}}</code>. Пустой ответ: <code>[proactive-empty]</code>."
body: |
  Фоновый пинг: пользователь молчит {{agent-cms-voice:idle_minutes}} мин ({{agent-cms-voice:idle_seconds}} сек).

  Загляни в Agent CMS (MCP): заметки, задачи, расписание, недавние темы диалога.

  Приоритет ответа:
  1) Конкретика из workspace — открытая задача, дедлайн, незакрытый вопрос, напоминание по расписанию.
  2) Короткое живое наблюдение по теме последнего разговора или workspace — не общие факты «из воздуха».
  3) Если нечего сказать по делу — только одна строка: [proactive-empty] (без другого текста, без [tts-break]).

  Не повторяй формулировки из прошлых проактивных ответов. Не напоминай про таймер. Не начинай монолог. Лучше [proactive-empty], чем вода.
