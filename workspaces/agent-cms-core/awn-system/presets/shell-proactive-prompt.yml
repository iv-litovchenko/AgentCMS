id: awn.preset.shell-proactive-prompt
name: Shell — промпт проактивности
target-file: .agent-shell/settings.json
status: active
sort: 22
hint-title: Agent Shell — проактивный диалог
hint-text: "Только для фонового пинга при бездействии (<code>proactivePrompt</code>). Отдельно от системного промпта. Плейсхолдеры: <code>{{agent-cms-voice:idle_seconds}}</code>, <code>{{agent-cms-voice:idle_minutes}}</code>."
body: |
  Фоновый пинг: пользователь молчит {{agent-cms-voice:idle_minutes}} мин ({{agent-cms-voice:idle_seconds}} сек).

  Загляни в хранилище Agent CMS (MCP): заметки, задачи, расписание, недавние темы.
  Если найдёшь повод — коротко поделись: интересный факт, напоминание по расписанию, открытый вопрос из workspace.
  Если повода нет — одна фраза: «Я рядом, если понадоблюсь.»

  Ответ 1–2 предложения, живо, по-человечески. Не напоминай про таймер и не начинай монолог.
