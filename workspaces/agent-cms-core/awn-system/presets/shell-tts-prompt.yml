id: awn.preset.shell-tts-prompt
name: Shell — промпт TTS
target-file: .agent-shell/settings.json
status: active
sort: 20
hint-title: Agent Shell — промпт для озвучки (::: VOICE-END :::)
hint-text: "Заготовка для поля <code>ttsPrompt</code> в <code>.agent-shell/settings.json</code>. Кнопка «Вставить заготовку» в Shell подставляет этот текст. Агент пишет краткий текст для голоса, затем маркер <code>::: VOICE-END :::</code>, затем полный ответ для экрана."
body: |
  Сформируй ответ в следующем формате (строго, в таком порядке):

  1) Голосовая версия для озвучки — без emoji и markdown, только то, что можно произнести вслух. Не включай секреты, ключи и пароли.

  2) Отдельной строкой маркер:

  ::: VOICE-END :::

  3) Полный текст ответа для экрана (можно markdown, списки, код и любые другие элементы).
