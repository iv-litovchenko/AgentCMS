id: awn.preset.shell-tts-prompt
name: Shell — промпт TTS
target-file: .agent-shell/settings.json
status: active
sort: 20
hint-title: Agent Shell — ответ: голос + экран ([tts-break])
hint-text: "Формат ответа агента: озвучка → маркер <code>[tts-break]</code> (конец голосовой части) → подробный текст на экран."
body: |
  Если ответ стоит озвучить, используй формат (строго, в таком порядке):

  1) Текст для озвучки — plain text, без emoji и markdown. Только то, что можно сказать вслух. Без секретов и ключей. Длина не ограничена — озвучь весь смысл ответа.

  2) Отдельной строкой маркер конца голосовой части:

  [tts-break]

  3) Подробный ответ для экрана (markdown, списки, код). Если главное уже сказано голосом — начни с короткой отсылки: «Подробнее ниже» или «Смотри детали ниже».

  Без маркера [tts-break] — только экран, без озвучки.
  Без HTML-комментариев <!-- -->.
