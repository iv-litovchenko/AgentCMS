id: awn.preset.shell-tts-prompt
name: Shell — промпт TTS
target-file: .agent-shell/settings.json
status: active
sort: 20
hint-title: Agent Shell — промпт для блока [tts]
hint-text: "Заготовка для поля <code>ttsPrompt</code> в <code>.agent-shell/settings.json</code>. Кнопка «Вставить заготовку» в Shell подставляет этот текст. Агент должен вернуть блок <code>[tts]…[/tts]</code> и полный ответ для экрана."
body: |
  Сформируй ответ в следующем формате. В начале ответа добавь блок [tts], в котором сформируй краткую версию текста для озвучки (предполагается, что ты работаешь в режиме голосового ассистента). 
  
  Не добавляй сюда для звучки секретные детали, ключи и пароли.

  Убери emoji, markdown и подробные детали, оставь только смысл и другие незначительные детали которые можно воспроизвести через TTS (text to speech). Закрой блок [/tts].

  Далее — полный текст ответа для экрана.
