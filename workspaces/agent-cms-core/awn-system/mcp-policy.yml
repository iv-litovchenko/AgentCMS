version: 1
description: >
  Центральная MCP policy платформы Agent CMS.
  Значения лимитов per-workspace — в config.yml → awn_settings (batch-read-limit, batch-write-limit).
  Этот файл — denylist, категории tools, паттерны. Меняется редко, одно на платформу.

mcp:
  # single-call write tools (blocked in mcp-mode=readonly)
  write_tool_pattern: "^(write_|create_|register_|delete_|move_|rename_|append_|upload_|import_|triage_|retain_|write_database_|register_database|create_database|delete_database|rename_database|delete_channel|rename_channel|delete_media_library|rename_media_library|delete_repository|rename_repository|refresh_databases_index_toc|database_frame_write_|database_frame_create_|database_frame_refresh_|refresh_database_frame_index_toc|database_frame_delete_|database_frame_rename_|notify_user|run_script|exec_|module_git_commit|module_git_init|module_git_push|module_git_pull|module_git_remote)"
  exec_tools:
    - exec_command
    - exec_shell
    - run_script
  # exec разрешён только при mcp-mode=full
  exec_allowed_modes:
    - full

batch_invoke:
  absolute_max_items: 50
  default_parallel:
    read: true
    write: false

  denied_tools:
    - batch_invoke
    - search_workspace_batch
    - get_session_context
    - get_user_active_context_now
    - list_workspaces
    - list_vaults
    - ask_workspace
    - search_and_get_context
    - notify_user
    - test_mcp_connection
    - toggle_comment_reaction
    - triage_inbox_item
    - rebuild_workspace_indexes
    - rebuild_workspace_semantic_index
    - rebuild_workspace_storage_index
    - rebuild_workspace_fulltext_index
    - rebuild_workspace_link_index
    - run_workspace_ocr_index
    - sync_workspace_index_file

  exec_tools:
    - exec_command
    - exec_shell
    - run_script

  read_name_patterns:
    - "^read_"
    - "^list_"
    - "^get_"
    - "^search_"
    - "^recall_"
    - "^resolve_"
    - "^refresh_"

  read_tools:
    - list_topics
    - get_topic
    - topic_exists
    - content_exists
    - list_settings
    - read_setting
    - list_databases
    - get_database
    - read_databases_index_toc
    - read_database_schema
    - read_database_properties
    - read_database_property
    - module_git_status
    - module_git_diff
