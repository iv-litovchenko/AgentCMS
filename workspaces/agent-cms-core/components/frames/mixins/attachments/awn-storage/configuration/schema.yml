id: awn.mixin.attachments
name: Вложения
kind: mixin
description: Файлы, прикреплённые к теме или записи — загрузка и вставка ссылкой в текст
fields:
  awn-attachments:
    type: awn.array
    name: Вложения
    description: Файлы в awn-storage/assets/attachments/; в шапке — список, снизу — файлы только в папке
    items: awn.file
    widget: attachments
    scope: media
