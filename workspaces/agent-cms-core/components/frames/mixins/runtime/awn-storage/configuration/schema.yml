id: awn.mixin.runtime
name: Runtime
kind: mixin
description: Участие элемента в реестре агента — загрузка, cron и heartbeat
fields:
  awn-runtime-load-always:
    type: awn.boolean
    name: В контексте всегда
    description: Тема всегда в контексте агента; иначе — только по запросу (по умолчанию)
    default: false
  awn-runtime-cron:
    type: awn.boolean
    name: Cron
    description: Участвует в планировщике по расписанию
    default: false
  awn-runtime-cron-schedule:
    type: awn.string
    name: Расписание cron
    description: Cron-выражение; используется при awn-runtime-cron true
    hint: "0 9 * * *"
    format: "0 9 * * *"
  awn-runtime-heartbeat:
    type: awn.boolean
    name: Сердцебиение
    description: Участвует в периодическом heartbeat-прогоне
    default: false
  awn-runtime-commands:
    type: awn.boolean
    name: Выполнение команд
    description: В инструкции темы есть команды для выполнения (визуальный маркер)
    default: false
