version: 1
layer: awn-database-store

awn_schema:
  record:
    extends: awn.data.element.default
    fields:
      awn-title:
        type: awn.string
        title: Название
        required: true
        tab: main
      awn-slogan-kind:
        type: awn.field.choice.one
        title: Тип
        enum:
          - text
          - arc
        default: text
        tab: main
      awn-slogan-text:
        type: awn.string
        title: Текст
        tab: main
      awn-slogan-arc:
        type: awn.string
        title: Дуга (части через |)
        description: Для типа arc — части через вертикальную черту
        tab: main
      awn-hold-ms:
        type: awn.integer
        title: Пауза (мс)
        default: 8000
        tab: main
      awn-status:
        type: awn.field.choice.one
        title: Статус
        enum:
          - active
          - draft
          - inactive
        default: active
        tab: main
    tabs:
      main: Слоган
