version: 1
layer: awn-database-store

awn_schema:
  record:
    extends: awn.data.element.default
    fields:
      awn-title:
        type: awn.string
        title: Название
        required: true
      awn-agentIds:
        type: awn.string
        title: Агенты
        description: id агентов через запятую
      awn-background:
        type: awn.string
        title: Фон (путь к изображению)
        description: "awn-storage/assets/attachments/{id}.png"
      awn-appearance:
        type: awn.field.choice.one
        title: Тема
        enum:
          - light
          - dark
        default: light
      awn-system:
        type: awn.boolean
        title: Системная запись
        description: _ungrouped — настройки агентов без группы
        default: false
