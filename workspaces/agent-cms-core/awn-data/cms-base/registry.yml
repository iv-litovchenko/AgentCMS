description: CMS-модель агента — типы в awn-system/types/ и awn-data/cms-base/entities

# domains — источник правды по доменам («какие бывают компоненты»).
# Встроенные домены известны рантайму по умолчанию. Здесь можно:
#   • переопределить их label/kind;
#   • ДОБАВИТЬ новый домен-«пакет» — заведи awn-data/<domain>/types/ и запись ниже.
# Формат записи: строка "id" ИЛИ объект:
#   - id: settings
#     label: Настройки
#     kind: type
#     icon: "⚙"
domains:
  - base
  - fields
  - mixins
  - id: settings
    label: Настройки
    kind: type
    icon: "⚙"
