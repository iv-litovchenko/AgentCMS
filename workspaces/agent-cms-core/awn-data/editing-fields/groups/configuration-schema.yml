version: 1
kind: collection
id: editing-fields.groups
name: Группы полей
extends: ../../_base/configuration-schema.yml
description: Категории типов полей в каталоге и палитре

record:
  id-mode: slug
  file: "{id}.md"

fields:
  title:
    type: awn.string
    title: Название
    required: true
  sort:
    type: awn.integer
    title: Порядок
    default: 0
  status:
    type: awn.enum
    title: Статус
    enum: [active, inactive]
    default: active
