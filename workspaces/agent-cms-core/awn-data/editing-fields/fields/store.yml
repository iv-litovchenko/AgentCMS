version: 1
kind: collection
id: editing-fields.fields
name: Поля
extends: ../../_base/store.yml
description: Типы полей awn.field.* — виджет, storage, settings

record:
  id-mode: slug
  file: "{id}.md"

fields:
  title:
    type: awn.string
    title: Название
    required: true
  fieldId:
    type: awn.string
    title: ID типа
    description: awn.field.string, awn.field.enum…
    required: true
  group:
    type: awn.string
    title: Группа
    description: id из editing-fields/groups
  sort:
    type: awn.integer
    title: Порядок в группе
    default: 0
  widget:
    type: awn.string
    title: Виджет
    required: true
  storage:
    type: awn.string
    title: Storage
  mdbase:
    type: awn.string
    title: MD-base
  format:
    type: awn.string
    title: Формат
  extends:
    type: awn.string
    title: Extends
    default: awn.field.base
  settings:
    type: awn.string
    title: Settings
    description: Список через запятую (hint, required, locked, …)
  status:
    type: awn.enum
    title: Статус
    enum: [active, draft, inactive]
    default: active
