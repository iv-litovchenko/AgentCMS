version: 1
kind: collection
id: zagotovki-shablonov
name: Заготовки шаблонов
extends: ../_base/configuration-schema.yml
description: Заготовки шаблонов

record:
  storage: md
  id-mode: slug
  file: "{id}.md"
  hierarchy: true

fields:
  title:
    type: awn.string
    title: Название
    required: true
  parent:
    type: awn.string
    title: Родитель
    description: id родительской записи
  target-file:
    type: awn.string
    title: Целевой файл
    description: "Имя системного файла: .env, .gitignore, SKILL.md, AGENTS.md, …"
    required: true
  hint-title:
    type: awn.string
    title: Заголовок подсказки
  hint-text:
    type: awn.string
    title: Текст подсказки
    description: HTML-подсказка в редакторе (кнопка «Вставить шаблон»)
  status:
    type: awn.enum
    title: Статус
    enum: [open, done]
    default: open
