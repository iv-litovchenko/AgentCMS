version: 1
kind: collection
id: taxonomies.colors
name: Палитра
extends: ../../_base/store.yml
description: Brand-цвета для awn-color

record:
  storage: csv
  file: main.csv
  id-mode: slug
  hierarchy: false

fields:
  code:
    type: awn.string
    title: Код
    required: true
  label:
    type: awn.string
    title: Подпись
    required: true
  emoji:
    type: awn.string
    title: Эмодзи
  color:
    type: awn.color
    title: Цвет
  sort:
    type: awn.integer
    title: Порядок
    default: 0
