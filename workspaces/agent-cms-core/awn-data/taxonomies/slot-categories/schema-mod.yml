version: 1
layer: awn-data-store

awn_schema:
  record:
    extends: awn.data.element.default
    fields:
      awn-code:
        type: awn.string
        title: Код (id)
        required: true
      awn-label:
        type: awn.string
        title: Название
        required: true
      awn-sort:
        type: awn.integer
        title: Порядок
        default: 0
      awn-description:
        type: awn.string
        title: Описание
