version: 1
kind: collection
id: taxonomies.users
name: Пользователи
extends: ../../_base/store.yml
description: Справочник для awn-owner

record:
  storage: csv
  file: main.csv
  id-mode: slug
  hierarchy: false

fields:
  code:
    type: awn.string
    title: Код
    required: true
  label:
    type: awn.string
    title: Подпись
    required: true
  email:
    type: awn.string
    title: Email
  sort:
    type: awn.integer
    title: Порядок
    default: 0
