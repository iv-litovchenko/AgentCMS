version: 1
kind: collection
id: markdown-blocks.blocks
name: MD-Блоки
extends: ../../_base/store.yml
description: Блоки палитры редактора — awn.block.* с шаблоном в теле записи

record:
  id-mode: slug
  file: "{id}.md"

fields:
  title:
    type: awn.string
    title: Название
    required: true
  blockId:
    type: awn.string
    title: ID типа
    description: awn.block.h2, awn.block.quote…
    required: true
  group:
    type: awn.string
    title: Группа палитры
    description: id из markdown-blocks/groups
  sort:
    type: awn.integer
    title: Порядок в группе
    default: 0
  icon:
    type: awn.string
    title: Иконка
  status:
    type: awn.enum
    title: Статус
    enum: [active, draft, inactive]
    default: active
  render:
    type: awn.enum
    title: Рендер
    enum: [template, fence]
    default: template
  fenceTag:
    type: awn.string
    title: Fence-тег
  renderer:
    type: awn.string
    title: JS-рендер
  extends:
    type: awn.string
    title: Extends
    default: awn.block.base
