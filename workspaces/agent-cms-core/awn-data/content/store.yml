version: 1
kind: collection
id: content
name: Контент
description: Типы записей в слотах (awn.content.*)
extends: ../_base/store.yml

record:
  id-mode: slug
  file: "{id}.md"

fields:
  title:
    type: awn.string
    title: Название
    required: true
  typeId:
    type: awn.string
    title: ID типа
    required: true
  kind:
    type: awn.string
    title: Kind
  domain:
    type: awn.string
    title: Domain
  status:
    type: awn.enum
    title: Статус
    enum: [active, draft, deprecated, inactive]
    default: active
  extends:
    type: awn.string
    title: Extends
