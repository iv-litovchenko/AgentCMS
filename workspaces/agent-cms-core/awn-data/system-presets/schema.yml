version: 1
layer: awn-data-store

awn_schema:
  record:
    extends: awn.data.element.default
    fields:
      awn-title:
        type: awn.string
        title: Название
        required: true
        tab: main
      awn-preset-id:
        type: awn.string
        title: ID пресета
        required: true
        tab: main
      awn-target-file:
        type: awn.string
        title: Целевой файл
        required: true
        tab: main
      awn-hint-title:
        type: awn.string
        title: Подсказка — заголовок
        tab: main
      awn-hint-text:
        type: awn.string
        title: Подсказка — текст
        tab: main
      awn-status:
        type: awn.field.choice.one
        title: Статус
        enum:
          - active
          - draft
          - deprecated
          - inactive
        default: active
        tab: main
      awn-sort:
        type: awn.number
        title: Порядок
        default: 0
        tab: main
    tabs:
      main: Пресет
