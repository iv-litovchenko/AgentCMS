id: awn.base
name: База
kind: base
description: Базовые YAML-свойства для всех типов записей агента
mixins: [awn.mixin.preview]
fields:
  awn-preview:
    type: awn.url
    title: Превью
    description: Путь к файлу в Assets/Preview/ (заполняется при загрузке превью)
  awn-emoji:
    type: awn.string
    title: Эмодзи
    description: Показывается вместо иконки, если превью не задано
    hint: Один символ emoji
    format: "🎯"
  awn-name:
    type: awn.string
    name: Имя
    description: Отображаемое имя в меню; пустое — показывается slug (имя файла или папки на диске)
    locked: true
  awn-status:
    type: awn.enum
    name: Статус
    description: Состояние записи
    enum:
      - key: open
        name: 🟢 Открыта
      - key: draft
        name: 🟡 Черновик
      - key: closed
        name: 🔴 Закрыта
    default: draft
  awn-type:
    type: awn.string
    name: Тип
    description: Идентификатор типа записи (awn.workspace, awn.area, awn.topic, …)
    hint: awn.workspace, awn.area, awn.topic, awn.record.category…
    required: true
    locked: true
  awn-create:
    type: awn.datetime
    title: Создан
    description: Дата и время создания
    format: ISO-8601
    locked: true
  awn-update:
    type: awn.datetime
    title: Изменён
    description: Дата последнего изменения
    format: ISO-8601
    locked: true
  awn-description:
    type: awn.text
    title: Описание
    description: Краткое назначение для агента
  awn-main:
    type: awn.boolean
    title: На главной
    description: Показывать в блоке «Фокус» на главной странице
    default: false
  awn-category:
    type: awn.string
    title: Категория
    description: Категория или группа записи
  awn-owner:
    type: awn.string
    title: Владелец
    description: Автор или ответственный (из справочника users)
  awn-priority:
    type: awn.string
    title: Приоритет
    description: Уровень важности (из справочника priorities)
  awn-tags:
    type: awn.array
    name: Теги
    description: Метки для поиска и фильтрации
    items: awn.string
  awn-color:
    type: awn.color
    title: Цвет
    description: Цвет метки в-панели
  awn-version:
    type: awn.integer
    title: Версия
    description: Счётчик сохранений; увеличивается автоматически при каждом сохранении
    hint: "1"
    format: "1"
    default: 1
    locked: true
  awn-sort:
    type: awn.integer
    title: Сортировка
    description: Порядок в списках и дереве