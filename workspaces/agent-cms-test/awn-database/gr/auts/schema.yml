version: 1
layer: awn-database-store

awn_schema:
  record:
    extends: awn.infoblock.element.default
    fields:
      awn-name:
        type: awn.field.string
        title: Имя
        description: Отображаемое имя в меню; пустое → slug
        placement: title-bar
        group: content
        sort: 1
        tab: main
      awn-description:
        type: awn.field.text
        title: Описание
        placement: hidden
        group: content
        sort: 4
        tab: main
      awn-preview:
        type: awn.field.file.image.for-preview
        title: "{A2!} Превью"
        description: awn-storage/assets/preview/
        placement: aside-hero
        group: content
        sort: 1
        tab: main
      awn-web-url:
        type: awn.field.string.url
        title: "{A2!} Веб-источник"
        description: "URL оригинала в интернете (https://…)"
        placement: aside-hero
        widget: url
        group: content
        sort: 2
        tab: main
      awn-status:
        type: awn.field.string
        title: Статус
        placement: aside-body
        group: content
        sort: 2
        enum:
          -
            key: open
            name: 🟢 Открыта
          -
            key: draft
            name: 🟡 Черновик
          -
            key: closed
            name: 🔴 Закрыта
          -
            key: none
            name: ⚪ Без статуса
        default: open
        tab: main
      awn-quality:
        type: awn.field.number.stars
        title: "{A2!} Качество проверки"
        description: Насколько запись готова после совместной проверки с агентом. Ниже 4 — требует доработки; 4 — норма; 10 — отлично.
        hint: 0 — очень низко · 4 — норма · 10 — высоко · ниже 4 нужна обработка
        placement: aside-body
        group: content
        sort: 3
        default: 4
        tab: main
      awn-importance:
        type: awn.field.number.importance
        title: "{A2!} Важность для меня"
        description: "Насколько тема или запись важны лично для вас. Влияет на приоритет в поиске агента: важные темы поднимаются выше при абстрактных вопросах. Наследуется от темы к записям внутри."
        hint: 0 — не отмечено · 5 — заметно · 10 — критично важно
        placement: aside-body
        group: content
        sort: 3.5
        default: 0
        tab: main
      awn-note-todo-sticker:
        type: awn.field.text
        title: "{A2!} Заметка остановки"
        description: "Техническая заметка для вас и агента: на чём остановились, что сделать дальше, блокеры."
        hint: "Кратко: статус, следующий шаг, блокер"
        placement: aside-body
        group: work-note
        sort: 1
        tab: main
      awn-emoji:
        type: awn.field.string
        title: "{A2!} Эмодзи"
        description: "Показывается вместо иконки, если превью не задано"
        placement: aside-body
        group: content
        sort: 4
        tab: main
      awn-sort:
        type: awn.field.number.integer
        title: "{A2!} Сортировка"
        placement: aside-body
        group: content
        sort: 5
        tab: main
      awn-runtime-load-always:
        type: awn.field.boolean
        title: "{A2!} Всегда в контексте"
        description: Тема всегда в контексте агента; иначе — только по запросу (по умолчанию)
        default: false
        placement: aside-body
        group: runtime
        sort: 1
        tab: main
      awn-runtime-heartbeat:
        type: awn.field.boolean
        title: "{A2!} Heartbeat"
        placement: aside-body
        group: runtime
        sort: 2
        tab: main
      awn-runtime-cron:
        type: awn.field.boolean
        title: Тип расписания (выполнение по расписанию)
        placement: aside-body
        group: runtime
        sort: 3
        tab: main
      awn-runtime-cron-schedule:
        type: awn.field.string.cron-schedule
        title: "{A2!} Расписание"
        description: "День и время, шаблон или своё cron-выражение"
        placement: aside-body
        group: runtime
        sort: 4
        show-when:
          field: awn-runtime-cron
          equals: true
        tab: main
      awn-runtime-commands:
        type: awn.field.boolean
        title: "{A2!} Выполнение команд"
        description: В инструкции темы есть команды для выполнения (визуальный маркер)
        default: false
        placement: aside-body
        group: runtime
        sort: 5
        tab: main
      awn-index-exclude:
        type: awn.field.boolean
        title: "{A2!} Запретить индексирование"
        description: "Исключить эту сущность и вложенные файлы из semantic, fulltext, storage и link индексов. Наследуется от manifest родительских папок."
        default: false
        placement: aside-body
        group: indexing
        sort: 1
        tab: main
      awn-category:
        type: awn.field.lookup.one
        source: categories
        title: "{A2!} Категория"
        placement: aside-body
        group: taxonomy
        sort: 1
        tab: main
      awn-owner:
        type: awn.field.string
        source: users
        title: Владелец
        placement: aside-body
        group: taxonomy
        sort: 2
        tab: main
      awn-priority:
        type: awn.field.lookup.one
        source: priorities
        title: "{A2!} Приоритет"
        placement: aside-body
        group: taxonomy
        sort: 3
        tab: main
      awn-color:
        type: awn.field.lookup.one
        source: colors
        value-kind: color
        title: "{A2!} Цвет"
        placement: aside-body
        group: taxonomy
        sort: 4
        tab: main
      awn-tags:
        type: awn.field.lookup.many
        source: tags
        title: "{A2!} Теги"
        placement: aside-body
        group: taxonomy
        sort: 5
        tab: main
      awn-id:
        type: awn.field.number.integer
        title: "{A2!} ID"
        description: Глобальный номер workspace (счётчик в settings.yml → Автоинкремент). Дубликаты допустимы — можно изменить вручную.
        placement: aside-body
        group: system
        sort: 0
        tab: main
      awn-type:
        type: awn.field.string
        title: "{A2!} Тип"
        required: true
        locked: true
        placement: aside-body
        group: system
        sort: 1
        tab: main
      awn-create:
        type: awn.field.date.datetime
        title: "{A2!} Создан"
        locked: true
        placement: aside-body
        group: system
        sort: 2
        tab: main
      awn-update:
        type: awn.field.date.datetime
        title: "{A2!} Изменён"
        locked: true
        placement: aside-body
        group: system
        sort: 3
        tab: main
      awn-version:
        type: awn.field.number.integer
        title: Версия
        default: 1
        locked: true
        placement: aside-body
        group: system
        sort: 4
        tab: main
      awn-created:
        type: awn.field.date.datetime
        title: Создано
        tab: main
      awn-updated:
        type: awn.field.date.datetime
        title: Обновлено
        tab: main
    tabs:
      main: Основное
