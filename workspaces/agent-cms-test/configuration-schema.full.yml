    description: Базовые мета-свойства любого поля
    properties:
      type:
        title: Тип данных
        description: ID типа поля (awn.field.string, awn.field.enum…)
        required: true
      name:
        title: Название
        description: Подпись поля в форме (человекочитаемое)
        required: true
      description:
        title: Описание
        description: Развёрнутое пояснение для схемы и документации
