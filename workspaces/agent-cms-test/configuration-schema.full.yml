      required:
        type: awn.field.boolean
        title: Обязательное
        default: false
      locked:
        type: awn.field.boolean
        title: Заблокированное
        description: Только чтение в форме
        default: false
      format:
        title: Формат
        description: Пример или шаблон заполнения (YYYY-MM-DD, 0.0.1)
        type: awn.field.string
      default:
        title: По умолчанию
        description: Значение при создании
        type: awn.field.string
      widget:
        title: Виджет
        description: Переопределить виджет по умолчанию для этого типа
        type: awn.field.string
      enum:
        title: Варианты
        description: Список key/name для awn.field.enum и awn.field.array
      items:
        title: Тип элементов
        description: Тип элементов для awn.field.array (awn.field.string, awn.field.link…)
