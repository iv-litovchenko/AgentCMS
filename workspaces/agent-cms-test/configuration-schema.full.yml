# Единая схема CMS — собрано из awn-system/types/*.yml
# Preview для review. Runtime пока читает types/ по файлам.
version: 1
layer: "assembled-preview"

meta:
  agent: agent-cms-test
  description: "CMS-модель агента — типы, слоты, поля. Runtime читает awn-system/types/"
  assembled-at: "2026-07-23"
  source: awn-system/types/
  type-count: 89

registry:
  domains:
    - base
    - content
    - fields
    - md-blocks
    - pages
    - slots
    - taxonomies
    - views
    - mixins
    - id: settings
      label: Настройки
      kind: type
      icon: "⚙"

base:
  awn.base:
    _source: awn-system/types/base/base.yml
    id: awn.base
    name: База сущности
    kind: base
    domain: base
    status: active
    extends: awn.entity
    description:
      Общие поля любого контента и узла: отображение и системные. Узлы дерева
    mixins:
      - awn.mixin.preview
    field-groups:
      -
        id: content
        name: Основное
        description: Что заполняет человек или агент
        collapsed: false
      -
        id: system
        name: Системные
        description: Заполняется автоматически, только чтение
        collapsed: true
    fields:
      awn-name:
        type: awn.field.string
        title: Имя
        description: Отображаемое имя в меню
        group: content
        locked: true
      awn-emoji:
        type: awn.field.string
        title: Эмодзи
        description: Показывается вместо иконки, если превью не задано
        group: content
      awn-status:
        type: awn.field.enum
        title: Статус
        group: content
        enum:
          -
            key: open
            name: 🟢 Открыта
          -
            key: draft
            name: 🟡 Черновик
          -
            key: closed
            name: 🔴 Закрыта
        default: draft
      awn-description:
        type: awn.field.text
        title: Описание
        group: content
      awn-tags:
        type: awn.field.array
        title: Теги
        items: awn.field.string
        group: content
      awn-type:
        type: awn.field.string
        title: Тип
        required: true
        locked: true
        group: system
      awn-create:
        type: awn.field.datetime
        title: Создан
        locked: true
        group: system
      awn-update:
        type: awn.field.datetime
        title: Изменён
        locked: true
        group: system
      awn-version:
        type: awn.field.integer
        title: Версия
        default: 1
        locked: true
        group: system
  awn.entity:
    _source: awn-system/types/base/_base.yml
    id: awn.entity
    name: Сущность CMS
    kind: entity
    domain: base
    status: active
    description: Корневой тип platform — от него наследуют pages, content, fields, md-blocks
    properties:
      id:
        title: Идентификатор
        description: Стабильный id типа (awn.topic, awn.string, awn.block.h2…)
        required: true
      name:
        title: Название
        description: Человекочитаемое имя
      description:
        title: Описание
        description: Назначение типа
      extends:
        title: Родитель
        description: id типа-родителя в цепочке наследования
      status:
        title: Статус
        description: active — в runtime; draft/disabled — скрыт
      kind:
        title: Класс
        description: entity · type · field · block · slot

