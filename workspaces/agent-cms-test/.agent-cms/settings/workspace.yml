  response-style: agents-md
  notify-on-complete: false
  awn-id-next: 13
  awn-id-issued: 12
  awn-id-updated-at: "2026-09-23T11:01:32.264Z"
  awn-id-model: workspace-id-autoincrement-v1
  ws-static-example-1: значение 1
  ws-static-example-2: значение 2
  ws-static-example-3: значение 3
  default-slot: main
  awn-temp-ttl-days: 0
