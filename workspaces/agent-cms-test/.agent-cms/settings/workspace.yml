  voice-cms-channel: thread
  voice-route-claude-cli-path: claude
  voice-route-codex-cli-path: codex
  voice-route-qwenpaw-url: "http://127.0.0.1:8088"
  voice-route-qwenpaw-user-id: default
  voice-route-qwenpaw-agent-id: default
  voice-route-qwenpaw-approval-level: AUTO
  voice-route-runtime: codex
  voice-proactive-enabled: false
  voice-proactive-idle-seconds-min: 44
  voice-proactive-idle-seconds-max: 77
  voice-proactive-cooldown-seconds: 88
  voice-proactive-quiet-hours-enabled: false
  voice-proactive-quiet-hours-start: "22:00"
  voice-proactive-quiet-hours-end: "05:00"
  voice-input-enabled: true
  voice-input-mode: fn_button
  voice-input-capture: microphone
  voice-input-global-listen: false
  voice-input-to-compose: false
  voice-input-response-enabled: true
  voice-stt-engine: browser
  voice-stt-lang: ru-RU
  voice-stt-whisper-model: base
  voice-stt-elevenlabs-model: scribe_v2
  voice-tts-enabled: false
  voice-tts-engine: browser
  voice-tts-playback-mode: reading
  voice-tts-rate: 1
  voice-tts-pitch: 1
  voice-tts-include-captions: true
  voice-tts-browser-lang: ru-RU
  voice-tts-edge-voice: ru-RU-SvetlanaNeural
  voice-tts-edge-rate: 1
  voice-tts-piper-binary: piper
  voice-tts-elevenlabs-voice-id: EXAVITQu4vr4xnSDxMaL
  voice-tts-elevenlabs-model: eleven_multilingual_v2
  voice-tts-elevenlabs-rate: 1
  voice-compose-templates: []
  voice-media-camera-enabled: false
  voice-media-camera-on-speech: true
  voice-media-camera-facing: environment
  voice-media-screen-enabled: false
  voice-media-screen-on-speech: false
  voice-window-character-model: robot
  voice-window-compact-mode: false
  voice-window-topmost: true
  voice-window-pet-overlay: false
  voice-window-transparent: false
  voice-window-background: wallpaper
  voice-window-compact-dialog-qa: true
  voice-window-dialog-auto-scroll: true
  voice-window-keep-awake: false
  voice-window-processing-sound: off
  voice-route-codex-permission-mode: untrusted
  voice-stt-prompt: |
    В сообщении пользователя может быть смесь обычного текста и голосовых блоков:
    
    [stt]
    …сырая расшифровка речи…
    [/stt]
    
    Текст вне [stt]…[/stt] — набран вручную, трактуй буквально.
    Внутри [stt] — сказано голосом: возможны «э-э», «эээ», «мм», «ну», ошибки распознавания и пунктуации.
    
    Понимай смысл по всему сообщению целиком; восстанавливай формулировку мысленно, не выдумывая новых фактов.
    Если смысл голосового блока неясен — спроси уточнение.
    Не удаляй и не переписывай разметку [stt] в цитатах пользователя.
  voice-tts-prompt: |
    Каждый ответ пользователю используй в формате (строго, в таком порядке):
    
    1) Текст для озвучки — plain text, без emoji и markdown. Только то, что можно сказать вслух. Без секретов и ключей. Длина не ограничена — озвучь весь смысл ответа.
    
    2) Отдельной строкой маркер конца голосовой части:
    
    [tts-break]
    
    3) Подробный ответ для экрана (markdown, списки, код). Если главное уже сказано голосом — начни с короткой отсылки: «Подробнее ниже» или «Смотри детали ниже».
    
    Формат обязателен для любых ответов, включая уточняющие вопросы.
    Без HTML-комментариев <!-- -->.
  voice-proactive-prompt: 534
