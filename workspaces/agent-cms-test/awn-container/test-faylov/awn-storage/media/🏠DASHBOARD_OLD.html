<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>📚 Моя Библиотека</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 900px;
            margin: 0 auto;
        }

        h1 {
            color: white;
            text-align: center;
            margin-bottom: 30px;
            font-size: 2.5rem;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.2);
        }

        .add-book-form {
            background: white;
            padding: 25px;
            border-radius: 15px;
            box-shadow: 0 10px 40px rgba(0,0,0,0.2);
            margin-bottom: 30px;
        }

        .form-row {
            display: flex;
            gap: 15px;
            margin-bottom: 15px;
        }

        .form-row:last-child {
            margin-bottom: 0;
        }

        input, select, button {
            padding: 12px 18px;
            border: 2px solid #e0e0e0;
            border-radius: 8px;
            font-size: 16px;
            transition: all 0.3s;
        }

        input:focus, select:focus {
            outline: none;
            border-color: #667eea;
            box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.1);
        }

        input {
            flex: 1;
        }

        button {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            cursor: pointer;
            font-weight: 600;
            padding: 12px 30px;
        }

        button:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 20px rgba(102, 126, 234, 0.4);
        }

        .stats {
            display: flex;
            gap: 20px;
            margin-bottom: 20px;
            flex-wrap: wrap;
        }

        .stat-card {
            background: white;
            padding: 20px 30px;
            border-radius: 12px;
            text-align: center;
            flex: 1;
            min-width: 150px;
            box-shadow: 0 5px 20px rgba(0,0,0,0.1);
        }

        .stat-number {
            font-size: 2.5rem;
            font-weight: bold;
            color: #667eea;
        }

        .stat-label {
            color: #666;
            margin-top: 5px;
        }

        .filters {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
            flex-wrap: wrap;
        }

        .filter-btn {
            background: white;
            color: #667eea;
            border: 2px solid #667eea;
            padding: 10px 20px;
            cursor: pointer;
        }

        .filter-btn.active {
            background: #667eea;
            color: white;
        }

        .book-list {
            display: grid;
            gap: 15px;
        }

        .book-card {
            background: white;
            padding: 20px;
            border-radius: 12px;
            box-shadow: 0 5px 20px rgba(0,0,0,0.1);
            display: flex;
            justify-content: space-between;
            align-items: center;
            transition: all 0.3s;
        }

        .book-card:hover {
            transform: translateX(5px);
        }

        .book-card.read {
            border-left: 5px solid #4ade80;
        }

        .book-card.unread {
            border-left: 5px solid #f59e0b;
        }

        .book-info {
            flex: 1;
        }

        .book-title {
            font-size: 1.2rem;
            font-weight: 600;
            color: #333;
            margin-bottom: 5px;
        }

        .book-author {
            color: #666;
            font-size: 0.95rem;
        }

        .book-meta {
            display: flex;
            gap: 15px;
            margin-top: 8px;
            font-size: 0.85rem;
            color: #888;
        }

        .book-actions {
            display: flex;
            gap: 10px;
        }

        .action-btn {
            padding: 8px 16px;
            font-size: 14px;
        }

        .btn-read {
            background: #4ade80;
        }

        .btn-unread {
            background: #f59e0b;
        }

        .btn-delete {
            background: #ef4444;
        }

        .empty-state {
            text-align: center;
            padding: 60px 20px;
            background: white;
            border-radius: 15px;
            color: #666;
        }

        .empty-state h3 {
            font-size: 1.5rem;
            margin-bottom: 10px;
            color: #333;
        }

        @media (max-width: 600px) {
            .form-row {
                flex-direction: column;
            }
            
            .book-card {
                flex-direction: column;
                gap: 15px;
                text-align: center;
            }
            
            .book-meta {
                justify-content: center;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>📚 Моя Библиотека</h1>

        <!-- Форма добавления книги -->
        <div class="add-book-form">
            <div class="form-row">
                <input type="text" id="title" placeholder="Название книги" required>
                <input type="text" id="author" placeholder="Автор" required>
            </div>
            <div class="form-row">
                <input type="text" id="genre" placeholder="Жанр">
                <input type="number" id="pages" placeholder="Страниц" min="1">
                <button onclick="addBook()">➕ Добавить</button>
            </div>
        </div>

        <!-- Статистика -->
        <div class="stats">
            <div class="stat-card">
                <div class="stat-number" id="totalBooks">0</div>
                <div class="stat-label">Всего книг</div>
            </div>
            <div class="stat-card">
                <div class="stat-number" id="readBooks">0</div>
                <div class="stat-label">Прочитано</div>
            </div>
            <div class="stat-card">
                <div class="stat-number" id="unreadBooks">0</div>
                <div class="stat-label">В планах</div>
            </div>
        </div>

        <!-- Поиск и фильтры -->
        <div class="filters">
            <input type="text" id="searchInput" placeholder="🔍 Поиск по названию, автору, жанру..." 
                   oninput="searchBooks()" style="flex: 1; min-width: 200px;">
            <button class="filter-btn active" onclick="filterBooks('all')">Все</button>
            <button class="filter-btn" onclick="filterBooks('read')">✅ Прочитано</button>
            <button class="filter-btn" onclick="filterBooks('unread')">📖 В планах</button>
        </div>

        <!-- Список книг -->
        <div class="book-list" id="bookList"></div>
    </div>

    <script>
        // Загрузка книг из localStorage
        let books = JSON.parse(localStorage.getItem('myLibrary')) || [];
        let currentFilter = 'all';

        // Сохранение книг
        function saveBooks() {
            localStorage.setItem('myLibrary', JSON.stringify(books));
            renderBooks();
            updateStats();
        }

        // Добавление книги
        function addBook() {
            const title = document.getElementById('title').value.trim();
            const author = document.getElementById('author').value.trim();
            const genre = document.getElementById('genre').value.trim();
            const pages = document.getElementById('pages').value.trim();

            if (!title || !author) {
                alert('Введите название и автора!');
                return;
            }

            const book = {
                id: Date.now(),
                title,
                author,
                genre: genre || 'Не указан',
                pages: pages || '?',
                read: false,
                dateAdded: new Date().toLocaleDateString('ru-RU')
            };

            books.unshift(book);
            
            // Очистка формы
            document.getElementById('title').value = '';
            document.getElementById('author').value = '';
            document.getElementById('genre').value = '';
            document.getElementById('pages').value = '';

            saveBooks();
        }

        // Переключение статуса прочтения
        function toggleRead(id) {
            const book = books.find(b => b.id === id);
            if (book) {
                book.read = !book.read;
                book.dateRead = book.read ? new Date().toLocaleDateString('ru-RU') : null;
                saveBooks();
            }
        }

        // Удаление книги
        function deleteBook(id) {
            if (confirm('Удалить эту книгу?')) {
                books = books.filter(b => b.id !== id);
                saveBooks();
            }
        }

        // Фильтрация
        function filterBooks(filter) {
            currentFilter = filter;
            
            // Обновление активных кнопок
            document.querySelectorAll('.filter-btn').forEach(btn => {
                btn.classList.remove('active');
            });
            event.target.classList.add('active');

            renderBooks();
        }

        // Отрисовка книг
        function renderBooks() {
            const bookList = document.getElementById('bookList');
            
            let filtered = books;
            if (currentFilter === 'read') {
                filtered = books.filter(b => b.read);
            } else if (currentFilter === 'unread') {
                filtered = books.filter(b => !b.read);
            }

            if (filtered.length === 0) {
                bookList.innerHTML = `
                    <div class="empty-state">
                        <h3>📚 Пока пусто</h3>
                        <p>Добавьте первую книгу в свою библиотеку!</p>
                    </div>
                `;
                return;
            }

            bookList.innerHTML = filtered.map(book => `
                <div class="book-card ${book.read ? 'read' : 'unread'}">
                    <div class="book-info">
                        <div class="book-title">${escapeHtml(book.title)}</div>
                        <div class="book-author">${escapeHtml(book.author)}</div>
                        <div class="book-meta">
                            <span>📁 ${escapeHtml(book.genre)}</span>
                            <span>📄 ${book.pages} стр.</span>
                            <span>📅 Добавлено: ${book.dateAdded}</span>
                            ${book.read ? `<span>✅ Прочитано: ${book.dateRead}</span>` : ''}
                        </div>
                    </div>
                    <div class="book-actions">
                        <button class="action-btn ${book.read ? 'btn-unread' : 'btn-read'}" 
                                onclick="toggleRead(${book.id})">
                            ${book.read ? '↩️ Не прочитано' : '✅ Прочитано'}
                        </button>
                        <button class="action-btn btn-delete" onclick="deleteBook(${book.id})">
                            🗑️
                        </button>
                    </div>
                </div>
            `).join('');
        }

        // Обновление статистики
        function updateStats() {
            const total = books.length;
            const read = books.filter(b => b.read).length;
            const unread = total - read;

            document.getElementById('totalBooks').textContent = total;
            document.getElementById('readBooks').textContent = read;
            document.getElementById('unreadBooks').textContent = unread;
        }

        // Экранирование HTML
        function escapeHtml(text) {
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }

        // Инициализация
        renderBooks();
        updateStats();
    </script>
</body>
</html>
