links.markdown_compatible: true

awn_schema:
  topic:
    fields:
      demo_string:
        type: awn.string
        title: Строка
        hint: Короткая однострочная строка
      demo_text:
        type: awn.text
        title: Текст
        description: Многострочное описание
      demo_integer:
        type: awn.integer
        title: Целое
      demo_number:
        type: awn.number
        title: Дробное
      demo_boolean:
        type: awn.boolean
        title: Логическое
      demo_null:
        type: awn.null
        title: Пустое (null)
      demo_array:
        type: awn.array
        title: Массив
        items: awn.string
      demo_enum:
        type: awn.enum
        title: Перечисление
        enum: [Открыта, В работе, Готово]
      demo_link:
        type: awn.link
        title: Связь
        hint: Wikilink на другую запись
      demo_date:
        type: awn.date
        title: Дата
      demo_datetime:
        type: awn.datetime
        title: Дата и время
      demo_url:
        type: awn.url
        title: URL
      demo_color:
        type: awn.color
        title: Цвет
  record:
    fields:
      rec_string:
        type: awn.string
        title: Строка
      rec_text:
        type: awn.text
        title: Текст
      rec_integer:
        type: awn.integer
        title: Целое
      rec_number:
        type: awn.number
        title: Дробное
      rec_boolean:
        type: awn.boolean
        title: Логическое
      rec_null:
        type: awn.null
        title: Пустое (null)
      rec_array:
        type: awn.array
        title: Массив
        items: awn.string
      rec_enum:
        type: awn.enum
        title: Перечисление
        enum: [Черновик, Проверка, Опубликовано]
      rec_link:
        type: awn.link
        title: Связь
      rec_file:
        type: awn.file
        title: Файл
        hint: Content/… или Assets/…
        scope: all
      rec_date:
        type: awn.date
        title: Дата
      rec_datetime:
        type: awn.datetime
        title: Дата и время
      rec_url:
        type: awn.url
        title: URL
      rec_color:
        type: awn.color
        title: Цвет
  sidecar:
    fields:
      sidecar_caption:
        type: awn.string
        title: Подпись
      sidecar_source:
        type: awn.url
        title: Источник
      sidecar_tagged:
        type: awn.boolean
        title: Размечено
