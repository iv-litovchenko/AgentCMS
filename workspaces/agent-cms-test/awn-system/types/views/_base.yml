id: awn.view.base
name: База вида
kind: base
domain: views
status: active
extends: awn.entity
description: >
  Базовый тип представления. У вида ДВЕ независимые оси, каждая привязана к своей
  точке UI:
  1) contentMode — «на каком экране» показывать содержимое узла. Появляется в
     селекторе «Вид по умолчанию» на обзоре темы.
  2) render-mode — «какой раскладкой» рисовать внешнюю память. Появляется в
     тулбар-переключателе рядом с содержимым (Таблица/Список/Карточки…).
  Можно задать любую из осей или обе. Примитивы рендера реализованы в рантайме
  один раз; новый вид = новый YAML поверх существующего примитива.
properties:
  contentMode:
    title: Экран (content mode)
    description: >
      На каком экране открывать узел по умолчанию. Появляется в селекторе
      «Вид по умолчанию» на обзоре темы.
    enum: [external, tabular, media, thread, inbox]
  render-mode:
    title: Раскладка (тулбар)
    description: >
      Какой раскладкой рисовать внешнюю память. Появляется в тулбар-переключателе
      «Вид отображения». Одно из значений, которые умеет рантайм.
    enum: [table, list, cards, kanban, calendar, index, moc, mindmap, cheatsheet, graph]
  icon:
    title: Иконка
    description: Эмодзи для подписи вида в переключателях.
  applies-to-slots:
    title: К каким слотам
    type: list
    description: Список слотов, где вид доступен (main, inbox, media, thread…)
