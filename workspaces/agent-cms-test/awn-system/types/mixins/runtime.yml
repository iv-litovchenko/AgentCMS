id: awn.mixin.runtime
name: Runtime
kind: mixin
domain: mixins
status: active
description: Загрузка в контекст агента, cron, heartbeat
fields:
  awn-runtime-load:
    type: awn.enum
    name: Загрузка в runtime
    enum:
      - key: on-demand
        name: По запросу
      - key: session-start
        name: При старте сессии
  awn-runtime-cron:
    type: awn.boolean
    name: Cron
  awn-runtime-heartbeat:
    type: awn.boolean
    name: Heartbeat
