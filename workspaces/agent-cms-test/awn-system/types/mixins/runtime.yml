id: awn.mixin.runtime
name: Runtime
kind: mixin
domain: mixins
status: active
description: Загрузка в контекст агента, cron, heartbeat
fields:
  awn-runtime-load:
    type: awn.field.enum
    name: Загрузка в runtime
    group: runtime
    enum:
      - key: on-demand
        name: По запросу
      - key: session-start
        name: При старте сессии
  awn-runtime-cron:
    type: awn.field.boolean
    name: Cron
    group: runtime
  awn-runtime-cron-schedule:
    type: awn.field.string
    name: Расписание cron
    group: runtime
    description: Шаблон, быстрый выбор времени или своё cron-выражение (5 полей)
  awn-runtime-heartbeat:
    type: awn.field.boolean
    name: Heartbeat
    group: runtime
