id: awn.page.base
name: База страницы
kind: base
domain: pages
status: active
extends: awn.base
description: Узел дерева (ws/area/topic) — база awn.base плюс навигация и runtime
mixins: [awn.mixin.preview, awn.mixin.runtime]

# Полный список групп для узлов дерева. Наследники awn.base (записи) видят
# только content+system; узлы дерева — все четыре.
field-groups:
  - id: content
    name: Основное
    description: Что заполняет человек или агент
    collapsed: false
  - id: nav
    name: Дерево и вид
    description: Поведение в меню и на главной (для узлов дерева)
    collapsed: true
  - id: runtime
    name: Runtime агента
    description: Загрузка в контекст, cron, heartbeat
    collapsed: true
  - id: system
    name: Системные
    description: Заполняется автоматически, только чтение
    collapsed: true

fields:
  # --- Дерево и вид (nav) — только у узлов дерева ---
  awn-main:
    type: awn.field.boolean
    title: На главной
    default: false
    group: nav
  awn-category:
    type: awn.field.string
    title: Категория
    group: nav
  awn-owner:
    type: awn.field.string
    title: Владелец
    group: nav
  awn-priority:
    type: awn.field.string
    title: Приоритет
    group: nav
  awn-color:
    type: awn.field.color
    title: Цвет
    group: nav
  awn-sort:
    type: awn.field.integer
    title: Сортировка
    group: nav
