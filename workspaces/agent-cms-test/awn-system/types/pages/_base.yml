id: awn.page.base
name: База страницы
kind: base
domain: pages
status: active
extends: awn.entity
description: Базовые YAML-свойства для узлов дерева и контентных записей
mixins: [awn.mixin.preview, awn.mixin.runtime]
fields:
  awn-preview:
    type: awn.field.url
    title: Превью
    description: Путь к файлу в Assets/Preview/
  awn-emoji:
    type: awn.field.string
    title: Эмодзи
    description: Показывается вместо иконки, если превью не задано
  awn-name:
    type: awn.field.string
    name: Имя
    description: Отображаемое имя в меню
    locked: true
  awn-status:
    type: awn.field.enum
    name: Статус
    enum:
      - key: open
        name: 🟢 Открыта
      - key: draft
        name: 🟡 Черновик
      - key: closed
        name: 🔴 Закрыта
    default: draft
  awn-type:
    type: awn.field.string
    name: Tип
    required: true
    locked: true
  awn-create:
    type: awn.field.datetime
    title: Создан
    locked: true
  awn-update:
    type: awn.field.datetime
    title: Изменён
    locked: true
  awn-description:
    type: awn.field.text
    title: Описание
  awn-main:
    type: awn.field.boolean
    title: На главной
    default: false
  awn-category:
    type: awn.field.string
    title: Категория
  awn-owner:
    type: awn.field.string
    title: Владелец
  awn-priority:
    type: awn.field.string
    title: Приоритет
  awn-tags:
    type: awn.field.array
    name: Теги
    items: awn.field.string
  awn-color:
    type: awn.field.color
    title: Цвет
  awn-version:
    type: awn.field.integer
    title: Версия
    default: 1
    locked: true
  awn-sort:
    type: awn.field.integer
    title: Сортировка
  my-field2:
    type: awn.field.string
    title: Моё поле22
