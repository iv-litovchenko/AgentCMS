<svg width="300" height="200" viewBox="0 0 300 200" xmlns="http://www.w3.org/2000/svg">
  <!-- Небо -->
  <rect width="300" height="200" fill="#87CEEB"/>
  <!-- Солнце -->
  <circle cx="250" cy="40" r="25" fill="#FFD700"/>
  <!-- Земля -->
  <rect y="150" width="300" height="50" fill="#7CFC00"/>
  <!-- Дом -->
  <rect x="100" y="100" width="100" height="70" fill="#D2691E"/>
  <!-- Крыша -->
  <polygon points="90,100 150,50 210,100" fill="#8B0000"/>
  <!-- Дверь -->
  <rect x="135" y="130" width="30" height="40" fill="#4B2E1E"/>
  <!-- Окно -->
  <rect x="105" y="115" width="20" height="20" fill="#ADD8E6" stroke="#000" stroke-width="1"/>
  <!-- Дерево -->
  <rect x="30" y="130" width="10" height="30" fill="#8B4513"/>
  <circle cx="35" cy="115" r="20" fill="#228B22"/>
</svg>
