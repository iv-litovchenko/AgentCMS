<!DOCTYPE html>
<html lang="ru">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Agent CMS Commander</title>
    <style>
      :root {
        color-scheme: dark;
        --bg: #0f1117;
        --panel: #171b26;
        --text: #e8ecf4;
        --muted: #94a3b8;
        --accent: #f43f5e;
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        min-height: 100vh;
        font-family: system-ui, -apple-system, Segoe UI, sans-serif;
        background: radial-gradient(circle at 20% 0%, #1f2937 0%, var(--bg) 55%);
        color: var(--text);
        display: grid;
        place-items: center;
        padding: 24px;
      }
      main {
        width: min(520px, 100%);
        background: var(--panel);
        border: 1px solid rgba(244, 63, 94, 0.35);
        border-radius: 16px;
        padding: 28px 24px;
        box-shadow: 0 24px 60px rgba(0, 0, 0, 0.35);
      }
      h1 {
        margin: 0 0 8px;
        font-size: 1.5rem;
      }
      p {
        margin: 0 0 12px;
        color: var(--muted);
        line-height: 1.5;
      }
      code {
        color: var(--accent);
        font-size: 0.95em;
      }
      .badge {
        display: inline-block;
        margin-bottom: 14px;
        padding: 4px 10px;
        border-radius: 999px;
        background: rgba(244, 63, 94, 0.15);
        color: var(--accent);
        font-size: 0.75rem;
        letter-spacing: 0.04em;
        text-transform: uppercase;
      }
    </style>
  </head>
  <body>
    <main>
      <div class="badge">Commander</div>
      <h1>Agent CMS Commander</h1>
      <p>
        Локальный HTTP-сервер Commander. Порт задаётся через
        <code>AGENT_CMS_COMMANDER_HTTP_PORT</code> (по умолчанию <code>3188</code>) в
        <code>.env</code> в корне репозитория.
      </p>
      <p>Дальше здесь появится управление компьютером (раскладка, мышь, горячие клавиши).</p>
    </main>
  </body>
</html>
