<!doctype html>
<html lang="ru">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Agent Shell — ожидание сервера</title>
    <style>
      :root {
        color-scheme: dark;
      }
      html,
      body {
        margin: 0;
        min-height: 100%;
        background: radial-gradient(ellipse 120% 80% at 50% 0%, #1e1145 0%, #0f0a1e 55%, #080512 100%);
        color: #e9e4ff;
        font: 14px/1.5 system-ui, -apple-system, "Segoe UI", sans-serif;
      }
      .stub {
        box-sizing: border-box;
        min-height: 100vh;
        padding: 28px 20px 36px;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        text-align: center;
        gap: 18px;
      }
      .scene {
        position: relative;
        width: min(220px, 72vw);
        height: 180px;
        margin-bottom: 4px;
      }
      .stars {
        position: absolute;
        inset: 0;
        opacity: 0.85;
      }
      .star {
        position: absolute;
        width: 2px;
        height: 2px;
        border-radius: 50%;
        background: #fff;
        animation: twinkle 2.4s ease-in-out infinite;
      }
      .star:nth-child(1) {
        top: 12%;
        left: 18%;
        animation-delay: 0s;
      }
      .star:nth-child(2) {
        top: 28%;
        left: 72%;
        animation-delay: 0.6s;
        width: 3px;
        height: 3px;
      }
      .star:nth-child(3) {
        top: 8%;
        left: 55%;
        animation-delay: 1.1s;
      }
      .star:nth-child(4) {
        top: 42%;
        left: 8%;
        animation-delay: 0.3s;
      }
      .star:nth-child(5) {
        top: 52%;
        left: 88%;
        animation-delay: 1.4s;
      }
      @keyframes twinkle {
        0%,
        100% {
          opacity: 0.35;
          transform: scale(1);
        }
        50% {
          opacity: 1;
          transform: scale(1.15);
        }
      }
      .rocket-wrap {
        position: absolute;
        left: 50%;
        bottom: 18%;
        transform: translateX(-50%);
        animation: hover 3.2s ease-in-out infinite;
      }
      @keyframes hover {
        0%,
        100% {
          transform: translateX(-50%) translateY(0);
        }
        50% {
          transform: translateX(-50%) translateY(-10px);
        }
      }
      .rocket svg {
        display: block;
        width: 72px;
        height: auto;
        filter: drop-shadow(0 8px 24px rgba(124, 58, 237, 0.45));
      }
      .flame {
        transform-origin: 50% 0%;
        animation: flicker 0.35s ease-in-out infinite alternate;
      }
      @keyframes flicker {
        from {
          opacity: 0.75;
          transform: scaleY(0.92);
        }
        to {
          opacity: 1;
          transform: scaleY(1.08);
        }
      }
      h1 {
        margin: 0;
        font-size: 17px;
        font-weight: 600;
        letter-spacing: -0.02em;
        color: #f5f3ff;
      }
      p {
        margin: 0;
        max-width: 280px;
        color: #c4b5fd;
        font-size: 13px;
      }
      .hint {
        margin-top: 6px;
        font-size: 12px;
        color: #8b7cb8;
      }
      kbd {
        display: inline-block;
        padding: 2px 7px;
        border-radius: 6px;
        border: 1px solid rgba(167, 139, 250, 0.35);
        background: rgba(124, 58, 237, 0.15);
        font: 11px/1.4 ui-monospace, monospace;
        color: #ddd6fe;
      }
    </style>
  </head>
  <body>
    <div class="stub" role="status" aria-live="polite">
      <div class="scene" aria-hidden="true">
        <div class="stars">
          <span class="star"></span>
          <span class="star"></span>
          <span class="star"></span>
          <span class="star"></span>
          <span class="star"></span>
        </div>
        <div class="rocket-wrap">
          <div class="rocket">
            <svg viewBox="0 0 64 96" fill="none" xmlns="http://www.w3.org/2000/svg">
              <path
                d="M32 4c-8 14-12 28-12 42v18c0 4 2 8 6 10l6 3 6-3c4-2 6-6 6-10V46C44 32 40 18 32 4Z"
                fill="url(#body)"
              />
              <path d="M20 52l-10 8 6 2 8-6-4-4Z" fill="#a78bfa" />
              <path d="M44 52l10 8-6 2-8-6 4-4Z" fill="#a78bfa" />
              <circle cx="32" cy="38" r="7" fill="#1e1b4b" stroke="#c4b5fd" stroke-width="2" />
              <ellipse cx="32" cy="38" rx="3" ry="4" fill="#67e8f9" opacity="0.85" />
              <g class="flame">
                <path d="M26 72c2 10 4 16 6 20 2-4 4-10 6-20H26Z" fill="url(#flame)" />
              </g>
              <defs>
                <linearGradient id="body" x1="32" y1="4" x2="32" y2="72" gradientUnits="userSpaceOnUse">
                  <stop stop-color="#f5f3ff" />
                  <stop offset="0.45" stop-color="#c4b5fd" />
                  <stop offset="1" stop-color="#7c3aed" />
                </linearGradient>
                <linearGradient id="flame" x1="32" y1="72" x2="32" y2="92" gradientUnits="userSpaceOnUse">
                  <stop stop-color="#fbbf24" />
                  <stop offset="0.5" stop-color="#f97316" />
                  <stop offset="1" stop-color="#ef4444" stop-opacity="0" />
                </linearGradient>
              </defs>
            </svg>
          </div>
        </div>
      </div>
      <h1>Сервер ещё не запущен</h1>
      <p>Локальный Agent Shell (лаунчер) пока не отвечает. Запустите проект — и нажмите «Обновить» в панели внизу.</p>
      <p class="hint">Кнопка с круговыми стрелками <kbd>↻</kbd> в нижней панели Companion</p>
    </div>
  </body>
</html>
