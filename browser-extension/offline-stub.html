<!doctype html>
<html lang="ru">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Agent Shell — ожидание сервера</title>
    <style>
      :root {
        color-scheme: light;
      }
      html,
      body {
        margin: 0;
        min-height: 100%;
        background: #7ec8e3;
        color: #1e3a5f;
        font: 14px/1.5 system-ui, -apple-system, "Segoe UI", sans-serif;
      }
      .stub {
        box-sizing: border-box;
        position: relative;
        min-height: 100vh;
        display: flex;
        flex-direction: column;
        overflow: hidden;
      }
      .sky-bg {
        position: absolute;
        inset: 0;
        background: linear-gradient(
          180deg,
          #3b9fd9 0%,
          #6ec5ea 28%,
          #9fdcf3 55%,
          #c8ebfa 78%,
          #e8f6fc 100%
        );
        pointer-events: none;
      }
      .clouds {
        position: absolute;
        top: 0;
        left: 0;
        right: 0;
        height: min(42vh, 200px);
        pointer-events: none;
        z-index: 1;
      }
      .clouds svg {
        display: block;
        width: 100%;
        height: 100%;
      }
      .cloud-drift-a {
        animation: cloud-drift 32s ease-in-out infinite;
      }
      .cloud-drift-b {
        animation: cloud-drift 40s ease-in-out infinite reverse;
      }
      .cloud-drift-c {
        animation: cloud-drift 26s ease-in-out infinite;
        animation-delay: -10s;
      }
      @keyframes cloud-drift {
        0%,
        100% {
          transform: translateX(0);
        }
        50% {
          transform: translateX(14px);
        }
      }
      .launch-zone {
        position: relative;
        flex: 1;
        min-height: 200px;
        z-index: 2;
      }
      .scene {
        position: absolute;
        inset: 0;
        overflow: hidden;
      }
      .rocket-wrap {
        position: absolute;
        left: 50%;
        bottom: 8%;
        transform: translateX(-50%);
        animation: fly-up 5.5s ease-in infinite;
      }
      @keyframes fly-up {
        0% {
          transform: translateX(-50%) translateY(0) scale(1);
          opacity: 1;
        }
        75% {
          transform: translateX(-50%) translateY(-210px) scale(0.92);
          opacity: 0.95;
        }
        100% {
          transform: translateX(-50%) translateY(-250px) scale(0.88);
          opacity: 0;
        }
      }
      .rocket svg {
        display: block;
        width: 64px;
        height: auto;
        filter: drop-shadow(0 4px 12px rgba(30, 58, 95, 0.25));
      }
      .flame {
        transform-origin: 50% 0%;
        animation: flicker 0.28s ease-in-out infinite alternate;
      }
      @keyframes flicker {
        from {
          opacity: 0.8;
          transform: scaleY(0.9);
        }
        to {
          opacity: 1;
          transform: scaleY(1.12);
        }
      }
      .copy {
        position: relative;
        z-index: 3;
        padding: 20px 20px 28px;
        text-align: center;
        background: linear-gradient(180deg, transparent 0%, rgba(232, 246, 252, 0.85) 24%, #e8f6fc 100%);
      }
      h1 {
        margin: 0 0 10px;
        font-size: 17px;
        font-weight: 600;
        letter-spacing: -0.02em;
        color: #0f2744;
      }
      p {
        margin: 0 auto;
        max-width: 280px;
        color: #334155;
        font-size: 13px;
      }
      .hint {
        margin-top: 10px;
        font-size: 12px;
        color: #64748b;
      }
      kbd {
        display: inline-block;
        padding: 2px 7px;
        border-radius: 6px;
        border: 1px solid #cbd5e1;
        background: #fff;
        font: 11px/1.4 ui-monospace, monospace;
        color: #334155;
      }
    </style>
  </head>
  <body>
    <div class="stub" role="status" aria-live="polite">
      <div class="sky-bg" aria-hidden="true"></div>
      <div class="clouds" aria-hidden="true">
        <svg viewBox="0 0 400 160" preserveAspectRatio="xMidYMin slice" xmlns="http://www.w3.org/2000/svg">
          <g class="cloud-drift-a">
            <ellipse cx="55" cy="72" rx="42" ry="24" fill="#fff" opacity="0.92" />
            <ellipse cx="88" cy="62" rx="34" ry="20" fill="#f8fcff" />
            <ellipse cx="28" cy="68" rx="28" ry="17" fill="#eef7fc" />
          </g>
          <g class="cloud-drift-b">
            <ellipse cx="195" cy="55" rx="48" ry="26" fill="#fff" opacity="0.95" />
            <ellipse cx="238" cy="48" rx="38" ry="22" fill="#f8fcff" />
            <ellipse cx="162" cy="52" rx="32" ry="19" fill="#fff" opacity="0.88" />
          </g>
          <g class="cloud-drift-c">
            <ellipse cx="340" cy="78" rx="44" ry="24" fill="#fff" opacity="0.9" />
            <ellipse cx="372" cy="68" rx="32" ry="18" fill="#f8fcff" />
            <ellipse cx="310" cy="74" rx="28" ry="16" fill="#eef7fc" />
          </g>
          <g opacity="0.7">
            <ellipse cx="130" cy="38" rx="20" ry="11" fill="#fff" />
            <ellipse cx="290" cy="28" rx="16" ry="9" fill="#f8fcff" />
          </g>
        </svg>
      </div>
      <div class="launch-zone">
        <div class="scene" aria-hidden="true">
          <div class="rocket-wrap">
            <div class="rocket">
              <svg viewBox="0 0 64 96" fill="none" xmlns="http://www.w3.org/2000/svg">
                <path
                  d="M32 4c-8 14-12 28-12 42v18c0 4 2 8 6 10l6 3 6-3c4-2 6-6 6-10V46C44 32 40 18 32 4Z"
                  fill="url(#body)"
                />
                <path d="M20 52l-10 8 6 2 8-6-4-4Z" fill="#a78bfa" />
                <path d="M44 52l10 8-6 2-8-6 4-4Z" fill="#a78bfa" />
                <circle cx="32" cy="38" r="7" fill="#ede9fe" stroke="#7c3aed" stroke-width="2" />
                <ellipse cx="32" cy="38" rx="3" ry="4" fill="#67e8f9" opacity="0.85" />
                <g class="flame">
                  <path d="M26 72c2 10 4 16 6 20 2-4 4-10 6-20H26Z" fill="url(#flame)" />
                </g>
                <defs>
                  <linearGradient id="body" x1="32" y1="4" x2="32" y2="72" gradientUnits="userSpaceOnUse">
                    <stop stop-color="#f5f3ff" />
                    <stop offset="0.45" stop-color="#c4b5fd" />
                    <stop offset="1" stop-color="#7c3aed" />
                  </linearGradient>
                  <linearGradient id="flame" x1="32" y1="72" x2="32" y2="92" gradientUnits="userSpaceOnUse">
                    <stop stop-color="#fbbf24" />
                    <stop offset="0.5" stop-color="#f97316" />
                    <stop offset="1" stop-color="#ef4444" stop-opacity="0" />
                  </linearGradient>
                </defs>
              </svg>
            </div>
          </div>
        </div>
      </div>
      <div class="copy">
        <h1>Сервер ещё не запущен</h1>
        <p>Локальный Agent Shell (лаунчер) пока не отвечает. Запустите проект — и нажмите «Обновить» в панели внизу.</p>
        <p class="hint">Кнопка с круговыми стрелками <kbd>↻</kbd> в нижней панели Companion</p>
      </div>
    </div>
  </body>
</html>
