<!DOCTYPE html>
<html lang="ru">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Agent Shell Companion — настройки</title>
    <style>
      body {
        margin: 0;
        padding: 20px;
        font: 14px/1.5 system-ui, sans-serif;
        color: #1e1b4b;
        background: #faf5ff;
      }
      h1 {
        font-size: 18px;
        margin: 0 0 8px;
      }
      p {
        margin: 0 0 16px;
        color: #4c1d95;
      }
      label {
        display: block;
        font-weight: 600;
        margin-bottom: 6px;
      }
      input {
        width: 100%;
        max-width: 420px;
        box-sizing: border-box;
        padding: 8px 10px;
        border-radius: 8px;
        border: 1px solid #c4b5fd;
      }
      .field {
        margin-bottom: 16px;
      }
      button {
        margin-top: 8px;
        margin-right: 8px;
        padding: 8px 14px;
        border: 0;
        border-radius: 8px;
        background: linear-gradient(135deg, #7c3aed, #c026d3);
        color: #fff;
        cursor: pointer;
        font-weight: 600;
      }
      #reset-btn {
        background: #64748b;
      }
      #shell-url-preview {
        display: block;
        margin-top: 6px;
        padding: 8px 10px;
        border-radius: 8px;
        background: #ede9fe;
        color: #4c1d95;
        font-family: ui-monospace, monospace;
        font-size: 12px;
        word-break: break-all;
      }
      #status {
        margin-top: 12px;
        min-height: 1.2em;
        color: #166534;
      }
      .checkbox-field label {
        display: flex;
        align-items: flex-start;
        gap: 10px;
        font-weight: 500;
        cursor: pointer;
      }
      .checkbox-field input[type="checkbox"] {
        width: auto;
        max-width: none;
        margin-top: 3px;
        flex: 0 0 auto;
      }
      .checkbox-field .hint {
        display: block;
        margin-top: 4px;
        font-weight: 400;
        color: #6b21a8;
        font-size: 13px;
      }
      h2 {
        font-size: 15px;
        margin: 24px 0 12px;
      }
    </style>
  </head>
  <body>
    <h1>Agent Shell Companion</h1>
    <p>
      Укажите <strong>базовый URL CMS</strong> (без <code>/shell</code>). Side Panel откроет Shell автоматически.
    </p>

    <div class="field">
      <label for="cmsBaseUrl">Базовый URL Agent CMS</label>
      <input id="cmsBaseUrl" type="url" placeholder="https://localhost:3443" />
      <code id="shell-url-preview"></code>
    </div>

    <div class="field">
      <label for="agentId">ID агента (необязательно)</label>
      <input id="agentId" type="text" placeholder="пусто = выбор хранилища при запуске" />
    </div>

    <h2>URL и копирование</h2>

    <div class="field checkbox-field">
      <label for="decodeUrlsInCompanion">
        <input id="decodeUrlsInCompanion" type="checkbox" checked />
        <span>
          Читаемые URL в Agent Shell
          <span class="hint">
            Декодировать %D0%… в кириллицу, когда панель отправляет страницу, ссылки и markdown в чат.
          </span>
        </span>
      </label>
    </div>

    <div class="field checkbox-field">
      <label for="decodeUrlsOnCopy">
        <input id="decodeUrlsOnCopy" type="checkbox" />
        <span>
          Читаемые URL при копировании на сайте
          <span class="hint">
            Как «Copy URL Simply»: при Ctrl+C / Copy заменять percent-encoding на нормальный текст в буфере.
          </span>
        </span>
      </label>
    </div>

    <button id="save-btn" type="button">Сохранить</button>
    <button id="reset-btn" type="button">Сброс: localhost:3443</button>
    <div id="status" aria-live="polite"></div>

    <script src="companion-urls-global.js"></script>
    <script src="companion-storage.js"></script>
    <script src="options.js"></script>
  </body>
</html>
