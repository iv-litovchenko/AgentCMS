<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" role="img" aria-label="ACMS Browser Extension">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e3a8a"/>
    </linearGradient>
    <linearGradient id="panel" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#8b5cf6"/>
      <stop offset="100%" stop-color="#db2777"/>
    </linearGradient>
    <linearGradient id="shine" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.22"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
  </defs>
  <rect width="128" height="128" rx="28" fill="url(#bg)"/>
  <rect width="128" height="128" rx="28" fill="url(#shine)"/>
  <!-- Browser window -->
  <rect x="18" y="26" width="92" height="76" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="2"/>
  <path fill="#e2e8f0" d="M18 26h92a10 10 0 0 1 10 10v8H18v-8a10 10 0 0 1 10-10z"/>
  <circle cx="32" cy="36" r="3.2" fill="#f87171"/>
  <circle cx="44" cy="36" r="3.2" fill="#fbbf24"/>
  <circle cx="56" cy="36" r="3.2" fill="#4ade80"/>
  <!-- Page (left) -->
  <rect x="26" y="50" width="44" height="4" rx="2" fill="#cbd5e1"/>
  <rect x="26" y="58" width="36" height="3" rx="1.5" fill="#e2e8f0"/>
  <rect x="26" y="65" width="40" height="3" rx="1.5" fill="#e2e8f0"/>
  <rect x="26" y="78" width="38" height="16" rx="4" fill="#e2e8f0"/>
  <!-- Side panel (Companion) -->
  <rect x="76" y="44" width="26" height="50" rx="6" fill="url(#panel)"/>
  <rect x="80" y="50" width="18" height="3" rx="1.5" fill="rgba(255,255,255,0.85)"/>
  <rect x="80" y="57" width="14" height="2.5" rx="1.25" fill="rgba(255,255,255,0.45)"/>
  <rect x="80" y="63" width="16" height="2.5" rx="1.25" fill="rgba(255,255,255,0.45)"/>
  <path
    d="M82 78 L88 84 L94 76"
    fill="none"
    stroke="#fff"
    stroke-width="2.5"
    stroke-linecap="round"
    stroke-linejoin="round"
  />
  <!-- Extension badge (orange puzzle — not purple pulse toolbar icon) -->
  <circle cx="34" cy="96" r="22" fill="#ea580c" stroke="#fff" stroke-width="3"/>
  <path
    fill="#fff"
    d="M34 82 h10 v4 c0 2.2 1.8 4 4 4 h4 v10 h-4 c-2.2 0-4 1.8-4 4 v4 H34 v-4 c0-2.2-1.8-4-4-4 h-4 V90 h4 c2.2 0 4-1.8 4-4 v-4z"
  />
</svg>
