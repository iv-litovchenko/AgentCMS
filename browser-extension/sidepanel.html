<!DOCTYPE html>
<html lang="ru">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Agent Shell</title>
    <style>
      html,
      body {
        margin: 0;
        height: 100%;
        background: #0f0a1e;
      }
      iframe {
        border: 0;
        width: 100%;
        height: 100%;
        display: block;
        background: #0f0a1e;
      }
      .sidepanel-bar {
        position: fixed;
        left: 0;
        right: 0;
        bottom: 0;
        z-index: 2;
        display: flex;
        align-items: center;
        gap: 6px;
        padding: 6px 8px;
        background: rgba(15, 10, 30, 0.92);
        border-top: 1px solid rgba(124, 58, 237, 0.35);
        font: 12px/1.4 system-ui, sans-serif;
        color: #ddd6fe;
      }
      .sidepanel-bar button {
        appearance: none;
        display: inline-flex;
        align-items: center;
        gap: 5px;
        border: 1px solid rgba(167, 139, 250, 0.45);
        background: rgba(124, 58, 237, 0.22);
        color: #f5f3ff;
        border-radius: 8px;
        padding: 6px 10px;
        cursor: pointer;
        white-space: nowrap;
        font: inherit;
      }
      .sidepanel-bar button:hover:not(:disabled) {
        background: rgba(124, 58, 237, 0.38);
      }
      .sidepanel-bar button:focus-visible {
        outline: 2px solid rgba(167, 139, 250, 0.65);
        outline-offset: 1px;
      }
      .sidepanel-bar button:disabled {
        opacity: 0.62;
        cursor: wait;
      }
      .sidepanel-action-icon {
        display: block;
        flex: 0 0 auto;
        width: 14px;
        height: 14px;
      }
      .sidepanel-bar button.is-busy .sidepanel-action-icon {
        animation: sidepanel-spin 0.85s linear infinite;
      }
      @keyframes sidepanel-spin {
        to {
          transform: rotate(360deg);
        }
      }
      #shell-url-label {
        flex: 1;
        min-width: 0;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
        opacity: 0.85;
        font-size: 11px;
      }
      #shell-frame {
        height: calc(100% - 40px);
      }
      .sidepanel-bar button.sidepanel-file-hub-btn {
        border-color: rgba(74, 222, 128, 0.55);
        background: linear-gradient(135deg, rgba(22, 163, 74, 0.45), rgba(34, 197, 94, 0.28));
        color: #ecfdf5;
      }
      .sidepanel-bar button.sidepanel-file-hub-btn:hover:not(:disabled) {
        background: linear-gradient(135deg, rgba(22, 163, 74, 0.62), rgba(34, 197, 94, 0.4));
      }
      .sidepanel-bar button.sidepanel-file-hub-btn.is-active {
        box-shadow: 0 0 0 2px rgba(74, 222, 128, 0.45);
      }
      .sidepanel-bar button.sidepanel-icon-btn {
        justify-content: center;
        gap: 0;
        padding: 6px;
        min-width: 28px;
      }
    </style>
  </head>
  <body>
    <iframe id="shell-frame" title="Agent Shell" allow="microphone; camera"></iframe>
    <div class="sidepanel-bar">
      <span id="shell-url-label" aria-live="polite"></span>
      <button
        id="retry-btn"
        type="button"
        class="sidepanel-icon-btn"
        title="Перезагрузить Agent CMS Voice в панели"
        aria-label="Перезагрузить Voice"
      >
        <svg
          class="sidepanel-action-icon"
          viewBox="0 0 24 24"
          aria-hidden="true"
          fill="none"
          stroke="currentColor"
          stroke-width="2"
          stroke-linecap="round"
          stroke-linejoin="round"
        >
          <polyline points="23 4 23 10 17 10"></polyline>
          <polyline points="1 20 1 14 7 14"></polyline>
          <path d="M3.51 9a9 9 0 0 1 14.13-3.36L23 10"></path>
          <path d="M20.49 15a9 9 0 0 1-14.13 3.36L1 14"></path>
        </svg>
      </button>
      <button
        id="open-tab-btn"
        type="button"
        class="sidepanel-icon-btn"
        title="Открыть Agent Shell в новой вкладке браузера"
        aria-label="Открыть в новом окне"
      >
        <svg
          class="sidepanel-action-icon"
          viewBox="0 0 24 24"
          aria-hidden="true"
          fill="none"
          stroke="currentColor"
          stroke-width="2"
          stroke-linecap="round"
          stroke-linejoin="round"
        >
          <path d="M15 3h6v6"></path>
          <path d="M10 14 21 3"></path>
          <path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6"></path>
        </svg>
      </button>
      <button
        id="options-link"
        type="button"
        class="sidepanel-icon-btn"
        title="Настройки Companion — URL сервера и агент"
        aria-label="Настройки"
      >
        <svg
          class="sidepanel-action-icon"
          viewBox="0 0 24 24"
          aria-hidden="true"
          fill="none"
          stroke="currentColor"
          stroke-width="2"
          stroke-linecap="round"
          stroke-linejoin="round"
        >
          <path
            d="M12.22 2h-.44a2 2 0 0 0-2 2v.18a2 2 0 0 1-1 1.73l-.43.25a2 2 0 0 1-2 0l-.15-.08a2 2 0 0 0-2.73.73l-.22.38a2 2 0 0 0 .73 2.73l.15.1a2 2 0 0 1 1 1.72v.51a2 2 0 0 1-1 1.74l-.15.09a2 2 0 0 0-.73 2.73l.22.38a2 2 0 0 0 2.73.73l.15-.08a2 2 0 0 1 2 0l.43.25a2 2 0 0 1 1 1.73V20a2 2 0 0 0 2 2h.44a2 2 0 0 0 2-2v-.18a2 2 0 0 1 1-1.73l.43-.25a2 2 0 0 1 2 0l.15.08a2 2 0 0 0 2.73-.73l.22-.39a2 2 0 0 0-.73-2.73l-.15-.08a2 2 0 0 1-1-1.74v-.5a2 2 0 0 1 1-1.74l.15-.09a2 2 0 0 0 .73-2.73l-.22-.38a2 2 0 0 0-2.73-.73l-.15.08a2 2 0 0 1-2 0l-.43-.25a2 2 0 0 1-1-1.73V4a2 2 0 0 0-2-2z"
          ></path>
          <circle cx="12" cy="12" r="3"></circle>
        </svg>
      </button>
      <button
        id="file-hub-btn"
        type="button"
        class="sidepanel-icon-btn sidepanel-file-hub-btn"
        title="Файловое хранилище — обмен файлами с агентом"
        aria-label="Файловое хранилище"
        aria-pressed="false"
      >
        <svg
          class="sidepanel-action-icon"
          viewBox="0 0 24 24"
          aria-hidden="true"
          fill="none"
          stroke="currentColor"
          stroke-width="2"
          stroke-linecap="round"
          stroke-linejoin="round"
        >
          <path d="M22 19a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h5l2 3h9a2 2 0 0 1 2 2z"></path>
          <path d="M12 11v6"></path>
          <path d="M9 14h6"></path>
        </svg>
      </button>
    </div>
    <script src="companion-urls-global.js"></script>
    <script src="companion-storage.js"></script>
    <script src="sidepanel.js"></script>
  </body>
</html>
