<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>JARVIS · Fable Core — рабочее пространство</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ccircle cx='16' cy='16' r='14' fill='%23060a0f'/%3E%3Ccircle cx='16' cy='16' r='9' fill='none' stroke='%23f5b942' stroke-width='2'/%3E%3Ccircle cx='16' cy='16' r='3' fill='%2370e4ff'/%3E%3C/svg%3E">
<style>
  :root {
    --bg: #060a0f;
    --panel: rgba(12, 20, 29, 0.82);
    --panel-2: rgba(16, 26, 37, 0.95);
    --line: rgba(112, 228, 255, 0.16);
    --line-strong: rgba(112, 228, 255, 0.45);
    --ice: #70e4ff;
    --ice-dim: #3aa9c4;
    --amber: #f5b942;
    --amber-dim: #b9842a;
    --text: #e6f3f8;
    --muted: #7c93a3;
    --ok: #5cf2a5;
    --warn: #ff7a59;
    --font: "SF Pro Display", "Inter", "Segoe UI", system-ui, sans-serif;
    --mono: "SF Mono", "JetBrains Mono", ui-monospace, Menlo, monospace;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; }
  body {
    font-family: var(--font); color: var(--text); overflow: hidden; color-scheme: dark;
    background:
      radial-gradient(900px 600px at 50% 45%, rgba(58,169,196,.12), transparent 65%),
      radial-gradient(700px 500px at 50% 110%, rgba(245,185,66,.08), transparent 60%),
      var(--bg);
  }
  body::after { content:""; position:fixed; inset:0; pointer-events:none; background: repeating-linear-gradient(0deg, rgba(255,255,255,.012) 0 1px, transparent 1px 3px); }
  button, input, select, textarea { font: inherit; color: inherit; }
  button { cursor: pointer; }

  .app { height: 100vh; height: 100dvh; display: grid; grid-template-rows: 56px minmax(0,1fr) 46px; gap: 10px; padding: 10px 12px; }

  /* ───── header ───── */
  header { display:flex; align-items:center; gap:14px; padding:0 14px 0 16px; border:1px solid var(--line); border-radius:14px; background:var(--panel); backdrop-filter:blur(14px); }
  .brand { display:flex; align-items:center; gap:10px; margin-right:auto; }
  .reactor-mini { width:28px;height:28px;border-radius:50%;border:2px solid var(--amber);display:grid;place-items:center;box-shadow:0 0 14px rgba(245,185,66,.45), inset 0 0 8px rgba(112,228,255,.3); }
  .reactor-mini i { width:7px;height:7px;border-radius:50%;background:var(--ice);box-shadow:0 0 8px var(--ice);animation:pulse 2.4s ease-in-out infinite; }
  .brand h1 { font-size:14px; letter-spacing:.3em; font-weight:700; }
  .brand small { display:block; font:10px var(--mono); letter-spacing:.16em; color:var(--amber); margin-top:1px; }
  .meta { display:flex; align-items:center; gap:16px; font:12px var(--mono); color:var(--muted); }
  .meta b { color:var(--text); font-weight:500; }
  .meta .dot { width:7px;height:7px;border-radius:50%;background:var(--ok);box-shadow:0 0 8px var(--ok);display:inline-block;margin-right:6px;vertical-align:middle; }
  .hbtns { display:flex; gap:6px; }
  .hb { height:32px; padding:0 11px; border-radius:9px; border:1px solid var(--line); background:rgba(112,228,255,.06); color:var(--text); font:500 12px var(--font); display:inline-flex; align-items:center; gap:7px; transition:.15s; }
  .hb:hover { border-color:var(--line-strong); background:rgba(112,228,255,.14); }
  .hb kbd { font:10px var(--mono); color:var(--muted); border:1px solid var(--line); border-radius:4px; padding:1px 4px; }
  .hb.icon { width:32px; padding:0; justify-content:center; }
  .hb svg { width:15px; height:15px; }
  .clock { text-align:right; line-height:1.15; }
  #clock { color:var(--ice); font:600 15px var(--mono); letter-spacing:.08em; }
  #date { color:var(--muted); font-size:11px; }

  /* ───── desktop ───── */
  .desktop { position:relative; overflow:hidden; border:1px solid var(--line); border-radius:16px; background: rgba(5,9,14,.5); }
  .desktop::before { content:""; position:absolute; inset:0; pointer-events:none; background-image: radial-gradient(rgba(112,228,255,.14) 1px, transparent 1px); background-size:28px 28px; mask-image: radial-gradient(ellipse at center, #000 20%, transparent 80%); opacity:.5; }
  #viz { position:absolute; inset:0; width:100%; height:100%; pointer-events:none; }

  .hero { position:absolute; left:50%; top:50%; transform:translate(-50%,-52%); display:flex; flex-direction:column; align-items:center; gap:16px; z-index:1; }
  .core { position:relative; width:220px; height:220px; border-radius:50%; display:grid; place-items:center; cursor:pointer; user-select:none; -webkit-tap-highlight-color:transparent; }
  .ring { position:absolute; inset:0; border-radius:50%; border:1px solid var(--line-strong); }
  .ring.r1 { border-style:dashed; animation:spin 24s linear infinite; }
  .ring.r2 { inset:20px; border-width:2px; border-color:var(--amber); border-top-color:transparent; border-bottom-color:transparent; animation:spin 7s linear infinite reverse; box-shadow:0 0 20px rgba(245,185,66,.25); }
  .ring.r3 { inset:40px; border-color:rgba(112,228,255,.5); border-left-color:transparent; animation:spin 4s linear infinite; }
  .orb { position:relative; width:104px; height:104px; border-radius:50%; display:grid; place-items:center; color:#03202b; transition:transform .3s, box-shadow .3s;
    background: radial-gradient(circle at 40% 35%, #c9f6ff 0%, var(--ice) 25%, #1b7f98 65%, #0b2b38 100%);
    box-shadow: 0 0 40px rgba(112,228,255,.55), 0 0 100px rgba(112,228,255,.25), inset 0 0 30px rgba(255,255,255,.3); }
  .orb svg { width:38px; height:38px; }
  .core[data-state="listening"] .orb { transform:scale(1.08); box-shadow:0 0 60px rgba(112,228,255,.9), 0 0 140px rgba(112,228,255,.35), inset 0 0 30px rgba(255,255,255,.4); }
  .core[data-state="thinking"] .orb { background: radial-gradient(circle at 40% 35%, #fff2cc 0%, var(--amber) 25%, #9a6a1c 65%, #3a2608 100%); box-shadow:0 0 60px rgba(245,185,66,.7), 0 0 140px rgba(245,185,66,.3); }
  .core[data-state="thinking"] .ring.r3 { animation-duration:1s; }
  .core[data-state="speaking"] .orb { animation:breathe 1.1s ease-in-out infinite; }
  .state-label { font:11px var(--mono); letter-spacing:.22em; text-transform:uppercase; color:var(--ice); padding:7px 14px; border-radius:99px; border:1px solid var(--line); background:rgba(6,10,15,.7); display:flex; align-items:center; gap:10px; white-space:nowrap; }
  .eq { display:inline-flex; gap:2px; align-items:flex-end; height:10px; }
  .eq i { width:2px; background:var(--ice); height:30%; animation:eq 1s ease-in-out infinite; }
  .eq i:nth-child(2){animation-delay:.15s} .eq i:nth-child(3){animation-delay:.3s} .eq i:nth-child(4){animation-delay:.45s} .eq i:nth-child(5){animation-delay:.6s}
  .core[data-state="idle"] ~ .state-label .eq i { animation-play-state:paused; height:20%; }
  .hero-hint { font:11px var(--mono); color:var(--muted); letter-spacing:.06em; }

  /* ───── windows ───── */
  .win { position:absolute; display:flex; flex-direction:column; min-width:220px; min-height:110px; border:1px solid var(--line); border-radius:14px; background:var(--panel); backdrop-filter:blur(16px); box-shadow:0 20px 50px rgba(0,0,0,.45); overflow:hidden; z-index:10; animation:pop .18s ease both; }
  .win.active { border-color:var(--line-strong); box-shadow:0 24px 60px rgba(0,0,0,.55), 0 0 0 1px rgba(112,228,255,.12); }
  .win.min { display:none; }
  .win.max { left:6px !important; top:6px !important; width:calc(100% - 12px) !important; height:calc(100% - 12px) !important; }
  .win-bar { display:flex; align-items:center; gap:6px; padding:7px 8px 7px 12px; cursor:grab; user-select:none; border-bottom:1px solid var(--line); background:rgba(255,255,255,.015); }
  .win-bar:active { cursor:grabbing; }
  .win-bar .ttl { flex:1; min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; font:600 10.5px var(--mono); letter-spacing:.2em; text-transform:uppercase; color:var(--muted); }
  .win.active .win-bar .ttl { color:var(--text); }
  .win-bar .ttl em { font-style:normal; color:var(--amber); letter-spacing:.08em; margin-left:8px; }
  .wb { width:22px; height:22px; border-radius:7px; border:1px solid transparent; background:transparent; color:var(--muted); display:grid; place-items:center; font:12px var(--mono); transition:.12s; }
  .wb:hover { background:rgba(112,228,255,.1); color:var(--text); border-color:var(--line); }
  .wb.x:hover { color:var(--warn); }
  .win-body { flex:1; min-height:0; overflow:auto; padding:14px; scrollbar-width:thin; scrollbar-color:rgba(112,228,255,.25) transparent; }
  .win-body.flush { padding:0; display:flex; flex-direction:column; overflow:hidden; }
  .rsz { position:absolute; right:0; bottom:0; width:18px; height:18px; cursor:nwse-resize; }
  .rsz::after { content:""; position:absolute; right:5px; bottom:5px; width:8px; height:8px; border-right:2px solid var(--line-strong); border-bottom:2px solid var(--line-strong); opacity:.7; }

  /* ───── generic bits ───── */
  .btn { appearance:none; border:1px solid var(--line); background:rgba(112,228,255,.08); color:var(--ice); font:600 12px var(--mono); letter-spacing:.08em; text-transform:uppercase; padding:10px 14px; border-radius:11px; transition:.15s; display:inline-flex; align-items:center; gap:8px; justify-content:center; }
  .btn:hover { background:rgba(112,228,255,.16); border-color:var(--line-strong); }
  .btn.primary { background:var(--ice); color:#03202b; border-color:var(--ice); }
  .btn.primary:hover { background:#9beeff; }
  .btn.danger { background:var(--warn); color:#2a0d05; border-color:var(--warn); }
  .btn.ghost { background:transparent; color:var(--muted); }
  .btn.sm { padding:7px 10px; font-size:11px; border-radius:9px; }
  .btn.mic { width:42px; height:42px; padding:0; border-radius:50%; }
  .btn.mic.on { background:var(--amber); color:#2a1a00; border-color:var(--amber); box-shadow:0 0 20px rgba(245,185,66,.5); }
  .btn svg { width:16px; height:16px; }
  .sect-foot { display:flex; gap:8px; justify-content:flex-end; padding:10px 12px; border-top:1px solid var(--line); background:rgba(6,10,15,.4); }
  .empty { color:var(--muted); font-size:12.5px; text-align:center; padding:24px 12px; line-height:1.5; }
  input.inp, textarea.inp, select.inp { width:100%; background:rgba(255,255,255,.035); border:1px solid var(--line); border-radius:10px; padding:10px 12px; outline:none; transition:border-color .15s; font-size:13.5px; }
  input.inp:focus, textarea.inp:focus, select.inp:focus { border-color:var(--line-strong); }
  .inp::placeholder { color:var(--muted); }
  textarea.inp { resize:vertical; min-height:80px; line-height:1.5; }

  /* chat */
  .transcript { flex:1; min-height:0; overflow-y:auto; padding:14px 16px; display:flex; flex-direction:column; gap:12px; scrollbar-width:thin; }
  .msg { display:flex; gap:10px; align-items:flex-start; animation:rise .3s ease both; }
  .msg .who { flex-shrink:0; width:30px; height:30px; border-radius:9px; display:grid; place-items:center; font:700 10px var(--mono); }
  .msg.ai .who { background:rgba(112,228,255,.1); color:var(--ice); border:1px solid var(--line); }
  .msg.me .who { background:rgba(245,185,66,.1); color:var(--amber); border:1px solid rgba(245,185,66,.3); }
  .msg .bubble { font-size:13.5px; line-height:1.5; }
  .msg .bubble .t { display:block; font:10px var(--mono); color:var(--muted); margin-bottom:3px; letter-spacing:.08em; }
  .msg.me { flex-direction:row-reverse; text-align:right; }
  .msg.me .bubble { color:#f6ead0; }
  .cursor { display:inline-block; width:7px; height:13px; background:var(--ice); vertical-align:-2px; margin-left:2px; animation:blink 1s steps(2) infinite; }
  .composer { display:flex; align-items:center; gap:8px; padding:10px 12px; border-top:1px solid var(--line); background:rgba(6,10,15,.45); }
  .composer input { flex:1; min-width:0; }

  /* commands */
  .cmd { display:flex; align-items:center; gap:10px; width:100%; text-align:left; padding:9px 10px; border-radius:11px; border:1px solid transparent; background:rgba(255,255,255,.025); transition:.15s; margin-bottom:6px; position:relative; }
  .cmd:hover { border-color:var(--line-strong); background:rgba(112,228,255,.06); }
  .cmd .lbl { font-size:13px; font-weight:500; }
  .cmd .hint { font:11px var(--mono); color:var(--muted); margin-top:2px; }
  .cmd .rm { position:absolute; right:8px; top:8px; opacity:0; }
  .cmd:hover .rm { opacity:1; }
  .rm { width:20px; height:20px; border-radius:6px; border:1px solid var(--line); background:rgba(6,10,15,.6); color:var(--muted); font:11px var(--mono); display:grid; place-items:center; }
  .rm:hover { color:var(--warn); border-color:var(--warn); }

  /* system */
  .stat .row { display:flex; flex-direction:column; gap:6px; margin-bottom:12px; }
  .stat .row .kv { display:flex; justify-content:space-between; font:11px var(--mono); color:var(--muted); }
  .stat .row .kv b { color:var(--text); font-weight:500; }
  .bar { height:5px; border-radius:99px; background:rgba(255,255,255,.06); overflow:hidden; }
  .bar i { display:block; height:100%; border-radius:99px; background:linear-gradient(90deg,var(--ice-dim),var(--ice)); transition:width .8s; }
  .bar.amber i { background:linear-gradient(90deg,var(--amber-dim),var(--amber)); }

  /* log */
  .log { font:11.5px var(--mono); line-height:1.7; color:var(--muted); }
  .log div { display:flex; gap:10px; white-space:nowrap; }
  .log .ts { color:var(--ice-dim); flex-shrink:0; }
  .ok { color:var(--ok); } .wr { color:var(--warn); } .am { color:var(--amber); }

  /* weather / schedule / chips */
  .weather { display:flex; align-items:center; justify-content:space-between; gap:12px; }
  .weather .temp { font-size:38px; font-weight:300; letter-spacing:-.03em; line-height:1; }
  .weather .temp sup { font-size:15px; color:var(--amber); vertical-align:top; margin-left:2px; }
  .weather .desc { font-size:12px; color:var(--muted); margin-top:6px; }
  .weather .city { font:11px var(--mono); color:var(--ice); letter-spacing:.1em; text-transform:uppercase; margin-bottom:6px; }
  .weather .glyph { width:52px; height:52px; color:var(--amber); }
  .ev { display:grid; grid-template-columns:48px 1fr auto; gap:10px; align-items:start; padding:8px 0; border-bottom:1px dashed rgba(112,228,255,.1); }
  .ev:last-child { border-bottom:0; }
  .ev .tm { font:12px var(--mono); color:var(--ice); padding-top:2px; }
  .ev .ti { font-size:13px; }
  .ev .sb { font-size:11px; color:var(--muted); margin-top:2px; }
  .ev.now .tm { color:var(--amber); }
  .chips { display:flex; flex-wrap:wrap; gap:8px; }
  .chip { font:11px var(--mono); padding:6px 10px; border-radius:99px; border:1px solid var(--line); background:rgba(255,255,255,.03); display:inline-flex; align-items:center; gap:6px; transition:.15s; }
  .chip i { width:6px; height:6px; border-radius:50%; background:var(--ok); box-shadow:0 0 6px var(--ok); }
  .chip.off { color:var(--muted); } .chip.off i { background:var(--muted); box-shadow:none; }
  .chip:hover { border-color:var(--line-strong); }

  /* terminal */
  .term { flex:1; min-height:0; overflow:auto; padding:12px 14px; font:12px var(--mono); line-height:1.65; color:#bfe9f5; white-space:pre-wrap; word-break:break-word; }
  .term .p { color:var(--amber); }
  .term-in { display:flex; align-items:center; gap:8px; padding:8px 14px; border-top:1px solid var(--line); font:12px var(--mono); }
  .term-in span { color:var(--amber); }
  .term-in input { flex:1; background:transparent; border:0; outline:none; font:inherit; color:var(--text); }

  /* dashboard */
  .dash-bar { display:flex; align-items:center; gap:10px; padding:8px 12px; border-bottom:1px solid var(--line); font:11px var(--mono); color:var(--muted); }
  .dash-bar .sp { flex:1; }
  .dash-grid { flex:1; min-height:0; overflow:auto; padding:12px; display:grid; grid-template-columns:repeat(auto-fill, minmax(170px, 1fr)); grid-auto-rows:minmax(120px, auto); gap:10px; align-content:start; }
  .wg { position:relative; border:1px solid var(--line); border-radius:12px; background:rgba(255,255,255,.025); padding:12px; display:flex; flex-direction:column; min-height:120px; transition:border-color .15s; }
  .wg:hover { border-color:var(--line-strong); }
  .wg.c2 { grid-column:span 2; } .wg.r2 { grid-row:span 2; }
  .wg .wt { font:10px var(--mono); letter-spacing:.18em; text-transform:uppercase; color:var(--muted); margin-bottom:8px; padding-right:22px; }
  .wg .rm { position:absolute; right:8px; top:8px; opacity:0; }
  .wg:hover .rm { opacity:1; }
  .kpi { cursor:pointer; flex:1; display:flex; flex-direction:column; justify-content:center; }
  .kpi .v { font-size:30px; font-weight:300; letter-spacing:-.02em; line-height:1; }
  .kpi .d { font:11px var(--mono); color:var(--ok); margin-top:6px; }
  .kpi .d.neg { color:var(--warn); }
  .wg canvas { width:100%; flex:1; min-height:60px; }
  .gauge { flex:1; display:grid; place-items:center; }
  .gauge svg { width:90px; height:90px; transform:rotate(-90deg); }
  .gauge .val { position:absolute; font:600 18px var(--mono); color:var(--text); }
  .gauge-wrap { position:relative; display:grid; place-items:center; }
  .cl { list-style:none; flex:1; overflow:auto; }
  .cl li { display:flex; align-items:center; gap:8px; font-size:13px; padding:5px 0; border-bottom:1px dashed rgba(112,228,255,.1); }
  .cl li.done span { text-decoration:line-through; color:var(--muted); }
  .cl li span { flex:1; }
  .cl input[type=checkbox] { accent-color:var(--ice); }
  .cl-add { display:flex; gap:6px; margin-top:8px; }
  .cl-add input { flex:1; padding:7px 10px; font-size:12.5px; }
  .wclock { flex:1; display:flex; flex-direction:column; justify-content:center; }
  .wclock .tm { font:600 32px var(--mono); color:var(--ice); letter-spacing:.06em; }
  .wclock .dt { font-size:12px; color:var(--muted); margin-top:4px; }
  .wg textarea { flex:1; resize:none; }

  /* ───── dock ───── */
  .dock { display:flex; align-items:center; gap:8px; padding:0 10px; border:1px solid var(--line); border-radius:14px; background:var(--panel); backdrop-filter:blur(14px); overflow:hidden; }
  .dock-l { font:10.5px var(--mono); letter-spacing:.18em; text-transform:uppercase; color:var(--muted); padding-right:10px; border-right:1px solid var(--line); flex-shrink:0; }
  .dock-wins { flex:1; display:flex; gap:6px; overflow-x:auto; scrollbar-width:none; }
  .dchip { flex-shrink:0; height:28px; padding:0 11px; border-radius:8px; border:1px solid var(--line); background:rgba(255,255,255,.03); color:var(--muted); font:11px var(--mono); display:inline-flex; align-items:center; gap:7px; transition:.15s; }
  .dchip i { width:6px; height:6px; border-radius:50%; background:var(--muted); }
  .dchip.act { color:var(--text); border-color:var(--line-strong); background:rgba(112,228,255,.1); }
  .dchip.act i { background:var(--ice); box-shadow:0 0 6px var(--ice); }
  .dchip.min { opacity:.6; border-style:dashed; }
  .dchip:hover { color:var(--text); }
  .dock-r { font:10.5px var(--mono); color:var(--muted); white-space:nowrap; flex-shrink:0; }
  .dock-r kbd { border:1px solid var(--line); border-radius:4px; padding:1px 5px; color:var(--text); }

  /* ───── dialogs ───── */
  dialog { border:1px solid var(--line-strong); border-radius:16px; background:var(--panel-2); color:var(--text); padding:0; width:min(520px, calc(100vw - 32px)); box-shadow:0 30px 80px rgba(0,0,0,.6); backdrop-filter:blur(20px); }
  dialog::backdrop { background:rgba(3,6,10,.6); backdrop-filter:blur(4px); }
  dialog[open] { animation:pop .18s ease both; }
  .dlg-head { padding:18px 20px 6px; }
  .dlg-head h2 { font-size:16px; font-weight:600; letter-spacing:.02em; }
  .dlg-head p { font-size:12.5px; color:var(--muted); margin-top:6px; line-height:1.5; }
  .dlg-fields { padding:12px 20px 6px; display:grid; grid-template-columns:1fr 1fr; gap:12px; }
  .field { display:flex; flex-direction:column; gap:6px; }
  .field.full { grid-column:1 / -1; }
  .field label { font:10.5px var(--mono); letter-spacing:.14em; text-transform:uppercase; color:var(--muted); display:flex; justify-content:space-between; }
  .field label .range-v { color:var(--ice); letter-spacing:0; }
  .field input, .field select, .field textarea { background:rgba(255,255,255,.035); border:1px solid var(--line); border-radius:10px; padding:10px 12px; outline:none; font-size:13.5px; transition:border-color .15s; }
  .field input:focus, .field select:focus, .field textarea:focus { border-color:var(--line-strong); }
  .field input[type=range] { padding:0; accent-color:var(--ice); height:28px; background:transparent; border:0; }
  .field textarea { resize:vertical; min-height:72px; }
  .field.toggle { flex-direction:row; align-items:center; gap:10px; cursor:pointer; padding:6px 0; }
  .field.toggle input { position:absolute; opacity:0; pointer-events:none; }
  .field.toggle .sw { width:36px; height:20px; border-radius:99px; background:rgba(255,255,255,.08); border:1px solid var(--line); position:relative; transition:.15s; flex-shrink:0; }
  .field.toggle .sw::after { content:""; position:absolute; top:2px; left:2px; width:14px; height:14px; border-radius:50%; background:var(--muted); transition:.15s; }
  .field.toggle input:checked + .sw { background:rgba(112,228,255,.25); border-color:var(--line-strong); }
  .field.toggle input:checked + .sw::after { left:18px; background:var(--ice); box-shadow:0 0 6px var(--ice); }
  .field.toggle > span:last-child { font-size:13px; }
  .dlg-actions { display:flex; gap:8px; justify-content:flex-end; padding:14px 20px 18px; }
  .dlg-text { padding:0 20px 8px; font-size:13.5px; line-height:1.55; color:var(--text); }
  .pick { padding:12px 20px 18px; display:grid; grid-template-columns:repeat(3,1fr); gap:10px; }
  .pick button { border:1px solid var(--line); border-radius:12px; background:rgba(255,255,255,.03); padding:14px 10px; text-align:left; transition:.15s; }
  .pick button:hover { border-color:var(--line-strong); background:rgba(112,228,255,.08); }
  .pick b { display:block; font-size:13px; font-weight:600; margin-bottom:4px; }
  .pick span { font-size:11px; color:var(--muted); line-height:1.4; }
  .pick .ico { color:var(--ice); font:11px var(--mono); margin-bottom:8px; letter-spacing:.1em; }

  /* palette */
  #palette { width:min(620px, calc(100vw - 32px)); }
  .pal-in { display:flex; align-items:center; gap:10px; padding:14px 16px; border-bottom:1px solid var(--line); }
  .pal-in input { flex:1; background:transparent; border:0; outline:none; font-size:16px; }
  .pal-in kbd { font:10px var(--mono); color:var(--muted); border:1px solid var(--line); border-radius:4px; padding:2px 6px; }
  .pal-list { max-height:min(420px, 60vh); overflow:auto; padding:8px; }
  .pal-i { width:100%; text-align:left; display:flex; align-items:center; gap:12px; padding:10px 12px; border-radius:10px; border:1px solid transparent; background:transparent; font-size:13.5px; }
  .pal-i:hover, .pal-i.sel { background:rgba(112,228,255,.08); border-color:var(--line); }
  .pal-i .h { margin-left:auto; font:10px var(--mono); color:var(--muted); letter-spacing:.1em; text-transform:uppercase; }
  .pal-i .k { font:10px var(--mono); color:var(--ice); width:52px; flex-shrink:0; letter-spacing:.1em; text-transform:uppercase; }

  /* context menu + toasts */
  .ctx { position:fixed; z-index:1000; min-width:220px; padding:6px; border:1px solid var(--line-strong); border-radius:12px; background:var(--panel-2); box-shadow:0 20px 50px rgba(0,0,0,.5); backdrop-filter:blur(16px); }
  .ctx[hidden] { display:none; }
  .ctx-i { width:100%; text-align:left; padding:8px 10px; border-radius:8px; border:0; background:transparent; font-size:13px; display:flex; justify-content:space-between; }
  .ctx-i:hover { background:rgba(112,228,255,.1); }
  .ctx-i small { font:10px var(--mono); color:var(--muted); }
  .ctx hr { border:0; border-top:1px solid var(--line); margin:5px 4px; }
  .toasts { position:fixed; right:22px; bottom:66px; z-index:900; display:flex; flex-direction:column; gap:8px; pointer-events:none; }
  .toast { padding:10px 14px; border-radius:10px; border:1px solid var(--line-strong); background:var(--panel-2); font-size:12.5px; box-shadow:0 10px 30px rgba(0,0,0,.4); opacity:0; transform:translateY(8px); transition:.25s; max-width:320px; }
  .toast.show { opacity:1; transform:none; }
  .toast.ok { border-color:rgba(92,242,165,.5); } .toast.wr { border-color:rgba(255,122,89,.6); }

  .help-list { padding:4px 20px 14px; font-size:13px; line-height:1.9; color:var(--text); }
  .help-list kbd { font:11px var(--mono); border:1px solid var(--line); border-radius:4px; padding:1px 6px; color:var(--ice); margin-right:6px; }

  /* ═══════════ UI KIT (j-*) — разметка контента, который генерирует агент ═══════════ */
  .j-view { padding:14px 16px; display:flex; flex-direction:column; gap:14px; }
  .j-stack { display:flex; flex-direction:column; gap:12px; min-width:0; }
  .j-view > *, .j-stack > * { flex-shrink:0; }

  /* markdown */
  .j-md { font-size:13.5px; line-height:1.6; min-width:0; }
  .j-md > :first-child { margin-top:0; }
  .j-md h1, .j-md h2, .j-md h3 { font-weight:600; margin:14px 0 6px; line-height:1.25; }
  .j-md h1 { font-size:20px; } .j-md h2 { font-size:16px; color:var(--ice); } .j-md h3 { font-size:14px; }
  .j-md h4 { font:600 10.5px var(--mono); letter-spacing:.18em; text-transform:uppercase; color:var(--muted); margin:12px 0 6px; }
  .j-md p { margin:0 0 8px; }
  .j-md ul, .j-md ol { margin:0 0 8px 20px; } .j-md li { margin:3px 0; }
  .j-md li.task { list-style:none; margin-left:-20px; } .j-md li.task input { accent-color:var(--ice); margin-right:6px; vertical-align:-1px; }
  .j-md a { color:var(--ice); text-decoration:none; border-bottom:1px solid rgba(112,228,255,.35); }
  .j-md strong { color:#fff; } .j-md em { color:var(--amber); font-style:normal; } .j-md s { color:var(--muted); }
  .j-md code { font:12px var(--mono); background:rgba(112,228,255,.08); border:1px solid var(--line); border-radius:5px; padding:1px 5px; color:var(--ice); }
  .j-md pre, .j-code { position:relative; background:rgba(3,6,10,.7); border:1px solid var(--line); border-radius:10px; padding:12px 14px; overflow:auto; font:12px/1.55 var(--mono); color:#bfe9f5; margin:0 0 8px; white-space:pre; }
  .j-md pre code { background:none; border:0; padding:0; color:inherit; font:inherit; }
  .j-code .lang, .j-md pre .lang { position:absolute; right:10px; top:8px; font:10px var(--mono); color:var(--muted); letter-spacing:.14em; text-transform:uppercase; }
  .j-md blockquote { margin:0 0 8px; padding:8px 14px; border-left:3px solid var(--amber); background:rgba(245,185,66,.06); border-radius:0 10px 10px 0; color:#f6ead0; }
  .j-md blockquote p:last-child { margin:0; }
  .j-md hr { border:0; border-top:1px solid var(--line); margin:12px 0; }
  .j-md table { width:100%; border-collapse:collapse; margin:0 0 8px; font-size:12.5px; }
  .j-md th, .j-md td { padding:7px 10px; border-bottom:1px solid var(--line); }
  .j-md th { font:600 10px var(--mono); letter-spacing:.14em; text-transform:uppercase; color:var(--muted); }

  /* table */
  .j-table-wrap { border:1px solid var(--line); border-radius:12px; overflow:hidden; background:rgba(255,255,255,.015); }
  .j-table-bar { display:flex; align-items:center; gap:10px; padding:8px 12px; border-bottom:1px solid var(--line); font:600 10.5px var(--mono); letter-spacing:.16em; text-transform:uppercase; color:var(--muted); }
  .j-table-bar input { flex:1; padding:6px 10px; font:13px var(--font); letter-spacing:0; text-transform:none; }
  .j-table-scroll { overflow:auto; max-height:380px; }
  .j-table { width:100%; border-collapse:separate; border-spacing:0; font-size:12.5px; }
  .j-table th { position:sticky; top:0; z-index:1; background:rgba(12,20,29,.98); font:600 10px var(--mono); letter-spacing:.14em; text-transform:uppercase; color:var(--muted); padding:9px 12px; text-align:left; border-bottom:1px solid var(--line); cursor:pointer; user-select:none; white-space:nowrap; }
  .j-table th:hover { color:var(--text); } .j-table th.sorted { color:var(--ice); } .j-table th .arr { margin-left:4px; }
  .j-table td { padding:8px 12px; border-bottom:1px solid rgba(112,228,255,.07); vertical-align:middle; }
  .j-table tbody tr:last-child td { border-bottom:0; }
  .j-table tbody tr:hover td { background:rgba(112,228,255,.04); }
  .j-table .num { text-align:right; font-family:var(--mono); font-variant-numeric:tabular-nums; }
  .j-table .pos { color:var(--ok); } .j-table .neg { color:var(--warn); }
  .j-table-foot { padding:6px 12px; font:10.5px var(--mono); color:var(--muted); border-top:1px solid var(--line); }
  .j-bar-cell { display:flex; align-items:center; gap:8px; font-family:var(--mono); }
  .j-bar-cell .trk { width:80px; height:6px; border-radius:3px; background:rgba(255,255,255,.06); overflow:hidden; flex-shrink:0; }
  .j-bar-cell .trk i { display:block; height:100%; background:linear-gradient(90deg,var(--ice-dim),var(--ice)); }

  /* badges / alerts */
  .j-badge { display:inline-flex; align-items:center; gap:5px; font:600 10px var(--mono); letter-spacing:.1em; text-transform:uppercase; padding:3px 8px; border-radius:99px; border:1px solid var(--line); color:var(--muted); background:rgba(255,255,255,.03); white-space:nowrap; }
  .j-badge.ok { color:var(--ok); border-color:rgba(92,242,165,.4); background:rgba(92,242,165,.08); }
  .j-badge.warn { color:var(--amber); border-color:rgba(245,185,66,.4); background:rgba(245,185,66,.08); }
  .j-badge.err { color:var(--warn); border-color:rgba(255,122,89,.45); background:rgba(255,122,89,.08); }
  .j-badge.info { color:var(--ice); border-color:var(--line-strong); background:rgba(112,228,255,.08); }
  .j-badges { display:flex; flex-wrap:wrap; gap:6px; }
  .j-alert { display:flex; gap:12px; padding:12px 14px; border-radius:12px; border:1px solid var(--line-strong); background:rgba(112,228,255,.06); }
  .j-alert .ic { width:22px; height:22px; border-radius:7px; display:grid; place-items:center; font:700 12px var(--mono); flex-shrink:0; background:rgba(112,228,255,.15); color:var(--ice); }
  .j-alert b { display:block; font-size:13.5px; margin-bottom:2px; } .j-alert p { font-size:12.5px; color:var(--muted); line-height:1.5; }
  .j-alert.ok { border-color:rgba(92,242,165,.4); background:rgba(92,242,165,.06); } .j-alert.ok .ic { background:rgba(92,242,165,.15); color:var(--ok); }
  .j-alert.warn { border-color:rgba(245,185,66,.45); background:rgba(245,185,66,.06); } .j-alert.warn .ic { background:rgba(245,185,66,.15); color:var(--amber); }
  .j-alert.err { border-color:rgba(255,122,89,.5); background:rgba(255,122,89,.06); } .j-alert.err .ic { background:rgba(255,122,89,.15); color:var(--warn); }

  /* kpi / kv / list / timeline / steps / progress */
  .j-kpis { display:grid; grid-template-columns:repeat(auto-fit, minmax(130px,1fr)); gap:10px; }
  .j-kpi { border:1px solid var(--line); border-radius:12px; padding:12px 14px; background:rgba(255,255,255,.025); }
  .j-kpi .l { font:10px var(--mono); letter-spacing:.16em; text-transform:uppercase; color:var(--muted); }
  .j-kpi .v { font-size:26px; font-weight:300; letter-spacing:-.02em; margin:6px 0 2px; line-height:1; }
  .j-kpi .d { font:11px var(--mono); color:var(--ok); } .j-kpi .d.neg { color:var(--warn); } .j-kpi .d.flat { color:var(--muted); }
  .j-kv { display:grid; grid-template-columns:auto 1fr; gap:6px 16px; font-size:13px; margin:0; }
  .j-kv dt { font:11px var(--mono); color:var(--muted); letter-spacing:.06em; padding-top:2px; } .j-kv dd { margin:0; }
  .j-list { display:flex; flex-direction:column; gap:6px; }
  .j-item { display:flex; align-items:center; gap:12px; padding:10px 12px; border-radius:11px; border:1px solid var(--line); background:rgba(255,255,255,.02); }
  .j-item .ic { width:32px; height:32px; border-radius:9px; display:grid; place-items:center; background:rgba(112,228,255,.08); border:1px solid var(--line); color:var(--ice); font:600 12px var(--mono); flex-shrink:0; }
  .j-item .t { font-size:13px; font-weight:500; } .j-item .s { font-size:11.5px; color:var(--muted); margin-top:2px; }
  .j-item .r { margin-left:auto; text-align:right; font:12px var(--mono); flex-shrink:0; }
  .j-tl { position:relative; padding-left:22px; display:flex; flex-direction:column; gap:12px; }
  .j-tl::before { content:""; position:absolute; left:6px; top:6px; bottom:6px; width:1px; background:var(--line-strong); }
  .j-tl .e { position:relative; } .j-tl .e::before { content:""; position:absolute; left:-20px; top:4px; width:9px; height:9px; border-radius:50%; background:var(--ice); box-shadow:0 0 8px var(--ice); }
  .j-tl .e.ok::before { background:var(--ok); box-shadow:0 0 8px var(--ok); } .j-tl .e.warn::before { background:var(--amber); box-shadow:0 0 8px var(--amber); } .j-tl .e.err::before { background:var(--warn); box-shadow:0 0 8px var(--warn); } .j-tl .e.muted::before { background:var(--muted); box-shadow:none; }
  .j-tl .tm { font:10.5px var(--mono); color:var(--muted); letter-spacing:.08em; } .j-tl .t { font-size:13px; margin-top:2px; } .j-tl .s { font-size:12px; color:var(--muted); margin-top:2px; }
  .j-steps { display:flex; }
  .j-step { flex:1; position:relative; padding-right:10px; display:flex; flex-direction:column; gap:6px; }
  .j-step .n { width:24px; height:24px; border-radius:50%; border:1px solid var(--line-strong); display:grid; place-items:center; font:600 11px var(--mono); color:var(--muted); background:var(--bg); position:relative; z-index:1; }
  .j-step::before { content:""; position:absolute; left:24px; right:0; top:12px; height:1px; background:var(--line); } .j-step:last-child::before { display:none; }
  .j-step.done .n { background:var(--ice); color:#03202b; border-color:var(--ice); } .j-step.active .n { border-color:var(--amber); color:var(--amber); box-shadow:0 0 12px rgba(245,185,66,.4); }
  .j-step .t { font-size:12.5px; font-weight:500; } .j-step .s { font-size:11px; color:var(--muted); }
  .j-prog { display:flex; flex-direction:column; gap:10px; }
  .j-prog .r { display:flex; flex-direction:column; gap:5px; } .j-prog .kv { display:flex; justify-content:space-between; font:11px var(--mono); color:var(--muted); } .j-prog .kv b { color:var(--text); font-weight:500; }
  .j-prog .bar i.ok { background:linear-gradient(90deg,#2e9c6a,var(--ok)); } .j-prog .bar i.warn { background:linear-gradient(90deg,var(--amber-dim),var(--amber)); } .j-prog .bar i.err { background:linear-gradient(90deg,#a3402a,var(--warn)); }

  /* layout */
  .j-cols { display:grid; gap:12px; }
  .j-card { border:1px solid var(--line); border-radius:12px; padding:12px 14px; background:rgba(255,255,255,.02); display:flex; flex-direction:column; gap:10px; min-width:0; }
  .j-card > .j-h { font:600 10.5px var(--mono); letter-spacing:.18em; text-transform:uppercase; color:var(--muted); display:flex; justify-content:space-between; align-items:center; gap:8px; }
  .j-tabs { display:flex; gap:4px; border-bottom:1px solid var(--line); margin-bottom:12px; overflow-x:auto; scrollbar-width:none; }
  .j-tab { padding:8px 12px; border:0; background:transparent; color:var(--muted); font:500 12.5px var(--font); border-bottom:2px solid transparent; margin-bottom:-1px; white-space:nowrap; }
  .j-tab.on { color:var(--text); border-bottom-color:var(--ice); } .j-tab:hover { color:var(--text); }
  .j-actions { display:flex; flex-wrap:wrap; gap:8px; }
  .j-divider { border:0; border-top:1px solid var(--line); }
  .j-img { border-radius:12px; border:1px solid var(--line); overflow:hidden; margin:0; } .j-img img { display:block; width:100%; } .j-img figcaption { padding:8px 12px; font-size:11.5px; color:var(--muted); }

  /* media */
  .j-media { border:1px solid var(--line); border-radius:12px; overflow:hidden; background:#000; margin:0; }
  .j-media video, .j-media iframe { display:block; width:100%; aspect-ratio:16/9; border:0; background:#000; }
  .j-media figcaption { padding:8px 12px; font-size:11.5px; color:var(--muted); background:var(--panel-2); }
  .j-yt { position:relative; aspect-ratio:16/9; background:#0a1118 center/cover no-repeat; cursor:pointer; display:grid; place-items:center; }
  .j-yt::after { content:""; position:absolute; inset:0; background:linear-gradient(180deg, transparent 45%, rgba(0,0,0,.65)); }
  .j-yt .play { position:relative; z-index:1; width:64px; height:44px; border-radius:12px; background:rgba(255,0,0,.92); display:grid; place-items:center; box-shadow:0 10px 30px rgba(0,0,0,.5); transition:transform .15s; }
  .j-yt:hover .play { transform:scale(1.08); }
  .j-yt .play::after { content:""; border-style:solid; border-width:9px 0 9px 16px; border-color:transparent transparent transparent #fff; margin-left:3px; }
  .j-yt .yt-t { position:absolute; left:12px; right:12px; bottom:10px; z-index:1; font-size:13px; font-weight:500; text-shadow:0 1px 4px #000; }
  .j-videos { display:grid; grid-template-columns:repeat(auto-fill, minmax(180px,1fr)); gap:10px; }
  .j-vcard { border:1px solid var(--line); border-radius:12px; overflow:hidden; background:rgba(255,255,255,.02); cursor:pointer; transition:border-color .15s; text-align:left; padding:0; color:inherit; display:block; }
  .j-vcard:hover { border-color:var(--line-strong); }
  .j-vcard .th { position:relative; aspect-ratio:16/9; background:#0a1118 center/cover no-repeat; }
  .j-vcard .th i { position:absolute; right:6px; bottom:6px; z-index:1; font:10px var(--mono); font-style:normal; background:rgba(0,0,0,.8); padding:2px 5px; border-radius:4px; }
  .j-vcard .th::after { content:"▶"; position:absolute; inset:0; display:grid; place-items:center; color:#fff; font-size:22px; opacity:0; transition:.15s; background:rgba(0,0,0,.35); }
  .j-vcard:hover .th::after { opacity:1; }
  .j-vcard .vt { padding:8px 10px 2px; font-size:12.5px; font-weight:500; line-height:1.3; display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; overflow:hidden; }
  .j-vcard .vc { padding:0 10px 9px; font:10.5px var(--mono); color:var(--muted); }
  .j-gallery { display:grid; gap:8px; grid-template-columns:repeat(auto-fill, minmax(140px,1fr)); }
  .j-gallery button { position:relative; aspect-ratio:4/3; border:1px solid var(--line); border-radius:10px; overflow:hidden; padding:0; background:#0a1118; cursor:zoom-in; }
  .j-gallery img { width:100%; height:100%; object-fit:cover; display:block; transition:transform .2s; } .j-gallery button:hover img { transform:scale(1.05); }
  .j-gallery .gc { position:absolute; left:0; right:0; bottom:0; padding:16px 8px 6px; font-size:11px; color:#fff; background:linear-gradient(transparent, rgba(0,0,0,.8)); text-align:left; }
  .j-img img { cursor:zoom-in; }
  .j-audio { display:flex; align-items:center; gap:12px; padding:10px 12px; border:1px solid var(--line); border-radius:12px; background:rgba(255,255,255,.02); }
  .j-audio .cov { width:52px; height:52px; border-radius:10px; background:linear-gradient(135deg,var(--ice-dim),var(--amber-dim)) center/cover; flex-shrink:0; display:grid; place-items:center; font-size:22px; color:#fff; }
  .j-audio > div:last-child { flex:1; min-width:0; }
  .j-audio .at { font-size:13px; font-weight:500; } .j-audio .aa { font:11px var(--mono); color:var(--muted); margin-top:2px; }
  .j-audio audio { width:100%; height:32px; margin-top:6px; filter:invert(.92) hue-rotate(160deg) saturate(.5); }
  .j-link { display:flex; border:1px solid var(--line); border-radius:12px; overflow:hidden; background:rgba(255,255,255,.02); text-decoration:none; color:inherit; transition:border-color .15s; }
  .j-link:hover { border-color:var(--line-strong); }
  .j-link .li { width:120px; flex-shrink:0; background:#0a1118 center/cover no-repeat; }
  .j-link .lb { padding:10px 12px; min-width:0; }
  .j-link .ls { font:10px var(--mono); color:var(--ice); letter-spacing:.1em; text-transform:uppercase; }
  .j-link .lt { font-size:13.5px; font-weight:500; margin:3px 0; }
  .j-link .ld { font-size:12px; color:var(--muted); line-height:1.4; display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; overflow:hidden; }
  .j-md img { max-width:100%; border-radius:10px; display:block; margin:6px 0; border:1px solid var(--line); }
  dialog.lightbox { width:min(1100px, calc(100vw - 40px)); background:transparent; border:0; box-shadow:none; backdrop-filter:none; padding:0; }
  dialog.lightbox img { max-width:100%; max-height:82vh; display:block; margin:0 auto; border-radius:12px; box-shadow:0 30px 80px rgba(0,0,0,.7); }
  dialog.lightbox iframe { width:100%; aspect-ratio:16/9; border:0; border-radius:12px; background:#000; display:block; }
  dialog.lightbox .lc { text-align:center; color:var(--text); font-size:13px; margin-top:12px; text-shadow:0 1px 4px #000; }

  /* charts (SVG) */
  .j-chart { min-width:0; } .j-chart svg { width:100%; height:auto; display:block; overflow:visible; }

<script type="text/plain" id="ui-spec">
# JARVIS UI DSL — как модели рисовать окна

Ответ, который нужно показать визуально, возвращай **JSON-спекой окна**. Интерфейс отрисует её сам (функция `openView(spec)`). Текстовый ответ в чат — отдельно.

```json
{ "title": "Заголовок окна", "width": 640, "height": 480, "blocks": [ ...блоки... ] }
```

## Блоки

#### Текст
- `{ "type": "md", "text": "## Markdown\n**жирный**, *акцент*, `код`, [ссылка](https://…), списки, > цитаты, таблицы `| a | b |`, ```fenced code```, - [x] задачи" }`
- `{ "type": "code", "lang": "bash", "text": "./serve.sh" }`
- `{ "type": "alert", "tone": "info|ok|warn|err", "title": "…", "text": "…" }`
- `{ "type": "badges", "items": [ { "text": "ONLINE", "tone": "ok" } ] }`

#### Числа
- `{ "type": "kpi", "items": [ { "label": "Запросов", "value": "128", "delta": "+12%", "tone": "neg|flat" } ] }`
- `{ "type": "kv", "items": [ ["Ключ", "Значение"], ["Статус", "**ok**"] ] }`
- `{ "type": "progress", "items": [ { "label": "Готовность", "value": 68, "max": 100, "tone": "ok|warn|err", "text": "68 / 100" } ] }`

#### Таблица
```json
{ "type": "table", "title": "…", "sortBy": "price", "sortDir": "asc", "search": true, "maxHeight": 320,
  "columns": [ { "key": "name", "label": "Модель" },
               { "key": "price", "label": "Цена", "format": "money", "unit": "₽" },
               { "key": "perf", "label": "Perf", "format": "bar" },
               { "key": "delta", "label": "Δ", "format": "pct" },
               { "key": "state", "label": "Статус", "format": "badge", "tones": { "есть": "ok", "нет": "err" } } ],
  "rows": [ { "name": "RTX 5070", "price": 62990, "perf": 100, "delta": -4.1, "state": "есть" } ] }
```
Форматы колонок: `text` (по умолчанию), `num`, `money`, `pct`, `bar`, `badge`, `bool`, `md`. Строки можно передавать массивами в порядке колонок.

#### График
```json
{ "type": "chart", "kind": "bar|hbar|line|area|pie|donut|radar|heatmap|scatter",
  "title": "…", "subtitle": "…", "unit": "%", "height": 240, "stacked": false, "max": 100,
  "labels": ["Пн","Вт"], "series": [ { "name": "5xx", "data": [3, 7], "color": "#ff7a59" } ] }
```
- `heatmap`: `"rows": ["Пн",…]`, `"matrix": [[…],[…]]`, `"labels"` — колонки.
- `scatter`: `"series": [{ "name": "…", "points": [[x, y, "подпись", r]] }]`, опц. `"xunit"`.
- `donut`: опц. `"center": "92%"`, `"centerLabel": "SLA"`.
- Цвета по умолчанию: ice #70e4ff, amber #f5b942, ok #5cf2a5, warn #ff7a59, violet #c084fc.

#### Форма
```json
{ "type": "form", "title": "Уведомление", "submit": "Сохранить", "say": "Форма уведомления", "toast": "Сохранено",
  "fields": [ { "name": "model", "label": "Модель", "type": "select", "options": ["A", ["b", "Подпись B"]], "full": true },
              { "name": "price", "label": "Порог", "type": "number", "value": 60000, "help": "в рублях" },
              { "name": "ch", "label": "Канал", "type": "radio", "options": ["Telegram", "Push"], "value": "Push" },
              { "name": "vol", "label": "Громкость", "type": "range", "min": 0, "max": 100, "unit": "%" },
              { "name": "daily", "label": "Проверять ежедневно", "type": "checkbox", "value": true, "full": true },
              { "name": "note", "label": "Комментарий", "type": "textarea", "full": true } ] }
```
Типы полей: `text, number, email, url, password, date, time, textarea, select, radio, range, checkbox`. По submit значения отправляются в диалог как сообщение «say: k=v, …».

#### Списки и статусы
- `{ "type": "list", "items": [ { "title": "…", "sub": "…", "icon": "A", "badge": "P1", "tone": "err", "right": "12 мин" } ] }`
- `{ "type": "timeline", "items": [ { "time": "03:41", "title": "…", "sub": "…", "tone": "ok|warn|err|muted" } ] }`
- `{ "type": "steps", "items": [ { "title": "…", "sub": "…", "state": "done|active|todo" } ] }`
- `{ "type": "actions", "items": [ { "label": "Сохранить", "say": "фраза для JARVIS", "open": "schedule", "tone": "primary|ghost" } ] }`

#### Раскладка
- `{ "type": "columns", "widths": [2, 1], "cols": [ [блоки], [блоки] ] }`
- `{ "type": "card", "title": "…", "badge": "LIVE", "tone": "ok", "blocks": [ … ] }`
- `{ "type": "tabs", "tabs": [ { "label": "Обзор", "blocks": [ … ] }, { "label": "Детали", "blocks": [ … ] } ] }`
- `{ "type": "divider" }`
- `{ "type": "html", "html": "<div class='j-card'>…</div>" }` — сырой HTML с классами кита: `j-card j-h j-kpis j-kpi j-badge j-alert j-list j-item j-kv j-tl j-steps j-prog j-table j-md j-code j-actions btn`.

#### Медиа
- `{ "type": "image", "src": "https://…", "alt": "…", "caption": "…" }` — клик открывает лайтбокс. В `md` тоже работает `![alt](src)`.
- `{ "type": "gallery", "cols": 3, "items": [ { "src": "…", "thumb": "…", "caption": "…" }, "https://…" ] }`
- `{ "type": "youtube", "url": "https://youtu.be/ID или ID", "title": "…", "start": 42, "caption": "…" }` — превью, по клику плеер.
- `{ "type": "videos", "items": [ { "url": "…", "title": "…", "channel": "…", "duration": "12:04", "views": "1,2 млн", "date": "2025" } ] }` — сетка роликов, открываются в лайтбоксе.
- `{ "type": "video", "src": "https://….mp4", "poster": "…", "caption": "…", "loop": false, "muted": false }` — HTML5-видео.
- `{ "type": "audio", "src": "https://….mp3", "title": "…", "artist": "…", "cover": "…" }`
- `{ "type": "embed", "src": "https://www.openstreetmap.org/export/embed.html?bbox=…", "title": "…", "height": 300 }` — любой iframe: карты, Figma, CodePen, документы.
- `{ "type": "link", "url": "https://…", "title": "…", "desc": "…", "image": "…", "site": "habr.com" }` — карточка-превью ссылки.

## Правила
1. Один вопрос — одно окно, 3–8 блоков. Сверху вывод (`md`/`alert`/`kpi`), затем данные (`table`/`chart`), внизу действия (`form`/`actions`).
2. Числа — числами, не строками (кроме `kpi.value`). Даты и единицы — в `label`/`unit`.
3. Для сравнения — `table` + `hbar`; для динамики — `line`/`area`; для долей — `donut`; для расписаний — `timeline`/`heatmap`.
4. Если данных нет — `alert` с `tone: "warn"` и объяснением, без пустых таблиц.
</script>

(() => {
  // ───────────── utils ─────────────
  const $ = (s, r = document) => r.querySelector(s);
  const h = (tag, attrs = {}, ...kids) => {
    const e = document.createElement(tag);
    for (const [k, v] of Object.entries(attrs)) {
      if (v == null || v === false) continue;
      if (k === 'class') e.className = v;
      else if (k === 'html') e.innerHTML = v;
      else if (k.startsWith('on')) e.addEventListener(k.slice(2), v);
      else if (k === 'style') e.style.cssText = v;
      else e.setAttribute(k, v === true ? '' : v);
    }
    for (const k of kids.flat(Infinity)) if (k != null && k !== false) e.append(k);
    return e;
  };
  const uid = () => Math.random().toString(36).slice(2, 8);
  const pad = n => String(n).padStart(2, '0');
  const sleep = ms => new Promise(r => setTimeout(r, ms));
  const nowHM = () => { const d = new Date(); return `${pad(d.getHours())}:${pad(d.getMinutes())}`; };
  const stamp = () => { const d = new Date(); return `${pad(d.getHours())}:${pad(d.getMinutes())}:${pad(d.getSeconds())}`; };
  const store = {
    get(k, d) { try { const v = localStorage.getItem(k); return v ? JSON.parse(v) : d; } catch { return d; } },
    set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch {} },
    del(k) { try { localStorage.removeItem(k); } catch {} },
  };
  const desktop = $('#desktop');

  // ───────────── state ─────────────
  const DEF_SETTINGS = { wake: 'Джарвис', name: 'Perez', city: 'Москва', lang: 'ru-RU', voice: 'fable-neutral', volume: 70, rate: 1, autoListen: true, tts: true, endpoint: 'ws://127.0.0.1:8765' };
  let settings = Object.assign({}, DEF_SETTINGS, store.get('fable-settings', {}));
  let integrations = store.get('fable-integrations', { Calendar: true, Spotify: true, HomeKit: true, Terminal: true, Telegram: false, Weather: true });
  let events = store.get('fable-events', [
    { id: uid(), tm: '09:30', ti: 'Стендап команды', sb: 'Meet · 15 мин' },
    { id: uid(), tm: '14:00', ti: 'Ревью PR #482', sb: 'voice-pipeline → main' },
    { id: uid(), tm: '23:30', ti: 'Деплой MyJarvis', sb: 'прод · через serve.sh' },
  ]);
  let commands = store.get('fable-commands', [
    { id: uid(), lbl: 'Погода', say: 'Какая сейчас погода?', hint: '«Джарвис, что на улице?»' },
    { id: uid(), lbl: 'Расписание', say: 'Что у меня по расписанию?', hint: '«Джарвис, план на день»' },
    { id: uid(), lbl: 'Фокус-музыка', say: 'Включи музыку для работы', hint: '«Джарвис, включи фокус»' },
    { id: uid(), lbl: 'Таймер 25', say: 'Поставь таймер на 25 минут', hint: '«Джарвис, помидорка»' },
    { id: uid(), lbl: 'Dev-сервер', say: 'Открой терминал', hint: '«Джарвис, подними сервер»' },
    { id: uid(), lbl: 'Свет', say: 'Выключи свет в кабинете', hint: '«Джарвис, свет»' },
  ]);
  const chatLog = [{ role: 'ai', tag: 'СИСТЕМА · ЗАГРУЗКА', text: `Доброй ночи, ${settings.name}. Рабочее пространство развёрнуто. Окна можно двигать и добавлять через «+ Окно». Попробуйте: «сравни видеокарты», «проанализируй логи», «покажи бюджет» — я соберу окно с таблицами и графиками. Кнопка UI Kit покажет все компоненты.` }];
  const logs = [];
  let state = 'idle', busy = false;

  // ───────────── clock / telemetry ─────────────
  const bootTs = Date.now();
  setInterval(() => {
    const d = new Date();
    $('#clock').textContent = stamp();
    $('#date').textContent = d.toLocaleDateString('ru-RU', { weekday: 'short', day: 'numeric', month: 'long' });
    document.querySelectorAll('.wclock .tm').forEach(e => e.textContent = stamp());
    document.querySelectorAll('.wclock .dt').forEach(e => e.textContent = d.toLocaleDateString('ru-RU', { weekday: 'long', day: 'numeric', month: 'long', year: 'numeric' }));
    const up = $('#uptime'); if (up) { const s = Math.floor((Date.now() - bootTs) / 1000); up.textContent = `up ${pad(Math.floor(s / 60))}:${pad(s % 60)}`; }
    checkReminders();
  }, 1000);
  let cpu = 21, ram = 9.4;
  setInterval(() => {
    cpu = Math.max(6, Math.min(92, cpu + (Math.random() - .5) * 10 + (state === 'thinking' ? 8 : 0)));
    ram = Math.max(6, Math.min(15.2, ram + (Math.random() - .5) * .3));
    const set = (id, v) => { const e = $(id); if (e) e.textContent = v; };
    const w = (id, v) => { const e = $(id); if (e) e.style.width = v; };
    set('#cpu-v', `${Math.round(cpu)}%`); w('#cpu-b', `${cpu}%`);
    set('#ram-v', `${ram.toFixed(1)} / 16 ГБ`); w('#ram-b', `${ram / 16 * 100}%`);
    set('#lat', `${Math.round(30 + Math.random() * 20)} мс`);

  // ───────────── toast / log ─────────────
  function toast(text, cls = '') {
    const t = h('div', { class: 'toast ' + cls }, text);

    requestAnimationFrame(() => t.classList.add('show'));
    setTimeout(() => { t.classList.remove('show'); setTimeout(() => t.remove(), 300); }, 3400);

  function log(text, cls = '') {
    const row = { ts: stamp(), text, cls };

    const c = $('#log-count'); if (c) c.textContent = logs.length;
  }
  const logRow = r => h('div', {}, h('span', { class: 'ts' }, r.ts), h('span', { class: r.cls }, r.text));

  const dlg = $('#dlg');
  function openDialog(build, cls = '') {
    return new Promise(res => {
      dlg.innerHTML = ''; dlg.className = cls;
      let done = false;
      const close = v => { if (done) return; done = true; dlg.close(); dlg.innerHTML = ''; dlg.className = ''; res(v); };
      build(dlg, close);
      dlg.oncancel = e => { e.preventDefault(); close(null); };
      dlg.onclick = e => { if (e.target === dlg) close(null); };
      dlg.showModal();
    });
  }
  function fieldEl(f) {
    const id = 'f_' + f.name;
    let input;
    if (f.type === 'textarea') { input = h('textarea', { name: f.name, id, rows: f.rows || 3, placeholder: f.placeholder || '' }); input.value = f.value || ''; }
    else if (f.type === 'select') { input = h('select', { name: f.name, id }, f.options.map(o => { const [v, l] = Array.isArray(o) ? o : [o, o]; const op = h('option', { value: v }, l); if (v == f.value) op.selected = true; return op; })); }
    else if (f.type === 'range') {
      input = h('input', { type: 'range', name: f.name, id, min: f.min ?? 0, max: f.max ?? 100, step: f.step ?? 1 }); input.value = f.value ?? 50;

  // ── markdown ──
  function inlineMd(s) {

      .replace(/!\[([^\]]*)\]\(([^)\s]+)\)/g, '<img src="$2" alt="$1" loading="lazy">')

        out += `<table><thead><tr>${head.map((c, k) => `<th style="text-align:${al[k] || 'left'}">${inlineMd(c)}</th>`).join('')}</tr></thead><tbody>${rows}</tbody></table>`; continue;
      }

      }
      if (!l.trim()) { flush(); i++; continue; }

  }

  const LABELS = () => ({ idle: `Ожидание · скажите «${settings.wake}»`, listening: 'Слушаю…', thinking: 'Обрабатываю запрос', speaking: 'Отвечаю' });
  function setState(s) { state = s; core.dataset.state = s; stateText.textContent = LABELS()[s]; document.querySelectorAll('.btn.mic').forEach(b => b.classList.toggle('on', s === 'listening')); }

  const OPEN_MAP = [[/галере|компонент|ui kit|кит(\s|$)/i, 'kit'], [/песочниц|playground/i, 'playground'], [/справочник|dsl|спецификац/i, 'spec'], [/погод/i, 'weather'], [/расписан|календар|план на день/i, 'schedule'], [/журнал|(^|\s)лог/i, 'log'], [/терминал|консол|сервер/i, 'terminal'], [/заметк/i, 'notes'], [/систем|телеметр/i, 'system'], [/команд/i, 'commands'], [/интеграц/i, 'integrations'], [/диалог|чат/i, 'chat']];
  const ANSWERS = [
    [/погод|улиц|холодно|тепло/i, () => `Сейчас в городе ${settings.city} +9°, ясно. К утру похолодает до +4°, возьмите куртку.`],
    [/расписан|план|дела|встреч/i, () => { const n = nowHM(); const next = [...events].sort((a, b) => a.tm.localeCompare(b.tm)).find(e => e.tm >= n); WM.open('schedule'); return next ? `Ближайшее событие: ${next.ti} в ${next.tm}. Всего в расписании ${events.length}.` : 'На сегодня событий больше нет.'; }],
    [/музык|фокус/i, () => 'Включаю плейлист «Deep Focus» в Spotify, громкость 35%.'],
    [/таймер|помидор/i, () => 'Таймер на 25 минут запущен. Сообщу, когда истечёт.'],
    [/привет|здравств|как дела/i, () => `Привет, ${settings.name}. Работаю штатно, задержка 38 миллисекунд.`],
    [/кто ты|что ты|ядро|модель/i, () => 'Я JARVIS на ядре Claude Fable 5.1 — голосовой ассистент с оконным рабочим пространством.'],
    [/спасибо/i, () => 'Всегда пожалуйста.'],
  ];
  const FALLBACK = ['Принято. Записал в задачи и вернусь с результатом.', 'Понял. Уточните — это срочно или можно отложить до утра?', 'Сделано. Что-нибудь ещё?'];

  async function answer(q) {
    // данные формы из окна: «Название: k=v, k=v»
    if (/^[^:]{1,60}: [\w]+=/.test(q)) { const [name, rest] = q.split(/:\s(.+)/); const n = rest.split(', ').length; return `Принял «${name}» — ${n} ${n === 1 ? 'поле' : n < 5 ? 'поля' : 'полей'}. Записал в журнал и учту в следующих ответах.`; }
    if (/^(открой|покажи|запусти|выведи)(\s|$)/i.test(q)) {
      if (/дашборд|панел/i.test(q)) { const w = await newDashboard(); return w ? `Создал дашборд «${w.title}». Добавляйте виджеты кнопкой внутри.` : 'Отменил создание дашборда.'; }
      if (/настройк/i.test(q)) { openSettings(); return 'Открыл настройки.'; }
      for (const [re, t] of OPEN_MAP) if (re.test(q)) { WM.open(t); return `Открыл окно «${TYPES[t].title}».`; }
    }
    if (/галере|компонент|ui kit/i.test(q)) { WM.open('kit'); return 'Открыл галерею компонентов: markdown, таблицы, 9 видов графиков, формы, карточки, статусы, раскладка.'; }
    if (/песочниц|playground/i.test(q)) { WM.open('playground'); return 'Открыл песочницу: слева JSON-спека, справа живой рендер.'; }
    if (/справочник|dsl|спецификац|как.*(рисовать|верстать)/i.test(q)) { WM.open('spec'); return 'Открыл справочник DSL — его можно вставить в системный промпт модели.'; }
    if (/сохрани/i.test(q) && /заметк/i.test(q)) { const last = [...chatLog].reverse().find(m => m.role === 'ai'); WM.open('notes', { title: 'Из диалога · ' + nowHM(), data: { text: (last?.text || q) } }); return 'Сохранил в новую заметку.'; }
    if (/^закрой (всё|все)/i.test(q)) { [...WM.list].filter(w => w.type !== 'chat').forEach(w => WM.close(w)); return 'Закрыл все окна, кроме диалога.'; }
    if (/^сверни/i.test(q)) { WM.list.forEach(w => WM.minimize(w, true)); return 'Свернул окна.'; }
    if (/разлож|упоряд/i.test(q)) { WM.tile(); return 'Разложил окна плиткой.'; }
    if (/напомни|напоминан/i.test(q)) { const text = q.replace(/^.*?напомни(ть)?\s*(мне)?\s*/i, '').trim(); const ev = await newReminder(text); return ev ? `Напомню в ${ev.tm}: ${ev.ti}.` : 'Напоминание отменено.'; }
    if (/свет/i.test(q)) { const ok = await confirmDialog({ title: 'Умный дом', text: 'Выключить свет в кабинете? Подсветку стола оставлю на 20%.', ok: 'Выключить' }); return ok ? 'Свет в кабинете выключен. Подсветка стола — 20%.' : 'Хорошо, свет оставляю.'; }
    if (/настройк/i.test(q)) { openSettings(); return 'Открыл настройки.'; }
    // сценарии «агент нашёл данные → построил окно»
    for (const d of Object.values(DEMOS)) if (d.re.test(q)) { await sleep(400); openView(d.spec()); return d.say; }
    for (const [re, a] of ANSWERS) if (re.test(q)) return a();
    return FALLBACK[Math.floor(Math.random() * FALLBACK.length)];
  }
  async function respond(text) {
    setState('speaking'); log('tts: синтез ответа', 'ok');
    const m = addMsg('ai', '', 'JARVIS · FABLE 5.1'); await typeInto(m, text);
    await sleep(200); setState('idle');
  }
  async function handle(q) {
    q = (q || '').trim(); if (busy || !q) return;
    busy = true; WM.open('chat');
    addMsg('me', q, 'ВЫ · ' + nowHM());
    log(`stt: «${q.slice(0, 32)}${q.length > 32 ? '…' : ''}»`);
    setState('thinking'); log('llm: запрос → Fable 5.1', 'am');
    const [a] = await Promise.all([answer(q), sleep(500 + Math.random() * 500)]);
    await respond(a); log('session: готов', 'ok');
    busy = false;
  }
  const PHRASES = ['Какая сейчас погода?', 'Сравни видеокарты', 'Проанализируй логи за ночь', 'Покажи бюджет за октябрь', 'Статус проекта', 'Прогноз на неделю', 'Покажи видео', 'Открой терминал', 'Покажи дашборд', 'Напомни позвонить маме', 'Выключи свет в кабинете'];
  let listenTimer = null;
  function startListening() {
    if (busy) return;
    if (state === 'listening') { clearTimeout(listenTimer); setState('idle'); log('vad: тишина'); return; }
    setState('listening'); log('vad: речь обнаружена', 'am');
    listenTimer = setTimeout(() => handle(PHRASES[Math.floor(Math.random() * PHRASES.length)]), 2200);
  }
  core.addEventListener('click', startListening);
  core.addEventListener('keydown', e => { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); startListening(); } });

  // ───────────── palette / menu / help ─────────────
  const palette = $('#palette'), palQ = $('#pal-q'), palList = $('#pal-list');
  const actions = () => [
    ...Object.entries(TYPES).filter(([, t]) => !t.hidden).map(([k, t]) => ({ k: 'окно', label: t.title, run: () => WM.open(k) })),
    { k: 'окно', label: 'Новый дашборд', run: newDashboard },
    ...Object.values(DEMOS).map(d => ({ k: 'пример', label: `Пример: ${d.label}`, run: () => openView(d.spec()) })),
    { k: 'диалог', label: 'Настройки JARVIS', run: openSettings },
    { k: 'диалог', label: 'Новое напоминание', run: () => newReminder() },
    { k: 'окна', label: 'Разложить окна плиткой', run: () => WM.tile() },
    { k: 'окна', label: 'Свернуть все окна', run: () => WM.list.forEach(w => WM.minimize(w, true)) },
    { k: 'окна', label: 'Показать все окна', run: () => WM.list.forEach(w => WM.minimize(w, false)) },
    { k: 'опасно', label: 'Сбросить раскладку и данные', run: resetLayout },
    ...PHRASES.map(p => ({ k: 'голос', label: `Сказать: «${p}»`, run: () => handle(p) })),
  ];
  let palSel = 0;
  function renderPal() {
    const q = palQ.value.toLowerCase().trim();
    const items = actions().filter(a => !q || a.label.toLowerCase().includes(q) || a.k.includes(q));
    if (q && !items.some(a => a.k === 'голос' && a.label.toLowerCase().includes(q))) items.push({ k: 'голос', label: `Сказать JARVIS: «${palQ.value.trim()}»`, run: () => handle(palQ.value.trim()) });
    palSel = Math.min(palSel, items.length - 1);
    palList.innerHTML = '';
    items.forEach((a, i) => palList.append(h('button', { class: 'pal-i' + (i === palSel ? ' sel' : ''), onclick: () => { palette.close(); a.run(); } }, h('span', { class: 'k' }, a.k), a.label)));
    palList.querySelector('.sel')?.scrollIntoView({ block: 'nearest' });
    return items;
  }
  function openPalette() { palQ.value = ''; palSel = 0; renderPal(); palette.showModal(); palQ.focus(); }
  palQ.addEventListener('input', () => { palSel = 0; renderPal(); });
  palQ.addEventListener('keydown', e => {
    const items = renderPal();
    if (e.key === 'ArrowDown') { e.preventDefault(); palSel = (palSel + 1) % items.length; renderPal(); }
    else if (e.key === 'ArrowUp') { e.preventDefault(); palSel = (palSel - 1 + items.length) % items.length; renderPal(); }
    else if (e.key === 'Enter') { e.preventDefault(); palette.close(); items[palSel]?.run(); }
  });
  palette.addEventListener('click', e => { if (e.target === palette) palette.close(); });

  const ctx = $('#ctx');
  function showMenu(x, y) {
    ctx.innerHTML = '';
    const items = [
      ...Object.entries(TYPES).filter(([, t]) => !t.hidden).map(([k, t]) => ({ l: t.title, s: t.single ? 'одно' : 'новое', run: () => WM.open(k) })),
      { sep: true }, { l: 'Новый дашборд…', s: 'сетка', run: newDashboard }, { l: 'Новое напоминание…', s: 'диалог', run: () => newReminder() },
      { sep: true }, ...Object.values(DEMOS).map(d => ({ l: d.label, s: 'пример', run: () => openView(d.spec()) })),
      { sep: true }, { l: 'Разложить окна', run: () => WM.tile() }, { l: 'Свернуть все', run: () => WM.list.forEach(w => WM.minimize(w, true)) },
    ];
    items.forEach(it => ctx.append(it.sep ? h('hr') : h('button', { class: 'ctx-i', onclick: () => { hideMenu(); it.run(); } }, it.l, it.s ? h('small', {}, it.s) : null)));
    ctx.hidden = false;
    ctx.style.left = Math.min(x, innerWidth - ctx.offsetWidth - 8) + 'px';
    ctx.style.top = Math.min(y, innerHeight - ctx.offsetHeight - 8) + 'px';
  }
  const hideMenu = () => ctx.hidden = true;
  desktop.addEventListener('contextmenu', e => { if (e.target.closest('.win')) return; e.preventDefault(); showMenu(e.clientX, e.clientY); });
  desktop.addEventListener('pointerdown', e => { if (!e.target.closest('.win')) { WM.active = null; WM.list.forEach(w => w.dom.classList.remove('active')); WM.dock(); } });
  window.addEventListener('pointerdown', e => { if (!e.target.closest('#ctx')) hideMenu(); }, true);
  $('#btn-win').addEventListener('click', e => { const r = e.currentTarget.getBoundingClientRect(); ctx.hidden ? showMenu(r.left, r.bottom + 6) : hideMenu(); });
  $('#btn-pal').addEventListener('click', openPalette);
  $('#btn-kit').addEventListener('click', () => WM.open('kit'));
  $('#btn-settings').addEventListener('click', openSettings);
  $('#btn-help').addEventListener('click', () => infoDialog('Как пользоваться', h('div', { class: 'help-list' },
    h('div', {}, h('kbd', {}, 'ПКМ'), 'по рабочему столу — меню окон; то же в кнопке «+ Окно»'),
    h('div', {}, h('kbd', {}, 'Drag'), 'заголовок — переместить; уголок справа внизу — размер'),
    h('div', {}, h('kbd', {}, 'Dbl-click'), 'заголовок — развернуть/вернуть'),
    h('div', {}, h('kbd', {}, '⌘K'), 'командная палитра: окна, настройки, фразы для ядра'),
    h('div', {}, h('kbd', {}, 'Пробел'), 'или клик по ядру — начать слушать'),
    h('div', {}, h('kbd', {}, 'Голос'), '«открой погоду», «покажи дашборд», «напомни…», «разложи окна»'),
    h('div', {}, h('kbd', {}, 'Агент'), '«сравни видеокарты», «проанализируй логи», «бюджет», «статус проекта» — окно с таблицами/графиками'),
    h('div', {}, h('kbd', {}, 'UI Kit'), 'галерея компонентов · Песочница (JSON → окно) · Справочник DSL для системного промпта'),
    h('div', {}, h('kbd', {}, 'Dock'), 'внизу — список окон; клик сворачивает/возвращает'),
    h('div', { style: 'color:var(--muted);font-size:12px;margin-top:8px' }, 'Раскладка, заметки, дашборды, команды и напоминания сохраняются в localStorage.'),
  )));
  async function resetLayout() {
    if (!await confirmDialog({ title: 'Сбросить всё?', text: 'Будут удалены раскладка окон, дашборды, заметки, пользовательские команды и напоминания.', ok: 'Сбросить', danger: true })) return;
    ['fable-layout', 'fable-settings', 'fable-events', 'fable-commands', 'fable-integrations'].forEach(store.del);
    location.reload();
  }
  window.addEventListener('keydown', e => {
    if ((e.metaKey || e.ctrlKey) && e.key.toLowerCase() === 'k') { e.preventDefault(); palette.open ? palette.close() : openPalette(); }
    if (e.code === 'Space' && document.activeElement === document.body && !dlg.open && !palette.open) { e.preventDefault(); startListening(); }
    if (e.key === 'Escape') hideMenu();
  });

  // ───────────── viz canvas ─────────────
  const cv = $('#viz'), cx2 = cv.getContext('2d');
  let W = 0, H = 0, t = 0;
  function resize() { const r = desktop.getBoundingClientRect(); const dpr = Math.min(2, devicePixelRatio || 1); cv.width = r.width * dpr; cv.height = r.height * dpr; W = r.width; H = r.height; cx2.setTransform(dpr, 0, 0, dpr, 0, 0); }
  resize(); addEventListener('resize', resize);
  const ENERGY = { idle: .18, listening: .75, thinking: .45, speaking: 1 };
  let energy = .18, frame = 0;
  (function draw() {
    requestAnimationFrame(draw); t += .016; energy += (ENERGY[state] - energy) * .06;
    cx2.clearRect(0, 0, W, H);
    const hr = $('.hero .core').getBoundingClientRect(), dr = desktop.getBoundingClientRect();
    const cx = hr.left - dr.left + hr.width / 2, cy = hr.top - dr.top + hr.height / 2, base = hr.width / 2 + 14;
    const col = state === 'thinking' ? '245,185,66' : '112,228,255';
    for (let i = 0; i < 96; i++) {
      const a = i / 96 * Math.PI * 2, n = Math.sin(t * 3 + i * .5) * .5 + Math.sin(t * 7 + i * 1.3) * .3 + Math.sin(t * 1.3 + i * .2) * .2;
      const len = 6 + Math.abs(n) * 40 * energy;
      cx2.strokeStyle = `rgba(${col},${.2 + .5 * energy})`; cx2.lineWidth = 2; cx2.beginPath();
      cx2.moveTo(cx + Math.cos(a) * base, cy + Math.sin(a) * base); cx2.lineTo(cx + Math.cos(a) * (base + len), cy + Math.sin(a) * (base + len)); cx2.stroke();
    }
    cx2.beginPath();
    for (let x = 0; x <= W; x += 3) { const k = (x - cx) / W, env = Math.exp(-Math.pow(k * 3.2, 2)); const y = cy + Math.sin(x * .045 + t * 6) * 22 * env * energy + Math.sin(x * .11 - t * 9) * 8 * env * energy; x === 0 ? cx2.moveTo(x, y) : cx2.lineTo(x, y); }
    cx2.strokeStyle = `rgba(112,228,255,${.08 + .25 * energy})`; cx2.lineWidth = 1.5; cx2.stroke();
    if (++frame % 6 === 0) { const lvl = Math.round(8 + energy * 70 + Math.random() * 6); const b = $('#mic-b'), v = $('#mic-v'); if (b) b.style.width = lvl + '%'; if (v) v.textContent = `${Math.round(-60 + lvl * .6)} дБ`; }
  })();

  // ───────────── boot ─────────────
  log('core: Fable 5.1 загружено', 'ok'); log('audio: вход 48 kHz / 16 bit', 'ok'); log(`wake-word: «${settings.wake}» активно`, 'am'); log('wm: оконный менеджер готов');
  applySettings(); setState('idle'); WM.load();
})();
</script>
</body>
</html>
