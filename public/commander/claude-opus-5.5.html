<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>J.A.R.V.I.S.</title>
<script src="https://cdn.jsdelivr.net/npm/marked@12.0.2/marked.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/dompurify@3.1.6/dist/purify.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.4/dist/chart.umd.js"></script>
<style>
  :root {
    --cyan: #00e5ff;
    --cyan-mid: rgba(0, 229, 255, 0.5);
    --cyan-dim: rgba(0, 229, 255, 0.25);
    --cyan-faint: rgba(0, 229, 255, 0.08);
    --orange: #ffb547;
    --red: #ff5470;
    --bg: #02070d;
    --text: #bfefff;
    --top: 56px;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; }
  body {
    background: radial-gradient(ellipse at center, #06202e 0%, var(--bg) 70%);
    color: var(--text);
    font-family: "SF Mono", "Menlo", "Consolas", monospace;
    overflow: hidden;
  }
  body::before {
    content: ""; position: fixed; inset: 0; pointer-events: none;
    background-image:
      linear-gradient(var(--cyan-faint) 1px, transparent 1px),
      linear-gradient(90deg, var(--cyan-faint) 1px, transparent 1px);
    background-size: 40px 40px;
    mask-image: radial-gradient(ellipse at center, #000 30%, transparent 80%);
  }
  button, input, textarea, select { font: inherit; color: inherit; }
  button { cursor: pointer; }
  [hidden] { display: none !important; }

  .btn {
    background: var(--cyan-faint); border: 1px solid var(--cyan-dim); color: var(--cyan);
    padding: 6px 12px; font-size: 11px; letter-spacing: 2px; transition: all .15s;
  }
  .btn:hover { background: rgba(0,229,255,.18); border-color: var(--cyan); box-shadow: 0 0 10px var(--cyan-dim); }
  .field {
    background: rgba(0,0,0,.35); border: 1px solid var(--cyan-dim); outline: none;
    padding: 8px 10px; font-size: 13px; width: 100%;
  }
  .field:focus { border-color: var(--cyan); box-shadow: 0 0 8px var(--cyan-dim); }

  /* ---------- Top bar ---------- */
  .topbar {
    position: fixed; top: 0; left: 0; right: 0; height: var(--top); z-index: 10000;
    display: flex; align-items: center; gap: 12px; padding: 0 20px;
    border-bottom: 1px solid var(--cyan-dim); background: rgba(2,12,20,.85); backdrop-filter: blur(6px);
  }
  .logo { font-size: 18px; letter-spacing: 8px; color: var(--cyan); text-shadow: 0 0 12px var(--cyan); margin-right: 16px; }
  .topbar .spacer { flex: 1; }
  .topbar select.field { width: auto; padding: 5px 8px; font-size: 11px; letter-spacing: 1px; }
  .clock { text-align: right; font-size: 16px; letter-spacing: 3px; }
  .clock small { display: block; font-size: 9px; opacity: .6; letter-spacing: 2px; }

  /* ---------- Dock ---------- */
  .dock {
    position: fixed; left: 0; top: var(--top); bottom: 0; width: 56px; z-index: 10000;
    display: flex; flex-direction: column; align-items: center; gap: 6px; padding: 12px 0;
    border-right: 1px solid var(--cyan-dim); background: rgba(2,12,20,.7);
    overflow-y: auto; scrollbar-width: none;
  }
  .dock-btn {
    position: relative; width: 40px; height: 40px; flex-shrink: 0;
    background: transparent; border: 1px solid transparent; color: var(--cyan-mid); font-size: 17px;
  }
  .dock-btn:hover { border-color: var(--cyan-dim); color: var(--cyan); background: var(--cyan-faint); }
  .dock-btn.on { color: var(--cyan); border-color: var(--cyan-dim); text-shadow: 0 0 8px var(--cyan); }
  .dock-btn.on::before, .dock-btn.min::before {
    content: ""; position: absolute; left: -9px; top: 10px; bottom: 10px; width: 3px; background: var(--cyan);
  }
  .dock-btn.min::before { background: var(--orange); }
  .dock-btn::after {
    content: attr(data-label); position: absolute; left: 50px; top: 50%; transform: translateY(-50%);
    white-space: nowrap; font-size: 10px; letter-spacing: 2px; padding: 5px 8px;
    background: rgba(2,18,28,.95); border: 1px solid var(--cyan-dim); color: var(--cyan);
    opacity: 0; pointer-events: none; transition: opacity .15s;
  }
  .dock-btn:hover::after { opacity: 1; }
  .dock hr { width: 28px; border: none; border-top: 1px solid var(--cyan-dim); margin: 4px 0; }
  .dock .add { color: var(--orange); font-size: 22px; }

  /* ---------- Core (background) ---------- */
  .core-wrap {
    position: fixed; left: 56px; right: 0; top: var(--top); bottom: 110px;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    pointer-events: none; z-index: 1;
  }
  .core { position: relative; width: min(42vh, 380px); aspect-ratio: 1; }
  .ring { position: absolute; border-radius: 50%; border: 2px solid var(--cyan-dim); }
  .r1 { inset: 0; border-style: dashed; animation: spin 40s linear infinite; }
  .r2 { inset: 6%; border-width: 6px; border-color: transparent var(--cyan) transparent var(--cyan); animation: spin 12s linear infinite reverse; filter: drop-shadow(0 0 6px var(--cyan)); }
  .r3 { inset: 14%; border: 1px solid var(--cyan); border-left-color: transparent; animation: spin 6s linear infinite; }
  .r4 { inset: 22%; border: 10px dotted var(--cyan-dim); animation: spin 25s linear infinite; }
  .r5 { inset: 32%; border: 2px solid var(--cyan); box-shadow: 0 0 20px var(--cyan), inset 0 0 20px var(--cyan); }
  .nucleus {
    position: absolute; inset: 38%; border-radius: 50%;
    background: radial-gradient(circle, #fff 0%, #9ff8ff 25%, var(--cyan) 55%, transparent 72%);
    box-shadow: 0 0 60px var(--cyan), 0 0 120px var(--cyan-dim);
    animation: pulse 3s ease-in-out infinite;
  }
  .core.listening .r2 { animation-duration: 3s; border-color: transparent var(--orange) transparent var(--orange); filter: drop-shadow(0 0 8px var(--orange)); }
  .core.thinking .r3 { animation-duration: 1s; }
  .core.speaking .nucleus { animation-duration: .6s; }
  @keyframes spin { to { transform: rotate(360deg); } }
  @keyframes pulse { 50% { opacity: .75; transform: scale(.94); } }
  .status-text { margin-top: 24px; font-size: 12px; letter-spacing: 6px; color: var(--cyan); text-shadow: 0 0 8px var(--cyan); }
  .last-reply { margin-top: 10px; font-size: 14px; max-width: 520px; text-align: center; opacity: .85; min-height: 20px; }

  /* ---------- Windows ---------- */
  .desktop { position: fixed; inset: 0; z-index: 2; pointer-events: none; }
  .win {
    position: absolute; pointer-events: auto;
    min-width: 220px; min-height: 140px; display: flex; flex-direction: column;
    background: rgba(2,18,28,.85); border: 1px solid var(--cyan-dim);
    backdrop-filter: blur(8px); box-shadow: 0 10px 40px rgba(0,0,0,.5);
    resize: both; overflow: hidden; animation: winIn .18s ease-out;
  }
  .win.focused { border-color: var(--cyan-mid); box-shadow: 0 0 25px rgba(0,229,255,.15), 0 10px 40px rgba(0,0,0,.6); }
  .win.max { left: 68px !important; top: calc(var(--top) + 12px) !important; width: calc(100vw - 80px) !important; height: calc(100vh - var(--top) - 130px) !important; resize: none; }
  .win::before, .win::after {
    content: ""; position: absolute; width: 12px; height: 12px; pointer-events: none; border: 2px solid var(--cyan);
  }
  .win::before { top: -1px; left: -1px; border-right: none; border-bottom: none; }
  .win::after { bottom: -1px; right: -1px; border-left: none; border-top: none; }
  @keyframes winIn { from { opacity: 0; transform: scale(.96); } }
  .win-head {
    display: flex; align-items: center; gap: 8px; padding: 8px 8px 8px 12px; flex-shrink: 0;
    border-bottom: 1px solid var(--cyan-dim); cursor: move; user-select: none;
    font-size: 11px; letter-spacing: 3px; color: var(--cyan);
    background: linear-gradient(90deg, rgba(0,229,255,.12), transparent);
  }
  .win-title { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .win-head button {
    width: 22px; height: 22px; background: transparent; border: 1px solid transparent;
    color: var(--cyan-mid); font-size: 11px; line-height: 1;
  }
  .win-head button:hover { border-color: var(--cyan-dim); color: var(--cyan); }
  .win-head button[data-a=close]:hover, .win-head button[data-a=del]:hover { color: var(--red); border-color: var(--red); }
  .win-body { flex: 1; min-height: 0; overflow: auto; padding: 12px; font-size: 13px; line-height: 1.5; }
  .win-body.flush { padding: 0; display: flex; flex-direction: column; }
  .win-body::-webkit-scrollbar, .messages::-webkit-scrollbar { width: 4px; }
  .win-body::-webkit-scrollbar-thumb, .messages::-webkit-scrollbar-thumb { background: var(--cyan-dim); }

  /* Chat */
  .messages { flex: 1; overflow-y: auto; padding: 12px; display: flex; flex-direction: column; gap: 10px; }
  .msg { padding: 8px 10px; border-left: 2px solid var(--cyan); background: var(--cyan-faint); max-width: 90%; animation: winIn .2s; }
  .msg.user { border-left: none; border-right: 2px solid var(--orange); background: rgba(255,181,71,.07); align-self: flex-end; text-align: right; white-space: pre-wrap; }
  .msg.wide { max-width: 100%; width: 100%; }
  .msg b { display: block; font-size: 9px; letter-spacing: 2px; opacity: .55; margin-bottom: 2px; font-weight: normal; }
  .mini-input { display: flex; gap: 6px; padding: 8px; border-top: 1px solid var(--cyan-dim); flex-shrink: 0; }
  .mini-input.top { border-top: none; border-bottom: 1px solid var(--cyan-dim); padding: 0 0 10px; margin-bottom: 10px; }

  /* System */
  .stat { margin-bottom: 14px; }
  .stat label { font-size: 10px; letter-spacing: 2px; opacity: .7; display: flex; justify-content: space-between; }
  .bar { height: 6px; background: var(--cyan-faint); margin-top: 6px; position: relative; overflow: hidden; }
  .bar i { position: absolute; inset: 0 auto 0 0; background: linear-gradient(90deg, var(--cyan), #7ff6ff); box-shadow: 0 0 8px var(--cyan); transition: width .8s; }
  .module { display: flex; justify-content: space-between; padding: 6px 8px; margin-bottom: 6px; font-size: 11px; border-left: 2px solid var(--cyan); background: var(--cyan-faint); }
  .module span:last-child { color: var(--cyan); }
  .module.off { border-color: var(--orange); }
  .module.off span:last-child { color: var(--orange); }

  /* Notes */
  .notes { width: 100%; height: 100%; resize: none; background: transparent; border: none; outline: none; padding: 12px; font-size: 13px; line-height: 1.6; }

  /* Todo */
  .todo { list-style: none; }
  .todo li { display: flex; align-items: center; gap: 8px; padding: 6px 4px; border-bottom: 1px solid var(--cyan-faint); }
  .todo li.done span { text-decoration: line-through; opacity: .45; }
  .todo span { flex: 1; }
  .todo input { accent-color: var(--cyan); }
  .todo button { background: none; border: none; color: var(--cyan-mid); }
  .todo button:hover { color: var(--red); }
  .empty { opacity: .45; font-size: 12px; text-align: center; padding: 16px; }

  /* Weather */
  .wx-now { display: flex; align-items: center; gap: 16px; margin-bottom: 14px; }
  .wx-temp { font-size: 44px; color: var(--cyan); text-shadow: 0 0 12px var(--cyan); }
  .wx-days { display: grid; grid-template-columns: repeat(5, 1fr); gap: 6px; text-align: center; font-size: 11px; }
  .wx-days div { padding: 8px 0; background: var(--cyan-faint); }
  .wx-days b { display: block; font-size: 16px; margin: 4px 0; font-weight: normal; }

  /* Calendar */
  .cal-head { display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; letter-spacing: 2px; font-size: 12px; }
  .cal { display: grid; grid-template-columns: repeat(7, 1fr); gap: 4px; text-align: center; font-size: 12px; }
  .cal .dow { opacity: .5; font-size: 10px; }
  .cal .day { padding: 6px 0; background: var(--cyan-faint); }
  .cal .today { background: var(--cyan); color: var(--bg); box-shadow: 0 0 10px var(--cyan); }

  /* Timer */
  .timer-display { font-size: 48px; text-align: center; color: var(--cyan); text-shadow: 0 0 14px var(--cyan); letter-spacing: 4px; margin: 6px 0 12px; }
  .row { display: flex; gap: 6px; flex-wrap: wrap; justify-content: center; margin-top: 10px; }

  /* Web */
  .web-frame { flex: 1; border: none; background: #fff; width: 100%; }
  .web-bar { display: flex; gap: 6px; padding: 8px; border-bottom: 1px solid var(--cyan-dim); }

  /* Custom */
  .custom-text { outline: none; min-height: 100%; white-space: pre-wrap; }
  .custom-text:empty::before { content: "Нажмите и пишите..."; opacity: .4; }

  /* ---------- Command bar ---------- */
  .cmd-zone {
    position: fixed; left: 56px; right: 0; bottom: 0; height: 110px; z-index: 9999;
    display: flex; flex-direction: column; align-items: center; justify-content: flex-end; padding-bottom: 18px;
    pointer-events: none;
  }
  #wave { width: min(760px, 90%); height: 28px; }
  .cmdbar {
    pointer-events: auto; width: min(760px, 90%); display: flex; align-items: center; gap: 10px;
    padding: 8px 8px 8px 8px; border: 1px solid var(--cyan-mid);
    background: rgba(2,18,28,.92); box-shadow: 0 0 30px rgba(0,229,255,.15);
  }
  .cmdbar input { flex: 1; background: transparent; border: none; outline: none; font-size: 15px; padding: 6px 4px; }
  .cmdbar input::placeholder { color: rgba(191,239,255,.4); }
  .mic {
    width: 44px; height: 44px; border-radius: 50%; flex-shrink: 0; display: grid; place-items: center;
    border: 2px solid var(--cyan); background: radial-gradient(circle, rgba(0,229,255,.2), transparent 70%); color: var(--cyan);
    transition: all .2s;
  }
  .mic:hover { box-shadow: 0 0 18px var(--cyan); }
  .mic.active { border-color: var(--orange); color: var(--orange); box-shadow: 0 0 24px var(--orange); animation: micPulse 1.2s infinite; }
  @keyframes micPulse { 50% { box-shadow: 0 0 6px var(--orange); } }
  .mic svg { width: 20px; height: 20px; }
  kbd { font-size: 10px; opacity: .5; border: 1px solid var(--cyan-dim); padding: 2px 5px; }

  /* ---------- Modal ---------- */
  .modal { position: fixed; inset: 0; z-index: 20000; background: rgba(0,5,10,.7); display: grid; place-items: center; backdrop-filter: blur(3px); }
  .dialog { width: min(440px, 92vw); background: rgba(2,18,28,.97); border: 1px solid var(--cyan-mid); padding: 20px; display: flex; flex-direction: column; gap: 12px; position: relative; animation: winIn .2s; }
  .dialog h3 { font-size: 12px; letter-spacing: 4px; color: var(--cyan); font-weight: normal; }
  .dialog label { font-size: 10px; letter-spacing: 2px; opacity: .8; display: flex; flex-direction: column; gap: 6px; }
  .dialog textarea { min-height: 90px; resize: vertical; }
  .dialog .row { justify-content: flex-end; }

  .help { font-size: 12px; }
  .help code { color: var(--orange); }
  .help li { margin: 4px 0 4px 16px; }
  .help h4 { font-size: 10px; letter-spacing: 2px; color: var(--cyan); margin: 10px 0 4px; font-weight: normal; }

  /* ---------- Rich content (markdown + artifacts) ---------- */
  .field { color-scheme: dark; }
  select.field option { background: #02121c; }
  .rich { line-height: 1.6; }
  .rich > :first-child { margin-top: 0; }
  .rich h1 { font-size: 18px; color: var(--cyan); letter-spacing: 2px; margin: 4px 0 8px; text-shadow: 0 0 8px var(--cyan-dim); font-weight: normal; }
  .rich h2 { font-size: 12px; color: var(--cyan); letter-spacing: 3px; margin: 18px 0 8px; padding-bottom: 4px; border-bottom: 1px solid var(--cyan-dim); text-transform: uppercase; font-weight: normal; }
  .rich h3 { font-size: 13px; color: var(--orange); margin: 14px 0 6px; font-weight: normal; }
  .rich p { margin: 6px 0; }
  .rich ul, .rich ol { margin: 6px 0 6px 20px; }
  .rich li { margin: 2px 0; }
  .rich li input[type=checkbox] { accent-color: var(--cyan); margin-right: 6px; }
  .rich ul:has(> li > input[type=checkbox]) { list-style: none; margin-left: 2px; }
  .rich a { color: var(--cyan); }
  .rich strong { color: #fff; }
  .rich code { background: var(--cyan-faint); padding: 1px 5px; color: var(--orange); font-size: 12px; }
  .rich pre { background: rgba(0,0,0,.4); border: 1px solid var(--cyan-dim); padding: 10px; overflow: auto; margin: 8px 0; }
  .rich pre code { background: none; padding: 0; color: var(--text); white-space: pre-wrap; }
  .rich blockquote { border-left: 3px solid var(--orange); padding: 4px 12px; margin: 8px 0; background: rgba(255,181,71,.06); }
  .rich hr { border: none; border-top: 1px dashed var(--cyan-dim); margin: 14px 0; }
  .rich table, .dt { width: 100%; border-collapse: collapse; font-size: 12px; margin: 8px 0; }
  .rich th { text-align: left; color: var(--cyan); font-weight: normal; letter-spacing: 1px; font-size: 10px; text-transform: uppercase; padding: 7px 8px; border-bottom: 1px solid var(--cyan-mid); background: #04202c; }
  .rich td { padding: 6px 8px; border-bottom: 1px solid var(--cyan-faint); }
  .rich tr:hover td { background: rgba(0,229,255,.04); }

  .art { margin: 12px 0; }
  .art-box { border: 1px solid var(--cyan-dim); background: rgba(0,0,0,.2); padding: 10px; }
  .art-title { font-size: 10px; letter-spacing: 2px; color: var(--cyan); margin-bottom: 8px; text-transform: uppercase; }
  .art-err { border: 1px solid var(--red); color: var(--red); padding: 8px; font-size: 12px; white-space: pre-wrap; }
  .art-frame { width: 100%; height: 160px; border: none; display: block; background: transparent; }
  .chart-box { position: relative; height: 240px; }
  .chart-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: 12px; }

  .tools { display: flex; gap: 6px; align-items: center; margin-bottom: 8px; flex-wrap: wrap; }
  .tools .art-title { margin: 0 auto 0 0; }
  .tools .field { padding: 5px 8px; font-size: 12px; width: 160px; }
  .tools small { opacity: .5; font-size: 10px; }
  .dt-wrap { overflow: auto; max-height: 420px; }
  .dt th { cursor: pointer; position: sticky; top: 0; user-select: none; }
  .dt th[data-sort]:not([data-sort=""])::after { content: " " attr(data-sort); color: var(--orange); }
  .dt .num { text-align: right; font-variant-numeric: tabular-nums; }
  .up { color: #3dffa8; }
  .down { color: var(--red); }
  .badge { display: inline-block; padding: 0 8px; font-size: 10px; letter-spacing: 1px; border: 1px solid currentColor; white-space: nowrap; }

  .jf { display: grid; grid-template-columns: 1fr 1fr; gap: 10px 12px; }
  .jf .f { grid-column: span 2; display: flex; flex-direction: column; gap: 5px; font-size: 10px; letter-spacing: 1.5px; text-transform: uppercase; }
  .jf .f.half { grid-column: span 1; }
  .jf .f > span:first-child { color: var(--cyan); }
  .jf .req::after { content: " *"; color: var(--orange); }
  .jf .opts { display: flex; flex-wrap: wrap; gap: 6px; text-transform: none; letter-spacing: 0; font-size: 12px; }
  .jf .opts label { display: flex; align-items: center; gap: 6px; padding: 5px 10px; border: 1px solid var(--cyan-dim); cursor: pointer; }
  .jf .opts label:has(input:checked) { border-color: var(--cyan); background: var(--cyan-faint); color: var(--cyan); }
  .jf input[type=radio], .jf input[type=checkbox], .jf input[type=range] { accent-color: var(--cyan); }
  .jf .f.check { flex-direction: row; align-items: center; gap: 8px; text-transform: none; letter-spacing: 0; font-size: 12px; cursor: pointer; }
  .jf .f.check > span:first-child { color: var(--text); }
  .jf .actions { grid-column: span 2; display: flex; justify-content: flex-end; align-items: center; gap: 8px; }
  .jf .sent { color: #3dffa8; font-size: 11px; letter-spacing: 2px; margin-right: auto; }
  .jf :disabled { opacity: .55; }

  .kpis { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 10px; }
  .kpi { border: 1px solid var(--cyan-dim); background: linear-gradient(160deg, rgba(0,229,255,.1), transparent 70%); padding: 12px; }
  .kpi .l { font-size: 10px; letter-spacing: 2px; opacity: .7; text-transform: uppercase; }
  .kpi .v { font-size: 22px; color: var(--cyan); text-shadow: 0 0 10px var(--cyan-dim); margin: 4px 0 2px; white-space: nowrap; }
  .kpi .d { font-size: 12px; }
  .kpi .h { opacity: .5; font-size: 11px; }

  .prog { margin: 10px 0; }
  .prog label { display: flex; justify-content: space-between; font-size: 11px; }
  .prog.done .bar i { background: #3dffa8; box-shadow: 0 0 8px #3dffa8; }

  .tl { position: relative; padding-left: 24px; }
  .tl::before { content: ""; position: absolute; left: 6px; top: 6px; bottom: 6px; width: 1px; background: var(--cyan-dim); }
  .tl-item { position: relative; margin-bottom: 14px; }
  .tl-item::before { content: ""; position: absolute; left: -23px; top: 4px; width: 11px; height: 11px; border-radius: 50%; border: 2px solid var(--cyan); background: var(--bg); }
  .tl-item.done::before { background: var(--cyan); }
  .tl-item.active::before { border-color: var(--orange); background: var(--orange); box-shadow: 0 0 10px var(--orange); }
  .tl-item.pending { opacity: .55; }
  .tl-time { font-size: 10px; letter-spacing: 2px; color: var(--orange); }
  .tl-title { color: var(--cyan); }
  .tl-text { font-size: 12px; opacity: .8; }

  .cards { display: grid; grid-template-columns: repeat(auto-fill, minmax(210px, 1fr)); gap: 10px; }
  .card { border: 1px solid var(--cyan-dim); padding: 12px; background: rgba(0,229,255,.04); display: flex; flex-direction: column; gap: 6px; text-decoration: none; color: inherit; transition: .15s; }
  a.card:hover { border-color: var(--cyan); box-shadow: 0 0 14px var(--cyan-dim); }
  .card .t { color: var(--cyan); font-size: 13px; }
  .card .x { font-size: 12px; opacity: .8; flex: 1; }
  .card .m { display: flex; justify-content: space-between; gap: 8px; font-size: 10px; opacity: .6; }

  .gallery { display: grid; grid-template-columns: repeat(auto-fill, minmax(170px, 1fr)); gap: 10px; }
  .g-item { text-align: left; border: 1px solid var(--cyan-dim); background: var(--cyan-faint); padding: 12px; display: flex; flex-direction: column; gap: 4px; color: var(--text); }
  .g-item:hover { border-color: var(--cyan); box-shadow: 0 0 14px var(--cyan-dim); }
  .g-item i { font-style: normal; font-size: 20px; color: var(--cyan); }
  .g-item b { color: var(--cyan); font-weight: normal; letter-spacing: 1px; font-size: 12px; }
  .g-item span { font-size: 11px; opacity: .65; line-height: 1.4; }

  .sbx-bar { display: flex; gap: 6px; padding: 8px; border-bottom: 1px solid var(--cyan-dim); flex-shrink: 0; align-items: center; }
  .sbx { flex: 1; min-height: 0; display: grid; grid-template-columns: 1fr 1fr; }
  .sbx textarea { resize: none; border: none; border-right: 1px solid var(--cyan-dim); background: rgba(0,0,0,.3); padding: 10px; font-size: 12px; line-height: 1.5; outline: none; min-height: 0; }
  .sbx .pv { overflow: auto; padding: 12px; min-height: 0; }

  /* ---------- Media ---------- */
  .art figure { margin: 0; }
  .art figcaption { font-size: 11px; opacity: .65; margin-top: 4px; }
  .img-single img { max-width: 100%; max-height: 440px; display: block; cursor: zoom-in; border: 1px solid var(--cyan-dim); }
  .img-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 8px; }
  .img-grid img { width: 100%; aspect-ratio: 4 / 3; object-fit: cover; display: block; cursor: zoom-in; border: 1px solid var(--cyan-dim); transition: .15s; }
  .img-grid img:hover, .img-single img:hover, .rich p img:hover { border-color: var(--cyan); box-shadow: 0 0 12px var(--cyan-dim); }
  .rich p img { max-width: 100%; cursor: zoom-in; border: 1px solid var(--cyan-dim); display: block; }

  .video-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(260px, 1fr)); gap: 12px; }
  .video-frame { position: relative; aspect-ratio: 16 / 9; background: #000; border: 1px solid var(--cyan-dim); overflow: hidden; }
  .video-frame iframe, .video-frame video, .video-frame img { position: absolute; inset: 0; width: 100%; height: 100%; border: none; object-fit: cover; }
  .video-frame video { object-fit: contain; }
  .video-play { position: absolute; inset: 0; display: grid; place-items: center; background: linear-gradient(transparent 40%, rgba(0,0,0,.6)); border: none; }
  .video-play span { width: 64px; height: 64px; border-radius: 50%; border: 2px solid var(--cyan); display: grid; place-items: center; color: var(--cyan); font-size: 22px; background: rgba(2,18,28,.75); box-shadow: 0 0 20px var(--cyan-dim); transition: .15s; }
  .video-play:hover span { transform: scale(1.1); box-shadow: 0 0 30px var(--cyan); }
  .video-meta { display: flex; justify-content: space-between; gap: 8px; font-size: 11px; margin-top: 5px; }
  .video-meta a { color: var(--cyan); opacity: .8; white-space: nowrap; }

  .audio-item { display: flex; flex-direction: column; gap: 4px; margin-bottom: 10px; font-size: 12px; }
  .audio-item:last-child { margin-bottom: 0; }
  .audio-item audio { width: 100%; height: 36px; color-scheme: dark; }
  .embed-frame { width: 100%; border: 1px solid var(--cyan-dim); display: block; background: #000; }
  .card-img { width: calc(100% + 24px); margin: -12px -12px 4px; aspect-ratio: 16 / 9; object-fit: cover; display: block; }

  .lightbox { position: fixed; inset: 0; z-index: 30000; background: rgba(0,4,8,.92); display: grid; place-items: center; backdrop-filter: blur(4px); animation: winIn .15s; }
  .lightbox figure { text-align: center; }
  .lightbox img { max-width: 88vw; max-height: 80vh; border: 1px solid var(--cyan-dim); box-shadow: 0 0 40px rgba(0,229,255,.2); }
  .lb-cap { margin-top: 10px; font-size: 13px; }
  .lb-count { position: absolute; top: 24px; left: 24px; font-size: 11px; letter-spacing: 2px; color: var(--cyan); }
  .lb-x, .lb-nav { position: absolute; background: rgba(2,18,28,.8); border: 1px solid var(--cyan-dim); color: var(--cyan); width: 44px; height: 44px; font-size: 20px; }
  .lb-x { top: 16px; right: 16px; }
  .lb-nav { top: 50%; transform: translateY(-50%); }
  .lb-nav.prev { left: 20px; }
  .lb-nav.next { right: 20px; }
  .lb-x:hover, .lb-nav:hover { border-color: var(--cyan); box-shadow: 0 0 12px var(--cyan-dim); }
</style>
</head>

      </svg>

<script>
/* ================= Artifacts: markdown + visual blocks =================
 * Ответ агента — Markdown. Fenced-блоки ```chart / ```table / ```form / ```kpi / ```progress /
 * ```timeline / ```cards (JSON) и ```html (Tailwind + Chart.js в iframe) рендерятся как виджеты.
 */

const PALETTE = ['#00e5ff', '#ffb547', '#7c5cff', '#3dffa8', '#ff5470', '#4da3ff', '#f5f56b', '#ff7ad9'];
const CHART_URL = 'https://cdn.jsdelivr.net/npm/chart.js@4.4.4/dist/chart.umd.js';
const ART_RE = /(```|~~~)[ \t]*(chart|table|form|kpi|progress|timeline|cards|html|image|images|video|youtube|audio|embed)[^\n]*\n([\s\S]*?)\1/g;
const BOXED = ['chart', 'table', 'form', 'progress', 'timeline', 'audio'];

if (window.Chart) {
  Chart.defaults.color = '#bfefff';
  Chart.defaults.borderColor = 'rgba(0,229,255,.1)';
  Chart.defaults.font.family = '"SF Mono", Menlo, Consolas, monospace';
  Chart.defaults.font.size = 11;
}

function h(tag, props = {}, ...kids) {
  const el = document.createElement(tag);
  for (const [k, v] of Object.entries(props)) {
    if (v == null || v === false) continue;
    if (k === 'class') el.className = v;
    else if (k.startsWith('on')) el[k] = v;
    else el.setAttribute(k, v === true ? '' : v);
  }
  kids.flat(Infinity).forEach(c => c != null && c !== false && el.append(c));
  return el;
}
const esc = s => String(s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const safeUrl = u => /^https?:\/\//i.test(u) ? u : '#';
const safeMedia = u => /^(https?:\/\/|data:(image|video|audio)\/)/i.test(u) ? u : '';
const itemsOf = s => Array.isArray(s) ? s : (s.items || []);
const titleOf = (box, s) => { if (!Array.isArray(s) && s.title) box.append(h('div', { class: 'art-title' }, s.title)); };

function hasArtifacts(md) { ART_RE.lastIndex = 0; return ART_RE.test(md); }

function plain(md) {
  return String(md)
    .replace(ART_RE, ' ')
    .replace(/\[([^\]]+)\]\([^)]+\)/g, '$1')
    .replace(/[#*_`>|~]+/g, ' ')
    .replace(/\s+/g, ' ').trim().slice(0, 400);
}

function renderRich(el, md) {
  el.classList.add('rich');
  const arts = [];
  const src = String(md).replace(ART_RE, (_, f, type, body) => `\n\n@@ART${arts.push({ type, body }) - 1}@@\n\n`);
  let html = window.marked && window.DOMPurify
    ? DOMPurify.sanitize(marked.parse(src, { gfm: true, breaks: true }))
    : `<p>${esc(src).replace(/\n/g, '<br>')}</p>`;
  html = html.replace(/(<p>)?@@ART(\d+)@@(<\/p>)?/g, '<div data-art="$2"></div>');
  el.innerHTML = html;
  el.querySelectorAll('a').forEach(a => { a.target = '_blank'; a.rel = 'noopener'; });
  el.querySelectorAll('p').forEach(p => {
    const a = p.firstElementChild;
    if (p.childNodes.length !== 1 || a?.tagName !== 'A' || !videoSource(a.href)) return;
    const box = h('div', { class: 'art art-video' });
    p.replaceWith(box);
    renderVideo(box, { url: a.href });
  });
  const imgs = [...el.querySelectorAll('p img')];
  imgs.forEach((img, i) => img.onclick = () => openLightbox(imgs.map(x => ({ src: x.src, caption: x.alt })), i));
  el.querySelectorAll('[data-art]').forEach(ph => mountArtifact(ph, arts[+ph.dataset.art]));
}

function mountArtifact(ph, { type, body }) {
  const box = h('div', { class: 'art art-' + type + (BOXED.includes(type) ? ' art-box' : '') });
  ph.replaceWith(box);
  try {
    if (type === 'html') return renderHtml(box, body);
    RENDERERS[type](box, JSON.parse(body.trim()));
  } catch (e) {
    box.className = 'art';
    box.replaceChildren(h('div', { class: 'art-err' }, `Ошибка в блоке «${type}»: ${e.message}\n\n${body.slice(0, 300)}`));
  }
}

/* ---------- chart ---------- */
function toChartConfig(s) {
  const grid = 'rgba(0,229,255,.1)';
  if (s.data?.datasets) {
    const cfg = structuredClone(s);
    cfg.options = { responsive: true, maintainAspectRatio: false, ...(cfg.options || {}) };
    cfg.data.datasets.forEach((d, i) => { const c = PALETTE[i % PALETTE.length]; d.borderColor ??= c; d.backgroundColor ??= c + '55'; });
    return cfg;
  }
  const kind = s.type || 'line';
  const type = kind === 'area' ? 'line' : kind === 'hbar' ? 'bar' : kind;
  const round = ['pie', 'doughnut', 'polarArea'].includes(type);
  const series = s.series || [{ name: s.title, data: s.data }];
  const datasets = series.map((d, i) => {
    const c = d.color || PALETTE[i % PALETTE.length];
    const asLine = (d.type || type) === 'line' || type === 'radar';
    return {
      label: d.name, data: d.data, type: d.type,
      borderColor: round ? '#02121c' : c,
      backgroundColor: round ? d.data.map((_, j) => PALETTE[j % PALETTE.length] + 'cc') : asLine ? c + '33' : c + 'bb',
      fill: kind === 'area' || type === 'radar' || !!d.fill,
      tension: 0.35, borderWidth: 2, borderRadius: type === 'bar' && !d.type ? 3 : 0,
      pointRadius: type === 'scatter' ? 4 : 2, yAxisID: d.axis === 'right' ? 'y1' : 'y',
    };
  });
  const options = {
    responsive: true, maintainAspectRatio: false,
    indexAxis: kind === 'hbar' ? 'y' : 'x',
    interaction: round || type === 'scatter' ? { mode: 'nearest', intersect: true } : { mode: 'index', intersect: false },
    plugins: {
      title: { display: !!s.title, text: s.title, color: '#00e5ff', font: { size: 12, weight: 'normal' } },
      legend: { display: series.length > 1 || round, labels: { boxWidth: 10 } },
    },
  };
  if (type === 'radar' || type === 'polarArea') {
    options.scales = { r: { grid: { color: grid }, angleLines: { color: grid }, pointLabels: { color: '#bfefff' }, ticks: { backdropColor: 'transparent', color: 'rgba(191,239,255,.5)' } } };
  } else if (!round) {
    const axisTitle = t => t ? { display: true, text: t } : undefined;
    options.scales = {
      x: { stacked: !!s.stacked, grid: { color: grid }, title: axisTitle(s.xLabel) },
      y: { stacked: !!s.stacked, beginAtZero: s.beginAtZero ?? type === 'bar', grid: { color: grid }, title: axisTitle(s.yLabel) },
    };
    if (series.some(d => d.axis === 'right')) options.scales.y1 = { position: 'right', grid: { drawOnChartArea: false } };
  }
  return { type, data: { labels: s.labels, datasets }, options };
}

function renderChart(box, s) {
  if (!window.Chart) return box.append(h('div', { class: 'art-err' }, 'Chart.js не загрузился — нужен интернет.'));
  if (s.grid) {
    const g = h('div', { class: 'chart-grid' });
    box.append(g);
    s.grid.forEach(sp => { const cell = h('div'); g.append(cell); renderChart(cell, sp); });
    return;
  }
  const canvas = h('canvas');
  box.append(h('div', { class: 'chart-box', style: `height:${s.height || 240}px` }, canvas));
  new Chart(canvas, toChartConfig(s));
}

/* ---------- table ---------- */
function tagColor(v) {
  const t = String(v).toLowerCase();
  if (/^(онлайн|вкл|актив|готов|в наличии|есть|ок|норм|успех|done|да)/.test(t)) return '#3dffa8';
  if (/(офлайн|выкл|ошибк|нет в|критич|отказ|fail|нет$)/.test(t)) return '#ff5470';
  if (/(ожида|пред|скоро|внимани|мало|в работе|pending)/.test(t)) return '#ffb547';
  let n = 0; for (const ch of t) n = (n * 31 + ch.charCodeAt(0)) >>> 0;
  return PALETTE[n % PALETTE.length];
}

function renderTable(box, s) {
  let cols, rows;
  if (Array.isArray(s)) {
    cols = Object.keys(s[0] || {}).map(k => ({ label: k, type: typeof s[0][k] === 'number' ? 'number' : 'text' }));
    rows = s.map(r => cols.map(c => r[c.label]));
  } else {
    cols = s.columns.map(c => typeof c === 'string' ? { label: c } : c);
    rows = s.rows.map(r => Array.isArray(r) ? r : cols.map(c => r[c.key ?? c.label]));
  }
  const isNum = c => ['number', 'money', 'percent', 'delta'].includes(c.type);
  let sortI = -1, dir = 1, q = '';

  const cell = (c, v) => {
    const td = h('td', { class: isNum(c) ? 'num' : null });
    if (v == null || v === '') { td.textContent = '—'; return td; }
    switch (c.type) {
      case 'number': td.textContent = (+v).toLocaleString('ru-RU'); break;
      case 'money': td.textContent = (+v).toLocaleString('ru-RU') + ' ' + (c.currency || '₽'); break;
      case 'percent': td.textContent = v + '%'; break;
      case 'delta': {
        const good = c.invert ? v < 0 : v > 0, bad = c.invert ? v > 0 : v < 0;
        td.textContent = (v > 0 ? '▲ +' : v < 0 ? '▼ ' : '') + v + '%';
        td.classList.add(good ? 'up' : bad ? 'down' : 'flat');
        break;
      }
      case 'badge': td.append(h('span', { class: 'badge', style: `color:${tagColor(v)}` }, String(v))); break;
      case 'link': td.append(h('a', { href: safeUrl(v), target: '_blank', rel: 'noopener' }, c.text || String(v).replace(/^https?:\/\/(www\.)?/, '').slice(0, 30))); break;
      default: td.textContent = v;
    }
    return td;
  };

  const tbody = h('tbody'), count = h('small');
  const headRow = h('tr', {}, cols.map((c, i) => h('th', {
    class: isNum(c) ? 'num' : null,
    onclick: () => { dir = sortI === i ? -dir : 1; sortI = i; draw(); },
  }, c.label)));

  function draw() {
    let list = rows.filter(r => !q || r.some(v => String(v ?? '').toLowerCase().includes(q)));
    if (sortI >= 0) list = [...list].sort((a, b) => {
      const x = a[sortI], y = b[sortI];
      return (typeof x === 'number' && typeof y === 'number' ? x - y : String(x ?? '').localeCompare(String(y ?? ''), 'ru', { numeric: true })) * dir;
    });
    tbody.replaceChildren(...list.map(r => h('tr', {}, cols.map((c, i) => cell(c, r[i])))));
    headRow.querySelectorAll('th').forEach((th, i) => th.dataset.sort = i === sortI ? (dir > 0 ? '▲' : '▼') : '');
    count.textContent = list.length === rows.length ? `${rows.length} строк` : `${list.length} из ${rows.length}`;
  }

  const csv = () => {
    const cellText = v => `"${String(v ?? '').replace(/"/g, '""')}"`;
    const text = [cols.map(c => c.label), ...rows].map(r => r.map(cellText).join(';')).join('\n');
    h('a', { href: URL.createObjectURL(new Blob(['\ufeff' + text], { type: 'text/csv' })), download: (s.title || 'table') + '.csv' }).click();
  };

  const filter = h('input', { class: 'field', placeholder: 'Фильтр…', oninput: e => { q = e.target.value.toLowerCase(); draw(); } });
  box.append(
    h('div', { class: 'tools' }, h('div', { class: 'art-title' }, s.title || ''), count, filter, h('button', { class: 'btn', onclick: csv }, 'CSV')),
    h('div', { class: 'dt-wrap' }, h('table', { class: 'dt' }, h('thead', {}, headRow), tbody)),
  );
  draw();
}

/* ---------- form ---------- */
function renderForm(box, s) {
  titleOf(box, s);
  if (s.description) box.append(h('p', { style: 'margin:-2px 0 12px;opacity:.7;font-size:12px' }, s.description));
  const form = h('form', { class: 'jf' });

  s.fields.forEach(f => {
    const type = f.type || 'text';
    const label = h('span', { class: f.required ? 'req' : null }, f.label || f.name);
    const base = { name: f.name, class: 'field', required: !!f.required && type !== 'checkboxes', placeholder: f.placeholder };
    let wrap;

    if (type === 'checkbox') {
      wrap = h('label', { class: 'f check' + (f.half ? ' half' : '') }, h('input', { type: 'checkbox', name: f.name, checked: !!f.value }), h('span', {}, f.label || f.name));
    } else if (type === 'radio' || type === 'checkboxes') {
      const opts = h('div', { class: 'opts' }, f.options.map(o => h('label', {},
        h('input', { type: type === 'radio' ? 'radio' : 'checkbox', name: f.name, value: o, required: type === 'radio' && !!f.required,
                     checked: f.value === o || (Array.isArray(f.value) && f.value.includes(o)) }),
        String(o))));
      wrap = h('div', { class: 'f' + (f.half ? ' half' : '') }, label, opts);
    } else {
      let input;
      if (type === 'textarea') {
        input = h('textarea', { ...base, rows: f.rows || 3 });
      } else if (type === 'select') {
        input = h('select', { ...base, multiple: !!f.multiple, size: f.multiple ? Math.min(f.options.length, 5) : null },
          f.multiple ? [] : h('option', { value: '' }, f.placeholder || '— выберите —'),
          f.options.map(o => h('option', { selected: f.value === o || (Array.isArray(f.value) && f.value.includes(o)) }, String(o))));
      } else {
        input = h('input', { ...base, type, min: f.min, max: f.max, step: f.step });
        if (type === 'range') {
          const out = h('b', {}, String(f.value ?? f.min ?? 0));
          label.append(': ', out);
          input.oninput = () => out.textContent = input.value;
        }
      }
      if (f.value != null && type !== 'select') input.value = f.value;
      wrap = h('label', { class: 'f' + (f.half ? ' half' : '') }, label, input);
    }
    form.append(wrap);
  });

  const sent = h('span', { class: 'sent' });
  form.append(h('div', { class: 'actions' }, sent,
    h('button', { class: 'btn', type: 'reset' }, 'ОЧИСТИТЬ'),
    h('button', { class: 'btn' }, (s.submit || 'Отправить').toUpperCase())));

  form.onsubmit = e => {
    e.preventDefault();
    const data = {};
    const q = n => form.querySelector(`[name="${CSS.escape(n)}"]`);
    s.fields.forEach(f => {
      const n = f.name;
      if (f.type === 'checkbox') data[n] = q(n).checked;
      else if (f.type === 'checkboxes') data[n] = [...form.querySelectorAll(`[name="${CSS.escape(n)}"]:checked`)].map(i => i.value);
      else if (f.type === 'radio') data[n] = form.querySelector(`[name="${CSS.escape(n)}"]:checked`)?.value ?? '';
      else if (f.type === 'select' && f.multiple) data[n] = [...q(n).selectedOptions].map(o => o.value);
      else data[n] = q(n).value;
    });
    [...form.elements].forEach(el => el.disabled = true);
    sent.textContent = '✓ ОТПРАВЛЕНО ДЖАРВИСУ';
    handleForm(s, data);
  };
  box.append(form);
}

/* ---------- kpi / progress / timeline / cards ---------- */
function renderKpi(box, s) {
  titleOf(box, s);
  box.append(h('div', { class: 'kpis' }, itemsOf(s).map(k => {
    const d = typeof k.delta === 'number' ? k.delta : parseFloat(k.delta);
    const deltaText = typeof k.delta === 'number' ? `${d > 0 ? '▲ +' : d < 0 ? '▼ ' : ''}${d}${k.deltaUnit ?? '%'}` : k.delta;
    const tone = (k.invert ? -d : d) > 0 ? 'up' : (k.invert ? -d : d) < 0 ? 'down' : '';
    return h('div', { class: 'kpi' },
      h('div', { class: 'l' }, k.label),
      h('div', { class: 'v' }, String(k.value)),
      k.delta != null && h('div', { class: 'd ' + tone }, deltaText),
      k.hint && h('div', { class: 'h' }, k.hint));
  })));
}

function renderProgress(box, s) {
  titleOf(box, s);
  itemsOf(s).forEach(p => {
    const pct = Math.round(p.value / (p.max || 100) * 100);
    box.append(h('div', { class: 'prog' + (pct >= 100 ? ' done' : '') },
      h('label', {}, h('span', {}, p.label), h('span', {}, p.text || pct + '%')),
      h('div', { class: 'bar' }, h('i', { style: `width:${Math.min(pct, 100)}%` }))));
  });
}

function renderTimeline(box, s) {
  titleOf(box, s);
  box.append(h('div', { class: 'tl' }, itemsOf(s).map(t => h('div', { class: 'tl-item ' + (t.status || 'done') },
    h('div', { class: 'tl-time' }, t.time || ''),
    h('div', { class: 'tl-title' }, t.title || ''),
    t.text && h('div', { class: 'tl-text' }, t.text)))));
}

function renderCards(box, s) {
  titleOf(box, s);
  box.append(h('div', { class: 'cards' }, itemsOf(s).map(c => h(c.url ? 'a' : 'div', {
    class: 'card', href: c.url ? safeUrl(c.url) : null, target: c.url ? '_blank' : null, rel: 'noopener',
  },
    c.image && safeMedia(c.image) && h('img', { class: 'card-img', src: safeMedia(c.image), alt: '', loading: 'lazy' }),
    c.tag && h('span', { class: 'badge', style: `color:${tagColor(c.tag)};align-self:flex-start` }, c.tag),
    h('div', { class: 't' }, c.title),
    c.text && h('div', { class: 'x' }, c.text),
    h('div', { class: 'm' }, h('span', {}, c.source || ''), h('span', {}, c.meta || ''))))));
}

/* ---------- html (Tailwind + Chart.js, sandboxed) ---------- */
const frames = {};
const FRAME_HEAD = `<!doctype html><html><head><meta charset="utf-8">
<script src="https://cdn.tailwindcss.com"><\/script>
<script>window.tailwind&&(tailwind.config={theme:{extend:{colors:{jarvis:{DEFAULT:'#00e5ff',orange:'#ffb547',panel:'#06202e',bg:'#02121c',text:'#bfefff'}},fontFamily:{sans:['SF Mono','Menlo','Consolas','monospace']}}}});<\/script>
<script src="${CHART_URL}"><\/script>
<script>const jarvis={send:t=>parent.postMessage({jarvis:1,type:'send',text:String(t)},'*')};
if(window.Chart){Chart.defaults.color='#bfefff';Chart.defaults.borderColor='rgba(0,229,255,.1)';Chart.defaults.font.family='SF Mono, Menlo, monospace';}<\/script>
<style>html,body{margin:0;background:transparent;color:#bfefff;font-family:'SF Mono',Menlo,Consolas,monospace;font-size:13px}body{display:flow-root}</style>
</head><body>`;
const FRAME_TAIL = id => `<script>(()=>{const r=()=>parent.postMessage({jarvis:1,type:'height',id:'${id}',h:document.body.scrollHeight},'*');
new ResizeObserver(r).observe(document.body);addEventListener('load',r);setTimeout(r,400);})();<\/script></body></html>`;

function renderHtml(box, html) {
  const id = 'f' + Math.random().toString(36).slice(2);
  const f = h('iframe', { class: 'art-frame', sandbox: 'allow-scripts allow-forms allow-popups' });
  f.srcdoc = FRAME_HEAD + html + FRAME_TAIL(id);
  frames[id] = f;
  box.append(f);
}
addEventListener('message', e => {
  const d = e.data;
  if (!d || d.jarvis !== 1 || !Object.values(frames).some(f => f.contentWindow === e.source)) return;
  if (d.type === 'height' && frames[d.id]) frames[d.id].style.height = Math.min(d.h + 2, 3000) + 'px';
  if (d.type === 'send') handle(String(d.text).slice(0, 2000));
});

/* ---------- media: image / video / youtube / audio / embed ---------- */
const mediaItems = s => (Array.isArray(s) ? s : s.items || [s]).map(i => typeof i === 'string' ? { src: i } : i);

function openLightbox(items, start) {
  let i = start;
  const img = h('img', { alt: '' }), cap = h('div', { class: 'lb-cap' }), count = h('div', { class: 'lb-count' });
  const show = () => {
    img.src = items[i].src;
    cap.textContent = items[i].caption || '';
    count.textContent = items.length > 1 ? `${i + 1} / ${items.length}` : '';
  };
  const step = d => { i = (i + d + items.length) % items.length; show(); };
  const close = () => { lb.remove(); removeEventListener('keydown', onKey, true); };
  const onKey = e => {
    if (e.key === 'Escape') close();
    else if (e.key === 'ArrowRight') step(1);
    else if (e.key === 'ArrowLeft') step(-1);
    else return;
    e.preventDefault(); e.stopPropagation();
  };
  const nav = (cls, d, label) => items.length > 1 && h('button', { class: 'lb-nav ' + cls, onclick: e => { e.stopPropagation(); step(d); } }, label);
  const lb = h('div', { class: 'lightbox', onclick: e => { if (e.target === lb) close(); } },
    count, h('button', { class: 'lb-x', onclick: close }, '✕'), nav('prev', -1, '‹'), h('figure', {}, img, cap), nav('next', 1, '›'));
  addEventListener('keydown', onKey, true);
  document.body.append(lb);
  show();
}

function renderImage(box, s) {
  titleOf(box, s);
  const items = mediaItems(s).filter(it => safeMedia(it.src));
  const grid = h('div', { class: items.length === 1 ? 'img-single' : 'img-grid',
                          style: s.columns ? `grid-template-columns:repeat(${+s.columns},1fr)` : null });
  items.forEach((it, i) => grid.append(h('figure', {},
    h('img', { src: it.src, alt: it.alt || it.caption || '', loading: 'lazy', onclick: () => openLightbox(items, i) }),
    it.caption && h('figcaption', {}, it.caption))));
  box.append(grid);
}

function videoSource(url, start) {
  if (!url) return null;
  let m;
  if ((m = url.match(/(?:youtube(?:-nocookie)?\.com\/(?:watch\?(?:.*&)?v=|embed\/|shorts\/|live\/)|youtu\.be\/)([\w-]{11})/))) {
    const t = start ?? url.match(/[?&]t=(\d+)/)?.[1];
    return { provider: 'YouTube', id: m[1], link: `https://www.youtube.com/watch?v=${m[1]}`,
             thumb: `https://i.ytimg.com/vi/${m[1]}/hqdefault.jpg`,
             embed: `https://www.youtube-nocookie.com/embed/${m[1]}?rel=0&autoplay=1${t ? '&start=' + t : ''}` };
  }
  if ((m = url.match(/vimeo\.com\/(?:video\/)?(\d+)/))) {
    return { provider: 'Vimeo', link: `https://vimeo.com/${m[1]}`, embed: `https://player.vimeo.com/video/${m[1]}` };
  }
  if ((m = url.match(/rutube\.ru\/(?:video|play\/embed)\/([\w]+)/))) {
    return { provider: 'RuTube', link: `https://rutube.ru/video/${m[1]}/`, embed: `https://rutube.ru/play/embed/${m[1]}` };
  }
  return null;
}

const PLAYER_ALLOW = 'accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; fullscreen';

function renderVideo(box, s) {
  titleOf(box, s);
  const items = mediaItems(s);
  const grid = h('div', { class: items.length > 1 ? 'video-grid' : '' });
  items.forEach(it => {
    const url = it.url || (it.id ? `https://youtu.be/${it.id}` : it.src);
    const src = videoSource(url, it.start);
    const frame = h('div', { class: 'video-frame' });
    const player = () => h('iframe', { src: src.embed, allow: PLAYER_ALLOW, allowfullscreen: true, referrerpolicy: 'strict-origin-when-cross-origin', title: it.title || src.provider });

    if (src?.thumb) {
      frame.append(h('img', { src: it.poster || src.thumb, alt: '', loading: 'lazy' }),
        h('button', { class: 'video-play', title: 'Смотреть', onclick: () => frame.replaceChildren(player()) }, h('span', {}, '▶')));
    } else if (src) {
      frame.append(player());
    } else if (safeMedia(url)) {
      frame.append(h('video', { src: url, poster: it.poster && safeMedia(it.poster), controls: true, preload: 'metadata', playsinline: true }));
    } else {
      frame.append(h('div', { class: 'art-err' }, 'Неподдерживаемая ссылка на видео: ' + url));
    }
    grid.append(h('figure', {}, frame, h('div', { class: 'video-meta' },
      h('span', {}, it.title || it.caption || ''),
      src && h('a', { href: src.link, target: '_blank', rel: 'noopener' }, `${src.provider} ↗`))));
  });
  box.append(grid);
}

function renderAudio(box, s) {
  titleOf(box, s);
  mediaItems(s).forEach(it => safeMedia(it.src) && box.append(h('div', { class: 'audio-item' },
    it.title && h('span', {}, '♪ ' + it.title),
    h('audio', { src: it.src, controls: true, preload: 'metadata' }))));
}

function renderEmbed(box, s) {
  const url = safeUrl(s.url);
  if (url === '#') throw new Error('нужна https-ссылка');
  if (s.title) box.append(h('div', { class: 'art-title' }, s.title));
  box.append(h('iframe', { class: 'embed-frame', src: url, style: `height:${+s.height || 360}px`, allow: PLAYER_ALLOW,
                           allowfullscreen: true, loading: 'lazy', referrerpolicy: 'strict-origin-when-cross-origin' }));
}

const RENDERERS = {
  chart: renderChart, table: renderTable, form: renderForm, kpi: renderKpi, progress: renderProgress,
  timeline: renderTimeline, cards: renderCards,
  image: renderImage, images: renderImage, video: renderVideo, youtube: renderVideo, audio: renderAudio, embed: renderEmbed,
};

    const rows = p.fields.map(f => ({ 'Поле': f.label || f.name, 'Значение': fmtVal(p.data[f.name]) }));
    return `**Принято, сэр.** Форма «${p.form}» обработана:\n\n~~~table\n${JSON.stringify(rows)}\n~~~`;
  }
  const t = String(p).toLowerCase();
  if (/видеокарт|gpu|rtx/.test(t)) {
    return { text: 'Готово, сэр. Проверил шесть магазинов, **отчёт** открыт в отдельном окне.', window: { example: 'report' } };
  }
  if (/продаж|выручк/.test(t)) {
    return `Продажи за год, сэр. Рост **+18%** к прошлому году:

~~~chart
{"type":"area","labels":["Янв","Фев","Мар","Апр","Май","Июн","Июл","Авг","Сен","Окт"],"series":[{"name":"2026","data":[4.1,4.5,5.2,4.9,5.8,6.3,6.1,6.8,7.2,7.6]},{"name":"2025","data":[3.6,3.9,4.2,4.4,4.8,5.1,5.3,5.6,6.0,6.4]}],"height":200}
~~~`;
  }
  if (/сравни|сравнен/.test(t)) {
    return `Сравнение тарифов связи:

~~~table
{"columns":[{"label":"Тариф"},{"label":"Цена","type":"money"},{"label":"Интернет, ГБ","type":"number"},{"label":"Скорость","type":"badge"}],"rows":[["Старт",390,10,"4G"],["Оптимум",690,40,"5G"],["Максимум",1290,200,"5G"]]}
~~~

**Рекомендация:** «Оптимум» — лучший баланс цены и объёма.`;
  }
  if (/встреч|созвон|забронир/.test(t)) {
    return `Конечно, сэр. Заполните детали:

~~~form
{"title":"Встреча","submit":"Создать","fields":[{"name":"title","label":"Тема","type":"text","required":true},{"name":"date","label":"Дата","type":"date","required":true,"half":true},{"name":"time","label":"Время","type":"time","value":"12:00","half":true},{"name":"online","label":"Онлайн","type":"checkbox","value":true}]}
~~~`;
  }
  if (/видео|ролик|ютуб|youtube/.test(t)) {
    return `Нашёл видео, сэр:

~~~video
[{"id":"aqz-KE-bpKQ","title":"Big Buck Bunny · Blender Foundation"},{"id":"jNQXAC9IVRw","title":"Me at the zoo"}]
~~~`;
  }
  if (/фото|картин|изображ/.test(t)) {
    return `Вот что удалось найти:

~~~images
[{"src":"https://picsum.photos/id/1015/900/675","caption":"Вариант 1"},{"src":"https://picsum.photos/id/1016/900/675","caption":"Вариант 2"},{"src":"https://picsum.photos/id/1018/900/675","caption":"Вариант 3"},{"src":"https://picsum.photos/id/1019/900/675","caption":"Вариант 4"}]
~~~`;
  }
  if (/план|этап|роадмап/.test(t)) {
    return `План проекта:

~~~timeline
[{"time":"Неделя 1","title":"Исследование","status":"done"},{"time":"Неделя 2","title":"Прототип","status":"active"},{"time":"Неделя 3","title":"Тесты","status":"pending"},{"time":"Неделя 4","title":"Релиз","status":"pending"}]
~~~`;
  }
  return null;
}
