<script>
const $ = id => document.getElementById(id);
const desktop = $('desktop'), dock = $('dock'), core = $('core'), cmd = $('cmd'), mic = $('mic');
const sleep = ms => new Promise(r => setTimeout(r, ms));

const store = {
  get(k, d) { try { return JSON.parse(localStorage.getItem('jarvis.' + k)) ?? d; } catch { return d; } },
  set(k, v) { localStorage.setItem('jarvis.' + k, JSON.stringify(v)); }
};

let layout = store.get('layout', null);
let customs = store.get('custom', []);
let chatLog = store.get('chat', []);
let notes = store.get('notes', '');
let todos = store.get('todo', []);
const wins = {};
let z = 10;

let saveTimer;
const saveLayout = () => { clearTimeout(saveTimer); saveTimer = setTimeout(() => store.set('layout', layout), 200); };

/* ================= Widgets ================= */

const DEFS = {
  chat:     { title: 'ДИАЛОГ',      icon: '◉', alias: ['диалог', 'чат', 'разговор'], size: [390, 480], flush: true, render: renderChat },
  system:   { title: 'СИСТЕМА',     icon: '▤', alias: ['систем', 'статистик'],       size: [290, 230], render: renderSystem },
  modules:  { title: 'МОДУЛИ',      icon: '⬡', alias: ['модул'],                     size: [290, 270], render: renderModules },
  notes:    { title: 'ЗАМЕТКИ',     icon: '✎', alias: ['замет'],                     size: [340, 300], flush: true, render: renderNotes },
  todo:     { title: 'ЗАДАЧИ',      icon: '☑', alias: ['задач', 'список', 'дела'],   size: [340, 320], render: renderTodo },
  weather:  { title: 'ПОГОДА',      icon: '☁', alias: ['погод'],                     size: [340, 230], render: renderWeather },
  calendar: { title: 'КАЛЕНДАРЬ',   icon: '▦', alias: ['календар'],                  size: [300, 300], render: renderCalendar },
  timer:    { title: 'ТАЙМЕР',      icon: '◷', alias: ['таймер', 'секундомер'],      size: [300, 260], render: renderTimer },
  web:      { title: 'БРАУЗЕР',     icon: '⌘', alias: ['браузер', 'веб', 'сайт'],    size: [560, 420], flush: true, render: renderWeb },
  gallery:  { title: 'ГАЛЕРЕЯ',     icon: '❖', alias: ['галере', 'пример', 'визуализ'], size: [600, 520], render: renderGallery },
  sandbox:  { title: 'ПЕСОЧНИЦА',   icon: '⚗', alias: ['песочниц', 'рендер'],        size: [900, 600], flush: true, render: renderSandbox },
  help:     { title: 'КОМАНДЫ',     icon: '?', alias: ['помощ', 'команд', 'справк'], size: [400, 480], render: renderHelp },
};

function allIds() { return [...Object.keys(DEFS), ...customs.map(c => c.id)]; }
function dockIds() { return [...allIds(), ...Object.keys(wins).filter(id => id.startsWith('ex-'))]; }
function openIds() { return Object.keys(wins).filter(id => !layout[id]?.min); }
function defOf(id) {
  if (DEFS[id]) return DEFS[id];
  if (id.startsWith('ex-')) {
    const e = EX[id.slice(3)];
    return e && { title: e.title.toUpperCase(), icon: e.icon, alias: [], size: e.size || [640, 600],
                  render: b => e.render ? e.render(b) : renderRich(b, e.content) };
  }
  const c = customs.find(c => c.id === id);
  if (!c) return null;
  return { title: c.title.toUpperCase(), icon: c.type === 'rich' ? '◈' : '◆', alias: [c.title.toLowerCase()],
           size: c.type === 'rich' ? [680, 600] : [360, 280],
           flush: c.type === 'web', custom: true, render: b => renderCustom(b, c) };
}

function msgEl(m) {
  const el = document.createElement('div');
  el.className = 'msg' + (m.who === 'user' ? ' user' : '');
  el.innerHTML = `<b>${m.who === 'user' ? 'ВЫ' : 'JARVIS'} · ${m.time}</b>`;
  if (m.who === 'user') {
    el.appendChild(document.createTextNode(m.text));
  } else {
    const body = document.createElement('div');
    renderRich(body, m.text);
    el.appendChild(body);
    if (hasArtifacts(m.text)) el.classList.add('wide');
  }
  return el;
}

function renderGallery(body) {
  body.append(
    h('p', { style: 'opacity:.7;font-size:12px;margin-bottom:12px' },
      'Что агент может вывести в ответ. Каждый пример — обычный Markdown с блоками; его можно открыть в Песочнице и поменять.'),
    h('div', { class: 'gallery' }, Object.entries(EX).map(([k, e]) =>
      h('button', { class: 'g-item', onclick: () => openWin('ex-' + k) }, h('i', {}, e.icon), h('b', {}, e.title), h('span', {}, e.desc)))),
  );
}

function renderSandbox(body) {
  const ta = h('textarea', { spellcheck: 'false', placeholder: 'Вставьте ответ модели (Markdown или JSON {text, window})' });
  ta.value = store.get('sandbox', SANDBOX_DEFAULT);
  const pv = h('div', { class: 'pv' });
  const source = () => {
    const a = parseAgentAnswer(ta.value);
    return typeof a === 'string' ? a : (a.window?.content || a.text || '');
  };
  const draw = () => { try { renderRich(pv, source()); } catch (e) { pv.textContent = e.message; } };
  let tm;
  ta.oninput = () => { store.set('sandbox', ta.value); clearTimeout(tm); tm = setTimeout(draw, 400); };

  const examples = h('select', { class: 'field', style: 'width:auto' }, h('option', { value: '' }, 'Загрузить пример…'),
    Object.entries(EX).filter(([, e]) => e.content).map(([k, e]) => h('option', { value: k }, e.title)));
  examples.onchange = () => { if (examples.value) { ta.value = EX[examples.value].content; ta.oninput(); draw(); examples.value = ''; } };

  body.append(
    h('div', { class: 'sbx-bar' }, examples, h('span', { style: 'flex:1' }),
      h('button', { class: 'btn', onclick: () => addMsg(source(), 'jarvis') }, 'В ЧАТ'),
      h('button', { class: 'btn', onclick: () => openRichWindow({ title: source().match(/^#\s+(.+)/m)?.[1] || 'Отчёт', content: source() }) }, 'В ОКНО')),
    h('div', { class: 'sbx' }, ta, pv),
  );
  draw();
}

function renderChat(body) {
  body.innerHTML = `<div class="messages"></div>
    <form class="mini-input"><input class="field" placeholder="Сообщение Джарвису…"><button class="btn">➤</button></form>`;
  const box = body.querySelector('.messages');
  chatLog.forEach(m => box.appendChild(msgEl(m)));
  requestAnimationFrame(() => box.scrollTop = box.scrollHeight);
  const form = body.querySelector('form'), input = form.querySelector('input');
  form.onsubmit = e => { e.preventDefault(); handle(input.value); input.value = ''; };
}

function renderSystem(body) {
  body.innerHTML = ['CPU', 'MEMORY', 'NETWORK', 'POWER'].map(k =>
    `<div class="stat"><label>${k}<span data-v="${k}">—</span></label><div class="bar"><i data-k="${k}"></i></div></div>`).join('');
  updateStats();
}

function renderModules(body) {
  body.innerHTML = [
    ['SPEECH RECOGNITION', SR ? 'READY' : 'N/A', !SR], ['VOICE SYNTHESIS', 'READY'], ['LANGUAGE CORE', 'ACTIVE'],
    ['SMART HOME', 'LINKED'], ['CALENDAR', 'SYNCED'], ['SECURITY PROTOCOL', 'STANDBY', true],
  ].map(([n, s, off]) => `<div class="module${off ? ' off' : ''}"><span>${n}</span><span>${s}</span></div>`).join('');
}

function renderNotes(body) {
  const ta = document.createElement('textarea');
  ta.className = 'notes'; ta.placeholder = 'Пишите здесь или скажите «заметка …»'; ta.value = notes;
  ta.oninput = () => { notes = ta.value; store.set('notes', notes); };
  body.appendChild(ta);
}
function addNote(t) {
  notes += (notes && !notes.endsWith('\n') ? '\n' : '') + '• ' + t;
  store.set('notes', notes);
  const ta = document.querySelector('.win[data-id=notes] textarea');
  if (ta) ta.value = notes;
}

function renderTodo(body) {
  body.innerHTML = `<form class="mini-input top"><input class="field" placeholder="Новая задача…"><button class="btn">+</button></form><ul class="todo"></ul>`;
  const form = body.querySelector('form'), input = form.querySelector('input');
  form.onsubmit = e => { e.preventDefault(); if (input.value.trim()) addTodo(input.value.trim()); input.value = ''; };
  drawTodos(body.querySelector('.todo'));
}
function drawTodos(ul = document.querySelector('.win[data-id=todo] .todo')) {
  if (!ul) return;
  ul.innerHTML = todos.length ? '' : '<div class="empty">Задач нет. Скажите «задача …»</div>';
  todos.forEach((t, i) => {
    const li = document.createElement('li');
    li.className = t.done ? 'done' : '';
    li.innerHTML = `<input type="checkbox" ${t.done ? 'checked' : ''}><span></span><button title="Удалить">✕</button>`;
    li.querySelector('span').textContent = t.t;
    li.querySelector('input').onchange = () => { t.done = !t.done; store.set('todo', todos); drawTodos(); };
    li.querySelector('button').onclick = () => { todos.splice(i, 1); store.set('todo', todos); drawTodos(); };
    ul.appendChild(li);
  });
}
function addTodo(t) { todos.push({ t, done: false }); store.set('todo', todos); drawTodos(); }

function renderWeather(body) {
  const days = [['ПН', '☁', 12], ['ВТ', '☂', 9], ['СР', '☀', 14], ['ЧТ', '☀', 15], ['ПТ', '☁', 11]];
  body.innerHTML = `<div class="wx-now"><div class="wx-temp">+12°</div>
    <div>МОСКВА<br><span style="opacity:.6">Облачно · ветер 4 м/с · влажность 71%</span></div></div>
    <div class="wx-days">${days.map(([d, i, t]) => `<div>${d}<b>${i}</b>+${t}°</div>`).join('')}</div>`;
}

function renderCalendar(body) {
  const d = new Date(); d.setDate(1);
  const draw = () => {
    const y = d.getFullYear(), mo = d.getMonth(), today = new Date();
    const first = (new Date(y, mo, 1).getDay() + 6) % 7, days = new Date(y, mo + 1, 0).getDate();
    let cells = ['ПН', 'ВТ', 'СР', 'ЧТ', 'ПТ', 'СБ', 'ВС'].map(x => `<div class="dow">${x}</div>`).join('');
    cells += '<div></div>'.repeat(first);
    for (let i = 1; i <= days; i++) {
      const isToday = i === today.getDate() && mo === today.getMonth() && y === today.getFullYear();
      cells += `<div class="day${isToday ? ' today' : ''}">${i}</div>`;
    }
    body.innerHTML = `<div class="cal-head"><button class="btn" data-n="-1">‹</button>
      <span>${d.toLocaleDateString('ru-RU', { month: 'long', year: 'numeric' }).toUpperCase()}</span>
      <button class="btn" data-n="1">›</button></div><div class="cal">${cells}</div>`;
    body.querySelectorAll('[data-n]').forEach(b => b.onclick = () => { d.setMonth(d.getMonth() + +b.dataset.n); draw(); });
  };
  draw();
}

const timer = { total: 0, left: 0, running: false };
function fmt(s) {
  const h = Math.floor(s / 3600), m = Math.floor(s % 3600 / 60), x = s % 60, p = n => String(n).padStart(2, '0');
  return (h ? p(h) + ':' : '') + p(m) + ':' + p(x);
}
function startTimer(s) { timer.total = timer.left = s; timer.running = true; updTimer(); }
function updTimer() {
  document.querySelectorAll('.timer-display').forEach(e => e.textContent = fmt(timer.left));
  document.querySelectorAll('.timer-bar i').forEach(e => e.style.width = (timer.total ? timer.left / timer.total * 100 : 0) + '%');
  document.querySelectorAll('[data-t=toggle]').forEach(b => b.textContent = timer.running ? 'ПАУЗА' : 'СТАРТ');
}
setInterval(() => {
  if (!timer.running) return;
  if (--timer.left <= 0) {
    timer.left = 0; timer.running = false;
    const a = 'Время вышло, сэр.'; addMsg(a, 'jarvis'); speak(a);
  }
  updTimer();
}, 1000);
function renderTimer(body) {
  body.innerHTML = `<div class="timer-display">00:00</div><div class="bar timer-bar"><i></i></div>
    <div class="row">${[1, 5, 10, 25].map(m => `<button class="btn" data-m="${m}">${m} МИН</button>`).join('')}</div>
    <div class="row"><button class="btn" data-t="toggle">СТАРТ</button><button class="btn" data-t="reset">СБРОС</button></div>`;
  body.querySelectorAll('[data-m]').forEach(b => b.onclick = () => startTimer(b.dataset.m * 60));
  body.querySelector('[data-t=toggle]').onclick = () => { if (timer.left) timer.running = !timer.running; updTimer(); };
  body.querySelector('[data-t=reset]').onclick = () => { timer.running = false; timer.left = timer.total; updTimer(); };
  updTimer();
}

function renderWeb(body) {
  const url = store.get('webUrl', 'https://www.wikipedia.org');
  body.innerHTML = `<form class="web-bar"><input class="field" value=""><button class="btn">GO</button></form><iframe class="web-frame"></iframe>`;
  const form = body.querySelector('form'), input = form.querySelector('input'), frame = body.querySelector('iframe');
  input.value = url; frame.src = url;
  form.onsubmit = e => {
    e.preventDefault();
    let u = input.value.trim(); if (!/^https?:\/\//.test(u)) u = 'https://' + u;
    input.value = frame.src = u; store.set('webUrl', u);
  };
}

function renderHelp(body) {
  body.innerHTML = `<div class="help">
    <h4>ВВОД</h4>
    <ul><li>Командная строка внизу экрана — текст или голос</li><li><code>Пробел</code> — микрофон, <code>⌘K</code> — фокус на строку</li></ul>
    <h4>ОКНА</h4>
    <ul><li><code>открой заметки</code> / <code>закрой погоду</code> / <code>открой всё</code></li>
    <li><code>новое окно Проект</code> — своё окно</li><li><code>разложи окна</code>, <code>дашборд продуктивность</code></li>
    <li>Тянуть за заголовок, размер — правый нижний угол, двойной клик — развернуть</li></ul>
    <h4>ДАННЫЕ</h4>
    <ul><li><code>заметка позвонить Пеппер</code></li><li><code>задача обновить броню</code></li><li><code>таймер 10 минут</code></li></ul>
    <h4>ВИЗУАЛИЗАЦИИ (ДЕМО-АГЕНТ)</h4>
    <ul><li><code>найди цены на видеокарты</code> — отчёт агента в окне</li>
    <li><code>покажи продажи</code> — график в чате</li><li><code>сравни тарифы</code> — таблица</li>
    <li><code>назначь встречу</code> — форма</li><li><code>план проекта</code> — хронология</li>
    <li><code>найди видео</code>, <code>найди фото</code> — медиа в чате, <code>покажи медиа</code> — пример</li>
    <li><code>открой галерею</code>, <code>покажи графики</code>, <code>открой песочницу</code></li></ul>
    <h4>ВОПРОСЫ</h4>
    <ul><li><code>который час</code>, <code>какая погода</code>, <code>кто ты</code></li></ul>
    <p style="opacity:.5;margin-top:10px">Раскладка, заметки, задачи и диалог сохраняются в браузере.</p></div>`;
}

function renderCustom(body, c) {
  if (c.type === 'web') {
    body.innerHTML = '<iframe class="web-frame"></iframe>';
    body.querySelector('iframe').src = /^https?:\/\//.test(c.content) ? c.content : 'https://' + c.content;
  } else if (c.type === 'rich') {
    renderRich(body, c.content);
  } else if (c.type === 'html') {
    body.innerHTML = c.content;
  } else {
    const div = document.createElement('div');
    div.className = 'custom-text'; div.contentEditable = true; div.textContent = c.content;
    div.oninput = () => { c.content = div.innerText; store.set('custom', customs); };
    body.appendChild(div);
  }
}
function createCustom(c) {
  c.id ||= 'custom-' + Date.now();
  customs.push(c); store.set('custom', customs);
  openWin(c.id);
}
function openRichWindow(w) {
  if (w.example) return openWin('ex-' + w.example);
  const id = w.id || 'rich-' + Date.now();
  const existing = customs.find(c => c.id === id);
  if (existing) {
    Object.assign(existing, { title: w.title || existing.title, content: w.content });
    store.set('custom', customs);
    closeWin(id); openWin(id);
  } else {
    createCustom({ id, title: w.title || 'Отчёт', type: 'rich', content: w.content || '' });
  }
}
function deleteCustom(id) {
  closeWin(id);
  customs = customs.filter(c => c.id !== id); store.set('custom', customs);
  delete layout[id]; saveLayout(); syncDock();
}

/* ================= Window manager ================= */

function openWin(id) {
  const def = defOf(id);
  if (!def) return;
  const n = Object.keys(wins).length;
  const st = layout[id] ||= { x: 120 + n * 28, y: 90 + n * 28, w: def.size[0], h: def.size[1] };
  st.open = true; st.min = false;

  if (wins[id]) { wins[id].el.hidden = false; focus(id); saveLayout(); syncDock(); return; }

  const el = document.createElement('div');
  el.className = 'win'; el.dataset.id = id;
  el.innerHTML = `<div class="win-head"><span>${def.icon}</span><span class="win-title"></span>
    ${def.custom ? '<button data-a="del" title="Удалить окно">🗑</button>' : ''}
    <button data-a="min" title="Свернуть">—</button><button data-a="max" title="Развернуть">□</button>
    <button data-a="close" title="Закрыть">✕</button></div><div class="win-body${def.flush ? ' flush' : ''}"></div>`;
  el.querySelector('.win-title').textContent = def.title;
  Object.assign(el.style, { left: st.x + 'px', top: st.y + 'px', width: st.w + 'px', height: st.h + 'px' });
  desktop.appendChild(el);
  wins[id] = { el };
  def.render(el.querySelector('.win-body'));

  const head = el.querySelector('.win-head');
  el.addEventListener('pointerdown', () => focus(id), true);
  head.addEventListener('dblclick', e => { if (!e.target.closest('button')) el.classList.toggle('max'); });
  head.addEventListener('click', e => {
    const a = e.target.closest('button')?.dataset.a;
    if (a === 'close') closeWin(id);
    else if (a === 'min') minWin(id);
    else if (a === 'max') el.classList.toggle('max');
    else if (a === 'del' && confirm('Удалить окно «' + def.title + '»?')) deleteCustom(id);
  });
  head.addEventListener('pointerdown', e => {
    if (e.target.closest('button') || el.classList.contains('max')) return;
    const r = el.getBoundingClientRect(), dx = e.clientX - r.left, dy = e.clientY - r.top;
    head.setPointerCapture(e.pointerId);
    const move = ev => {
      st.x = Math.round(Math.min(Math.max(ev.clientX - dx, 56), innerWidth - 100));
      st.y = Math.round(Math.min(Math.max(ev.clientY - dy, 56), innerHeight - 40));
      el.style.left = st.x + 'px'; el.style.top = st.y + 'px';
    };
    const up = () => { head.removeEventListener('pointermove', move); head.removeEventListener('pointerup', up); saveLayout(); };
    head.addEventListener('pointermove', move);
    head.addEventListener('pointerup', up);
  });
  new ResizeObserver(() => {
    if (el.hidden || el.classList.contains('max') || !el.offsetWidth) return;
    st.w = el.offsetWidth; st.h = el.offsetHeight; saveLayout();
  }).observe(el);

  focus(id); saveLayout(); syncDock();
}

function closeWin(id) {
  if (!wins[id]) return;
  wins[id].el.remove(); delete wins[id];
  if (layout[id]) layout[id].open = false;
  saveLayout(); syncDock();
}
function minWin(id) {
  if (!wins[id]) return;
  wins[id].el.hidden = true; layout[id].min = true;
  saveLayout(); syncDock();
}
let focused = null;
function focus(id) {
  if (focused && wins[focused]) wins[focused].el.classList.remove('focused');
  focused = id;
  wins[id].el.style.zIndex = ++z;
  wins[id].el.classList.add('focused');
}

function syncDock() {
  dock.innerHTML = '';
  const btn = (id, cls, icon, label, onclick) => {
    const b = document.createElement('button');
    b.className = 'dock-btn ' + cls; b.textContent = icon; b.dataset.label = label; b.onclick = onclick;
    dock.appendChild(b);
  };
  dockIds().forEach((id, i) => {
    if (i === Object.keys(DEFS).length) dock.appendChild(document.createElement('hr'));
    const d = defOf(id), st = layout[id];
    const cls = wins[id] ? (st.min ? 'min' : 'on') : '';
    btn(id, cls, d.icon, d.title, () => {
      if (!wins[id] || st.min) openWin(id);
      else if (focused === id) minWin(id);
      else focus(id);
    });
  });
  dock.appendChild(document.createElement('hr'));
  btn(null, 'add', '+', 'НОВОЕ ОКНО', openModal);
}

function place(id, x, y, w, h) {
  openWin(id);
  const st = layout[id], el = wins[id].el;
  Object.assign(st, { x: Math.round(x), y: Math.round(y), w: Math.round(w), h: Math.round(h) });
  el.classList.remove('max');
  Object.assign(el.style, { left: st.x + 'px', top: st.y + 'px', width: st.w + 'px', height: st.h + 'px' });
  saveLayout();
}
function tile(ids) {
  const n = ids.length; if (!n) return;
  const X0 = 68, Y0 = 68, W = innerWidth - X0 - 12, H = innerHeight - Y0 - 122, gap = 12;
  if (n <= 2) {
    const w = Math.min(420, W / 2 - gap);
    ids.forEach((id, i) => place(id, n === 1 || i === 1 ? X0 + W - w : X0, Y0, w, H));
    return;
  }
  const cols = Math.ceil(Math.sqrt(n)), rows = Math.ceil(n / cols);
  const cw = (W - gap * (cols - 1)) / cols, rh = (H - gap * (rows - 1)) / rows;
  ids.forEach((id, i) => place(id, X0 + (i % cols) * (cw + gap), Y0 + Math.floor(i / cols) * (rh + gap), cw, rh));
}

const PRESETS = {
  main: { name: 'Основной',       alias: 'основ',   ids: ['chat', 'system', 'modules', 'weather'] },
  work: { name: 'Продуктивность', alias: 'продукт', ids: ['chat', 'todo', 'notes', 'calendar', 'timer'] },
  data: { name: 'Аналитика',      alias: 'аналит',  ids: ['chat', 'ex-report', 'ex-kpi'] },
  dev:  { name: 'Разработка',     alias: 'разраб',  ids: ['sandbox', 'gallery'] },
  min:  { name: 'Минимум',        alias: 'миним',   ids: ['chat'] },
  all:  { name: 'Всё',            alias: 'вс',      ids: null },
};
function applyPreset(k) {
  const ids = PRESETS[k].ids || allIds().filter(id => !['help', 'sandbox', 'web'].includes(id));
  Object.keys(wins).forEach(id => { if (!ids.includes(id)) closeWin(id); });
  tile(ids);
}
Object.entries(PRESETS).forEach(([k, p]) => $('preset').add(new Option(p.name.toUpperCase(), k)));
$('preset').onchange = e => { if (e.target.value) applyPreset(e.target.value); e.target.value = ''; };
$('btnTile').onclick = () => tile(openIds());
$('btnReset').onclick = () => {
  Object.keys(wins).forEach(closeWin);
  layout = {}; applyPreset('main');
};

function openModal() { $('modal').hidden = false; $('newForm').title.focus(); }
function closeModal() { $('modal').hidden = true; $('newForm').reset(); }
$('btnNew').onclick = openModal;
$('cancelNew').onclick = closeModal;
$('modal').onclick = e => { if (e.target.id === 'modal') closeModal(); };
$('newForm').onsubmit = e => {
  e.preventDefault();
  const f = new FormData(e.target);
  createCustom({ title: f.get('title').trim(), type: f.get('type'), content: f.get('content') });
  closeModal();
};

/* ================= Assistant ================= */

function setState(s) {
  core.className = 'core ' + (s === 'idle' ? '' : s);
  mic.classList.toggle('active', s === 'listening');
  $('status').textContent = { idle: 'ОЖИДАНИЕ КОМАНДЫ', listening: 'СЛУШАЮ…', thinking: 'ОБРАБОТКА…', speaking: 'ОТВЕЧАЮ' }[s];
}

function addMsg(text, who) {
  const m = { text, who, time: new Date().toLocaleTimeString('ru-RU', { hour: '2-digit', minute: '2-digit' }) };
  chatLog.push(m); chatLog = chatLog.slice(-200); store.set('chat', chatLog);
  if (who === 'jarvis') $('lastReply').textContent = plain(text);
  const box = document.querySelector('.win[data-id=chat] .messages');
  if (box) { box.appendChild(msgEl(m)); box.scrollTop = box.scrollHeight; }
}

function findWidget(name) {
  return allIds().find(id => defOf(id).alias.some(a => name.includes(a)));
}

function runCommand(q) {
  const t = q.toLowerCase().replace(/[.!?]+$/, '');
  let m;
  if ((m = t.match(/^(открой|покажи|запусти|включи)\s+(.+)/))) {
    if (/^вс[её]/.test(m[2])) { allIds().forEach(openWin); return 'Открываю все окна.'; }
    const ex = Object.keys(EX).find(k => EX[k].alias.some(a => m[2].includes(a)));
    if (ex) { openWin('ex-' + ex); return `Открываю пример «${EX[ex].title}».`; }
    const id = findWidget(m[2]);
    if (id) { openWin(id); return `Открываю «${defOf(id).title.toLowerCase()}».`; }
  }
  if ((m = t.match(/^(закрой|убери|скрой)\s+(.+)/))) {
    if (/^вс[её]/.test(m[2])) { Object.keys(wins).forEach(closeWin); return 'Все окна закрыты.'; }
    const id = findWidget(m[2]);
    if (id) { closeWin(id); return 'Закрыто.'; }
    return 'Не нашёл такое окно, сэр.';
  }
  if ((m = q.match(/^(запиши\s+)?заметк[аиу][:,]?\s+(.+)/i))) { addNote(m[2]); openWin('notes'); return 'Записал, сэр.'; }
  if ((m = q.match(/^(добавь\s+)?задач[аиу][:,]?\s+(.+)/i))) { addTodo(m[2]); openWin('todo'); return `Добавил задачу: ${m[2]}.`; }
  if ((m = t.match(/таймер\s+(на\s+)?(\d+)\s*(сек|мин|час)?/))) {
    const mult = m[3] === 'сек' ? 1 : m[3] === 'час' ? 3600 : 60;
    startTimer(+m[2] * mult); openWin('timer');
    return `Таймер запущен на ${fmt(+m[2] * mult)}.`;
  }
  if ((m = q.match(/^(новое|создай)\s+окно\s*(.*)/i))) {
    if (m[2]) { createCustom({ title: m[2], type: 'text', content: '' }); return `Окно «${m[2]}» создано.`; }
    openModal(); return 'Открываю конструктор окон.';
  }
  if (/разлож|упорядоч|расставь/.test(t)) { tile(openIds()); return 'Окна разложены.'; }
  if ((m = t.match(/дашборд\s+(.+)/))) {
    const k = Object.keys(PRESETS).find(k => m[1].includes(PRESETS[k].alias));
    if (k) { applyPreset(k); return `Дашборд «${PRESETS[k].name}» активирован.`; }
  }
  return null;
}

function reply(q) {
  const t = q.toLowerCase();
  if (/врем|час/.test(t)) return 'Сейчас ' + new Date().toLocaleTimeString('ru-RU', { hour: '2-digit', minute: '2-digit' }) + ', сэр.';
  if (/дата|число|какой день/.test(t)) return 'Сегодня ' + new Date().toLocaleDateString('ru-RU', { weekday: 'long', day: 'numeric', month: 'long' }) + '.';
  if (/привет|здравств|добр/.test(t)) return 'Здравствуйте, сэр. Чем займёмся?';
  if (/погод/.test(t)) { openWin('weather'); return 'За окном плюс двенадцать, облачно. Рекомендую куртку.'; }
  if (/кто ты|как тебя/.test(t)) return 'Я Джарвис, ваш персональный голосовой ассистент.';
  if (/помо|что ты умеешь|команд/.test(t)) { openWin('help'); return 'Открыл список команд.'; }
  return 'Принято, сэр. Это демо-режим: попробуйте «найди цены на видеокарты», «покажи продажи», «назначь встречу» или откройте галерею. Для свободных вопросов подключите LLM в функции ask().';
}

function parseAgentAnswer(raw) {
  const s = String(raw).trim();
  if (s.startsWith('{')) {
    try { const o = JSON.parse(s); if (o.text || o.window) return o; } catch {}
  }
  return s;
}

// payload: строка пользователя или { form, fields, data } после отправки формы.
// Ответ: Markdown-строка или { text, window: { title, content } }.
async function ask(payload) {
  // const r = await fetch('/api/ask', {
  //   method: 'POST', headers: { 'Content-Type': 'application/json' },
  //   body: JSON.stringify({ system: AGENT_PROMPT, payload, history: chatLog.slice(-20) }),
  // });
  // return parseAgentAnswer((await r.json()).answer);
  return mockAgent(payload) ?? reply(String(payload));
}

function deliver(answer) {
  const a = typeof answer === 'string' ? { text: answer } : answer;
  if (a.window) openRichWindow(a.window);
  addMsg(a.text || 'Готово, сэр.', 'jarvis');
  speak(plain(a.text || 'Готово, сэр.'));
}

async function handle(raw) {
  const q = raw.trim();
  if (!q) return;
  addMsg(q, 'user');
  setState('thinking');
  await sleep(300);
  deliver(runCommand(q) ?? await ask(q));
}

async function handleForm(spec, data) {
  addMsg(`📝 Отправлена форма «${spec.title || 'без названия'}»`, 'user');
  setState('thinking');
  await sleep(300);
  deliver(await ask({ form: spec.title || 'Форма', fields: spec.fields, data }));
}

function speak(text) {
  if (!('speechSynthesis' in window)) return setState('idle');
  const u = new SpeechSynthesisUtterance(text);
  u.lang = 'ru-RU'; u.pitch = 0.9;
  const voice = speechSynthesis.getVoices().find(v => v.lang.startsWith('ru'));
  if (voice) u.voice = voice;
  u.onstart = () => setState('speaking');
  u.onend = u.onerror = () => setState('idle');
  speechSynthesis.cancel();
  speechSynthesis.speak(u);
  setTimeout(() => { if (!speechSynthesis.speaking) setState('idle'); }, 1500);
}

const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
let rec = null, listening = false;
if (SR) {
  rec = new SR();
  rec.lang = 'ru-RU'; rec.interimResults = true;
  rec.onresult = e => {
    const r = e.results[e.results.length - 1];
    cmd.value = r[0].transcript;
    if (r.isFinal) { handle(r[0].transcript); cmd.value = ''; }
  };
  rec.onend = () => { listening = false; if (core.classList.contains('listening')) setState('idle'); };
  rec.onerror = () => { listening = false; setState('idle'); };
}
function toggleMic() {
  if (!rec) { addMsg('Голосовой ввод не поддерживается этим браузером. Откройте в Chrome или пишите в строку внизу.', 'jarvis'); return; }
  if (listening) return rec.stop();
  speechSynthesis.cancel();
  listening = true; setState('listening'); rec.start();
}
mic.onclick = toggleMic;
$('cmdForm').onsubmit = e => { e.preventDefault(); handle(cmd.value); cmd.value = ''; };

document.addEventListener('keydown', e => {
  const typing = /INPUT|TEXTAREA|SELECT/.test(document.activeElement.tagName) || document.activeElement.isContentEditable;
  if (e.key === 'Escape') closeModal();
  if ((e.metaKey || e.ctrlKey) && e.key.toLowerCase() === 'k') { e.preventDefault(); cmd.focus(); }
  if (e.code === 'Space' && !typing) { e.preventDefault(); toggleMic(); }
});

/* ================= Ambient ================= */

function tick() {
  const d = new Date();
  $('time').textContent = d.toLocaleTimeString('ru-RU');
  $('date').textContent = d.toLocaleDateString('ru-RU', { weekday: 'long', day: 'numeric', month: 'long' }).toUpperCase();
}
setInterval(tick, 1000); tick();

function updateStats() {
  for (const [k, base, spread] of [['CPU', 25, 35], ['MEMORY', 50, 20], ['NETWORK', 10, 50], ['POWER', 100, 0]]) {
    const v = Math.round(base + Math.random() * spread);
    document.querySelectorAll(`[data-k="${k}"]`).forEach(e => e.style.width = v + '%');
    document.querySelectorAll(`[data-v="${k}"]`).forEach(e => e.textContent = v + '%');
  }
}
setInterval(updateStats, 2000);

const wave = $('wave'), wctx = wave.getContext('2d');
const resize = () => { wave.width = wave.clientWidth * devicePixelRatio; wave.height = wave.clientHeight * devicePixelRatio; };
addEventListener('resize', resize); resize();
let t = 0, level = 0;
(function draw() {
  t += 0.05;
  const active = core.classList.contains('listening') || core.classList.contains('speaking');
  level += ((active ? 1 : 0.1) - level) * 0.08;
  const W = wave.width, H = wave.height, bars = 96, bw = W / bars;
  const color = core.classList.contains('listening') ? '255,181,71' : '0,229,255';
  wctx.clearRect(0, 0, W, H);
  for (let i = 0; i < bars; i++) {
    const c = Math.abs(i - bars / 2) / (bars / 2);
    const amp = (Math.sin(i * 0.35 + t * 3) * 0.5 + 0.5) * (1 - c * 0.7);
    const h = Math.max(1.5, amp * H * level * (0.6 + Math.random() * 0.4));
    wctx.fillStyle = `rgba(${color},${0.25 + amp * 0.75})`;
    wctx.fillRect(i * bw + bw * 0.25, (H - h) / 2, bw * 0.5, h);
  }
  requestAnimationFrame(draw);
})();

/* ================= Boot ================= */

if (!chatLog.length) addMsg('Добрый вечер, сэр. Все системы в норме. Пишите или говорите в строку внизу. Скажите **«помощь»** — список команд, **«открой галерею»** — примеры графиков, таблиц и форм.', 'jarvis');
else $('lastReply').textContent = plain([...chatLog].reverse().find(m => m.who === 'jarvis')?.text || '').slice(0, 200);

if (!layout) { layout = {}; applyPreset('main'); }
else Object.entries(layout).forEach(([id, st]) => {
  if (!st.open || !defOf(id)) return;
  const wasMin = st.min;
  openWin(id);
  if (wasMin) minWin(id);
});
syncDock();
</script>
