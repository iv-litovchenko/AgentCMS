<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>08 — Toggle merged</title>
    <link rel="stylesheet" href="../shared-page.css" />
    <link rel="stylesheet" href="../dock-mock.css" />
  </head>
  <body class="layout-08">
    <div class="demo-top">
      <a href="../index.html">← Каталог ui-variant-16</a>
      <h1>08 · Toggle merged</h1>
      <p>Три toggles (crosshair, inspector, media) — один сегментированный переключатель вместо трёх tracks.</p>
      <span class="demo-tag">−2 контрола ширины</span>
    </div>
    <article class="demo-stage">
      <h2>Фон страницы</h2>
      <p class="fake-text">Можно включать только один режим overlay или multi-select — но визуально dock короче на ~70px.</p>
    </article>
    <div class="dock-anchor asc-dock-mock">
      <div class="m-capsule">
        <div class="m-brand"><span class="m-brand-icon"></span></div>
        <button type="button" class="m-btn m-btn--icon m-btn--accent">⊞</button>
        <button type="button" class="m-btn m-btn--icon m-btn--pomo">🍅</button>
        <button type="button" class="m-btn m-btn--icon-sm">📷</button>
        <div class="m-toggle-group" role="group" aria-label="Overlay">
          <button type="button" class="is-on" title="Crosshair">⊹</button>
          <button type="button" title="Inspector">📄</button>
          <button type="button" title="Media">🖼</button>
        </div>
        <div class="m-toggles-loose" hidden>
          <span class="m-toggle-track"></span>
        </div>
        <span class="m-div"></span>
        <button type="button" class="m-btn m-btn--icon-sm">↗</button>
        <div class="m-search">
          <span class="m-search-picker">Я</span>
          <input class="m-search-input" placeholder="…" readonly />
        </div>
        <button type="button" class="m-btn m-btn--icon m-btn--mark">🔖</button>
      </div>
      <div class="m-vault m-vault-row">
        <span class="m-vault-avatar"></span>
        <span class="m-vault-meta"><span class="m-vault-name">0-ws-core</span><span class="m-vault-hint">онлайн</span></span>
      </div>
    </div>
  </body>
</html>
