<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>05 — Brand flank</title>
    <link rel="stylesheet" href="../shared-page.css" />
    <link rel="stylesheet" href="../dock-mock.css" />
  </head>
  <body class="layout-05">
    <div class="demo-top">
      <a href="../index.html">← Каталог ui-variant-16</a>
      <h1>05 · Brand flank</h1>
      <p>Бренд слева, весь «шум» прижат вправо одним кластером — без dividers между каждой иконкой.</p>
      <span class="demo-tag">flex space-between</span>
    </div>
    <article class="demo-stage">
      <h2>Фон страницы</h2>
      <p class="fake-text">Читается как «логотип + пульт». Поиск короткий, toggles идут подряд без разделителей.</p>
    </article>
    <div class="dock-anchor asc-dock-mock">
      <div class="m-capsule">
        <div class="m-brand"><span class="m-brand-icon"></span><span class="m-brand-label">Toolbar</span></div>
        <div class="m-cluster-right m-tools-full">
          <button type="button" class="m-btn m-btn--icon m-btn--accent">⊞</button>
          <button type="button" class="m-btn m-btn--icon m-btn--pomo">25</button>
          <button type="button" class="m-btn m-btn--icon-sm">📷</button>
          <span class="m-toggle-track"><span class="m-toggle-thumb"></span></span>
          <span class="m-toggle-track"><span class="m-toggle-thumb"></span></span>
          <span class="m-toggle-track is-on"><span class="m-toggle-thumb"></span></span>
          <button type="button" class="m-btn m-btn--icon-sm">↗</button>
          <div class="m-search">
            <span class="m-search-picker">G</span>
            <input class="m-search-input" placeholder="…" readonly />
          </div>
          <button type="button" class="m-btn m-btn--icon m-btn--mark">🔖</button>
        </div>
      </div>
      <div class="m-vault m-vault-row">
        <span class="m-vault-avatar"></span>
        <span class="m-vault-meta"><span class="m-vault-name">0-ws-core</span><span class="m-vault-hint">онлайн</span></span>
      </div>
    </div>
  </body>
</html>
