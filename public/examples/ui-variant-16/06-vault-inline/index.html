<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>06 — Vault inline</title>
    <link rel="stylesheet" href="../shared-page.css" />
    <link rel="stylesheet" href="../dock-mock.css" />
  </head>
  <body class="layout-06">
    <div class="demo-top">
      <a href="../index.html">← Каталог ui-variant-16</a>
      <h1>06 · Vault inline</h1>
      <p>Мини-vault (аватар + короткое имя) внутри кapsule — вторая строка vault убрана.</p>
      <span class="demo-tag">−1 строка высоты</span>
    </div>
    <article class="demo-stage">
      <h2>Фон страницы</h2>
      <p class="fake-text">Экономия вертикали на страницах с vault. Клик по inline-vault = тот же popover списка.</p>
    </article>
    <div class="dock-anchor asc-dock-mock">
      <div class="m-capsule">
        <div class="m-vault m-vault--inline">
          <span class="m-vault-avatar"></span>
          <span class="m-vault-meta"><span class="m-vault-name">ws-core</span></span>
        </div>
        <span class="m-div"></span>
        <div class="m-brand"><span class="m-brand-icon m-brand-icon--sm"></span></div>
        <button type="button" class="m-btn m-btn--icon m-btn--accent">⊞</button>
        <button type="button" class="m-btn m-btn--icon m-btn--pomo">🍅</button>
        <button type="button" class="m-btn m-btn--icon-sm">📷</button>
        <span class="m-toggle-track is-on"><span class="m-toggle-thumb"></span></span>
        <button type="button" class="m-btn m-btn--icon-sm">↗</button>
        <button type="button" class="m-btn m-btn--icon-sm">🔍</button>
        <button type="button" class="m-btn m-btn--icon m-btn--mark">🔖</button>
      </div>
    </div>
  </body>
</html>
