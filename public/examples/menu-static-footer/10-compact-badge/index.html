<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>10 — Компакт + badge</title>
    <link rel="stylesheet" href="../shared.css" />
    <style>
      .v10-wrap { padding: 6px 10px 0; }
      .v10-toggle {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 8px;
        width: 100%;
        padding: 7px 10px;
        border: 1px solid #dbe3ef;
        border-radius: 8px;
        background: linear-gradient(180deg, #fff, #f8fafc);
        cursor: pointer;
        font: inherit;
        text-align: left;
      }
      .v10-toggle:hover { border-color: #a5b4fc; }
      .v10-main { display: flex; align-items: center; gap: 8px; min-width: 0; }
      .v10-emoji { font-size: 15px; }
      .v10-copy { display: flex; flex-direction: column; gap: 1px; min-width: 0; }
      .v10-title { font-size: 12px; font-weight: 700; color: #0f172a; line-height: 1.2; }
      .v10-sub { font-size: 9px; color: #94a3b8; line-height: 1.2; }
      .v10-badge {
        min-width: 22px;
        height: 22px;
        padding: 0 7px;
        border-radius: 999px;
        background: #4f46e5;
        color: #fff;
        font-size: 11px;
        font-weight: 800;
        line-height: 22px;
        text-align: center;
        flex-shrink: 0;
      }
      .footer-panel.is-collapsed .v10-sub { display: block; }
    </style>
  </head>
  <body>
    <header class="demo-top">
      <div><h1>10 · Компакт + badge</h1><p>Короткое имя и счётчик секций</p></div>
      <a href="../index.html">← Все варианты</a>
    </header>
    <div class="demo-stage">
      <aside class="sidebar-mock">
        <div class="sidebar-mock-head"><strong>Agent workspace</strong></div>
        <div class="sidebar-mock-tree"><div class="tree-item">📁 Темы</div></div>
        <div class="sidebar-mock-bottom">
          <section class="footer-panel v10-wrap">
            <button type="button" class="v10-toggle" data-footer-toggle aria-expanded="true">
              <span class="v10-main">
                <span class="v10-emoji" aria-hidden="true">🧩</span>
                <span class="v10-copy">
                  <span class="v10-title">Система и доп.</span>
                  <span class="v10-sub" data-footer-action>Нажмите, чтобы свернуть</span>
                </span>
              </span>
              <span class="v10-badge" aria-label="3 секции">3</span>
            </button>
            <div class="footer-body" style="padding-top:8px">
              <details class="mock-section mock-section--purple" open><summary>🟢 Накопители</summary><div class="mock-section-body">Domains</div></details>
              <details class="mock-section mock-section--blue"><summary>💬 Диалоги</summary><div class="mock-section-body">Runtime</div></details>
              <details class="mock-section mock-section--slate"><summary>🛠 Среда</summary><div class="mock-section-body">Зависимости</div></details>
            </div>
          </section>
        </div>
      </aside>
    </div>
    <script src="../shared.js"></script>
    <script>
      document.querySelector("[data-footer-toggle]")?.addEventListener("click", function () {
        const open = this.getAttribute("aria-expanded") === "true";
        this.querySelector("[data-footer-action]").textContent = open
          ? "Нажмите, чтобы свернуть"
          : "Нажмите, чтобы развернуть";
      });
    </script>
  </body>
</html>
