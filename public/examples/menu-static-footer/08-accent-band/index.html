<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>08 — Accent band</title>
    <link rel="stylesheet" href="../shared.css" />
    <style>
      .v08-toggle {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 8px;
        width: 100%;
        padding: 10px 12px;
        border: 0;
        background: linear-gradient(135deg, #4f46e5 0%, #6366f1 55%, #818cf8 100%);
        color: #fff;
        cursor: pointer;
        font: inherit;
        text-align: left;
      }
      .v08-toggle:hover { filter: brightness(1.05); }
      .v08-title { font-size: 11px; font-weight: 800; letter-spacing: 0.05em; text-transform: uppercase; }
      .v08-chevron {
        width: 8px; height: 8px;
        border-right: 2px solid rgba(255,255,255,0.9);
        border-bottom: 2px solid rgba(255,255,255,0.9);
        transform: rotate(-45deg);
        transition: transform 0.15s;
      }
      .footer-panel:not(.is-collapsed) .v08-chevron { transform: rotate(45deg); }
      .v08-action { font-size: 10px; font-weight: 600; opacity: 0.88; }
      .footer-body { background: #f5f3ff; }
    </style>
  </head>
  <body>
    <header class="demo-top">
      <div><h1>08 · Accent band</h1><p>Яркая полоса — сразу видно зону управления</p></div>
      <a href="../index.html">← Все варианты</a>
    </header>
    <div class="demo-stage">
      <aside class="sidebar-mock">
        <div class="sidebar-mock-head"><strong>Agent workspace</strong></div>
        <div class="sidebar-mock-tree"><div class="tree-item">📁 Темы</div></div>
        <div class="sidebar-mock-bottom">
          <section class="footer-panel">
            <button type="button" class="v08-toggle" data-footer-toggle aria-expanded="true">
              <span style="display:flex;align-items:center;gap:8px">
                <span class="v08-chevron" aria-hidden="true"></span>
                <span class="v08-title">Системные секции</span>
              </span>
              <span class="v08-action" data-footer-action>Свернуть</span>
            </button>
            <div class="footer-body">
              <details class="mock-section mock-section--purple" open><summary>🟢 Накопители</summary><div class="mock-section-body">Domains</div></details>
              <details class="mock-section mock-section--blue"><summary>💬 Диалоги</summary><div class="mock-section-body">Runtime</div></details>
              <details class="mock-section mock-section--slate"><summary>🛠 Среда</summary><div class="mock-section-body">Зависимости</div></details>
            </div>
          </section>
        </div>
      </aside>
    </div>
    <script src="../shared.js"></script>
  </body>
</html>
