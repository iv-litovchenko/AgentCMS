<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>09 — Плавающая карточка</title>
    <link rel="stylesheet" href="../shared-base.css" />
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <span class="demo-badge">09 · Плавающая карточка</span>
    <a class="demo-back" href="../index.html">← Все варианты</a>
    <div class="layout-shell" id="app">
      <header class="app-header">
        <h1>Agent CMS</h1>
        <span>Workspaces/*.node.md</span>
      </header>
      <div class="layout-body layout-float">
        <aside class="sidebar">
          <input class="tree-search" placeholder="Поиск..." />
          <div class="tree"></div>
        </aside>
        <section class="workspace workspace-relative">
          <div class="path-bar">Путь: <strong>Workspaces / Agents / Research Agent.node.md</strong></div>
          <div class="editor-area">
            <div class="field-label">Содержимое · <span data-active-mode-label></span></div>
            <div class="editor-mock" data-mode-preview></div>
          </div>
          <div class="float-card collapsed" data-float-card>
            <button type="button" class="float-toggle" data-float-toggle>⚙ Режим</button>
            <div class="float-body">
              <div class="float-title">Управление нодой</div>
              <div class="float-modes mode-panel"></div>
            </div>
          </div>
        </section>
        <aside class="right-panel">
          <button type="button" class="btn btn-primary">Сохранить</button>
          <textarea class="yaml-mock" rows="5">title: Research Agent</textarea>
        </aside>
      </div>
    </div>
    <script type="module" src="app.js"></script>
  </body>
</html>
