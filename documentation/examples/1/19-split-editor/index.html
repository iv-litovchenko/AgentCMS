<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>19 — Split editor</title>
    <link rel="stylesheet" href="../shared-base.css" />
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <span class="demo-badge">19 · Split view</span>
    <a class="demo-back" href="../index.html">← Все варианты</a>
    <div class="layout-shell" id="app">
      <header class="app-header"><h1>Agent CMS</h1></header>
      <div class="layout-body layout-split">
        <aside class="sidebar"><div class="tree"></div></aside>
        <section class="workspace split-workspace">
          <div class="split-top"><div class="field-label">Редактор · <span data-active-mode-label></span></div><div class="editor-mock" data-mode-preview></div></div>
          <div class="split-handle" data-split-handle></div>
          <div class="split-bottom">
            <div class="split-bottom-title">Управление нодой</div>
            <div class="split-modes mode-panel"></div>
          </div>
        </section>
        <aside class="right-panel"><button type="button" class="btn btn-primary">Сохранить</button></aside>
      </div>
    </div>
    <script type="module" src="app.js"></script>
  </body>
</html>
