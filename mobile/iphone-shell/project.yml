name: AgentShell
options:
  bundleIdPrefix: com.agentcms
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    SWIFT_VERSION: "5.9"
    TARGETED_DEVICE_FAMILY: "1"
    DEVELOPMENT_TEAM: ""
targets:
  AgentShell:
    type: application
    platform: iOS
    sources:
      - path: AgentShell
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.agentcms.shell
        INFOPLIST_FILE: AgentShell/Resources/Info.plist
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        CODE_SIGN_STYLE: Automatic
        CURRENT_PROJECT_VERSION: 1
        MARKETING_VERSION: 0.1.0
        GENERATE_INFOPLIST_FILE: false
