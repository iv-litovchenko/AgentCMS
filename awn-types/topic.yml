name: awn.topic
kind: type
extends: awn.base
description: Тема (файл) — standalone *.md манифест
fields:
  title:
    type: string
    title: Заголовок
    description: Отображаемое название темы
  tags:
    type: array
    title: Теги
    items: string
  status:
    type: enum
    title: Статус
    enum: [draft, active, archived]
    default: draft
  priority:
    type: integer
    title: Приоритет
    default: 0
