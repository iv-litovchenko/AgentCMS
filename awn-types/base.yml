name: awn.base
kind: base
description: Базовые YAML-свойства для всех типов записей агента
mixins: [awn.mixin.preview]
fields:
  awn-type:
    type: string
    title: Тип
    description: Идентификатор типа записи (awn.agent, awn.area, awn.topic, …)
    required: true
  awn-name:
    type: string
    title: Имя
    description: Имя файла без расширения (дублирует имя файла на диске)
  awn-create:
    type: datetime
    title: Создан
    description: Дата и время создания
  awn-update:
    type: datetime
    title: Изменён
    description: Дата последнего изменения
  awn-description:
    type: text
    title: Описание
    description: Краткое назначение для агента
  awn-version:
    type: string
    title: Версия
    description: Номер или метка версии
  awn-sort:
    type: integer
    title: Сортировка
    description: Порядок в списках и дереве
