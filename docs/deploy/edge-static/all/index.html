<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1"/>
  <title>Все сервисы · Agent CMS</title>
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Cdefs%3E%3ClinearGradient id='g' x1='0%25' y1='0%25' x2='100%25' y2='100%25'%3E%3Cstop offset='0%25' stop-color='%235149f3'/%3E%3Cstop offset='100%25' stop-color='%232e8dfd'/%3E%3C/linearGradient%3E%3C/defs%3E%3Crect width='64' height='64' rx='14' fill='url(%23g)'/%3E%3Ccircle cx='32' cy='17' r='8' fill='none' stroke='%23fff' stroke-width='3'/%3E%3Ccircle cx='18' cy='45' r='7' fill='none' stroke='%23fff' stroke-width='3'/%3E%3Ccircle cx='46' cy='45' r='7' fill='none' stroke='%23fff' stroke-width='3'/%3E%3Cline x1='32' y1='25' x2='18' y2='38' stroke='%23fff' stroke-width='3' stroke-linecap='round'/%3E%3Cline x1='32' y1='25' x2='46' y2='38' stroke='%23fff' stroke-width='3' stroke-linecap='round'/%3E%3C/svg%3E"/>
  <style>
    *, *::before, *::after { box-sizing: border-box; }
    :root {
      --bg: #f4f7fb;
      --surface: #fff;
      --text: #1e293b;
      --muted: #64748b;
      --line: #e2e8f0;
      --cms: #4f46e5;
      --cms-soft: #eef2ff;
      --edge: #db2777;
      --edge-soft: #fdf2f8;
      --sun: #f59e0b;
    }
    body {
      font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
      background: var(--bg);
      color: var(--text);
      margin: 0;
      min-height: 100vh;
      padding: 28px 16px 40px;
    }
    .bg-dots {
      position: fixed;
      inset: 0;
      z-index: 0;
      pointer-events: none;
      opacity: 0.45;
      background-image: radial-gradient(#cbd5e1 1px, transparent 1px);
      background-size: 22px 22px;
    }
    .blob {
      position: fixed;
      border-radius: 50%;
      filter: blur(48px);
      z-index: 0;
      pointer-events: none;
    }
    .blob-a { width: 280px; height: 280px; background: #bfdbfe; top: -80px; right: -60px; }
    .blob-b { width: 220px; height: 220px; background: #fbcfe8; bottom: 10%; left: -40px; }
    .blob-c { width: 160px; height: 160px; background: #fde68a; top: 40%; right: 15%; opacity: 0.7; }
    .wrap {
      position: relative;
      z-index: 1;
      max-width: 560px;
      margin: 0 auto;
    }
    .hero {
      text-align: center;
      margin-bottom: 24px;
    }
    .wave {
      font-size: 2rem;
      line-height: 1;
      margin-bottom: 8px;
    }
    h1 {
      font-size: clamp(1.85rem, 6vw, 2.35rem);
      font-weight: 800;
      margin: 0 0 8px;
      letter-spacing: -0.03em;
      color: var(--text);
    }
    h1 span {
      color: var(--cms);
    }
    .lead {
      margin: 0 auto;
      max-width: 22rem;
      font-size: 1rem;
      line-height: 1.5;
      color: var(--muted);
    }
    .host-pill {
      display: inline-block;
      margin-top: 14px;
      font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
      font-size: 0.72rem;
      padding: 6px 12px;
      background: var(--surface);
      border: 1px solid var(--line);
      border-radius: 999px;
      color: var(--muted);
      box-shadow: 0 1px 2px rgba(15, 23, 42, 0.06);
    }
    .grid {
      display: grid;
      gap: 12px;
      list-style: none;
      padding: 0;
      margin: 0;
    }
    .card {
      display: grid;
      grid-template-columns: auto 1fr auto;
      gap: 12px 14px;
      align-items: center;
      padding: 16px 18px;
      background: var(--surface);
      border: 2px solid var(--line);
      border-radius: 16px;
      text-decoration: none;
      color: inherit;
      transition: transform 0.12s ease, box-shadow 0.12s ease, border-color 0.12s ease;
      box-shadow: 0 2px 8px rgba(15, 23, 42, 0.04);
    }
    .card:hover {
      transform: translateY(-2px) rotate(-0.3deg);
      box-shadow: 0 8px 24px rgba(15, 23, 42, 0.08);
    }
    .card--cms:hover { border-color: #a5b4fc; }
    .card--edge:hover { border-color: #f9a8d4; }
    .icon {
      width: 48px;
      height: 48px;
      border-radius: 14px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.5rem;
    }
    .icon--cms { background: var(--cms-soft); }
    .icon--edge { background: var(--edge-soft); }
    .card-body h2 {
      margin: 0 0 4px;
      font-size: 1.05rem;
      font-weight: 700;
    }
    .card-body p {
      margin: 0;
      font-size: 0.82rem;
      line-height: 1.4;
      color: var(--muted);
    }
    .card-url {
      grid-column: 1 / -1;
      font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
      font-size: 0.68rem;
      color: var(--cms);
      background: var(--bg);
      padding: 8px 10px;
      border-radius: 8px;
      word-break: break-all;
    }
    .card--edge .card-url { color: var(--edge); }
    .go {
      font-size: 1.25rem;
      color: var(--muted);
      transition: transform 0.12s ease;
    }
    .card:hover .go { transform: translateX(3px); color: var(--text); }
    .tip {
      margin-top: 22px;
      padding: 14px 16px;
      background: #fffbeb;
      border: 1px solid #fde68a;
      border-radius: 12px;
      font-size: 0.78rem;
      line-height: 1.45;
      color: #92400e;
    }
    .tip strong { color: #b45309; }
    .tip code {
      font-size: 0.72rem;
      background: #fff;
      padding: 1px 5px;
      border-radius: 4px;
      border: 1px solid #fde68a;
    }
  </style>
</head>
<body>
  <div class="bg-dots" aria-hidden="true"></div>
  <div class="blob blob-a" aria-hidden="true"></div>
  <div class="blob blob-b" aria-hidden="true"></div>
  <div class="blob blob-c" aria-hidden="true"></div>
  <div class="wrap">
    <header class="hero">
      <div class="wave" aria-hidden="true">👋</div>
      <h1>Куда идём <span>сегодня?</span></h1>
      <p class="lead">Здесь всё, что живёт на вашем хосте: CMS и edge-приложения.</p>
      <p class="host-pill" id="host-label"></p>
    </header>
    <ul class="grid" id="list"></ul>
    <p class="tip"><strong>Случайный поддомен?</strong> Открой <code>http://имя.<span id="apex-foot"></span></code> — увидишь заглушку. HTTPS для «левых» имён — позже.</p>
  </div>
  <script>
    (function () {
      function apexHost() {
        var h = location.hostname;
        if (h === "localhost" || h.endsWith(".localhost")) return "localhost";
        var parts = h.split(".");
        if (parts.length <= 2) return h;
        return parts.slice(-2).join(".");
      }
      function url(sub, path) {
        var apex = apexHost();
        var port = location.port ? ":" + location.port : "";
        var host = sub ? sub + "." + apex : apex;
        return location.protocol + "//" + host + port + (path || "/");
      }
      function displayHost(sub, path) {
        var apex = apexHost();
        var port = location.port ? ":" + location.port : "";
        return (sub ? sub + "." : "") + apex + port + (path || "/");
      }
      var apex = apexHost();
      document.getElementById("host-label").textContent = "all." + apex;
      document.getElementById("apex-foot").textContent = apex;

      var apps = [
        {
          title: "Agent CMS",
          sub: "",
          path: "/",
          desc: "Редактор, Control, MCP — всё по /app-* на главном домене.",
          icon: "🏠",
          cardClass: "card--cms"
        },
        {
          title: "QwenPaw",
          sub: "qwenpaw",
          path: "/",
          desc: "Отдельное приложение агента — свой поддомен, свой контейнер.",
          icon: "🐾",
          cardClass: "card--edge"
        }
      ];

      var ul = document.getElementById("list");
      apps.forEach(function (app) {
        var li = document.createElement("li");
        var a = document.createElement("a");
        a.className = "card " + app.cardClass;
        a.href = url(app.sub, app.path);
        a.innerHTML =
          '<span class="icon ' + (app.cardClass === "card--cms" ? "icon--cms" : "icon--edge") + '" aria-hidden="true">' + app.icon + "</span>" +
          '<div class="card-body"><h2>' + app.title + "</h2><p>" + app.desc + "</p></div>" +
          '<span class="go" aria-hidden="true">→</span>' +
          '<span class="card-url">' + displayHost(app.sub, app.path) + "</span>";
        li.appendChild(a);
        ul.appendChild(li);
      });
    })();
  </script>
</body>
</html>
