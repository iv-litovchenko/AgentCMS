<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1"/>
  <title>Все сервисы · Agent CMS</title>
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Cdefs%3E%3ClinearGradient id='g' x1='0%25' y1='0%25' x2='100%25' y2='100%25'%3E%3Cstop offset='0%25' stop-color='%235149f3'/%3E%3Cstop offset='100%25' stop-color='%232e8dfd'/%3E%3C/linearGradient%3E%3C/defs%3E%3Crect width='64' height='64' rx='14' fill='url(%23g)'/%3E%3Ccircle cx='32' cy='17' r='8' fill='none' stroke='%23fff' stroke-width='3'/%3E%3Ccircle cx='18' cy='45' r='7' fill='none' stroke='%23fff' stroke-width='3'/%3E%3Ccircle cx='46' cy='45' r='7' fill='none' stroke='%23fff' stroke-width='3'/%3E%3Cline x1='32' y1='25' x2='18' y2='38' stroke='%23fff' stroke-width='3' stroke-linecap='round'/%3E%3Cline x1='32' y1='25' x2='46' y2='38' stroke='%23fff' stroke-width='3' stroke-linecap='round'/%3E%3C/svg%3E"/>
  <style>
    *, *::before, *::after { box-sizing: border-box; }
    :root {
      --bg: #070b14;
      --card: rgba(15, 23, 42, 0.78);
      --border: rgba(148, 163, 184, 0.22);
      --text: #f1f5f9;
      --muted: #94a3b8;
      --accent: #38bdf8;
      --accent2: #a78bfa;
      --cms: #5149f3;
      --edge: #f472b6;
    }
    body {
      font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
      background: var(--bg);
      color: var(--text);
      margin: 0;
      min-height: 100vh;
      padding: 32px 20px 48px;
      overflow-x: hidden;
    }
    .bg {
      position: fixed;
      inset: 0;
      z-index: 0;
      pointer-events: none;
      background:
        radial-gradient(ellipse 90% 70% at 10% 0%, rgba(81, 73, 243, 0.35), transparent 55%),
        radial-gradient(ellipse 70% 60% at 95% 30%, rgba(56, 189, 248, 0.25), transparent 50%),
        radial-gradient(ellipse 60% 50% at 50% 100%, rgba(244, 114, 182, 0.15), transparent 45%),
        var(--bg);
    }
    @media (prefers-reduced-motion: no-preference) {
      .bg::after {
        content: "";
        position: absolute;
        inset: -30%;
        background: conic-gradient(from 0deg, transparent, rgba(56, 189, 248, 0.05), transparent, rgba(167, 139, 250, 0.07), transparent);
        animation: drift 24s linear infinite;
      }
      @keyframes drift { to { transform: rotate(360deg); } }
    }
    .wrap {
      position: relative;
      z-index: 1;
      max-width: 640px;
      margin: 0 auto;
    }
    .hero {
      text-align: center;
      margin-bottom: 28px;
    }
    .badge {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      font-size: 0.68rem;
      font-weight: 700;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: var(--accent);
      background: rgba(56, 189, 248, 0.12);
      border: 1px solid rgba(56, 189, 248, 0.35);
      padding: 5px 12px;
      border-radius: 999px;
      margin-bottom: 14px;
    }
    h1 {
      font-size: clamp(1.75rem, 5vw, 2.25rem);
      font-weight: 700;
      margin: 0 0 10px;
      letter-spacing: -0.02em;
      background: linear-gradient(135deg, #fff 0%, #94a3b8 100%);
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
    }
    .lead {
      margin: 0;
      color: var(--muted);
      font-size: 0.95rem;
      line-height: 1.5;
      max-width: 420px;
      margin-left: auto;
      margin-right: auto;
    }
    .host {
      margin-top: 12px;
      font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
      font-size: 0.72rem;
      color: var(--accent2);
      opacity: 0.9;
    }
    .grid {
      display: grid;
      gap: 14px;
      list-style: none;
      padding: 0;
      margin: 0;
    }
    @media (min-width: 520px) {
      .grid { grid-template-columns: 1fr 1fr; }
      .grid .card--primary { grid-column: 1 / -1; }
    }
    .card {
      display: flex;
      flex-direction: column;
      gap: 10px;
      padding: 18px 18px 16px;
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 16px;
      text-decoration: none;
      color: inherit;
      transition: border-color 0.15s ease, transform 0.15s ease, box-shadow 0.15s ease;
      backdrop-filter: blur(8px);
    }
    .card:hover {
      border-color: rgba(56, 189, 248, 0.45);
      transform: translateY(-2px);
      box-shadow: 0 12px 40px rgba(0, 0, 0, 0.35);
    }
    .card-top {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 10px;
    }
    .icon {
      width: 44px;
      height: 44px;
      border-radius: 12px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.35rem;
      flex-shrink: 0;
    }
    .icon--cms { background: linear-gradient(145deg, rgba(81, 73, 243, 0.5), rgba(46, 141, 253, 0.35)); }
    .icon--edge { background: linear-gradient(145deg, rgba(244, 114, 182, 0.45), rgba(167, 139, 250, 0.35)); }
    .tag {
      font-size: 0.6rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.06em;
      padding: 3px 8px;
      border-radius: 6px;
      color: var(--muted);
      background: rgba(148, 163, 184, 0.12);
      border: 1px solid rgba(148, 163, 184, 0.2);
    }
    .tag--platform { color: #c4b5fd; border-color: rgba(167, 139, 250, 0.35); background: rgba(167, 139, 250, 0.1); }
    .tag--edge { color: #fbcfe8; border-color: rgba(244, 114, 182, 0.35); background: rgba(244, 114, 182, 0.1); }
    .card h2 {
      margin: 0;
      font-size: 1.05rem;
      font-weight: 650;
    }
    .card p {
      margin: 0;
      font-size: 0.82rem;
      line-height: 1.45;
      color: var(--muted);
    }
    .card-url {
      font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
      font-size: 0.68rem;
      color: var(--accent);
      word-break: break-all;
      margin-top: auto;
      padding-top: 6px;
    }
    .foot {
      margin-top: 28px;
      text-align: center;
      font-size: 0.72rem;
      color: var(--muted);
      line-height: 1.5;
    }
    .foot code {
      font-size: 0.68rem;
      background: rgba(15, 23, 42, 0.9);
      padding: 2px 6px;
      border-radius: 4px;
      border: 1px solid var(--border);
    }
  </style>
</head>
<body>
  <div class="bg" aria-hidden="true"></div>
  <div class="wrap">
    <header class="hero">
      <div class="badge">all · каталог сервисов</div>
      <h1>Все</h1>
      <p class="lead">Платформа Agent CMS и edge-приложения на этом хосте. Выберите, куда перейти.</p>
      <p class="host" id="host-label"></p>
    </header>
    <ul class="grid" id="list"></ul>
    <p class="foot">Неизвестный поддомен — <code>http://имя.<span id="apex-foot"></span></code> (заглушка). HTTPS для произвольных имён — позже.</p>
  </div>
  <script>
    (function () {
      function apexHost() {
        var h = location.hostname;
        if (h === "localhost" || h.endsWith(".localhost")) return "localhost";
        var parts = h.split(".");
        if (parts.length <= 2) return h;
        return parts.slice(-2).join(".");
      }
      function url(sub, path) {
        var apex = apexHost();
        var port = location.port ? ":" + location.port : "";
        var host = sub ? sub + "." + apex : apex;
        return location.protocol + "//" + host + port + (path || "/");
      }
      function displayHost(sub, path) {
        var apex = apexHost();
        var port = location.port ? ":" + location.port : "";
        return (sub ? sub + "." : "") + apex + port + (path || "/");
      }
      var apex = apexHost();
      document.getElementById("host-label").textContent = "Вы на all." + apex;
      document.getElementById("apex-foot").textContent = apex;

      var apps = [
        {
          title: "Agent CMS",
          sub: "",
          path: "/",
          desc: "Editor, Control, MCP и приложения по пути /app-* на основном домене.",
          icon: "◆",
          iconClass: "icon--cms",
          tag: "platform",
          tagClass: "tag--platform",
          tagLabel: "ядро",
          primary: true
        },
        {
          title: "QwenPaw",
          sub: "qwenpaw",
          path: "/",
          desc: "Агентский консольный UI (Docker agentscope/qwenpaw), отдельный поддомен.",
          icon: "🐾",
          iconClass: "icon--edge",
          tag: "edge",
          tagClass: "tag--edge",
          tagLabel: "edge"
        }
      ];

      var ul = document.getElementById("list");
      apps.forEach(function (app) {
        var li = document.createElement("li");
        var a = document.createElement("a");
        a.className = "card" + (app.primary ? " card--primary" : "");
        a.href = url(app.sub, app.path);
        a.innerHTML =
          '<div class="card-top">' +
          '<span class="icon ' + app.iconClass + '" aria-hidden="true">' + app.icon + "</span>" +
          '<span class="tag ' + app.tagClass + '">' + app.tagLabel + "</span>" +
          "</div>" +
          "<h2>" + app.title + "</h2>" +
          "<p>" + app.desc + "</p>" +
          '<span class="card-url">' + displayHost(app.sub, app.path) + "</span>";
        li.appendChild(a);
        ul.appendChild(li);
      });
    })();
  </script>
</body>
</html>
