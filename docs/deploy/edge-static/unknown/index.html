<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1"/>
  <title>Нет такого сервиса</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; }
    body {
      font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
      background: #f4f7fb;
      color: #1e293b;
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
    }
    main {
      max-width: 440px;
      text-align: center;
      background: #fff;
      border: 1px solid #e2e8f0;
      border-radius: 16px;
      padding: 32px 28px;
      box-shadow: 0 8px 30px rgba(15, 23, 42, 0.06);
    }
    .emoji { font-size: 2.5rem; line-height: 1; margin-bottom: 12px; }
    h1 { font-size: 1.35rem; font-weight: 700; margin: 0 0 10px; }
    p { color: #64748b; line-height: 1.55; margin: 0 0 18px; }
    a { color: #4f46e5; font-weight: 500; text-decoration: none; }
    a:hover { text-decoration: underline; }
    code { font-size: 0.92em; background: #eef2ff; color: #4338ca; padding: 2px 8px; border-radius: 6px; }
    .links { display: flex; flex-wrap: wrap; gap: 8px 16px; justify-content: center; }
  </style>
</head>
<body>
  <main>
    <div class="emoji" aria-hidden="true">🧭</div>
    <h1>Тут пока пусто</h1>
    <p>Поддомен <code id="host"></code> не подключён к платформе.</p>
    <p class="links">
      <a id="all-link" href="#">Каталог «Все»</a>
      <a id="cms-link" href="#">Agent CMS</a>
    </p>
  </main>
  <script>
    (function () {
      var h = location.hostname;
      document.getElementById("host").textContent = h;
      function apexHost() {
        if (h === "localhost" || h.endsWith(".localhost")) return "localhost";
        var parts = h.split(".");
        if (parts.length <= 2) return h;
        return parts.slice(-2).join(".");
      }
      function originForSub(sub) {
        var apex = apexHost();
        var port = location.port ? ":" + location.port : "";
        return location.protocol + "//" + sub + "." + apex + port + "/";
      }
      document.getElementById("all-link").href = originForSub("all");
      document.getElementById("cms-link").href = location.protocol + "//" + apexHost() + (location.port ? ":" + location.port : "") + "/";
    })();
  </script>
</body>
</html>
