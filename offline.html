<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Agent CMS — офлайн</title>
  <style>
    :root { color-scheme: dark; font-family: system-ui, -apple-system, sans-serif; }
    body {
      margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center;
      background: #0f1117; color: #e2e8f0; padding: 24px;
    }
    .card {
      max-width: 420px; text-align: center; padding: 32px 28px; border-radius: 16px;
      background: #171a22; border: 1px solid #2d3340;
    }
    h1 { font-size: 1.25rem; margin: 0 0 12px; font-weight: 600; }
    p { margin: 0 0 16px; line-height: 1.5; color: #94a3b8; font-size: 0.95rem; }
    code { font-size: 0.85rem; background: #0f1117; padding: 2px 6px; border-radius: 6px; }
    button {
      margin-top: 8px; padding: 10px 18px; border-radius: 10px; border: none;
      background: #3b82f6; color: #fff; font-size: 0.95rem; cursor: pointer;
    }
    button:hover { background: #2563eb; }
    .hint { margin-top: 20px; font-size: 0.8rem; color: #64748b; }
  </style>
</head>
<body>
  <div class="card">
    <h1 id="title">Сервер Agent CMS недоступен</h1>
    <p id="detail">Docker-стек не отвечает по <code id="base">…</code></p>
    <p>Запустите стек: <code>agent-cms start</code> или Docker в Control.</p>
    <button type="button" id="retry">Повторить</button>
    <p class="hint">Electron только открывает URL — сервер не встроен.</p>
  </div>
  <script>
    const params = new URLSearchParams(location.search);
    document.getElementById("title").textContent = params.get("app") || "Сервер Agent CMS недоступен";
    document.getElementById("base").textContent = params.get("base") || "—";
    document.getElementById("retry").addEventListener("click", () => {
      if (window.electronBridge && window.electronBridge.retryLoad) {
        window.electronBridge.retryLoad();
      } else {
        location.reload();
      }
    });
  </script>
</body>
</html>
